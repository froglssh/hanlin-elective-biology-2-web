 <li>課本記載孔恩於 1876 年發現內孢子，並引述從約 2 億 5 千萬年前岩鹽晶體分離出活細菌的研究。此為<b>2000 年的研究報告</b>；岩鹽年代與細菌本身的年代需分開判讀，不能直接當作現今已確認的最久休眠紀錄。</li></ul>`},
{t:'尼丹 vs. 司巴蘭贊尼：肉汁實驗',src:'課本 P11 圖1-2；原始簡報第 13–14 張',set:'need',tb:[['fig1_2','課本 P11 圖1-2 尼丹與司巴蘭贊尼的實驗示意圖']],
 txt:`${Q('1745 年，尼丹把肉汁煮沸、開口在室溫下冷卻，再用軟木塞封口，數日後肉汁混濁、長出微生物。司巴蘭贊尼認為這是冷卻時空氣中的微生物落入；他改成煮沸後立刻封口，肉汁就不長微生物。','課本 P11（改寫）')}
 <ul><li><b class="abio">尼丹</b>：煮沸 → 開口冷卻 → 軟木塞封口 → 混濁 → 支持無生源說。</li>
 <li><b class="bio">司巴蘭贊尼</b>：煮沸 → <b>立刻燒融封口</b> → 澄清 → 支持生源說。</li>
 <li>無生源說的反擊：瓶子立刻封死，<b>缺乏空氣流通</b>，而空氣是生物生長的必需要素。雙方再度僵持不下。</li></ul>`},
{t:'巴斯德的葡萄釀酒實驗',src:'課本 P12；原始簡報第 18 張',set:'grape',
 txt:`${Q('1850 年代，巴斯德研究葡萄酒的釀造時，用針筒從葡萄皮下抽取葡萄汁，發現沒有酵母菌的葡萄汁無法發酵產生酒精。','課本 P12（改寫）')}
 <ul><li>結論 1：果皮上的<b>酵母菌</b>，是釀酒成功的關鍵。</li>
 <li>結論 2：酵母菌<b>不會無中生有</b>，必須透過繁殖而來 → <b class="bio">支持生源說</b>。</li>
 <li>巧妙之處：針筒穿過果皮直接取汁，避開了果皮表面的酵母菌。</li></ul>`},
{t:'蒲歇的反擊',src:'課本 P12；原始簡報第 19 張',set:'pouchet',
 txt:`${Q('巴斯德的論點引起許多反對，其中以學術地位很高的蒲歇最強烈。1858 年，蒲歇用人造水製作乾草浸液、滅菌後通入氮與氧混合的人造空氣，結果仍有微生物產生。','課本 P12（改寫）')}
 <ul><li>蒲歇的結論：生命可以自然發生 → <b class="abio">支持無生源說</b>。</li>
 <li>巴斯德的反駁：許多<b>器械沒有澈底消毒</b>，仍有微生物殘留。</li>
 <li>想一想：蒲歇用的又是<b>乾草浸液</b>——還記得內孢子嗎？</li></ul>`},
{sec:'s3',t:'巴斯德的燒瓶實驗',src:'課本 P12–P13 圖1-3a；原始簡報第 20–21 張',set:'flask',tb:[['fig1_3a','課本 P12 圖1-3a 巴斯德的燒瓶實驗']],
 txt:`${Q('1864 年，巴斯德假設微生物來自空氣中的塵埃。他把肉汁在燒瓶中煮沸並立刻封口，即使擺很久也不長微生物；一旦打開封口，肉汁很快就長出微生物。','課本 P13（改寫）')}
 <ul><li>不封口 → <b>長出微生物</b>；封口 → <b>不長微生物</b>。</li>
 <li>結論：肉汁長微生物，是<b>空氣中的微生物落入</b>肉汁滋生的結果。</li>
 <li>但反對者依舊認為：封口的瓶中<b>空氣不流通</b>，微生物才長不出來——要怎麼讓空氣進得去、微生物進不去？</li></ul>`},
{t:'鵝頸瓶實驗',src:'課本 P13 圖1-3b；原始簡報第 22–23 張',set:'swan',tb:[['fig1_3b','課本 P13 圖1-3b 鵝頸瓶']],
 txt:`${Q('為了排除空氣的影響，巴斯德把玻璃瓶頸拉細、燒成鵝頸狀：空氣可以從開口進入，空氣中的塵埃則落在鵝頸下方的彎曲處。結果瓶內長期未見微生物生長；若把鵝頸切斷，不久就長出微生物。','課本 P13（改寫）')}
 <ul><li><b class="k1">不切斷</b>：空氣能流通，塵埃卡在彎曲處 → 不長微生物。</li>
 <li><b class="k3">切斷</b>：塵埃直接落入 → 長出微生物。</li>
 <li>同時回答了兩件事：微生物來自<b>空氣中的塵埃</b>；不長菌<b>不是因為缺空氣</b>。</li>
 <li>鵝頸瓶實驗為生源說提出無可反駁的證明，澈底終結了長久以來的爭議。</li></ul>`},
{t:'一百多年都沒長菌的燒瓶',src:'課本 P13 圖1-3c；原始簡報第 24 張',
 fig:()=>`<div class="fig2">${zoomImg('fig1_3c','課本圖1-3c 巴斯德研究所的燒瓶')}${zoomImg('k24_0','原始簡報第 24 張')}</div><div class="cap">左：課本 P13 圖1-3c　右：原始簡報第 24 張（點圖可放大）</div>`,
 txt:`${Q('許多巴斯德實驗用的燒瓶至今仍存放在法國巴斯德研究所展示。一百多年過去了，那些封口的燒瓶中，還是沒有微生物出現。','課本 P13（改寫）')}
 <ul><li>課本以長期保存的燒瓶說明：在原先處理有效、且不再受到汙染的條件下，肉汁不會自行產生微生物。長期保存與重新做一次實驗是不同的證據。</li>
 <li>好的實驗設計＝<b>只改變一個條件</b>，並且讓別人可以<b>重複驗證</b>。</li>
 <li>下一張：自己動手設計燒瓶實驗，看看結果如何。</li></ul>`},
{t:'動手做：燒瓶模擬台',src:'自製互動模擬（依課本 P10–P13 的實驗設計）',
 fig:()=>simHTML(),
 txt:`<p class="think"><b>玩法：</b>選好材料、是否煮沸、瓶子的樣式和放置時間，按「▶ 開始實驗」。看塵埃落到哪裡、湯汁會不會變混濁，再看看這是哪一位科學家做過的實驗。</p>
 <ul><li>試試看重現：<b class="abio">尼丹</b>、<b class="bio">司巴蘭贊尼</b>、<b class="bio">約伯勒</b>、<b class="bio">巴斯德鵝頸瓶</b>。</li>
 <li>挑戰 1：只改「鵝頸瓶 ↔ 切斷鵝頸」，結果差在哪？</li>
 <li>挑戰 2：乾草浸液「立刻燒融封口」放數日與放很久，有什麼不同？為什麼？</li>
 <li>標示「補充推論」的組合是課本沒有做的實驗，依課文原理推論而來。</li></ul>`},
{sec:'s4',t:'爭論的歷程：時間軸',src:'課本 P14 圖1-4；原始簡報第 25 張',set:'time',tb:[['fig1_4','課本 P14 圖1-4 生源說與無生源說爭論的歷程']],
 txt:`<ul><li><b class="abio">無生源說</b>：亞里斯多德（B.C. 350）→ 凡赫芒 → 尼丹（1745）→ 蒲歇與其他學者。</li>
 <li><b class="bio">生源說</b>：雷迪（1668）→ 約伯勒（1718）→ 司巴蘭贊尼 → 巴斯德（1864）。</li>
 <li>每一次的實驗都被對方找到破綻（微生物落入、缺乏空氣、器械沒消毒、內孢子……），下一位科學家就改良設計。</li>
 <li>科學不是一次就定案，而是在<b>反覆質疑與修正</b>中前進。</li></ul>`},
{t:'實驗設計比一比',src:'整理自課本 P8–P14',
 fig:()=>`<div class="tblwrap"><table class="cmp2"><tr><th>科學家</th><th>怎麼做</th><th>結果</th><th>支持</th><th>被質疑／關鍵</th></tr>
  <tr><td>雷迪 1668</td><td>腐肉放入敞開、蓋緊、覆紗布的瓶中</td><td>只有敞開組生蛆</td><td><span class="side bio">生源說</span></td><td>紗布組排除「缺空氣」的解釋</td></tr>
  <tr><td>約伯勒 1718</td><td>乾草浸液煮沸，立刻封閉／不封閉</td><td>封閉不長菌，不封閉混濁</td><td><span class="side bio">生源說</span></td><td>他人重做、培養較久仍長菌（內孢子）</td></tr>
  <tr><td>尼丹 1745</td><td>肉汁煮沸 → 開口冷卻 → 軟木塞封口</td><td>混濁、長微生物</td><td><span class="side abio">無生源說</span></td><td>冷卻時微生物已落入</td></tr>
  <tr><td>司巴蘭贊尼</td><td>肉汁煮沸後立刻燒融封口</td><td>保持澄清</td><td><span class="side bio">生源說</span></td><td>被質疑瓶中缺乏空氣</td></tr>
  <tr><td>巴斯德 1850s</td><td>針筒抽取葡萄皮下的葡萄汁</td><td>無酵母菌不發酵</td><td><span class="side bio">生源說</span></td><td>酵母菌須繁殖而來</td></tr>
  <tr><td>蒲歇 1858</td><td>人造水、人造空氣通入滅菌的乾草浸液</td><td>仍長微生物</td><td><span class="side abio">無生源說</span></td><td>器械未澈底消毒</td></tr>
  <tr><td>巴斯德 1864</td><td>鵝頸瓶：空氣可進，塵埃卡在彎曲處</td><td>不切斷不長，切斷就長</td><td><span class="side bio">生源說</span></td><td>回應「缺空氣」，終結爭論</td></tr></table></div>
  <div class="cap">依課本 P8–P14 整理（手機可左右滑動表格）</div>`,
 txt:`<ul><li>先問「<b>改變了什麼條件</b>」，再問「<b>結果支持誰</b>」，最後問「<b>還有什麼漏洞</b>」。</li>
 <li>支持無生源說的實驗，破綻幾乎都是：<b>微生物其實是從外面進來，或根本沒殺乾淨</b>。</li>
 <li>封口實驗的弱點是「缺乏空氣」，鵝頸瓶用<b>不封口卻擋住塵埃</b>一次解決。</li>
 <li>下一張保留原簡報中的三題練習；也可進入互動練習，用實驗證據檢驗自己的理解。</li></ul>`},

const SIM_CARD=LEARN.findIndex(L=>L.t.includes('燒瓶模擬台'));

LEARN.forEach((x,i)=>{x.id=`b2-11-l${String(i+1).padStart(2,'0')}`;});
LEARN[6].txt+=`<p class="scope-note">閱讀補註：此處保留課本知識補給站完整原文；正文將歷史實驗敘述與一般滅菌原理分開。<a href="https://stacks.cdc.gov/view/cdc/7790" target="_blank" rel="noopener noreferrer">煮沸與內孢子研究</a> · <a href="https://www.nature.com/articles/35038060" target="_blank" rel="noopener noreferrer">2000 年岩鹽研究</a></p>`;
LEARN[6].fig=()=>zoomImg('knowledge_full','課本 P10 完整知識補給站：全部文字、枯草桿菌照片與尺度')+deckBtn('k15_0','PPT 15–17');

const SIMO={mat:[['meat','肉汁'],['hay','乾草浸液']],boil:[['y','煮沸'],['n','不煮沸']],
  type:[['open','開口瓶'],['cork','冷卻後軟木塞封口'],['seal','立刻燒融封口'],['swan','鵝頸瓶'],['cut','鵝頸瓶→切斷鵝頸']],
  time:[['d','放置數日'],['l','放置很久']]};
let SIM={mat:'meat',boil:'y',type:'swan',time:'d'},SIMRAF=null,SIMT=[];
function simHTML(){
  const row=(k,lab)=>`<div class="simrow"><span class="lab">${lab}</span>${SIMO[k].map(([v,t])=>`<button class="seg" data-k="${k}" data-v="${v}">${t}</button>`).join('')}</div>`;
  return `<div class="sim" id="sim"><svg id="simsvg" viewBox="0 0 600 400" role="img" aria-label="燒瓶模擬"></svg>
   <div class="simctl">${row('mat','材料')}${row('boil','加熱')}${row('type','瓶子')}${row('time','時間')}
   <div class="simgo"><button class="btn" id="simrun">▶ 開始實驗</button><button class="btn ghost" id="simreset">↺ 重設</button></div></div>
   <div class="simres" id="simres">選好條件後按「▶ 開始實驗」。</div></div>`;
}
function simStop(){if(SIMRAF)cancelAnimationFrame(SIMRAF);SIMRAF=null;SIMT.forEach(clearTimeout);SIMT=[];}
function simInit(){
  el('sim').querySelectorAll('.seg').forEach(b=>{b.classList.toggle('on',SIM[b.dataset.k]===b.dataset.v);
    b.onclick=()=>{SIM[b.dataset.k]=b.dataset.v;simInit();}});
  el('simrun').onclick=simRun;el('simreset').onclick=()=>{SIM={mat:'meat',boil:'y',type:'swan',time:'d'};simInit();};
  simStop();simDraw({phase:0});el('simres').className='simres';el('simres').innerHTML='選好條件後按「▶ 開始實驗」。';
}
function simOutcome(){
  const {mat,boil,type,time}=SIM,long=time==='l';
  if(boil==='n')return{grow:true,who:'（沒有先殺菌）',side:'',why:'沒有煮沸，湯汁裡原本就有的微生物會直接繁殖——這樣的結果無法判斷微生物從哪裡來，所以每位科學家都會先煮沸殺菌。'};
  if(mat==='meat'){
    if(type==='open')return{grow:true,who:'巴斯德燒瓶實驗「不封口」（1864）',side:'bio',why:'空氣中的塵埃帶著微生物落入肉汁，肉汁變混濁。'};
    if(type==='cork')return{grow:true,who:'尼丹的肉汁實驗（1745）',side:'abio',why:'開口冷卻時，空氣中的微生物已落入肉汁，之後才封口也來不及——這正是司巴蘭贊尼指出的缺失。尼丹卻據此主張無生源說。'};
    if(type==='seal')return{grow:false,who:'司巴蘭贊尼；巴斯德燒瓶「封口」',side:'bio',why:'煮沸殺菌後立刻密封，外面的微生物進不來。'+(long?'巴斯德研究所的封口燒瓶放了一百多年，至今仍然澄清。':'')+'但反對者質疑：會不會只是因為瓶中缺乏空氣？'};
    if(type==='swan')return{grow:false,who:'巴斯德鵝頸瓶（1864）',side:'bio',why:'空氣可以自由進出，塵埃卻停在鵝頸的彎曲處——有空氣也不長菌，推翻了「缺乏空氣」的說法。'};
    return{grow:true,who:'巴斯德鵝頸瓶「切斷鵝頸」',side:'bio',why:'切斷鵝頸後，塵埃直接落入肉汁，不久就長出微生物——證明微生物來自空氣中的塵埃。'};
  }
  if(type==='seal'&&!long)return{grow:false,who:'約伯勒的乾草浸液實驗（1718）',side:'bio',why:'煮沸後立刻封瓶，瓶中氧氣很少，好氧的枯草桿菌內孢子不易萌發，浸液保持澄清。'};
  if(type==='seal')return{grow:null,who:'条件不足，不能只憑時間判定'.replace('条件','條件'),side:'abio',why:'長時間本身不保證一定長菌。課本指出重做結果可能與封瓶時機、氧氣和殘存內孢子有關；本模擬未提供這些實測條件，故無法確定結果。'};
  if(type==='open')return{grow:true,who:'約伯勒「不封閉」組（1718）',side:'bio',why:'浸液受到空氣中微生物的汙染而變混濁。'};
  if(type==='cork')return{grow:true,who:'補充推論（課本沒有這個實驗）',side:'',why:'冷卻時微生物落入，浸液也含較多氧氣，內孢子同樣可以萌發。'};
  return{grow:true,who:'補充推論（課本沒有這個實驗）',side:'',why:'乾草浸液裡的內孢子耐煮沸，鵝頸瓶又讓氧氣進得去，內孢子仍可能萌發——所以巴斯德改用課本實驗中處理後沒有微生物生長的肉汁。'};
}

function flaskPath(type,corkOn){
  const glass='fill="none" stroke="#7DA9C9" stroke-width="3"',inner='fill="#EAF4FB" fill-opacity=".55" stroke="none"';
  let neck='';
  if(type==='open'||type==='cork')neck=`<path d="M286 222 L286 130 M314 222 L314 130" ${glass}/><ellipse cx="300" cy="130" rx="16" ry="4" ${glass}/>`+(type==='cork'&&corkOn?`<path d="M284 112 L316 112 L313 140 L287 140 Z" fill="#B98A55" stroke="#7A5530" stroke-width="2"/>`:'');
  else if(type==='seal')neck=`<path d="M286 222 L286 150 Q300 104 314 150 L314 222" ${glass}/>`;
  else if(type==='swan')neck=`<path d="M300 220 C300 150 330 110 380 140 S 450 250 500 190 L 512 130" fill="none" stroke="#7DA9C9" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 220 C300 150 330 110 380 140 S 450 250 500 190 L 512 130" fill="none" stroke="#F4FAFF" stroke-width="10" stroke-linecap="round"/>`;
  else neck=`<path d="M300 220 C300 175 305 168 318 160" fill="none" stroke="#7DA9C9" stroke-width="16" stroke-linecap="round"/><path d="M300 220 C300 175 305 168 318 160" fill="none" stroke="#F4FAFF" stroke-width="10" stroke-linecap="round"/>
    <path d="M430 210 C460 250 490 220 500 190 L 512 130" fill="none" stroke="#B9CFE0" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 5"/>`+txt(468,268,'切下的鵝頸',{fs:13,fw:500,c:'#877865'});
  return neck+`<circle cx="300" cy="285" r="72" ${glass}/>`;
}
function simDraw(o){
  const t=SIM.type,liqC=o.cloud?`rgb(${Math.round(242-(242-150)*o.cloud)},${Math.round(193-(193-140)*o.cloud)},${Math.round(78+(95-78)*o.cloud)})`:(SIM.mat==='hay'?'#D9C77A':'#F2C14E');

function dustPath(type,i,phase){
  const sx=200+((i*71)%340),r=((i*37)%23)-11;
  const enter=[[300+r*.6,-8],[300+r*.6,130],[300+r*2.5,300+((i*13)%40)]];

  if(type==='seal'&&i%2===0)return[[300+r*.3,-8],[300+r*.2,118],[300+r*.5,122]];
  if(type==='cork'&&i%2===0)return[[300+r*.6,-8],[300+r*.8,110]];
  if(type==='swan'&&i%2===0)return[[512+r*.3,-8],[512,130],[500,190],[470+((i*7)%14),222]];

}
function simRun(){
  simStop();const O=simOutcome(),T=SIM.type,boiled=SIM.boil==='y';if(O.grow===null){simDraw({phase:0});el('simres').textContent=O.who+'：'+O.why;return;}
  el('simres').className='simres';el('simres').textContent='實驗進行中……';
  const t0=performance.now();let phase='boil';
  const D=14,paths=[];let dustStart=0;
  const steps=[];
  if(boiled)steps.push(['boil',1600]);
  if(T==='cork')steps.push(['cool',2600]);
  steps.push(['wait',3200],['grow',1600]);
  let acc=0;const sched=steps.map(([n,d])=>{const r=[n,acc,acc+d];acc+=d;return r});
  const frame=now=>{
    const t=now-t0;const cur=sched.find(s=>t>=s[1]&&t<s[2])||sched[sched.length-1];phase=cur[0];
    const o={tick:t/16,label:'',dust:[]};
    if(phase==='boil'){o.flame=true;o.bubbles=true;o.steam=true;o.label='① 加熱煮沸，殺死湯汁裡的微生物';o.corkOn=false;}
    else{o.corkOn=T==='cork'&&phase!=='cool';
      o.label=phase==='cool'?'② 開口放在室溫下冷卻……':(T==='cork'?'③ 以軟木塞封口，靜置':'② 靜置，空氣中的塵埃慢慢飄落');
      const ds=sched.find(s=>s[0]===(T==='cork'?'cool':'wait'))[1];
      for(let i=0;i<D;i++){
        const ph=(T==='cork'&&phase!=='cool'&&i<D/2)?'cool':phase;
        const pth=dustPath(T,i,T==='cork'?(i<D/2?'cool':'wait'):phase);
        const st=ds+(T==='cork'&&i>=D/2?2600:0)+i*140,u=Math.max(0,Math.min(1,(t-st)/1800));
        if(t<st)continue;
        const seg=pth.length-1,f=u*seg,k=Math.min(seg-1,Math.floor(f)),w=f-k;
        const p={x:pth[k][0]+(pth[k+1][0]-pth[k][0])*w,y:pth[k][1]+(pth[k+1][1]-pth[k][1])*w};
        const enters=pth.length===3&&pth[2][1]>250;
        if(enters&&u>=1&&O.grow)continue;
        o.dust.push(p);
      }
    }
    if(phase==='grow'){const g=Math.min(1,(t-cur[1])/(cur[2]-cur[1]));o.cloud=O.grow?g:0;o.label=`${SIM.time==='l'?'④ 很久以後':'④ 數日後'}：${O.grow?'湯汁變混濁，長出微生物':'湯汁保持澄清'}`;o.note=O.grow?'長出微生物 🦠':'不長微生物 ✓';}
    simDraw(o);
    if(t<acc)SIMRAF=requestAnimationFrame(frame);
    else{SIMRAF=null;const side=O.side==='bio'?'<span class="side bio">支持生源說</span>':O.side==='abio'?'<span class="side abio">當時被當成支持無生源說</span>':'';
      el('simres').className='simres '+(O.grow?'grow':'clear');
      el('simres').innerHTML=`<b>${O.grow?'結果：長出微生物':'結果：保持澄清'}</b>　對應：${O.who} ${side}<br>${O.why}`;}
  };
  SIMRAF=requestAnimationFrame(frame);
}

 track.querySelectorAll('button').forEach(b=>b.onclick=()=>showQuestion(+b.dataset.stage));

let READING=null,tableState=null,resultObserver=null;
function readingBlocks(node){
 const blocks=[];for(const child of [...node.childNodes]){
  if(child.nodeType===3){if(child.textContent.trim()){const p=document.createElement('p');p.textContent=child.textContent;blocks.push(p);}continue;}
  if(child.matches('ul,ol'))for(const li of child.children){const list=document.createElement(child.tagName);list.append(li.cloneNode(true));blocks.push(list);}
  else blocks.push(child.cloneNode(true));
 }return blocks;
}
function prepareLesson(){
 resultObserver?.disconnect();resultObserver=null;tableState=null;
 const fig=el('lcard').querySelector('.lfig'),text=el('lcard').querySelector('.ltext'),core=document.createElement('div'),ref=document.createElement('div'),notes=document.createElement('div');
 for(const child of [...text.childNodes]){if(child.nodeType===1&&child.matches('.note-label,.note-prompt,.lesson-note'))notes.append(child);else if(child.nodeType===1&&child.matches('.quote'))ref.append(child);else core.append(child);}
 const canvas=document.createElement('div'),tools=document.createElement('div');canvas.className='figure-canvas';tools.className='figure-tools';
 for(const child of [...fig.children]){
  if(child.matches('.cap')){ref.append(child);continue;}
  if(child.matches('details.tbx')){const img=child.querySelector('img'),b=document.createElement('button');b.textContent='課本原圖';b.title=img.alt;b.onclick=()=>zoom(img.src,img.alt);tools.append(b);continue;}
  if(child.matches('.fctl,.fdots,button'))tools.append(child);else canvas.append(child);
 }
 fig.replaceChildren(canvas,tools);const groups=[{name:'教學重點',nodes:readingBlocks(core)},{name:'原文與圖說',nodes:readingBlocks(ref)},{name:'思考筆記',notes}];
 if(!groups[1].nodes.length){const p=document.createElement('p');p.className='cap';p.textContent=LEARN[LI].src;groups[1].nodes=[p];}
 const sim=canvas.querySelector('#sim');if(sim){
  const result=sim.querySelector('#simres'),layout=document.createElement('div');layout.className='sim-layout';layout.append(sim.querySelector('svg'),sim.querySelector('.simctl'));sim.replaceChildren(layout);
  result.hidden=true;fig.append(result);groups.push({name:'實驗結果',nodes:[document.createElement('p')]});
  resultObserver=new MutationObserver(()=>{if(!READING||LI!==SIM_CARD)return;READING.groups[3].nodes=readingBlocks(result);if(!READING.groups[3].nodes.length){const p=document.createElement('p');p.textContent=result.textContent;READING.groups[3].nodes=[p];}READING.cache='';if(result.textContent.includes('結果')||result.textContent.includes('無法確定'))selectReadingTab(3);fit();});
  groups[3].nodes[0].textContent=result.textContent;resultObserver.observe(result,{childList:true,subtree:true,characterData:true});
 }
 READING={groups,tab:0,indices:groups.map(()=>0),pages:[],cache:''};
 const tabs=document.createElement('div');tabs.className='reading-tabs';tabs.setAttribute('role','tablist');tabs.setAttribute('aria-label','圖解解說分頁');
 groups.forEach((g,i)=>{const b=document.createElement('button');b.id='reading-tab-'+i;b.textContent=g.name;b.setAttribute('role','tab');b.setAttribute('aria-controls','reading-pane-'+i);b.onclick=()=>selectReadingTab(i);b.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();e.stopPropagation();const n=e.key==='Home'?0:e.key==='End'?groups.length-1:(i+(e.key==='ArrowRight'?1:-1)+groups.length)%groups.length;selectReadingTab(n);tabs.children[n].focus();}};tabs.append(b);});
 text.replaceChildren(tabs);groups.forEach((g,i)=>{const pane=document.createElement('section');pane.className='reading-pane'+(g.notes?' notes-pane':'');pane.id='reading-pane-'+i;pane.setAttribute('role','tabpanel');pane.setAttribute('aria-labelledby','reading-tab-'+i);if(g.notes){pane.append(...g.notes.childNodes);pane.querySelector('textarea').oninput=e=>{ST.notes[LEARN[LI].id]=e.target.value;save();};}else{pane.innerHTML='<div class="reading-body"></div><div class="reading-pager"><button aria-label="上一頁解說">←</button><span aria-live="polite"></span><button aria-label="下一頁解說">→</button></div>';const buttons=pane.querySelectorAll('button');buttons[0].onclick=()=>stepReading(-1);buttons[1].onclick=()=>stepReading(1);}text.append(pane);});
 const table=canvas.querySelector('.cmp2');if(table){canvas.classList.add('table-canvas');const rows=[...table.rows].slice(1),pager=document.createElement('div');pager.className='table-pager';pager.innerHTML='<button>← 前組</button><span></span><button>後組 →</button><button>完整表格 ↗</button>';tools.append(pager);tableState={table,rows,index:0,count:1,pager,original:table.outerHTML};const b=pager.querySelectorAll('button');b[0].onclick=()=>{tableState.index--;fitLessonTable();};b[1].onclick=()=>{tableState.index++;fitLessonTable();};b[2].onclick=()=>openDialog('完整實驗設計比較表',tableState.original);}
 el('lcard').querySelectorAll('img').forEach(img=>img.addEventListener('load',fit,{once:true}));selectReadingTab(0);
}
function selectReadingTab(i){if(!READING)return;READING.tab=i;el('lcard').querySelectorAll('.reading-tabs button').forEach((b,j)=>{b.setAttribute('aria-selected',String(i===j));b.tabIndex=i===j?0:-1;});el('lcard').querySelectorAll('.reading-pane').forEach((p,j)=>p.hidden=i!==j);READING.cache='';fit();}
function stepReading(d){if(!READING)return;const i=READING.tab;READING.indices[i]=Math.max(0,Math.min((READING.pages[i]?.length||1)-1,READING.indices[i]+d));renderReading();}
function splitBlock(node,body){
 // Range fragments keep inline emphasis and every character when a long paragraph needs another page.
 const length=node.textContent.length;if(!length)return [node];const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT),texts=[];let n,offset=0;while(n=walker.nextNode()){texts.push({node:n,start:offset,end:offset+n.length});offset+=n.length;}
 function fragment(a,b){const range=document.createRange(),start=texts.find(t=>t.end>a),end=texts.find(t=>t.end>=b);range.setStart(start.node,a-start.start);range.setEnd(end.node,b-end.start);const clone=node.cloneNode(false);clone.append(range.cloneContents());return clone;}
 const parts=[];let from=0;while(from<length){let lo=from+1,hi=length,best=lo;while(lo<=hi){const mid=(lo+hi)>>1,c=fragment(from,mid);body.replaceChildren(c);if(body.scrollHeight<=body.clientHeight+1){best=mid;lo=mid+1;}else hi=mid-1;}
  if(best<length){const s=node.textContent.slice(from,best),breakAt=Math.max(s.lastIndexOf('。'),s.lastIndexOf('；'),s.lastIndexOf('，'));if(breakAt>Math.max(20,s.length*.55))best=from+breakAt+1;}
  parts.push(fragment(from,best));from=best;
 }body.replaceChildren();return parts;
}
function paginateReading(){
 if(!READING)return;const i=READING.tab,g=READING.groups[i];if(g.notes)return;const pane=el('reading-pane-'+i),body=pane.querySelector('.reading-body'),pager=pane.querySelector('.reading-pager');pager.hidden=false;
 const key=[i,body.clientWidth,body.clientHeight,ST.font,innerWidth>900].join(':');if(READING.cache===key){renderReading();return;}
 const pages=[[]];body.replaceChildren();
 if(innerWidth<=900){pages[0]=g.nodes.map(x=>x.cloneNode(true));}
 else for(const original of g.nodes){let node=original.cloneNode(true);body.append(node);if(body.scrollHeight<=body.clientHeight+1){pages.at(-1).push(node);continue;}node.remove();if(pages.at(-1).length){pages.push([]);body.replaceChildren();}body.append(node);if(body.scrollHeight<=body.clientHeight+1){pages.at(-1).push(node);continue;}
  body.replaceChildren();const parts=splitBlock(original,body);for(const part of parts){if(pages.at(-1).length)pages.push([]);pages.at(-1).push(part);}body.replaceChildren(...pages.at(-1));
 }
 READING.pages[i]=pages;READING.cache=key;READING.indices[i]=Math.min(READING.indices[i],pages.length-1);renderReading();
}
function renderReading(){if(!READING)return;const i=READING.tab,pages=READING.pages[i];if(!pages)return;const pane=el('reading-pane-'+i),j=READING.indices[i];pane.querySelector('.reading-body').replaceChildren(...pages[j].map(x=>x.cloneNode(true)));const pager=pane.querySelector('.reading-pager');pager.hidden=pages.length<2;pager.querySelector('span').textContent=`${j+1} / ${pages.length} 頁`;const b=pager.querySelectorAll('button');b[0].disabled=j===0;b[1].disabled=j===pages.length-1;bindZoom(pane);}
function fitLessonTable(){if(!tableState)return;const {table,rows,pager}=tableState,canvas=table.closest('.figure-canvas');rows.forEach(r=>r.hidden=false);if(innerWidth<=900){tableState.count=rows.length;tableState.index=0;}else{const head=table.rows[0].getBoundingClientRect().height,room=canvas.clientHeight-head-2;let height=0,count=0;for(const row of rows){const h=row.getBoundingClientRect().height;if(height+h>room&&count)break;height+=h;count++;}tableState.count=Math.max(1,count);tableState.index=Math.max(0,Math.min(Math.ceil(rows.length/tableState.count)-1,tableState.index));}
 const {count,index}=tableState;rows.forEach((r,i)=>r.hidden=i<index*count||i>=(index+1)*count);pager.querySelector('span').textContent=`${index+1} / ${Math.ceil(rows.length/count)} 組`;const b=pager.querySelectorAll('button');b[0].disabled=index===0;b[1].disabled=(index+1)*count>=rows.length;
}
function fitLesson(){
 const stage=el('learn-stage'),card=el('lcard'),root=document.documentElement,fs=document.fullscreenElement===stage||stage.classList.contains('presentation');
 if(innerWidth>900){const top=fs?12:card.getBoundingClientRect().top,nav=(fs?stage.querySelector('.fs-controls'):el('learn').querySelector('.lnav')).getBoundingClientRect().height,head=card.querySelector('.lhead').getBoundingClientRect().height,cardH=Math.max(230,innerHeight-top-nav-26);root.style.setProperty('--lesson-card-height',cardH+'px');root.style.setProperty('--lesson-body-height',(cardH-head-2)+'px');}
 paginateReading();fitLessonTable();
}

function fit(){if(fitPending)return;fitPending=true;requestAnimationFrame(()=>{fitPending=false;const bar=el('bar'),h=bar.classList.contains('hidden')?0:Math.ceil(bar.getBoundingClientRect().height);if(document.documentElement.style.getPropertyValue('--barh')!==h+'px')document.documentElement.style.setProperty('--barh',h+'px');

 if(QI===2){const layout=panel.querySelector('.fill-layout'),rail=panel.querySelector('.reference-rail'),img=rail?.querySelector('img');if(img){const caption=rail.querySelector('p').getBoundingClientRect().height+8,ratio=img.naturalWidth/img.naturalHeight||1.115;const width=Math.min(360,Math.max(140,(available-caption)*ratio));layout.style.setProperty('--reference-width',width+'px');}}

 if(QI===1){const group=panel.querySelector('.jar-group'),img=group?.querySelector('img');if(img){const rest=group.getBoundingClientRect().height-img.getBoundingClientRect().height;panel.querySelectorAll('.jar-group img').forEach(x=>{const limit=Math.max(50,available-rest-22);x.style.maxHeight=limit+'px';});}}
 } });}

el('hint-toggle').setAttribute('aria-haspopup','dialog');el('hint-toggle').onclick=()=>{el('hint-toggle').setAttribute('aria-expanded','true');const d=openDialog('思考提示',`<p>${esc(STAGES[QI].hint)}</p>`);d.addEventListener('close',()=>el('hint-toggle').setAttribute('aria-expanded','false'),{once:true});};el('reference-btn').onclick=()=>openReferences(STAGES[QI]);el('question-learn').onclick=()=>{returnQuestion=true;navigate('learn',STAGES[QI].learn)};el('q-jump').onchange=e=>showQuestion(+e.target.value);el('prev-btn').onclick=()=>QI>0&&showQuestion(QI-1);el('skip-btn').onclick=()=>QI<STAGES.length-1?showQuestion(QI+1):navigate('done');el('check-btn').onclick=check;el('reset-btn').onclick=resetQuestion;el('finish-btn').onclick=()=>navigate('done');
