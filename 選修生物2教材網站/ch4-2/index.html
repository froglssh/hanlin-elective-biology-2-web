r>雌花序<br>柱頭<br>柱頭<br>花藥<br>第 4 章  植物的生殖　119<br>授粉作用與花形態的多樣化<br>植物的花粉粒散播至雌性生殖構造的過<br>程稱為授粉作用。被子植物的花有多種特化<br>的外形，有利於進行多樣化的授粉方式，例<br>如：花瓣鮮豔、明顯，具有濃郁氣味或產生<br>花蜜，可吸引昆蟲或鳥類等動物訪花覓食。<br>在訪花過程中，這些動物身上沾滿花粉，成<br>為協助植物傳粉的媒介。有些植物沒有上述<br>吸引動物的特徵，但雄蕊具有大型花藥以產<br>生大量花粉粒，且花粉粒可藉風力飄落至毛<br>狀的柱頭上，如玉米（圖 4－10）。<br>授粉作用　pollination<br> 圖 4－10　<br> 玉米植株。雌、雄花序分別位於植株的<br>葉腋與莖頂，藉風力傳粉。<br>花與授粉昆蟲的共同演化<br>當某種植物由特定的動物協助傳播花粉時，其花萼、花冠、雄蕊及雌蕊之形態、顏色、氣味等特性多<br>與其傳粉動物有特殊的配合。換言之，此兩種生物的構造或外形已相互配合、適應，並有利於雙方或單<br>方的生存，所以有學者視之為一種共同演化的現象，例如：蘭花的雌、雄蕊共同長在一個稱為蕊柱的構造<br>上，但其位置不利於自花授粉，而須藉由蜂類的訪花行為進行授粉作用。<br>右圖的蜂蘭，其花形與雌角蜂的<br>外形相似（圖a），並具特殊氣味，<br>可引誘雄角蜂前來企圖進行交配（圖<br>b）。若雄角蜂的頭部碰觸到上方的<br>雄蕊蓋，會使花粉塊剝落並黏附在雄<br>角蜂的頭上（圖c），當這隻攜帶花<br>粉塊的雄角蜂再飛至另一朵蜂蘭時，<br>此花粉塊即能落在柱頭上，完成異花<br>授粉。<br>知識補給站<br>柱頭<br>雄蕊蓋<br>蕊柱<br>花粉塊<br>a<br>b<br>c<br>第 4 章  植物的生殖　119<small>課本 PDF 第 9 頁，印刷 P119（完整原文）</small></div>", "tb": [["BOOK9", "P119 完整課本頁"]]}, {"id": "b2-42-l19", "t": "蘭花擬態與共同演化的判讀", "src": "課本 P119；原PPT第 37 頁", "slide": 37, "sec": "s3", "figSpec": {"image": "orchid"}, "txt": "<ul><li>原照片追蹤昆蟲造訪蘭花、攜帶花粉，再接觸另一花柱頭的過程。</li><li>花的形態或氣味可影響昆蟲行為；有些蘭花以性欺騙吸引傳粉。</li><li>觀察到配合不等於已證明雙方共同演化；需要遺傳變化與相互選擇的證據。</li></ul><p class=\"think\">思考：昆蟲協助傳粉，是否一定也獲得花蜜？</p><p class=\"scope-note\">教材判讀：共同演化指相互作用物種因彼此選擇而發生的演化改變；不只等於外形相配，也不保證每次互動雙方受益。<a href=\"https://whitemanlab.org/wp-content/uploads/2024/01/2014_1.pdf\" target=\"_blank\" rel=\"noopener\">共同演化：相互的演化改變</a></p><div class=\"quote\"> <br>知識補給站<br>花與授粉昆蟲的共同演化<br>       當某種植物由特定的動物協助傳播花粉時，其花萼、花冠、雄蕊及雌蕊之形態、顏色、氣味等特性多與其傳粉動物有特殊的配合。換言之，<br>此兩種生物的構造或外形已相互配合、適應，並有利於雙方或單方的生存<br>，所以有學者視之為一種<br>共同演化<br>的現象。<br>配合課本 <br>P119<br>37<small>原PPT第 37 頁（完整原文）</small></div><div class=\"quote\"> <br>知識補給站<br>花與授粉昆蟲的共同演化<br>若雄角蜂的頭部碰觸到上方的雄蕊蓋，會使花粉塊剝落並黏附在雄角蜂的頭上，當這隻攜帶花粉塊的雄角蜂再飛至另一朵蜂蘭時，此花粉塊即能落在柱頭上，完成異花授粉<br>       例如<br>：<br>蘭花的雌、雄蕊共同長在一個稱為蕊柱的構造上，但其位置不利於自花授粉，而須藉由蜂類的訪花行為進行授粉作用。<br>蜂蘭<br>的<br>花形與雌角蜂的外形相似<br>蜂蘭<br>具特殊氣味，可引誘雄角蜂前來進行交配<br>蕊柱<br>柱頭<br>雄蕊蓋<br>花粉塊<br>配合課本 <br>P119<br>38<small>原PPT第 38 頁（完整原文）</small></div><div class=\"quote\">雄花序<br>雌花序<b 珠方向延伸至珠被開口處<br>時，再將管中的兩個精細胞送入胚珠內的胚囊中<br>（圖 4－83）。胚囊中的卵細胞與具有 2 個細<br>胞核（極核）的中央細胞，將分別與兩個精細胞<br>進行受精作用，產生受精卵（2n）與胚乳母細胞<br>（3n），這種被子植物特有的受精作用稱為雙重<br>受精（圖 4－84、4－11）。<br>種子與果實的生成<br>種子是由胚珠發育而來，包含種皮、胚及<br>胚乳。在雙重受精後的發育過程中，胚珠內的<br>胚乳母細胞發育成胚乳（3n），受精卵發育成胚<br>（2n），而外層的珠被則長成種皮（圖 4－85、<br>4－11）。胚珠發育成種子的同時，其外圍的子房<br>壁發育成果皮，種子與果皮共同形成果實。<br> 圖 4－11　<br> 被子植物的雙重受精與胚珠發育成<br>種子的過程<br>精細胞<br>精細胞＋卵細胞<br>精細胞＋中央細胞<br>中央細胞<br>卵細胞<br>管核<br>極核<br>珠被<br>花粉管<br>胚乳母細胞<br>珠被發育<br>為種皮<br>胚珠發育為種子<br>受精卵<br>雙<br>重<br>受<br>精<br>受精卵發育<br>為胚<br>胚乳母細胞<br>發育為胚乳<br>胚珠<br>種子<br>胚珠　ovule<br>珠被　integument<br>雙重受精　double fertilization<br>120　選修生物 Ⅱ (全)<small>課本 PDF 第 10 頁，印刷 P120（完整原文）</small></div>", "tb": [["BOOK10", "P120 完整課本頁"]]}, {"id": "b2-42-l21", "t": "雙重受精：兩顆精細胞、兩種產物", "src": "課本 P120；原PPT第 41 頁", "slide": 41, "sec": "s4", "figSpec": {"flip": [41]}, "txt": "<ul><li>一精細胞n與卵n結合，形成2n合子，後續發育成胚。</li><li>另一精細胞n與中央細胞的兩個極核n+n結合，形成3n初生胚乳核。</li><li>典型雙重受精發生在胚珠內的胚囊；柱頭是花粉接收處。</li></ul><p class=\"think\">思考：胚與胚乳的套數，為什麼不同？</p><div class=\"quote\">花粉管<br>（ <br>1n <br>）<br>兩個<br>精細胞<br>（ <br>1n <br>）<br>管核<br>（ <br>1n<br> <br>）<br> <br>後來退化消失<br>1<br> 個精細胞<br> +<br> <br>1<br> 個<br>卵細胞<br>卵細胞<br>（<br>1<br> <br>n<br> ）<br>1<br> 個精細胞<br> <br>+<br> <br>2<br> 個極核<br>極核<br>（ <br>1n<br> <br>）<br>4-2.3 <br>被子植物有性生殖的階段<br>雙重受精<br>配合課本 <br>P119<br>、<br>120<small>原PPT第 41 頁（完整原文）</small></div><div class=\"quote\">胚珠的構造與雙重受精<br>胚珠是大孢子發育成雌配子體之處，也是進<br>行受精作用與受精卵發育成胚等過程的位置。胚<br>珠內的大孢子母細胞經減數分裂產生 4 個大孢<br>子，其中3 個退化，1 個大孢子再經有絲分裂發<br>育成雌配子體，稱為胚囊（圖4－82）。胚珠的<br>外層是由多層細胞所構成的珠被，可保護胚珠內<br>部組織。<br>當花粉粒傳至雌蕊柱頭時，已是具有生殖<br>細胞與營養細胞的雄配子體。花粉粒在柱頭上<br>萌發成花粉管時，生殖細胞會有絲分裂為兩個<br>精細胞。花粉管朝胚珠方向延伸至珠被開口處<br>時，再將管中的兩個精細胞送入胚珠內的胚囊中<br>（圖 4－83）。胚囊中的卵細胞與具有 2 個細<br>胞核（極核）的中央細胞，將分別與兩個精細胞<br>進行受精作用，產生受精卵（2n）與胚乳母細胞<br>（3n），這種被子植物特有的受精作用稱為雙重<br>受精（圖 4－84、4－11）。<br>種子與果實的生成<br>種子是由胚珠發育而來，包含種皮、胚及<br>胚乳。在雙重受精後的發育過程中，胚珠內的<br>胚乳母細胞發育成胚乳（3n），受精卵發育成胚<br>（2n），而外層的珠被則長成種皮（圖 4－85、<br>4－11）。胚珠發育成種子的同時，其外圍的子房<br>壁發育成果皮，種子與果皮共同形成果實。<br> 圖 4－11　<br> 被子植物的雙重受精與胚珠發育成<br>種子的過程<br>精細  4－84、4－11）。<br>種子與果實的生成<br>種子是由胚珠發育而來，包含種皮、胚及<br>胚乳。在雙重受精後的發育過程中，胚珠內的<br>胚乳母細胞發育成胚乳（3n），受精卵發育成胚<br>（2n），而外層的珠被則長成種皮（圖 4－85、<br>4－11）。胚珠發育成種子的同時，其外圍的子房<br>壁發育成果皮，種子與果皮共同形成果實。<br> 圖 4－11　<br> 被子植物的雙重受精與胚珠發育成<br>種子的過程<br>精細胞<br>精細胞＋卵細胞<br>精細胞＋中央細胞<br>中央細胞<br>卵細胞<br>管核<br>極核<br>珠被<br>花粉管<br>胚乳母細胞<br>珠被發育<br>為種皮<br>胚珠發育為種子<br>受精卵<br>雙<br>重<br>受<br>精<br>受精卵發育<br>為胚<br>胚乳母細胞<br>發育為胚乳<br>胚珠<br>種子<br>胚珠　ovule<br>珠被　integument<br>雙重受精　double fertilization<br>120　選修生物 Ⅱ (全)<small>課本 PDF 第 10 頁，印刷 P120（完整原文）</small></div>", "tb": [["BOOK10", "P120 完整課本頁"]]}, {"id": "b2-42-l27", "t": "原題二：豌豆種子與果皮", "src": "課本 P120；原PPT第 49 頁", "slide": 49, "sec": "s6", "figSpec": {"flip": [49]}, "txt": "<ul><li>原題甲為種子，乙為果皮；正確答案為<b>D</b>。</li><li>甲的數量小於或等於花中原有胚珠數；果皮來自子房壁而非珠被。</li><li>種子不同組織有不同來源；成熟豌豆沒有大量殘留胚乳。</li></ul><p class=\"think\">思考：為何不能宣稱種子所有細胞基因型必定相同？</p><div class=\"quote\">  <br>Question<br>2. <br>下圖為豌豆果實，下列關於甲、乙構造的敘述，何者正確？<br>(A)<br>甲為種子，來自胚珠受精後發育而成，構造中的所有細胞基因型皆<br>相同　<br>(<br>B)<br>乙為果皮，發育來自珠<br>被　<br>(<br>C)<br>甲中可找到大量 <br>3n<br> 的<br>胚乳　<br>(<br>D)<br>甲的數量小於或等於豌豆花中的胚珠數目。<br>解答<br>：<br>(D)<br>解析<br>：<br>(A)<br>珠被的基因型來自雌蕊，與其他合子發育來的細胞不同。<br>(B)<br>果皮來自子房壁的發育。<br>(C)<br>豌豆為雙子葉植物，其胚乳在種子階段已消耗殆盡。<br>49<small>原PPT第 49 頁（完整原文）</small></div><div class=\"quote\">胚珠的構造與雙重受精<br>胚珠是大孢子發育成雌配子體之處，也是進<br>行受精作用與受精卵發育成胚等過程的位置。胚<br>珠內的大孢子母細胞經減數分裂產生 4 個大孢<br>子，其中3 個退化，1 個大孢子再經有絲分裂發<br>育成雌配子體，稱為胚囊（圖4－82）。胚珠的<br>外層是由多層細胞所構成的珠被，可保護胚珠內<br>部組織。<br>當花粉粒傳至雌蕊柱頭時，已是具有生殖<br>細胞與營養細胞的雄配子體。花粉粒在柱頭上<br>萌發成花粉管時，生殖細胞會有絲分裂為兩個<br>精細胞。花粉管朝胚珠方向延伸至珠被開口處<br>時，再將管中的兩個精細胞送入胚珠內的胚囊中<br>（圖 4－83）。胚囊中的卵細胞與具有 2 個細<br>胞核（極核）的中央細胞，將分別與兩個精細胞<br>進行受精作用，產生受精卵（2n）與胚乳母細胞<br>（3n），這種被子植物特有的受精作用稱為雙重<br>受精（圖 4－84、4－11）。<br>種子與果實的生成<br>種子是由胚珠發育而來，包含種皮、胚及<br>胚乳。在雙重受精後的發育過程中，胚珠內的<br>胚乳母細胞發育成胚乳（3n），受精卵發育成胚<br>（2n），而外層的珠被則長成種皮（圖 4－85、<br>4－11）。胚珠發育成種子的同時，其外圍的子房<br>壁發育成果皮，種子與果皮共同形成果實。<br> 圖 4－11　<br> 被子植物的雙重受精與胚珠發育成<br>種子的過程<br>精細胞<br>精細胞＋卵細胞<br>精細胞＋中央細胞<br>中央細胞<br>卵細胞<br>管核<br>極核<br>珠被<br>花粉管<br>胚乳母細胞<br>珠被發育<br>為種皮<br>胚珠發育為種子<br>受精卵<br>雙<br>重<br>受<br>精<br>受精卵發育<br>為胚<br>胚乳母細胞<br>發育為胚乳<br>胚珠<br>種子<br>胚珠　ovule<br>珠被　integument<br>雙重受精　double fertilization<br>120　選修生物 Ⅱ (全)<small>課本 PDF 第 10 頁，印刷 P120（完整原文）</small></div>", "tb": [["BOOK10", "P120 完整課本頁"]]}, {"id": "b2-42-l28", "t": "原題三：椰子傳粉的支持證據", "src": "課本 P119；原PPT第 50 頁", "slide": 50, "sec": "s6", "figSpec": {"flip": [50]}, "txt": "<ul><li>依原題設問，選出支持蟲媒傳粉的特徵，原答案為<b>C、D、E</b>。</li><li>花蜜與芳香可吸引昆蟲；原題將較粗糙花粉列為支持特徵。</li><li>特徵提供假說支持，仍需昆蟲攜粉、柱頭接觸與繁殖成功等觀察。</li></ul><p class=\"think\">思考：一項特徵能否排除其他傳粉媒介？</p><p class=\"scope-note\">教材判讀：原題的「至今仍無定論」保留為當時題目文字，不另當成現況主張。花粉縱溝本身不是蟲媒的專一證據；答案按原教材保留，新增練習採多項證據與直接觀察。</p><div class=\"quote\">  <br>Question<br>3. <br>椰子樹究竟是如何傳<br>粉，至今<br>仍無定論，有一派學者認為椰子樹主要以風媒進行傳粉，但有另一派學者認為在部分區域的椰子主要以蟲媒進行傳粉，下列哪些因素使學者認為椰子樹是蟲媒傳粉的植物<br>？　<br>(<br>A)<br>椰子花粉量多 <br>(B)<br>雄蕊呈細碎<br>狀　<br>(<br>C)<br>椰子花具有<br>花蜜　<br>(<br>D)<br>花粉粒有一條明顯的縱溝，<br>較<br>粗糙　<br>(<br>E)<br>花期中椰子花具有芳香氣味。<br>解答<br>：<br>(C)(D)(E)<br>解<br>析<br>：<br>(A)<br>花粉較多是風媒花的特色。<br>(B)<br>雄蕊呈細碎狀有利花粉隨風散播。<br>50<small>原PPT第 50 頁（完整原文）</small></div><div class=\"quote\">雄花序<br>雌花序<br>柱頭<br>柱頭<br>花藥<br>第 4 章  植物的生殖　119<br>授粉作用與花形態的多樣化<br>植物的花粉粒散播至雌性生殖構造的過<br>程稱為授粉作用。被子植物的花有多種特化<br>的外形，有利於進行多樣化的授粉方式，例<br>如：花瓣鮮豔、明顯，具有濃郁氣味或產生<br>花蜜，可吸引昆蟲或鳥類等動物訪花覓食。<br>在訪花過程中，這些動物身上沾滿花粉，成<br>為協助植物傳粉的媒介。有些植物沒有上述<br>吸引動物的特徵，但雄蕊具有大型花藥以產<br>生大量花粉粒，且花粉粒可藉風力飄落至毛<br>狀的柱頭上，如玉米（圖 4－10）。<br>授粉作用　pollination<br> 圖 4－10　<br> 玉米植株。雌、雄花序分別位於植株的<br>葉腋與莖頂，藉風力傳粉。<br>花與授粉昆蟲的共同演化<br>當某種植物由特定的動物協助傳播花粉時，其花萼、花冠、雄蕊及雌蕊之形態、顏色、氣味等特性多<br>與其傳粉動物有特殊的配合。換言之，此兩種生物的構造或外形已相互配合、適應，並有利於雙方或單<br>方的生存，所以有學者視之為一種共同演化的現象，例如：蘭花的雌、雄蕊共同長在一個稱為蕊柱的構造<br>上，但其位置不利於自花授粉，而須藉由蜂類的訪花行為進行授粉作用。<br>右圖的蜂蘭，其花形與雌角蜂的<br>外形相似（圖a），並具特殊氣味，<br>可引誘雄角蜂前來企圖進行交配（圖<br>b）。若雄角蜂的頭部碰觸到上方的<br>雄蕊蓋，會使花粉塊剝落並黏附在雄<br>角蜂的頭上（圖c），當這隻攜帶花<br>粉塊的雄角蜂再飛至另一朵蜂蘭時，<br>此花粉塊即能落在柱頭上，完成異花<br>授粉。<br>知識補給站<br>柱頭<br>雄蕊蓋<br>蕊柱<br>花粉塊<br>a<br>b<br>c<br>第 4 章  植物的生殖　119<small>課本 PDF 第 9 頁，印刷 P119（完整原文）</small></div>", "tb": [["BOOK9", "P119 完整課本頁"]]}], "questions": [{"t": "花的構造：六個角色", "q": "將構造或功能卡放回對應位置。", "learn": 1, "tag": "flower", "hint": "由大構造到內部構造，先辨認雄蕊與雌蕊。", "why": "花萼、花冠分別由萼片、花瓣構成；雄蕊有花絲、花藥；雌蕊有柱頭、花柱、子房。胚珠在子房內，發育對應不同。", "sub": "課本P111圖4-4；PPT3", "refs": [{"src": "overview", "cap": "課本P111圖4-4：花的完整構造"}, {"src": "PPT03S3", "cap": "原PPT第3頁末段代表畫面"}, {"src": "BOOK1", "cap": "P111 完整課本頁"}], "kind": "drag", "slots": [{"id": "s0", "label": "花萼"}, {"id": "s1", "label": "花冠"}, {"id": "s2", "label": "雄蕊"}, {"id": "s3", "label": "雌蕊"}, {"id": "s4", "label": "子房"}, {"id": "s5", "label": "胚珠"}], "pieces": [{"id": "a0", "label": "由萼片構成"}, {"id": "a1", "label": "由花瓣構成"}, {"id": "a2", "label": "包含花絲與花藥"}, {"id": "a3", "label": "包含柱頭、花柱、子房"}, {"id": "a4", "label": "內含胚珠的構造"}, {"id": "a5", "label": "受精後可發育為種子"}], "sol": {"s0": "a0", "s1": "a1", "s2": "a2", "s3": "a3", "s4": "a4", "s5": "a5"}, "pre": {"s0": "a0"}, "id": "b2-42-q01"}, {"t": "完全花與兩性花：兩套判準", "q": "逐一辨認四個花構造情境。", "learn": 2, "tag": "flower", "hint": "完全花看四大部分，兩性花看同一朵花內是否有雌雄蕊。", "why": "完全花必有雌雄蕊，故是兩性花；兩性花若缺少花萼或花冠，仍是不完全花。", "sub": "課本P112圖4-5；PPT4–7", "refs": [{"src": "flowerTypes", "cap": "完全花與兩性花：兩套判準完整教材圖"}, {"src": "PPT04S3", "cap": "原PPT第4頁末段代表畫面"}, {"src": "BOOK2", "cap": "P112 完整課本頁"}], "fig": "flowerTypes", "kind": "fill", "imageWidth": 560, "figCaption": "課本P112圖4-5；PPT4–7", "rows": [{"q": "四大部分都有，該如何分類？", "o": ["完全花，也是兩性花", "完全花，但一定是單性花", "不完全花，因為有雌蕊"], "tag": "flower"}, {"q": "有雌雄蕊，但缺少花冠，是？", "o": ["不完全花、兩性花", "完全花、單性花", "完全花、兩性花"], "tag": "flower"}, {"q": "有雄蕊，沒有雌蕊的花，是？", "o": ["單性花，也是不完全花", "兩性花，也是完全花", "兩性花，但缺花藥"], "tag": "flower"}, {"q": "完全花的判準應看什麼？", "o": ["花萼、花冠、雄蕊、雌蕊是否都有", "只看花瓣是否鮮豔", "只看有沒有昆蟲造訪"], "tag": "flower"}], "id": "b2-42-q02"}, {"t": "果實分類：依成熟構造判讀", "q": "將六張描述卡放到對應類型。", "learn": 5, "tag": "fruit", "hint": "看成熟果皮及發育來源，不以人工剝開與否判斷。", "why": "豌豆為裂開的乾果；向日葵與栗為閉果例子。桃為核果。草莓可食部主要是花托；鳳梨涉及整個花序。原圖花生分類另附說明，未拿它作裂果標準。", "sub": "課本P113–115；PPT9–15", "refs": [{"src": "fruitTypes", "cap": "課本P113圖4-6完整分類原圖；花生標示另附判讀"}, {"src": "PPT09S3", "cap": "原PPT第9頁末段代表畫面"}, {"src": "BOOK3", "cap": "P113 完整課本頁"}], "kind": "drag", "slots }, {"id": "a4", "label": "受精形成2n合子"}, {"id": "a5", "label": "合子有絲分裂成2n孢子體"}], "sol": {"s0": "a0", "s1": "a1", "s2": "a2", "s3": "a3", "s4": "a4", "s5": "a5"}, "pre": {}, "id": "b2-42-q05"}, {"t": "母細胞、孢子與配子體的倍數", "q": "逐一追蹤雌雄兩條發育途徑。", "learn": 11, "tag": "cycle", "hint": "辨認母細胞、孢子、配子體與配子，不只背名稱。", "why": "母細胞屬2n孢子體；減數分裂產生n孢子，再有絲分裂形成配子體。花粉、胚囊分別為雄、雌配子體。", "sub": "課本P117圖4-8；PPT17–24", "refs": [{"src": "gametophytes", "cap": "母細胞、孢子與配子體的倍數完整教材圖"}, {"src": "PPT17S3", "cap": "原PPT第17頁末段代表畫面"}, {"src": "BOOK7", "cap": "P117 完整課本頁"}], "fig": "gametophytes", "kind": "fill", "imageWidth": 540, "figCaption": "課本P117圖4-8；PPT17–24", "rows": [{"q": "大、小孢子母細胞的套數為？", "o": ["2n，屬孢子體組織", "n，已是配子", "3n，都是胚乳"], "tag": "cycle"}, {"q": "減數分裂形成的大、小孢子為？", "o": ["n孢子，尚不是卵或精", "2n受精卵", "3n配子體"], "tag": "cycle"}, {"q": "花粉與胚囊各代表？", "o": ["雄配子體與雌配子體", "雄孢子體與雌孢子體", "兩種受精卵"], "tag": "cycle"}, {"q": "孢子發育成配子體，主要進行？", "o": ["有絲分裂，維持n", "受精，改成2n", "再減數分裂，改成半個n"], "tag": "cycle"}], "id": "b2-42-q06"}, {"t": "胚囊形成：七個細胞與八個核", "q": "依典型模型逐一判讀四個問題。", "learn": 13, "tag": "cycle", "hint": "兩個極核共處於一個中央細胞；不要把細胞數當成核數。", "why": "典型大孢子母細胞減數分裂後，保留一大孢子；三次有絲分裂形成八核，再構成七細胞八核胚囊。中央細胞含兩個n極核。", "sub": "課本P117圖4-8；PPT25–28", "refs": [{"src": "PPT28S3", "cap": "胚囊形成：七個細胞與八個核完整教材圖"}, {"src": "PPT27S3", "cap": "原PPT第27頁末段代表畫面"}, {"src": "BOOK7", "cap": "P117 完整課本頁"}], "fig": "PPT28S3", "kind": "fill", "imageWidth": 600, "figCaption": "課本P117圖4-8；PPT25–28", "rows": [{"q": "一次減數分裂後，通常保留幾個大孢子？", "o": ["一個，另三個退化", "四個都直接成為卵", "八個都直接成為卵"], "tag": "cycle"}, {"q": "保留的大孢子形成八個核，需幾次有絲分裂？", "o": ["三次", "一次", "三次減數分裂"], "tag": "cycle"}, {"q": "典型成熟胚囊的細胞／核數為？", "o": ["七個細胞、八個核", "八個細胞、七個核", "一個細胞、兩個核"], "tag": "cycle"}, {"q": "中央細胞的兩個極核，在融合前各為？", "o": ["各n，以n+n表示", "各2n，共4n", "各3n，共6n"], "tag": "cycle"}], "id": "b2-42-q07"}, {"t": "花粉形成：哪個細胞會成為精細胞？", "q": "逐一辨認小孢子與花粉發育。", "learn": 15, "tag": "cycle", "hint": "母細胞減數分裂形成小孢子；生殖細胞有絲分裂形成精細胞。", "why": "花粉是雄配子體，精細胞由生殖細胞分裂形成；形成時機可在散粉前或花粉管生長時。", "sub": "課本P118圖4-9；PPT29–33", "refs": [{"src": "pollen", "cap": "花粉形成：哪個細胞會成為精細胞？完整教材圖"}, {"src": "PPT31S3", "cap": "原PPT第31頁末段代表畫面"}, {"src": "BOOK8", "cap": "P118 完整課本頁"}], "fig": "pollen", "kind": "fill", "imageWidth": 560, "figCaption": "課本P118圖4-9；PPT29–33", "rows": [{"q": "一個小孢子母細胞減數分裂形成？", "o": ["四個n小孢子", "四個2n胚乳", "兩個3n受精卵"], "tag": "cycle"}, {"q": "形成管細胞與生殖細胞，是哪種分裂？", "o": ["有絲分裂", "受精", "減數分裂"], "tag": "cycle"}, {"q": "兩個精細胞由何者分裂形成？", "o": ["生殖細胞", "管核與卵結合", "珠被細胞"], "tag": "cycle"}, {"q": "散粉時是否一定尚未形成精細胞？", "o": ["不一定，依植物可為二細胞或三細胞花粉", "一定，所有植物都完全相同", "一定，花粉永遠只有一個細胞"], "tag": "cycle"}], "id": "b2-42-q08"}, {"t": "傳粉媒介：特徵與直接證據", "q": "比較特徵與研究結論的證據強度。", "learn": 17, "tag": "pollen", "hint": "單項特徵只是支持；花粉是否真的送達且促成繁殖需要觀察。", "why": "風媒、蟲媒的特徵比較是趨勢；昆蟲造訪不一定等於有效傳粉，多項特徵與直接觀察可相互補強。", "sub": "課本P119；PPT35–38", "refs": [{"src": "PPT36S3", "cap": "傳粉媒介：特徵與直接證據完整教材圖"}, {"src": "PPT35S3", "cap": "原PPT第35頁末段代表畫面"}, {"src": "BOOK9", "cap": "P119 完整課本頁"}], "fig": "PPT36S3", "kind": "fill", "imageWidth": 560, "figCaption": "課本P119；PPT35–38", "rows": [{"q": "花蜜、芳香與昆蟲造訪，通常支持？", "o": ["蟲媒假說，仍需追蹤實際傳粉", "完全排除任何風媒", "花粉必已與卵受精"], "tag": "pollen"}, {"q": "大量輕花粉、暴露接收構造，通常支持？", "o": ["風媒傳粉的可能性", "完全不需要柱頭", "所有花都是兩性花"], "tag": "pollen"}, {"q": "證明昆蟲是有效傳粉者，還應觀察？", "o": ["攜粉、接觸柱頭與促成繁殖的結果", "只觀察花的顏色", "只記錄昆蟲停留在葉片"], "tag": "pollen"}], "id": "b2-42-q09"}, {"t": "雙重受精：五種構造的去向", "q": "把受精或發育結果放回對應來源。", "learn": 20, "tag": "fert", "hint": "卵與極核走兩條路；珠被、子房壁不是配子結合的產物。", "why": "雙重受精形成合子與胚乳；珠被變種皮、子房壁變果皮；胚珠成種子。倍數依本節典型正常減數分裂與雙重受精模型。", "sub": "課本P120圖4-11；PPT41–44", "refs": [{"src": "double", "cap": "課本P120圖4-11完整發育原圖"}, {"src": "PPT41S3", "cap": "原PPT第41頁末段代表畫面"}, {"src": "BOOK10", "cap": "P120 完整課本頁"}], "kind": "drag", "slots": [{"id": "s0", "label": "卵n＋精n"}, {"id": "s1", "label": "兩極核n+n＋精n"}, {"id": "s2", "label": "珠被2n"}, {"id": "s3", "label": "子房壁2n"}, {"id": "s4", "label": "胚珠整體"}], "pieces": [{"id": "a0", "label": "合子2n，後續發育為胚"}, {"id": "a1", "label": "初生胚乳核3n，發育成胚乳"}, {"id": "a2", "label": "種皮2n，母體來源"}, {"id": "a3", "label": "果皮2n，母體來源"}, {"id": "a4", "label": "發育為種子"}], "sol": {"s0": "a0", "s1": "a1", "s2": "a2", "s3": "a3", "s4": "a4"}, "pre": {}, "id": "b2-42-q10"}, {"t": "種子與果實：來源、倍數與數量", "q": "逐一判讀母體與受精後組織。", "learn": 21, "tag": "fert", "hint": "辨認胚、胚乳與母體組織，再檢查胚珠是否成功發育。", "why": "合子成胚，典型胚乳3n；母體珠被、子房壁形成2n種皮、果皮。成熟豌豆胚乳吸收而子葉貯藏養分，不代表所有雙子葉植物都相同。", "sub": "課本P120圖4-11；PPT42–44、49", "refs": [{"src": "double", "cap": "種子與果實：來源、倍數與數量完整教材圖"}, {"src": "PPT42S3", "cap": "原PPT第42頁末段代表畫面"}, {"src": "BOOK10", "cap": "P120 完整課本頁"}], "fig": "double", "kind": "fill", "imageWidth": 310, "figCaption": "課本P120 圖4-11", "rows": [{"q": "典型種子內的胚與胚乳倍數為？", "o": ["胚2n、胚乳3n", "胚3n、胚乳2n", "兩者都是n"], "tag": "fert"}, {"q": "種皮與果皮，與雙亲配子結合有何關係？", "o": ["均由母體2n組織發育", "均由受精卵發育", "均由3n胚乳發育"], "tag": "fert"}, {"q": "成熟豌豆的營養主要在哪裡？", "o": ["胚的子葉，胚乳已被吸收", "大量殘留的3n胚乳", "子房壁形成的管核"], "tag": "fert"}, {"q": "正常情境下一個果莢的成熟種子數？", "o": ["小於或等於原有胚珠數", "必定多於原有胚珠數", "與原有胚珠完全無關"], "tag": "fert"}], "id": "b2-42-q11"}, {"t": "育種與複製：先產生組合再選拔", "q": "依蝴蝶蘭育種與繁殖範例判讀。", "learn": 23, "tag": "breed", "hint": "有性育種與無性繁殖的目的不同，生長仍受環境影響。", "why": "人工授粉產生不同遺傳組合，需篩選；選定個體後可組織培養繁殖。移植需環境適應，且不能保證完全沒有變異。", "sub": "課本P121知識補給站；PPT45–47", "refs": [{"src": "breeding", "cap": "育種與複製：先產生組合再選拔完整教材圖"}, {"src": "PPT45S3", "cap": "原PPT第45頁末段代表畫面"}, {"src": "BOOK11", "cap": "P121 完整課本頁"}], "fig": "breeding", "kind": "fill", "imageWidth": 500, "figCaption": "課本P121知識補給站；PPT45–47", "rows": [{"q": "人工授粉後為何還要篩選子代？", "o": ["遺傳組合不同，不保證都符合目標", "所有子代一定完全相同", "授粉直接等於組織培養"], "tag": "breed"}, {"q": "選到優良個體後，組織培養常用來？", "o": ["增加所選品種的個體數", "產生另一親代的花粉", "把每個母體細胞都變成3n"], "tag": "breed"}, {"q": "移出培養瓶的小苗應注意？", "o": ["逐步適應外界環境並檢查生長", "不需任何環境適應", "培養後保證永遠無變異"], "tag": "breed"}], "id": "b2-42-q12"}, {"t": "原題一：雙重受精的甲乙丙丁", "q": "右圖為雙子葉植物花器柱頭雙重受精示意圖，下列何者正確？", "learn": 25, "tag": "fert", "hint": "辨認甲精細胞、乙管核、丙極核與丁卵；受精發生在胚囊。", "why": "原答案C。甲精細胞一個與卵結合，另一個與中央細胞兩極核結合形成典型3n胚乳；乙管核不形成合子。原題「柱頭雙重受精」措辭保留，正確位置是胚囊。", "sub": "原PPT第48頁原題；原文、原圖與答案保留", "refs": [{"src": "original48", "cap": "原題一：雙重受精的甲乙丙丁完整教材圖"}, {"src": "PPT48S3", "cap": "原PPT第48頁末段代表畫面"}, {"src": "BOOK10", "cap": "P120 完整課本頁"}], "fig": "original48", "kind": "single", "original": true, "sourceSlide": 48, "originalKey": [2], "opts": [{"t": "乙與丁結合成受精卵", "ok": false, "tag": "fert"}, {"t": "兩個甲細胞將與丙的兩個細胞受精", "ok": false, "tag": "fert"}, {"t": "丙受精後發展成胚乳", "ok": true, "tag": "fert"}, {"t": "胚乳細胞與受精卵的染色體套數皆為2n。", "ok": false, "tag": "fert"}], "id": "b2-42-q13"}, {"t": "原題二：豌豆的種子與果皮", "q": "下圖為豌豆果實，下列關於甲、乙構造的敘述，何者正確？", "learn": 26, "tag": "fert", "hint": "看甲乙指線；成熟豌豆的胚乳吸收，不套用到所有雙子葉植物。", "why": "原答案D。甲為種子、乙為果皮；種子有不同來源組織，不能宣稱所有細胞基因型必相同。果皮來自子房壁；成熟豌豆養分主要在子葉。每一成功發育胚珠至多形成一粒種子。", "sub": "原PPT第49頁原題；原文、原圖與答案保留", "refs": [{"src": "original49", "cap": "原題二：豌豆的種子與果皮完整教材圖"}, {"src": "PPT49S3", "cap": "原PPT第49頁末段代表畫面"}, {"src": "BOOK10", "cap": "P120 完整課本頁"}], "fig": "original49", "kind": "single", "original": true, "sourceSlide": 49, "originalKey": [3], "opts": [{"t": "甲為種子，來自胚珠受精後發育而成，構造中的所有細胞基因型皆相同", "ok": false, "tag": "fert"}, {"t": "乙為果皮，發育來自珠被", "ok": false, "tag": "fert"}, {"t": "甲中可找到大量3n的胚乳", "ok": false, "tag": "fert"}, {"t": "甲的數量小於或等於豌豆花中的胚珠數目。", "ok": true, "tag": "fert"}], "id": "b2-42-q14"}, {"t": "原題三：椰子是否由昆蟲傳粉？", "q": "椰子樹究竟是如何傳粉，至今仍無定論，有一派學者認為椰子樹主要以風媒進行傳粉，但有另一派學者認為在部分區域的椰子主要以蟲媒進行傳粉，下列哪些因素使學者認為椰子樹是蟲媒傳粉的植物？", "learn": 27, "tag": "pollen", "hint": "題目要支持蟲媒的因素，可複選；依原教材特徵比較判讀。", "why": "原答案C、D、E。花蜜與芳香可吸引昆蟲，較粗糙花粉在原題視為支持。花粉縱溝本身不是蟲媒的專一證據，還需直接傳粉觀察；原題「至今仍無定論」保留當時語境，不另當成現況主張。", "sub": "原PPT第50頁原題；原文、原圖與答案保留", "refs": [{"src": "PPT50S3", "cap": "原PPT第50頁末段代表畫面"}, {"src": "BOOK9", "cap": "P119 完整課本頁"}], "kind": "multi", "original": true, "sourceSlide": 50, "originalKey": [2, 3, 4], "opts": [{"t": "椰子花粉量多", "ok": false, "tag": "pollen"}, {"t": "雄蕊呈細碎狀", "ok": false, "tag": "pollen"}, {"t": "椰子花具有花蜜", "ok": true, "tag": "pollen"}, {"t": "花粉粒有一條明顯的縱溝，較粗糙", "ok": true, "tag": "pollen"}, {"t": "花期中椰子花具有芳香氣味。", "ok": true, "tag": "pollen"}], "id": "b2-42-q15"}], "tags": {"flower": ["花的構造與分類", "完全花與兩性花採不同判準；子房與胚珠是不同構造。", "課本P111–112 或產生花蜜\n◆\n \n花藥不伸出花冠的外面\n◆\n \n花粉的數量較少，表面通常粗糙\n◆\n \n柱頭\n不伸出花冠外\n配合課本 \nP119\n35", "36": "4-2.3 \n被子植物有性生殖的階段\n風媒花\n花形態的多樣化\n◆\n \n花較小而不顯著\n◆\n \n通常無香味和蜜腺\n◆\n \n柱頭常呈毛狀，並伸出花冠外\n雄花序\n雌花序\n配合課本 \nP119\n36\n◆\n \n具大型花藥，常伸出花冠的\n外面\n◆\n \n花粉數量多，小且輕，表面\n光滑", "37": " \n知識補給站\n花與授粉昆蟲的共同演化\n       當某種植物由特定的動物協助傳播花粉時，其花萼、花冠、雄蕊及雌蕊之形態、顏色、氣味等特性多與其傳粉動物有特殊的配合。換言之，\n此兩種生物的構造或外形已相互配合、適應，並有利於雙方或單方的生存\n，所以有學者視之為一種\n共同演化\n的現象。\n配合課本 \nP119\n37", "38": " \n知識補給站\n花與授粉昆蟲的共同演化\n若雄角蜂的頭部碰觸到上方的雄蕊蓋，會使花粉塊剝落並黏附在雄角蜂的頭上，當這隻攜帶花粉塊的雄角蜂再飛至另一朵蜂蘭時，此花粉塊即能落在柱頭上，完成異花授粉\n       例如\n：\n蘭花的雌、雄蕊共同長在一個稱為蕊柱的構造上，但其位置不利於自花授粉，而須藉由蜂類的訪花行為進行授粉作用。\n蜂蘭\n的\n花形與雌角蜂的外形相似\n蜂蘭\n具特殊氣味，可引誘雄角蜂前來進行交配\n蕊柱\n柱頭\n雄蕊蓋\n花粉塊\n配合課本 \nP119\n38", "39": "4-2.3 \n被子植物有性生殖的階段\n授粉作用\n◆ 花粉粒散播至雌蕊的過程\n花粉粒\n（ \n1n\n \n）\n配合課本 \nP119\n、\n120", "40": "4-2.3 \n被子植物有性生殖的階段\n生殖細胞\n（ \n1n\n \n）\n營養細胞\n（ \n1n\n \n）\n花粉粒\n（ \n1n\n \n）\n生殖細胞\n有絲分裂\n花粉管\n（ \n1n\n \n）\n兩個\n精細胞\n \n（\n1n\n \n）\n管核\n（ \n1n\n \n）\n \n後來退化消失\n生殖細胞\n（\n1\n \nn\n ）\n管核\n（ \n1n\n \n）\n授粉作用\n◆ 花粉粒散播至雌蕊的過程\n配合課本 \nP119\n、\n120", "41": "花粉管\n（ \n1n \n）\n兩個\n精細胞\n（ \n1n \n）\n管核\n（ \n1n\n \n）\n \n後來退化消失\n1\n 個精細胞\n +\n \n1\n 個\n卵細胞\n卵細胞\n（\n1\n \nn\n ）\n1\n 個精細胞\n \n+\n \n2\n 個極核\n極核\n（ \n1n\n \n）\n4-2.3 \n被子植物有性生殖的階段\n雙重受精\n配合課本 \nP119\n、\n120", "42": "4-2.3 \n被子植物有性生殖的階段\n種子的生成\n胚珠\n珠被\n卵細胞\n精細胞\n極核\n精細胞\n種子\n種皮\n胚乳\n胚\n配合課本 \nP120", "43": "精細胞（ \n1n\n ）\n+ \n卵細胞（ \n1n\n ）\n \n      \n→\n \n胚（ \n2n\n ）\n種仁\n種子\n珠被（ \n2n\n ）         \n  \n→\n \n種皮（ \n2n\n ）\n精細胞（ \n1n\n ）\n+ \n極核（ \n1n\n，\n2\n 個 \n）\n→ \n胚乳（ \n3n\n ） \n4-2.3 \n被子植物有性生殖的階段\n種子的生成\n配合課本 \nP120", "44": "精細胞（ \n1n\n ）\n+ \n卵細胞（ \n1n\n ） \n \n \n     \n→\n \n胚（ \n2n\n ）\n種仁\n種子\n珠被（ \n2n\n ）         \n   \n→\n \n種皮（ \n2n\n ）\n精細胞（ \n1n\n ）\n+ \n極核（ \n1n\n，\n2\n 個 ）\n \n→ \n胚乳（ \n3n\n ） \n4-2.3 \n被子植物有性生殖的階段\n果實的生成\n子房（ \n2n\n ）\n \n \n       \n   \n→\n \n果皮（ \n2n\n ）\n果實\n綠豆的種子和果實\n配合課本 \nP120", "45": " \n知識補給站\n植物生殖的應用\n       人們善用植物的生殖特性，配合育種與組織培養的技術，使得農業更加蓬勃發展。\n       育種的操作方法是以有性生殖可增加植物個體變異的概念為基礎，藉人工授粉方式促使植株產生子代，再篩選出特殊表徵的個體，而得到新的品種。\n配合課本 \nP121\n45", "46": " \n知識補給站\n植物生殖的應用\n       現今許多花卉的優良品種即是應用此系列技術所培育出來的，下圖是蝴蝶蘭新品種「台大小斑馬」的育種與量產過程。\n育種\n（藉有性生殖\n)\nPhalaenopsis\n \nHo's\nLittle Caroline\n父本\n母本\nPhalaenopsis\nEver-spring King\n雜交後代\n台大小斑馬\nPhalaenopsis\n \nTaida\nKing's Caroline\n配合課本 \nP121\n46", "47": " \n知識補給站\n植物生殖的應用\n       \n \n接著根據植物組織具有增生形成新個體的潛能，利用組織培養技術進行量產，以無性生殖的方式保留新品種的特徵。\n於無菌室中，培養出許多相同特性的幼苗\n幼苗移植前，先至溫室馴化（適應環境）\n植株移植成盆栽，於溫室種植　\n量產（藉無性生殖\n)\n配合課本 \nP121\n47", "48": "  \nQuestion\n1. \n右圖為\n雙子葉植物花器柱頭雙重\n受精示意圖，下列何者正確\n？　\n(\nA)\n乙與丁結合成受精卵 \n\n(B)\n兩個甲細胞將與丙的兩個細胞\n受精　\n(\nC)\n丙受精後發展成\n胚乳　\n(\nD)\n胚乳細胞與受精卵的染色體套數皆為 \n2n\n。\n【108.\n指\n考\n】\n解答\n：\n(C)\n解析\n：\n甲為精細胞，乙為管核，丙為極核，丁為卵細胞。\n(A)\n其中一個精細胞與卵細胞結合成受精卵。\n(B)\n一個精細胞與卵細胞受精，另一個精細胞與兩個極核受精。\n(D)\n胚乳細胞為 \n3n\n。\n48", "49": "  \nQuestion\n2. \n下圖為豌豆果實，下列關於甲、乙構造的敘述，何者正確？\n(A)\n甲為種子，來自胚珠受精後發育而成，構造中的所有細胞基因型皆\n相同　\n(\nB)\n乙為果皮，發育來自珠\n被　\n(\nC)\n甲中可找到大量 \n3n\n 的\n胚乳　\n(\nD)\n甲的數量小於或等於豌豆花中的胚珠數目。\n解答\n：\n(D)\n解析\n：\n(A)\n珠被的基因型來自雌蕊，與其他合子發育來的細胞不同。\n(B)\n果皮來自子房壁的發育。\n(C)\n豌豆為雙子葉植物，其胚乳在種子階段已消耗殆盡。\n49", "50": "  \nQuestion\n3. \n椰子樹究竟是如何傳\n粉，至今\n仍無定論，有一派學者認為椰子樹主要以風媒進行傳粉，但有另一派學者認為在部分區域的椰子主要以蟲媒進行傳粉，下列哪些因素使學者認為椰子樹是蟲媒傳粉的植物\n？　\n(\nA)\n椰子花粉量多 \n(B)\n雄蕊呈細碎\n狀　\n(\nC)\n椰子花具有\n花蜜　\n(\nD)\n花粉粒有一條明顯的縱溝，\n較\n粗糙　\n(\nE)\n花期中椰子花具有芳香氣味。\n解答\n：\n(C)(D)(E)\n解\n析\n：\n(A)\n花粉較多是風媒花的特色。\n(B)\n雄蕊呈細碎狀有利花粉隨風散播。\n50"}};
