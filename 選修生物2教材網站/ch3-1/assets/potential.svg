<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560"><rect width="1080" height="560" fill="#fff"/><g font-family="sans-serif" fill="#202e4d"><text x="40" y="64" font-size="32" font-weight="bold">水勢梯度：由高向低</text><text x="40" y="112" font-size="24">教學假設數值，非教材實測資料 · 單位 MPa</text><g font-size="28" text-anchor="middle"><text x="135" y="216">土壤</text><text x="405" y="216">表皮</text><text x="675" y="216">皮層</text><text x="945" y="216">中柱</text></g><g fill="#e7edf8" stroke="#354f87" stroke-width="3"><rect x="40" y="244" width="190" height="108" rx="12"/><rect x="310" y="244" width="190" height="108" rx="12"/><rect x="580" y="244" width="190" height="108" rx="12"/><rect x="850" y="244" width="190" height="108" rx="12"/></g><g font-size="36" text-anchor="middle"><text x="135" y="310">−0.1</text><text x="405" y="310">−0.3</text><text x="675" y="310">−0.4</text><text x="945" y="310">−0.6</text></g><g stroke="#b56132" stroke-width="6" fill="none"><path d="M244 298h50m-15-12 15 12-15 12M514 298h50m-15-12 15 12-15 12M784 298h50m-15-12 15 12-15 12"/></g><text x="40" y="430" font-size="28">較不負的水勢較高；水沿水勢降低的方向淨移動。</text><text x="40" y="486" font-size="24">水勢同時受溶質、壓力等條件影響，不能只看濃度。</text><text x="40" y="532" font-size="22">概念依據：課本 P72–73、原簡報第18–19頁；本圖為補充示意。</text></g></svg>