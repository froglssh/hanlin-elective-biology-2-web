const CONTENT={"lessons": [{"id": "b2-31-l01", "t": "元素從哪裡來？碳源與無機鹽", "src": "課本 P70；原簡報第 1、2 頁", "slide": 1, "figSpec": {"flip": [1, 2]}, "sec": "s1", "txt": "<h3>元素從哪裡來？碳源與無機鹽</h3><ul><li>一般綠色植物主要由葉吸收二氧化碳，取得合成有機物所需的碳。</li><li>水與氮、磷、鉀等無機鹽主要經根吸收；氮源可為硝酸根或銨離子。</li><li>根部呼吸需要氧；氣體交換與碳源、氮源的取得要分別判讀。</li></ul><div class=\"think\">想一想：空氣很多氮氣，為何一般植物仍需要從土壤取得氮？</div><div class=\"quote\"><strong>課本 P70 完整原文（PDF 第 1 頁）</strong><br>-1 植物體對水與無機鹽的吸收<br>3<br>爬藤的莖都很纖細嗎？其實在熱帶森林裡的蔓藤很長、很有韌性，有<br>些可用來編製藤椅，也可讓森林中的猿猴盪來盪去快速移動。對蔓藤而<br>言，莖具韌性就能延長而不容易斷，有利於植株的蔓延。然而，莖很長對<br>植株內水分與養分的運送方便嗎？進入植物根部的水分子要通過多長的管<br>道才能送到葉片，以供光合作用之需？光合作用等代謝過程所產生的養分<br>又會如何運送到其他部位利用或儲藏呢？<br>a<br>b<br>根毛<br>表皮<br>皮層<br>土壤顆粒<br>土壤水 <br>土壤氣泡<br>植物利用環境中的二氧化碳與水作為光合作用的主<br>要原料，從中獲得碳、氫及氧三種元素，而生長發育所<br>需的其他元素如氮、磷、鉀等要從哪裡取得？空氣中有<br>豐富的氮氣，但是植物並不能直接加以利用，而是與土<br>壤中的磷、鉀等礦物質元素一樣，必須以無機鹽的型式<br>隨著水被植物的根部吸收。<br>3-1.1 根吸收水與無機鹽的構造<br>根對水與無機鹽的吸收，主要在具根毛的成熟區吸<br>收能力最佳。根毛是表皮細胞的延伸突起，可增加吸收<br>的表面積，並能深入土壤顆粒間隙，吸收周圍的水與無<br>機鹽（圖 3－1）。<br>幼根的表皮細胞通常沒有角質層覆蓋，且細胞壁含<br>較多的果膠，黏性與親水性較強，水分較易進入根內。<br>硝酸鹽與磷酸鹽等無機鹽主要藉由根表皮細胞膜上的運<br>輸蛋白以主動運輸的方式被根吸收。<br> 圖 3－1　<br> 根毛與土壤顆粒。a蘿蔔種子萌發的初生根，可見密布的根<br>毛；b成熟區的根毛延伸至土壤顆粒間隙。<br>70　選修生物 Ⅱ (全)<br><br></div><div class=\"quote\"><strong>原PPT第 1 頁完整原文</strong><br>3-1 <br>植物體對水與無機鹽的吸收<br>3-1.1 <br>根吸收水與無機鹽的構造<br>3-1.2 <br>水與無機鹽在根中的橫向運輸<br>1</div><div class=\"quote\"><strong>原PPT第 2 頁完整原文</strong><br>3-1 <br>植物體對水與無機鹽的吸收<br>◆ <br>氮<br>、<br>磷<br>、<br>鉀<br>◆ <br>碳<br>、<br>氫<br>、<br>氧<br>▪ <br>二氧化碳<br>、<br>氧氣<br>：<br>◇ 主要吸收型式<br>：<br>無機鹽<br>◇ 吸收部位<br>：<br>◇ 主要吸收型式<br>：<br>二氧化碳<br>、<br>水<br>、<br>氧氣<br>◇ 吸收部位<br>：<br>▪ <br>水<br>：<br>CO<br>2<br>NH<br>4<br>+<br>NO<br>3<br>-<br>PO<br>4<br>3-<br>H<br>2<br>O<br>O<br>2<br>K<br>+<br>葉<br>根<br>根<br>配合課本 <br>P70</div>", "tb": [["BOOK1", "P70 完整頁面"]]}, {"id": "b2-31-l02", "t": "成熟區與根毛：吸收的主要部位", "src": "課本 P70；原簡報第 3 頁", "slide": 3, "figSpec": {"flip": [3]}, "sec": "s1", "txt": "<h3>成熟區與根毛：吸收的主要部位</h3><ul><li>根尖由根冠、分生區、延長區到成熟區，具有不同的細胞狀態。</li><li>成熟區表皮細胞向外突出形成根毛，維管組織已分化，能配合吸收與運輸。</li><li>根毛不是永久構造，會隨根的 ner noreferrer\">OpenStax 水與溶質運輸</a>。</div><div class=\"quote\"><strong>課本 P72 完整原文（PDF 第 3 頁）</strong><br>水與溶解於其中的無機鹽進入根後，經過皮層橫向運輸進入中柱，再<br>由中柱內的維管束向上運輸。在橫向運輸的過程中，水和無機鹽經由細胞<br>之間稱為原生質絲的微細通道，通過皮層細胞而到達內皮細胞內，稱為<br>共質體路徑（圖 3－2a）。而植物細胞膜外的空間稱為質外體，若水和<br>無機鹽沿著細胞壁與細胞間隙直達內皮細胞外，稱為質外體路徑（圖 3－<br>2b）。根中水分的運輸可分為共質體與質外體兩種路徑，運輸過程中兩種<br>路徑可互相轉換。<br>內皮的細胞排列緊密，在上下左右相鄰的內皮細胞間，細胞壁有加厚<br>的卡氏帶，成分為不透水的木質素或部分木栓質（圖 3－2），因此無論是<br>經由細胞內或細胞間隙橫向運輸至內皮細胞的水分，皆須進入細胞內才能<br>到達中柱。<br>共質體路徑　symplast pathway<br>質外體　apoplast<br>質外體路徑　apoplast pathway<br>原生質體　protoplast<br>共質體　symplast<br>水勢　water potential<br>漢斯坦　Johannes von Hanstein, 1822∼1880<br>3-1.2 水與無機鹽在根中的橫向運輸<br>原生質體<br>原生質體是在1880 年由德國植物學家漢斯坦所提出，代表植物細胞的內含物，但<br>不包括細胞壁。由於兩個相鄰活細胞間有貫穿細胞壁的特有孔道，稱為原生質絲，使<br>得相鄰細胞的原生質相通而成為一個連續的共同體，故稱為共質體。<br>卡氏帶<br>19 世紀中葉，德國植物學家卡斯伯里首次描述了植物根部的內皮，發現其細胞<br>壁有加厚的現象，命名為「Schutzscheide」（意指防護套），後來學者將其稱為卡氏<br>帶。卡氏帶完全填充了內皮細胞間包含中膠層在內的空隙，使兩細胞的細胞壁幾乎融<br>合。有些內皮細胞還會有次級生長現象，細胞壁中除了木質素，還另外多了木栓質。<br>水勢<br>水勢是指水移動的能力，決定水會從哪裡流向哪裡。簡單來說，水總是從高水勢<br>流向低水勢，就像水從高處往低處流一樣。當在水中添加溶質時，水分子移動的自由<br>度會降低，水分子會更難擴散，使得水勢變小，但吸水能力卻變強。例如：土壤中的<br>水含有較少的溶質，因此水勢較高；而植物的根毛內含有許多溶於水的無機鹽和有機<br>養分，因此水勢較低。由於水會從高水勢流向低水勢，因此土壤中的水就會流進根毛<br>內，幫助植物吸收水分。<br>知識補給站<br>卡斯伯里　Johann Xaver Robert Caspary, 1818∼1887<br>72　選修生物 Ⅱ (全)<br><br></div><div class=\"quote\"><strong>原PPT第 18 頁完整原文</strong><br>  <br>知識補給站<br>水勢<br>　　水勢是指<br>水移動的能力<br>，決定水會從哪裡流向哪裡。簡單來說，水總是從<br>高水勢流向低水勢<br>，就像水從高處往低處流一樣。當在<br>水中添加溶質時，水分子移動的自由度會降低，水分子會更難擴散，使得水勢變小<br>，但吸水能力卻變強。例如<br>：<br>土壤中的水含有較少的溶質，因此水勢較高；而植物的根毛內含有許多溶於水的無機鹽和有機養分，因此水勢較低。由於水會從高水勢流向低水勢，因此土壤中的水就會流進根毛內，幫助植物吸收水分。<br>配合課本 <br>P72<br>18</div>", "tb": [["BOOK3", "P72 完整頁面"]]}, {"id": "b2-31-l14", "t": "水勢梯度：從土壤進入中柱", "src": "課本 P73；原簡報第 19 頁", "slide": 19, "figSpec": {"image": "potential"}, "sec": "s4", "txt": "<h3>水勢梯度：從土壤進入中柱</h3><ul><li>課本以正常吸水的梯度，說明土壤到根內水勢逐步降低。</li><li>此時水可沿梯度進入根；離子運輸可改變細胞內的溶質條件。</li><li>原簡報的滲透壓序列是教材簡化示例；不可當成所有植物、所有時間的固定數值關係。</li></ul><div class=\"think\">想一想：要用溶質差解釋水勢差，必須補上哪些條件？</div><div class=\"scope-note\">教材範圍與科學補充：木質部水勢也可受壓力影響；本節以根的吸收判讀為主，完整運輸機制須再結合後續單元。</div><div class=\"quote\"><strong>課本 P73 完整原文（PDF 第 4 頁）</strong><br>根毛<br>b<br>a<br>木質部導管細胞<br>周鞘細胞<br>內皮細胞<br>卡氏帶<br>原生質絲<br>表皮<br>皮層<br>內皮<br>中柱<br>卡氏帶<br>共質體路徑<br>質外體路徑<br>第 3 章  植物體內物質的吸收、合成及運輸　73<br>水分因受到卡氏帶阻擋而須藉<br>由原生質絲進入內皮細胞，然<br>後再運輸至中柱的木質部。<br> 圖 3－2　 <br>水分和無機鹽的橫向運輸。從根毛到內皮有a、b兩種方式。a水分進入表皮或皮層細胞內，經由細胞間<br>的原生質絲運輸到內皮；b水分進入表皮細胞的細胞壁，而後沿著皮層細胞的細胞間隙運輸到內皮。<br>卡氏帶阻止由皮層細胞間隙而來的物質直接進入中柱，使內皮細胞的<br>細胞膜能發揮選擇性通透的功能，依細胞中離子濃度的高低或生理活動的<br>特殊需求，以被動或主動方式運輸無機鹽進入內皮細胞內，再藉由原生質<br>絲將無機鹽送入中柱。此外，卡氏帶也可阻擋對植物體有害的物質經由細<br>胞間隙進入中柱，避免透過維管束進一步擴及全株；同時卡氏帶也阻止無<br>機鹽等物質向外流出，維持中柱細胞內高滲透壓和低水勢，通常水勢的大<br>小是：土壤間隙＞表皮＞皮層＞中柱，因此水分可藉由滲透作用從土壤擴<br>散至中柱。<br>第 3 章  植物體內物質的吸收、合成及運輸　73<br></div><div class=\"quote\"><strong>原PPT第 19 頁完整原文</strong><br>3-1.2 <br>水與無機鹽在根中的橫向運輸<br>◆ <br>滲透壓差<br>：<br>土壤<br>&lt;<br>表皮<br>&lt;<br>皮層<br>&lt;<br>內皮<br>&lt;<br>周鞘<br>&lt;<br>木質部<br>→ <br>水勢<br>：<br>土壤<br>&gt;<br>表皮<br>&gt;<br>皮層<br>&gt;<br>內皮<br>&gt;<br>周鞘<br>&gt;<br>木質部<br>→ <br>水分才可藉由滲透作用從土壤擴散至<br>木質部<br>表皮<br>皮層<br>周鞘<br>內<br>皮<br>木質部<br>水、無機鹽<br>水、無機鹽<br>配合課本 <br>P73</div>", "tb": [["BOOK4", "P73 完整頁面"]]}, {"id": "b2-31-l15", "t": "原題一、二：核對吸收的條件", "src": "課本 P70；原簡報第 20、21 頁", "slide": 20, "figSpec": {"flip": [20, 21]}, "sec": "s5", "txt": "<h3>原題一、二：核對吸收的條件</h3><ul><li>原題一答案 D；一般植物碳源主要來自二氧化碳，水與無機鹽的運輸機制須分辨。</li><li>原題二答案 A、D；成熟區有根毛，幼嫩根表皮通常沒有角質層，根毛會老化。</li><li>保留原題全部選項與解析，另區分課本的主要吸收情境及研究中的例外。</li></ul><div class=\"think\">想一想：「主要吸收無機鹽」是否等於「完全不能吸收有機物」？</div><div class=\"scope-note\">教材範圍與科學補充：原題二解析稱根表皮「不吸收有機物質」，此說法過於絕對。研究顯示某些植物根可吸收胺基酸等有機氮，也可由糖運輸蛋白吸收單醣。本關保留教材預期答案 A、D，題意依主要無機鹽吸收情境判讀；原解析不作普遍通則。<a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC6232311/\" target=\"_blank\" rel=\"noopener noreferrer\">有機氮吸收研究</a>、<a href=\"https://pubmed.ncbi.nlm.nih.gov/19054349/\" target=\"_blank\" rel=\"noopener noreferrer\">根糖運輸研究</a>。</div><div class=\"quote\"><strong>課本 P70 完整原文（PDF 第 1 頁）</strong><br>-1 植物體對水與無機鹽的吸收<br>3<br>爬藤的莖都很纖細嗎？其實在熱帶森林裡的蔓藤很長、很有韌性，有<br>些可用來編製藤椅，也可讓森林中的猿猴盪來盪去快速移動。對蔓藤而<br>言，莖具韌性就能延長而不容易斷，有利於植株的蔓延。然而，莖很長對<br>植株內水分與養分的運送方便嗎？進入植物根部的水分子要通過多長的管<br>道才能送到葉片，以供光合作用之需？光合作用等代謝過程所產生的養分<br>又會如何運送到其他部位利用或儲藏呢？<br>a<br>b<br>根毛<br>表皮<br>皮層<br>土壤顆粒<br>土壤水 <br>土壤氣泡<br>植物利用環境中的二氧化碳與水作為光合作用的主<br>要原料，從中獲得碳、氫及氧三種元素，而生長發育所<br>需的其他元素如氮、磷、鉀等要從哪裡取得？空氣中有<br>豐富的氮氣，但是植物並不能直接加以利用，而是與土<br>壤中的磷、鉀等礦物質元素一樣，必須以無機鹽的型式<br>隨著水被植物的根部吸收。<br>3-1.1 根吸收水與無機鹽的構造<br>根對水與無機鹽的吸收，主要在具根毛的成熟區吸<br>收能力最佳。根毛是表皮細胞的延伸突起，可增加吸收<br>的表面積，並能深入土壤顆粒間隙，吸收周圍的水與無<br>機鹽（圖 3－1）。<br>幼根的表皮細胞通常沒有角質層覆蓋，且細胞壁含<br>較多的果膠，黏性與親水性較強，水分較易進入根內。<br>硝酸鹽與磷酸鹽等無機鹽主要藉由根表皮細胞膜上的運<br>輸蛋白以主動運輸的方式被根吸收。<br> 圖 3－1　<br> 根毛與土壤顆粒。a蘿蔔種子萌發的初生根，可見密布的根<br>毛；b成熟區的根毛延伸至土壤顆粒間隙。<br>70　選修生物 Ⅱ (全)<br><br></div><div class=\"quote\"><strong>原PPT第 20 頁完整原文</strong><br>  <br>Question<br>1. <br>下列有關植物獲取養分的敘述，何者正確<br>？　<br>(<br>A)<br>植物所需碳源主要來自根部<br>吸收　<br>(<br>B)<br>根部表皮細胞主要藉由滲透作用吸收各種<br>無機鹽　<br>(<br>C)<br>植物可使用來自氣孔的氮氣作為氮<br>源　<br>(<br>D)<br>相較於莖的表皮細胞，根的表皮細胞為了吸收養分而消耗更多能量。<br>解答<br>：<br>(D)<br>解析<br>：<br>(A)<br>植物所需的碳源主要來自二氧化碳。<br>(B)<br>根部藉滲透作用吸收水分，主要藉主動運輸吸收無機鹽類。 <br>(C)<br>植物無法利用氮氣作為氮源，須以無機鹽的型式<br>吸收。<br>20</div><div class=\"quote\"><strong>原PPT第 21 頁完整原文</strong><br>  <br>Question<br>2. <br>下列有關植物根部細胞特性與吸收養分的敘述，哪些正確？<br>(A)<br>成熟區具有根毛，吸收能力<br>最佳　<br>(<br>B)<br>可藉由主動運輸吸收葡萄糖、胺基酸、硝酸鹽、磷酸鹽等<br>養分　<br>(<br>C)<br>根表皮細胞外的角質層可防止吸收的水分<br>散失　<br>(<br>D)<br>根部細胞含較多的果膠，黏性與親水性較<br>強　<br>(<br>E)<br>根毛是永久性的構造，會持續存在。<br>解答<br>：<br>(<br>A)(D)<br>解析<br>：<br>(<br>B)<br>根部表皮細胞不吸收有機物質。<br>(C)<br>根表皮細胞外通常沒有角質層。<br>(E)<br>根毛會隨著根部成熟老化而脫落。<br>21</div>", "tb": [["BOOK1", "P70 完整頁面"]]}, {"id": "b2-31-l16", "t": "原題三：根段吸水曲線", "src": "課本 P70；原簡報第 22、23 頁", "slide": 22, "figSpec": {"image": "originalgraph"}, "sec": "s5", "txt": "<h3>原題三：根段吸水曲線</h3><ul><li>先確認橫軸是與根頂端的距離（mm），縱軸為吸水速率，不能把位置當成時間。</li><li>原解答指出約離根頂端 80 mm 處吸水最好；約 100 mm 之後曲線急降而維持低值。</li><li>原解析以較成熟根內皮細胞壁全面增厚作為可能原因；曲線本身顯示相關，仍需構造或實驗證據佐證。</li></ul><div class=\"think\">想一想：若要驗證內皮細胞壁變化是原因，可以比對哪些根段構造？</div><div class=\"scope-note\">教材範圍與科學補充：80 mm、100 mm 是這一道題的圖示與解答，不是所有植物根的固定分界；「可能原因」須保留推論性質。</div><div class=\"quote\"><strong>課本 P70 完整原文（PDF 第 1 頁）</strong><br>-1 植物體對水與無機鹽的吸收<br>3<br>爬藤的莖都很纖細嗎？其實在熱帶森林裡的蔓藤很長、很有韌性，有<br>些可用來編製藤椅，也可讓森林中的猿猴盪來盪去快速移動。對蔓藤而<br>言，莖具韌性就能延長而不容易斷，有利於植株的蔓延。然而，莖很長對<br>植株內水分與養分的運送方便嗎？進入植物根部的水分子要通過多長的管<br>道才能送到葉片，以供光合作用之需？光合作用等代謝過程所產生的養分<br>又會如何運送到其他部位利用或儲藏呢？<br>a<br>b<br>根毛<br>表皮<br>皮層<br>土壤顆粒<br>土壤水 <br>土壤氣泡<br>植物利用環境中的二氧化碳與水作為光合作用的主<br>要原料，從中獲得碳、氫及氧三種元素，而生長發育所<br>需的其他元素如氮、磷、鉀等要從哪裡取得？空氣中有<br>豐富的氮氣，但是植物並不能直接加以利用，而是與土<br>壤中的磷、鉀等礦物質元素一樣，必須以無機鹽的型式<br>隨著水被植物的根部吸收。<br>3-1.1 根吸收水與無機鹽的構造<br>根對水與無機鹽的吸收，主要在具根毛的成熟區吸<br>收能力最佳。根毛是表皮細胞的延伸突起，可增加吸收<br>的表面積，並能深入土壤顆粒間隙，吸收周圍的水與無<br>機鹽（圖 3－1）。<br>幼根的表皮細胞通常沒有角質層覆蓋，且細胞壁含<br>較多的果膠，黏性與親水性較強，水分較易進入根內。<br>硝酸鹽與磷酸鹽等無機鹽主要藉由根表皮細胞膜上的運<br>輸蛋白以主動運輸的方式被根吸收。<br> 圖 3－1　<br> 根毛與土壤顆粒。a蘿蔔種子萌發的初生根，可見密布的根<br>毛；b成熟區的根毛延伸至土壤顆粒間隙。<br>70　選修生物 Ⅱ (全)<br><br></div><div class=\"quote\"><strong>原PPT第 22 頁完整原文</strong><br>  <br>Question<br>3. <br>右圖<br>表示某植物不同根段處的水分吸收效率，吸水能力最好的部位是何處？在某一根段處，曲線急遽下降而後維持低的吸水效率，原因可能為何？<br>22</div><div class=\"quote\"><strong>原PPT第 23 頁完整原文</strong><br>  <br>Question<br>解答<br>：<br>離根頂端 <br>80 mm <br>處吸水最好。離根頂端<br>約<br><br>100 <br>mm <br>之後吸水能力急遽下降的原因，可能與較成熟根部的內皮細胞全面加上厚壁而喪失輸送水分的功能有關。<br>23</div>", "tb": [["BOOK1", "P70 完整頁面"]]}], "questions": [{"id": "b2-31-q01", "t": "元素來源配對", "q": "將四種元素配對到一般綠色植物的主要取得形式。", "sub": "課本 P70；原PPT第 2 頁", "learn": 0, "tag": "nutrient", "hint": "先分開碳源與氮、磷、鉀的土壤來源。", "why": "一般綠色植物以二氧化碳取得主要碳源；根可吸收硝酸根或銨離子、磷酸根與鉀離子。一般植物不能直接把氮氣作為氮源。", "refs": [{"src": "BOOK1", "cap": "課本 P70 完整頁面"}, {"src": "PPT02S3", "cap": "原PPT第 2 頁完整畫面"}], "fig": "overview", "kind": "drag", "slots": [{"id": "s0", "label": "碳（C）"}, {"id": "s1", "label": "氮（N）"}, {"id": "s2", "label": "磷（P）"}, {"id": "s3", "label": "鉀（K）"}], "pieces": [{"id": "a0", "label": "主要由葉吸收二氧化碳"}, {"id": "a1", "label": "根吸收硝酸根或銨離子"}, {"id": "a2", "label": "根吸收磷酸根"}, {"id": "a3", "label": "根吸收鉀離子"}, {"id": "a4", "label": "全部植物直接吸收氮氣"}], "sol": {"s0": "a0", "s1": "a1", "s2": "a2", "s3": "a3"}, "pre": {}}, {"id": "b2-31-q02", "t": "根毛與膜運輸", "q": "逐一判讀根毛構造與吸收機制。", "sub": "課本 P70 圖3-1；原PPT第 3、4 頁", "learn": 2, "tag": "root", "hint": "根毛是哪一種細胞的延伸？水與離子進入細胞的原理相同嗎？", "why": "成熟區的表皮形成根毛，增加吸收面積；水依水勢梯度經滲透作用淨移動，離子需膜蛋白運輸，逆梯度的主動運輸會耗能。根毛會老化更新。", "refs": [{"src": "BOOK1", "cap": "課本 P70 完整頁面"}, {"src": "PPT04S3", "cap": "原PPT第 4 頁完整畫面"}], "fig": "PPT04S3", "kind": "fill", "imageWidth": 520, "rows": [{"q": "根毛的構造起源", "o": ["表皮細胞向外延伸", "皮層細胞向外分裂", "根瘤菌連成菌絲"], "tag": "root"}, {"q": "根毛主要位在哪一區？", "o": ["成熟區", "根冠", "分生區最前端"], "tag": "root"}, {"q": "水進入根細胞的淨移動依據", "o": ["由較高水勢到較低水勢", "由較低水勢到較高水勢", "只要有根毛就一定向內"], "tag": "root"}, {"q": "離子逆梯度進入根細胞", "o": ["需膜運輸蛋白與能量", "都由滲透作用穿過膜", "完全不需細胞膜參與"], "tag": "root"}]}, {"id": "b2-31-q03", "t": "共生與綠肥的資源交換", "q": "對照一般綠色植物的共生情境，配對四項作用。", "sub": "課本 P71；原PPT第 5–8 頁", "learn": 5, "tag": "symbiosis", "hint": "菌根真菌與根瘤菌不是同一類生物。綠肥分解與固氮也不是同一步驟。", "why": "一般具光合作用的菌根植物可提供有機物，真菌協助水與無機鹽取得；根瘤菌固定氮氣；綠肥還田後，殘體分解將養分回到土壤。油菜可作綠肥，不等於具有豆科根瘤共生固氮。", "refs": [{"src": "BOOK2", "cap": "課本 P71 完整頁面"}, {"src": "PPT07S3", "cap": "原PPT第 7 頁完整畫面"}], "fig": "symbiosis", "kind": "drag", "slots": [{"id": "s0", "label": "菌根真菌協助植物"}, {"id": "s1", "label": "一般綠色植物供應真菌"}, {"id": "s2", "label": "根瘤菌的固氮作用"}, {"id": "s3", "label": "綠肥殘體還田後"}], "pieces": [{"id": "a0", "label": "擴大探索範圍，取得水與無機鹽"}, {"id": "a1", "label": "供應光合作用產生的有機物"}, {"id": "a2", "label": "將氮氣轉成可利用的氮化合物"}, {"id": "a3", "label": "分解後使養分回到土壤"}, {"id": "a4", "label": "所有綠肥都由根瘤菌固氮"}], "sol": {"s0": "a0", "s1": "a1", "s2": "a2", "s3": "a3"}, "pre": {}}, {"id": "b2-31-q04", "t": "橫向運輸六站", "q": "把水從土壤到木質部所經的層次由外向內排好。", "sub": "課本 P72–73 圖3-2；原PPT第 9 頁", "learn": 7, "tag": "route", "hint": "內皮是皮層最內側；內皮之內屬中柱。", "why": "由外向內為土壤、表皮、皮層、內皮、周鞘、木質部。這是根的組織位置關係；具體移動仍需區分共質體、質外體與跨膜階段。", "refs": [{"src": "BOOK4", "cap": "課本 P73 完整頁面"}, {"src": "PPT09S3", "cap": "原PPT第 9 頁完整畫面"}], "fig": "PPT09S3", "kind": "drag", "slots": [{"id": "s0", "label": "第 1 站"}, {"id": "s1", "label": "第 2 站"}, {"id": "s2", "label": "第 3 站"}, {"id": "s3", "label": "第 4 站"}, {"id": "s4", "label": "第 5 站"}, {"id": "s5", "label": "第 6 站"}], "pieces": [{"id": "a0", "label": "土壤"}, {"id": "a1", "label": "表皮"}, {"id": "a2", "label": "皮層"}, {"id": "a3", "label": "內皮"}, {"id": "a4", "label": "周鞘"}, {"id": "a5", "label": "木質部"}, {"id": "a6", "label": "葉片保衛細胞"}], "sol": {"s0": "a0", "s1": "a1", "s2": "a2", "s3": "a3", "s4": "a4", "s5": "a5"}, "pre": {}}, {"id": "b2-31-q05", "t": "兩條路徑與卡氏帶", "q": "沿原圖箭頭，逐一判讀壁間、細胞質與跨膜階段。", "sub": "課本 P73 圖3-2；原PPT第 10–17 頁", "learn": 9, "tag": "barrier", "hint": "原生質絲連接細胞質。沿細胞壁的物質要先經膜，才能進入共質體。", "why": "共質體經細胞質及原生質絲；質外體沿細胞壁與細胞間隙。卡氏帶限制質外體，迫使物質跨膜，而選擇性主要由細胞膜及膜蛋白提供；兩種途徑可轉換。", "refs": [{"src": "BOOK4", "cap": "課本 P73 完整頁面"}, {"src": "PPT12S3", "cap": "原PPT第 12 頁完整畫面"}], "fig": "routes", "kind": "fill", "imageWidth": 500, "rows": [{"q": "共質體在相鄰細胞之間主要經過", "o": ["原生質絲連接的細胞質", "連通的細胞壁與間隙", "卡氏帶內部的孔洞"], "tag": "barrier"}, {"q": "質外體途徑主要位於", "o": ["細胞壁與細胞間隙", "每個細胞的細胞核", "只有木質部導管內"], "tag": "barrier"}, {"q": "卡氏帶限制質外體後，必經的界面", "o": ["先跨細胞膜進入共質體", "由壁間空間直接跳進原生質絲", "穿過卡氏帶而不需跨膜"], "tag": "barrier"}, {"q": "兩種途徑的關係", "o": ["可以在根的不同位置轉換", "全程互不相通", "兩者都必須經細胞核"], "tag": "barrier"}]}, {"id": "b2-31-q06", "t": "水勢高低與移動方向", "q": "以假設數值比較水勢，再判斷水的淨移動。", "sub": "課本 P72–73；數值為自製教學假設", "learn": 12, "tag": "potential", "hint": "負數越接近零，數值越大；水往較低水勢移動。", "why": "水從較高水勢移往較低水勢。−0.1 MPa 高於 −0.6 MPa；若土壤降到 −0.8 MPa、根為 −0.3 MPa，水可能由根往土壤淨移動。其他條件相同時，增加溶質會降低水勢。示例非實測資料。", "refs": [{"src": "BOOK3", "cap": "課本 P72 完整頁面"}, {"src": "PPT18S3", "cap": "原PPT第 18 頁完整畫面"}], "fig": "potential", "kind": "fill", "imageWidth": 500, "rows": [{"q": "−0.1 MPa 與 −0.6 MPa，何者水勢較高？", "o": ["−0.1 MPa", "−0.6 MPa", "兩者相同"], "tag": "potential"}, {"q": "示例由土壤到中柱的水淨移動", "o": ["土壤 → 根內", "根內 → 土壤", "只由根毛數量決定"], "tag": "potential"}, {"q": "土壤 −0.8、根 −0.3 MPa 時", "o": ["水可由根向土壤淨移動", "水一定由土壤向根淨移動", "沒有任何淨移動的可能"], "tag": "potential"}, {"q": "壓力等其他條件相同，增加溶質", "o": ["水勢降低", "水勢升高", "水勢與溶質完全無關"], "tag": "potential"}]}, {"id": "b2-31-q07", "t": "原題一：植物如何取得養分？", "q": "下列有關植物獲取養分的敘述，何者正確？", "sub": "原PPT第 20 頁原題；課本 P70", "learn": 14, "tag": "nutrient", "hint": "先區別主要碳源、氮源與水和無機鹽的吸收機制。", "why": "原題答案 D。原解析：A 植物所需的碳源主要來自二氧化碳。B 根部藉滲透作用吸收水分，主要藉主動運輸吸收無機鹽類。C 植物無法利用氮氣作為氮源，須以無機鹽的型式吸收。此題依教材比較根表皮的離子吸收耗能與莖表皮主要保護功能。", "refs": [{"src": "BOOK1", "cap": "課本 P70 完整頁面"}, {"src": "PPT20S3", "cap": "原PPT第 20 頁完整畫面"}], "kind": "single", "opts": [{"t": "植物所需碳源主要來自根部吸收", "ok": false, "tag": "nutrient"}, {"t": "根部表皮細胞主要藉由滲透作用吸收各種無機鹽", "ok": false, "tag": "nutrient"}, {"t": "植物可使用來自氣孔的氮氣作為氮源", "ok": false, "tag": "nutrient"}, {"t": "相較於莖的表皮細胞，根的表皮細胞為了吸收養分而消耗更多能量。", "ok": true, "tag": "nutrient"}]}, {"id": "b2-31-q08", "t": "原題二：教材答案與研究範圍", "q": "下列有關植物根部細胞特性與吸收養分的敘述，哪些正確？", "sub": "原PPT第 21 頁原題；B 解析過於絕對，見思考提示", "learn": 14, "tag": "root", "hint": "本關保留教材預期答案 A、D。B 的原解析「根不吸收有機物」過於絕對：某些植物根可吸收有機氮或單醣。請依教材答案作答，並將原解析與研究適用範圍分開。", "why": "原題答案 A、D。原解析：B「根部表皮細胞不吸收有機物質」；C 根表皮細胞外通常沒有角質層；E 根毛會隨著根部成熟老化而脫落。科學補充：B 的原解析過於絕對，部分植物根可由轉運蛋白吸收有機氮或單醣；本關保留教材原答案，依主要無機鹽吸收情境判讀，不能將原解析當成普遍通則。<br><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC6232311/\" target=\"_blank\" rel=\"noopener noreferrer\">有機氮吸收研究</a>、<a href=\"https://pubmed.ncbi.nlm.nih.gov/19054349/\" target=\"_blank\" rel=\"noopener noreferrer\">根糖運輸研究</a>。", "refs": [{"src": "BOOK1", "cap": "課本 P70 完整頁面"}, {"src": "PPT21S3", "cap": "原PPT第 21 頁完整畫面"}], "kind": "multi", "opts": [{"t": "成熟區具有根毛，吸收能力最佳", "ok": true, "tag": "root"}, {"t": "可藉由主動運輸吸收葡萄糖、胺基酸、硝酸鹽、磷酸鹽等養分", "ok": false, "tag": "nutrient"}, {"t": "根表皮細胞外的角質層可防止吸收的水分散失", "ok": false, "tag": "root"}, {"t": "根部細胞含較多的果膠，黏性與親水性較強", "ok": true, "tag": "root"}, {"t": "根毛是永久性的構造，會持續存在。", "ok": false, "tag": "root"}]}, {"id": "b2-31-q09", "t": "原題三：根段吸水效率", "q": "右圖表示某植物不同根段處的水分吸收效率，吸水能力最好的部位是何處？在某一根段處，曲線急遽下降而後維持低的吸水效率，原因可能為何？", "sub": "原PPT第 22、23 頁原題與原解答", "learn": 15, "tag": "root", "hint": "橫軸是距離，縱軸是吸水速率；構造因素屬可能原因，不是曲線本身直接證明。", "why": "原解答：離根頂端 80 mm 處吸水最好。離根頂端約 100 mm 之後吸水能力急遽下降的原因，可能與較成熟根部的內皮細胞全面加上厚壁而喪失輸送水分的功能有關。適用範圍：保留原題的可能解釋，80 mm、100 mm 不是所有植物固定的分界，仍可藉根段切片及控制實驗檢驗。", "refs": [{"src": "PPT22S3", "cap": "原PPT第 22 頁完整題目與曲線"}, {"src": "PPT23S3", "cap": "原PPT第 23 頁完整解答"}], "fig": "originalgraph", "kind": "fill", "imageWidth": 390, "rows": [{"q": "吸水能力最好的部位是何處？", "o": ["離根頂端約 80 mm", "離根頂端約 0 mm", "離根頂端約 240 mm"], "tag": "root"}, {"q": "曲線急遽下降而後維持低效率的可能原因", "o": ["較成熟根段的內皮細胞壁全面增厚，可能限制輸水", "根頂端完全沒有任何分生細胞", "距離增加必然使所有植物根永久停止吸水"], "tag": "root"}]}], "tags": {"nutrient": ["元素來源與膜運輸", "先區別碳源、氮源與取得形式，再分辨水的滲透及離子的膜運輸。", "課本 P70；原PPT第2、4、20、21頁"], "root": ["根毛與根段判讀", "比較根尖各區的細胞分化；曲線橫軸是距離，位置與可能原因需分開。", "課本 P70；原PPT第3、4、21–23頁"], "symbiosis": ["共生與養分循環", "菌根真菌協助吸收，根瘤菌固定氮；綠肥分解還田不等於所有綠肥都能根瘤固氮。", "課本 P71；原PPT第5–8頁"], "route": ["橫向運輸組織順序", "由外向內核對表皮、皮層、內皮、周鞘與木質部，內皮與周鞘不要互換。", "課本 P72–73；原PPT第9頁"], "barrier": ["路徑與跨膜界面", "質外體沿細胞壁，共質體連接細胞質；卡氏帶迫使先跨膜，原生質絲不直接連通細胞壁空間。", "課本 P72–73；原PPT第10–17頁"], "potential": ["水勢與適用條件", "比較水勢的數值高低；水往較低水勢淨移動。以溶質解釋時，要控制壓力等其他因素。", "課本 P72–73；原PPT第18–19頁"]}, "conceptMap": {"nutrient": 0, "root": 2, "symbiosis": 5, "route": 7, "barrier": 10, "potential": 12}, "pptText": {"1": "3-1 \n植物體對水與無機鹽的吸收\n3-1.1 \n根吸收水與無機鹽的構造\n3-1.2 \n水與無機鹽在根中的橫向運輸\n1", "2": "3-1 \n植物體對水與無機鹽的吸收\n◆ \n氮\n、\n磷\n、\n鉀\n◆ \n碳\n、\n氫\n、\n氧\n▪ \n二氧化碳\n、\n氧氣\n：\n◇ 主要吸收型式\n：\n無機鹽\n◇ 吸收部位\n：\n◇ 主要吸收型式\n：\n二氧化碳\n、\n水\n、\n氧氣\n◇ 吸收部位\n：\n▪ \n水\n：\nCO\n2\nNH\n4\n+\nNO\n3\n-\nPO\n4\n3-\nH\n2\nO\nO\n2\nK\n+\n葉\n根\n根\n配合課本 \nP70", "3": "3-1.1 \n根吸收水與無機鹽的構造\n成熟區\n延長區\n分生區\n根冠\n表皮\n皮層\n中柱\n根毛\n◆\n \n水\n和無機鹽的主要吸收部位是根的\n成熟區\n◆ \n具\n根毛\n的成熟區吸收能力最佳\n配合課本 \nP70", "4": "◆ 根毛是\n表皮細胞\n的延伸突起，可增加吸收的表面積，並能深入土壤顆粒間隙，吸收周圍的水與無機鹽\n3-1.1 \n根吸收水與無機鹽的構造\n皮層\n表皮\n根毛\n土壤水\n土壤顆粒\n土壤氣泡\n初生根\n配合課本 \nP70", "5": "  \n知識補給站\n協助植物吸收無機鹽的共生構造\n       菌根是\n植物\n與\n菌根\n真菌\n共生而形成的構造，依菌絲能否穿透植物細胞壁分成兩類，包覆在表皮細胞外的為\n外生菌根\n；能穿透皮層細胞的為\n內生菌根\n。\n       根吸收無機鹽除了靠植物本身的吸收能力外，還可藉由與其他生物產生\n菌根\n或\n根瘤\n等方式來補強。\n菌根\n  外生\n菌\n根\n內生\n菌\n根\n菌絲\n層\n叢枝狀菌絲\n配合課本 \nP71\n5", "6": "  \n知識補給站\n協助植物吸收無機鹽的共生構造\n       此類\n真菌協助植物吸收多種無機鹽\n，使植物生長較為良好，\n植物則提供真菌有機養分\n，全世界約 \n95%\n 的植物種類都具有菌根。\n含菌根\n缺\n菌根\n配合課本 \nP71\n6", "7": "  \n知識補給站\n協助植物吸收無機鹽的共生構造\n        根瘤是某些種類的\n植物\n與\n根瘤菌\n共生而成的構造\n，\n\n根瘤菌\n可將氮氣轉變為含氮化合物供植物利用\n，\n植物\n則\n\n提供\n根瘤菌有機養分\n。\n根瘤\n被感染的根毛\n感染絲\n根瘤菌\n根部皮層細胞分裂中\n周鞘細胞分裂中\n發育中的根瘤\n感染區\n根瘤維管束組織\n根瘤\n田菁\n配合課本 \nP71\n7", "8": "  \n知識補給站\n協助植物吸收無機鹽的共生構造\n       農民會在休耕時種植豆科植物、油菜等能與根瘤菌共生的植物，然後在下期農作物耕種之前，將這些植物翻土掩埋以增加土壤的含氮量，因此這些植物俗稱\n綠肥作物\n。\n配合課本 \nP71\n8", "9": "3-1.2 \n水與無機鹽在根中的橫向運輸\n◆ \n運輸途徑：\n表皮\n皮層\n周鞘\n內\n皮\n木質部\n單\n子葉植物\n根 （ \n玉米 ）\n雙子葉植物\n根\n \n（ 毛茛 ）\n水、無機鹽\n水、無機鹽\n土與水\n土壤\n→ 表皮\n→ 皮層\n→ 內皮\n→ 周鞘\n→ 木質部\n配合課本 \nP72", "10": "3-1.2 \n水與無機鹽在根中的橫向運輸\n②\n內皮\n周鞘\n木質部\n表皮\n皮層\n無機鹽\n：\n主動運輸\n水分\n：\n滲透作用\n無機鹽\n：\n主動運輸\n水分\n：\n滲透作用\n共質體路徑\n◆ \n運輸途徑\n：\n土壤 → 表皮 → 皮層 → 內皮 → 周鞘 → 木質部\n沿著細胞與細胞間的\n原生質絲\n運輸 \n②\n水和無機鹽進入根毛細胞 　　　\n①\n水和無機鹽移出周鞘細胞，進入木質部\n③\n③\n配合課本 \nP72 \n、\n73\n原生質絲\n①", "11": "  \n知識補給站\n原生質體\n       原生質體是在 \n1880\n 年由\n德國\n植物學家\n漢斯坦\n所提出，代表植物細胞的內含物，但不包括細胞壁。由於兩個相鄰活細胞間有貫穿細胞壁的特有孔道，稱為\n原生質絲\n，使得相鄰細胞的原生質相通而成為一個連續的共同體，故稱為\n共質體\n。\n配合課本 \nP72\n11", "12": "3-1.2 \n水與無機鹽在根中的橫向運輸\n水和無機鹽移出周鞘細胞，進入木質部\n④\n①\n④\n內皮\n周鞘\n木質部\n表皮\n皮層\n◆ \n運輸途徑\n：\n土壤 → 表皮 → 皮層 → 內皮 → 周鞘 → 木質部\n內皮細胞壁具卡氏帶，水分和無機鹽改道進入內皮細胞\n②\n水和無機鹽沿著細胞壁間隙運輸\n①\n沿細胞和細胞間的原生質絲運輸\n③\n③\n②\n質外體路徑\n配合課本 \nP72 \n、\n73\n無機鹽\n：\n主動運輸\n水分\n：\n滲透\n作用\n無機鹽\n：\n主動運輸\n水分\n：\n滲透作用", "13": "3-1.2 \n水與無機鹽在根中的橫向運輸\n◆ \n運輸途徑\n：\n土壤 → 表皮 → 皮層 → 內皮 → 周鞘 → 木質部\n在質體外運輸過程中可能因生理需求等因素，半途進入細胞內，再經由原生質絲進入內皮與中柱\n①\n內皮\n周鞘\n木質部\n表皮\n皮層\n質外體路徑\n配合課本 \nP72 \n、\n73\n④\n③\n②\n無機鹽\n：\n主動運輸\n水分\n：\n滲透\n作用\n無機鹽\n：\n主動運輸\n水分\n：\n滲透作用", "14": "3-1.2 \n水與無機鹽在根中的橫向運輸\n內皮細胞\n◆ 排列緊密\n◆ 上下左右\n相鄰\n的內皮細胞間，細胞壁有加厚的現象，主要成分為不透水的\n木質素\n，稱為\n卡氏帶\n卡氏帶\n內皮細胞\n配合課本 \nP72 \n、\n73\n14", "15": "  \n知識補給站\n卡氏帶\n       \n19\n 世紀中葉，\n德國\n植物學家\n卡斯伯里\n首次描述了植物根部的內\n皮，\n發現其細胞壁有加厚的現象，命名為「\nSchutzscheide\n」（意指防護套），後來學者將其稱為\n卡氏帶\n。卡氏帶完全填充了內皮細胞間包含中膠層在內的空隙，使兩細胞的細胞壁幾乎融合。有些內皮細胞還會有次級生長現象，細胞壁中除了木質素，還另外多了\n木栓質\n。\n配合課本 \nP72\n15", "16": "卡氏帶\n內皮細胞\n3-1.2 \n水與無機鹽在根中的橫向運輸\n內皮細胞\n◆ \n無論是經由 \n①\n \n細胞內\n或 \n② \n細胞間隙\n橫向運輸至內皮細胞的水分，皆\n須經由原生質絲\n進入內皮細胞內\n才能到達中柱\n→ 使內皮細胞的細胞膜發揮選擇性通透的功能\n②\n①\n配合課本 \nP72 \n、\n73\n16", "17": "3-1.2 \n水與無機鹽在根中的橫向運輸\n內皮細胞\n→ \n卡氏帶阻擋\n有害物質經由細胞間隙進入中柱，\n避免\n透過維管束擴及全株\n→ 卡\n氏帶阻止\n無機鹽等物質向外流出\n，維持中柱細胞內\n高滲透壓\n和\n低水勢\n配合課本 \nP72 \n、\n73\n17\n根系吸收水分與無機鹽的路徑\n卡氏帶\n內皮細胞\n②\n①", "18": "  \n知識補給站\n水勢\n　　水勢是指\n水移動的能力\n，決定水會從哪裡流向哪裡。簡單來說，水總是從\n高水勢流向低水勢\n，就像水從高處往低處流一樣。當在\n水中添加溶質時，水分子移動的自由度會降低，水分子會更難擴散，使得水勢變小\n，但吸水能力卻變強。例如\n：\n土壤中的水含有較少的溶質，因此水勢較高；而植物的根毛內含有許多溶於水的無機鹽和有機養分，因此水勢較低。由於水會從高水勢流向低水勢，因此土壤中的水就會流進根毛內，幫助植物吸收水分。\n配合課本 \nP72\n18", "19": "3-1.2 \n水與無機鹽在根中的橫向運輸\n◆ \n滲透壓差\n：\n土壤\n<\n表皮\n<\n皮層\n<\n內皮\n<\n周鞘\n<\n木質部\n→ \n水勢\n：\n土壤\n>\n表皮\n>\n皮層\n>\n內皮\n>\n周鞘\n>\n木質部\n→ \n水分才可藉由滲透作用從土壤擴散至\n木質部\n表皮\n皮層\n周鞘\n內\n皮\n木質部\n水、無機鹽\n水、無機鹽\n配合課本 \nP73", "20": "  \nQuestion\n1. \n下列有關植物獲取養分的敘述，何者正確\n？　\n(\nA)\n植物所需碳源主要來自根部\n吸收　\n(\nB)\n根部表皮細胞主要藉由滲透作用吸收各種\n無機鹽　\n(\nC)\n植物可使用來自氣孔的氮氣作為氮\n源　\n(\nD)\n相較於莖的表皮細胞，根的表皮細胞為了吸收養分而消耗更多能量。\n解答\n：\n(D)\n解析\n：\n(A)\n植物所需的碳源主要來自二氧化碳。\n(B)\n根部藉滲透作用吸收水分，主要藉主動運輸吸收無機鹽類。 \n(C)\n植物無法利用氮氣作為氮源，須以無機鹽的型式\n吸收。\n20", "21": "  \nQuestion\n2. \n下列有關植物根部細胞特性與吸收養分的敘述，哪些正確？\n(A)\n成熟區具有根毛，吸收能力\n最佳　\n(\nB)\n可藉由主動運輸吸收葡萄糖、胺基酸、硝酸鹽、磷酸鹽等\n養分　\n(\nC)\n根表皮細胞外的角質層可防止吸收的水分\n散失　\n(\nD)\n根部細胞含較多的果膠，黏性與親水性較\n強　\n(\nE)\n根毛是永久性的構造，會持續存在。\n解答\n：\n(\nA)(D)\n解析\n：\n(\nB)\n根部表皮細胞不吸收有機物質。\n(C)\n根表皮細胞外通常沒有角質層。\n(E)\n根毛會隨著根部成熟老化而脫落。\n21", "22": "  \nQuestion\n3. \n右圖\n表示某植物不同根段處的水分吸收效率，吸水能力最好的部位是何處？在某一根段處，曲線急遽下降而後維持低的吸水效率，原因可能為何？\n22", "23": "  \nQuestion\n解答\n：\n離根頂端 \n80 mm \n處吸水最好。離根頂端\n約\n\n100 \nmm \n之後吸水能力急遽下降的原因，可能與較成熟根部的內皮細胞全面加上厚壁而喪失輸送水分的功能有關。\n23"}, "originalCount": 3, "sourceScopeNotes": {"prevalence": "https://research-repository.uwa.edu.au/en/publications/evolutionary-history-of-mycorrhizal-symbioses-and-global-host-pla/", "monotropa": "https://pmc.ncbi.nlm.nih.gov/articles/PMC2660934/", "green": "https://www.ars.usda.gov/ARSUserFiles/60100500/csr/ResearchPubs/price/price_07f.pdf", "water": "https://openstax.org/books/biology-2e/pages/30-5-transport-of-water-and-solutes-in-plants", "organic": "https://pmc.ncbi.nlm.nih.gov/articles/PMC6232311/", "sugar": "https://pubmed.ncbi.nlm.nih.gov/19054349/"}};

function readingBlocks(node){
 const blocks=[];for(const child of [...node.childNodes]){
  if(child.nodeType===3){if(child.textContent.trim()){const p=document.createElement('p');p.textContent=child.textContent;blocks.push(p);}continue;}
  if(child.matches('ul,ol'))for(const li of child.children){const list=document.createElement(child.tagName);list.append(li.cloneNode(true));blocks.push(list);}
  else blocks.push(child.cloneNode(true));
 }return blocks;
}

function splitBlock(node,body){
 // Range fragments keep inline emphasis and every character when a long paragraph needs another page.
 const length=node.textContent.length;if(!length)return [node];const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT),texts=[];let n,offset=0;while(n=walker.nextNode()){texts.push({node:n,start:offset,end:offset+n.length});offset+=n.length;}

  parts.push(fragment(from,best));from=best;
 }body.replaceChildren();return parts;
}
function paginateReading(){
