, "txt": "<ul><li>花的外觀可能吸引訪花者，協助花粉散布。</li><li>先觀察整朵花，再分辨其組成。</li><li>外觀的功能推論要與實際訪花或構造證據分開。</li></ul><p class=\"think\">思考：鮮豔的部分一定都是花瓣嗎？</p><p class=\"scope-note\">判讀提醒：原PPT提及其他影片名稱，原文保留；本頁播放器使用本活動提供的教學影片。</p><div class=\"quote\">探討活動 <br>4-1 <br>花與果實的形態與構造<br>活動一 花的觀察<br>       花的鮮豔外觀通常有利於吸引訪花者前來，以協助花粉的散布。從本活動所提供的各種花形，你可以判斷出花的組成構造嗎？<br>花的構造與功能<br>花的構造（月橘）<br>花開縮時攝影<br>配合課本 <br>P127<br>5<small>原PPT第 5 頁（完整原文）</small></div><div class=\"quote\">花的鮮豔外觀通常有利於吸引訪花者前來，以協助花粉的散布。從本活動所<br>提供的各種花形，你可以判斷出花的組成構造嗎？<br>步　驟<br>觀察一朵花的外形，並分辨<br>其組成構造，如花萼、花<br>冠、雄蕊及雌蕊。<br>1<br>e： 輻射對稱的花可有多條對稱<br>軸（圖中藍色虛線）；兩<br>側對稱的花則只有一條對稱<br>軸。<br>2<br>兩側對稱<br>輻射對稱<br>由花的組成構造排列方式來<br>判斷花的對稱性──輻射對<br>稱或兩側對稱。<br>以鑷子將一朵花的組成構造由<br>外而內（花萼→花冠）依序從<br>其著生處（花托）摘取下來。<br>3<br>e： 請留意花萼、花冠、雄蕊及<br>雌蕊的相對著生位置，有些<br>並未直接著生在花托上。<br>活動一<br>花的觀察<br>第 4 章  植物的生殖　127<small>課本 PDF 第 2 頁，印刷 P127（完整原文）</small></div>", "tb": [["BOOK2", "P127 完整課本頁"]]}, {"id": "b2-a41-l06", "t": "花的基本組成：由外到內", "src": "課本 P127；原PPT第 6 頁", "slide": 6, "sourcePages": [6], "sec": "s2", "figSpec": {"image": "parts"}, "txt": "<ul><li>辨認花萼、花冠、雄蕊及雌蕊。</li><li>花萼由萼片構成，花冠由花瓣構成。</li><li>雄蕊及雌蕊是與花粉、胚珠相關的生殖構造。</li></ul><p class=\"think\">思考：只看顏色，能準確區分每種花的花萼與花冠嗎？</p><p class=\"scope-note\">判讀提醒：教材解剖圖用於辨認各組構造；實物的數目、分化與癒合程度依植物而異，須保留位置紀錄。</p><div class=\"quote\">探討活動 <br>4-1 <br>花與果實的形態與構造<br>活動一 花的觀察<br>觀察一朵花的外形，並分辨其組成構造，<br>如花萼、花冠、<br>雄蕊及雌蕊。<br>步驟<br>配合課本 <br>P127<br>6<small>原PPT第 6 頁（完整原文）</small></div><div class=\"quote\">花的鮮豔外觀通常有利於吸引訪花者前來，以協助花粉的散布。從本活動所<br>提供的各種花形，你可以判斷出花的組成構造嗎？<br>步　驟<br>觀察一朵花的外形，並分辨<br>其組成構造，如花萼、花<br>冠、雄蕊及雌蕊。<br>1<br>e： 輻射對稱的花可有多條對稱<br>軸（圖中藍色虛線）；兩<br>側對稱的花則只有一條對稱<br>軸。<br>2<br>兩側對稱<br>輻射對稱<br>由花的組成構造排列方式來<br>判斷花的對稱性──輻射對<br>稱或兩側對稱。<br>以鑷子將一朵花的組成構造由<br>外而內（花萼→花冠）依序從<br>其著生處（花托）摘取下來。<br>3<br>e： 請留意花萼、花冠、雄蕊及<br>雌蕊的相對著生位置，有些<br>並未直接著生在花托上。<br>活動一<br>花的觀察<br>第 4 章  植物的生殖　127<small>課本 PDF 第 2 頁，印刷 P127（完整原文）</small></div>", "tb": [["BOOK2", "P127 完整課本頁"]]}, {"id": "b2-a41-l07", "t": "花的對稱：多條或一條軸", "src": "課本 P127；原PPT第 7 頁", "slide": 7, "source lide": 9, "sourcePages": [9], "sec": "s2", "figSpec": {"image": "spread"}, "txt": "<ul><li>遇到癒合的花萼或花冠，沿癒合處縱向劃開。</li><li>由基部切離，讓花冠能攤平。</li><li>保留原形與攤平後的對照照片。</li></ul><p class=\"think\">思考：攤平後的花冠外形，是否仍能直接代表整朵花的對稱？</p><div class=\"quote\">探討活動 <br>4-1 <br>花與果實的形態與構造<br>活動一 花的觀察<br>若花萼或<br>花冠癒合<br>，須將癒合處縱向劃開，並從基部切離，以便將<br>花<br>冠<br>攤<br>平。<br>配合課本 <br>P128<br>9<small>原PPT第 9 頁（完整原文）</small></div><div class=\"quote\">若花萼或花冠癒合，須將癒合處縱向劃開，並從基部切離，以便將<br>花冠攤平。<br>4<br>將雄蕊取下，最後剩雌蕊留在花托<br>上。在壁報紙上將各個組成一一排<br>列，標示出植物名稱與各項組成構<br>造後，拍照記錄。<br>5<br>重複以上步驟，觀<br>察並記錄多種花的<br>構造。<br>6<br>128　選修生物 Ⅱ (全)<small>課本 PDF 第 3 頁，印刷 P128（完整原文）</small></div>", "tb": [["BOOK3", "P128 完整課本頁"]]}, {"id": "b2-a41-l10", "t": "解剖三：排列、標示、拍照", "src": "課本 P128；原PPT第 10 頁", "slide": 10, "sourcePages": [10], "sec": "s2", "figSpec": {"image": "parts"}, "txt": "<ul><li>取下雄蕊，雌蕊最後留在花托上。</li><li>在深色壁報紙上逐一排列各組構造。</li><li>標示植物名稱與構造名稱，再拍照記錄。</li></ul><p class=\"think\">思考：少了植物名稱或比例參照，照片會失去哪些資訊？</p><div class=\"quote\">探討活動 <br>4-1 <br>花與果實的形態與構造<br>活動一 花的觀察<br>將雄蕊取下，最後剩雌蕊留在花托上。在壁報紙上將各個組成一一排列，標示出植物名稱與各項組成構造後，拍照記錄。<br>配合課本 <br>P128<br>10<small>原PPT第 10 頁（完整原文）</small></div><div class=\"quote\">若花萼或花冠癒合，須將癒合處縱向劃開，並從基部切離，以便將<br>花冠攤平。<br>4<br>將雄蕊取下，最後剩雌蕊留在花托<br>上。在壁報紙上將各個組成一一排<br>列，標示出植物名稱與各項組成構<br>造後，拍照記錄。<br>5<br>重複以上步驟，觀<br>察並記錄多種花的<br>構造。<br>6<br>128　選修生物 Ⅱ (全)<small>課本 PDF 第 3 頁，印刷 P128（完整原文）</small></div>", "tb": [["BOOK3", "P128 完整課本頁"]]}, {"id": "b2-a41-l11", "t": "重複觀察：比較多種花", "src": "課本 P128；原PPT第 11 頁", "slide": 11, "sourcePages": [11], "sec": "s2", "figSpec": {"image": "parts"}, "txt": "<ul><li>用相同流程觀察多種花。</li><li>逐種記錄外形、對稱、數目與著生位置。</li><li>分開記錄實際所見及暫時無法辨認的部分。</li></ul><p class=\"think\">思考：構造不明顯時，應寫「未辨認」還是直接寫「沒有」？</p><div class=\"quote\">探討活動 <br>4-1 <br>花與果實的形態與構造<br>重複以上步驟，觀察並記錄多種花的構造。<br>活動一 花的觀察<br>配合課本 <br>P128<br>11<small>原PPT第 11 頁（完整原文）</small></div><div class=\"quote\">若花萼或花冠癒合，須將癒合處縱向劃開，並從基部切離，以便將<br>花冠攤平。<br>4<br>將雄蕊取下，最後剩雌蕊留在花托<br>上。在壁報紙上將各個組成一一排<br>列，標示出植物名稱與各項組成構<br>造後，拍照記錄。<br>5<br>重複以上步驟，觀<br 動藉由觀察常見的花外形與構造，了解花的基本組成。\n2. \n觀察常見的果實構造，嘗試連結由花長成果實的過程，並認識不同果實散播種子的方式。\n目的\n花與果實的形態與構造 \n(\n花\n)\n花與果實的形態與構造 \n(\n果實\n)\n配合課本 \nP126\n2", "3": "探討活動 \n4-1 \n花與果實的形態與構造\n器材\n每組使用\n放大鏡\n1\n 支\n深色壁報紙\n1\n 張\n尖細鑷子\n1\n 支\n水果刀\n1\n 支\n解剖刀\n1\n 支\n砧板\n1\n 個\n解剖顯微鏡\n1\n 臺\n配合課本 \nP126\n3", "4": "探討活動 \n4-1 \n花與果實的形態與構造\n每組使用\n 花、\n果實（依\n季節選用數\n種）\n \n(1\n)\n \n第 \n1\n 學期\n：\n① \n雙子葉植物\n：\n黃\n槐（花\n、\n果）、鳳凰木\n（\n花\n、\n果）、朱槿（花）、向日葵（\n花、果\n）、蜜棗（果）、柑橘（果）、鳳梨（果）、蘋果（果）或梨（果）\n② \n單子葉植物\n：\n百合（花）\n(2\n)\n \n第\n \n2 \n學期\n：\n① \n雙子葉植物\n：\n羊\n蹄\n甲（花\n、\n果\n）\n、\n朱槿\n（花）\n、\n杜鵑（花）、向日葵（\n花、果\n）、桃（果）、柑橘（果）、草莓（果）、鳳梨（果）、蘋果（果）或梨（果）\n② \n單子葉植物\n：\n百合（花）\n配合課本 \nP126\n4", "5": "探討活動 \n4-1 \n花與果實的形態與構造\n活動一 花的觀察\n       花的鮮豔外觀通常有利於吸引訪花者前來，以協助花粉的散布。從本活動所提供的各種花形，你可以判斷出花的組成構造嗎？\n花的構造與功能\n花的構造（月橘）\n花開縮時攝影\n配合課本 \nP127\n5", "6": "探討活動 \n4-1 \n花與果實的形態與構造\n活動一 花的觀察\n觀察一朵花的外形，並分辨其組成構造，\n如花萼、花冠、\n雄蕊及雌蕊。\n步驟\n配合課本 \nP127\n6", "7": "探討活動 \n4-1 \n花與果實的形態與構造\n活動一 花的觀察\n由花的組成構造排列方式來判斷花的對稱\n性 \n——\n \n輻射\n對稱或兩側對稱。\n註\n輻射對稱的花可有多條對稱軸（圖中藍色虛線）；兩側對稱的花則只有一條對稱軸。\n兩側\n對稱\n輻射對稱\n配合課本 \nP127\n7", "8": "探討活動 \n4-1 \n花與果實的形態與構造\n活動一 花的觀察\n以鑷子將一朵花的組成構造由外而內\n（花萼→花冠）\n依序從其著生處（花托）摘取下來。\n註\n請\n留意\n花萼\n、花\n冠\n、\n雄蕊及雌蕊的相對著生位置，有些並未直接著生在花托上。 \n配合課本 \nP127\n8", "9": "探討活動 \n4-1 \n花與果實的形態與構造\n活動一 花的觀察\n若花萼或\n花冠癒合\n，須將癒合處縱向劃開，並從基部切離，以便將\n花\n冠\n攤\n平。\n配合課本 \nP128\n9", "10": "探討活動 \n4-1 \n花與果實的形態與構造\n活動一 花的觀察\n將雄蕊取下，最後剩雌蕊留在花托上。在壁報紙上將各個組成一一排列，標示出植物名稱與各項組成構造後，拍照記錄。\n配合課本 \nP128\n10", "11": "探討活動 \n4-1 \n花與果實的形態與構造\n重複以上步驟，觀察並記錄多種花的構造。\n活動一 花的觀察\n配合課本 \nP128\n11", "12": "探討活動 \n4-1 \n花與果實的形態與構造\n活動一 花的觀察\n1. \n一般歸納單子葉植物花的組成構造數目多\n為 \n3\n 的\n倍數，雙子葉植物的組成構造數目多\n為 \n4\n 或 \n5\n 的\n倍數。比較不同植物花的外形與組成構造之觀察紀錄，是否與上述的歸納相同？\n討論\n配合課本 \nP129\n12", "13": "探討活動 \n4-1 \n花與果實的形態與構造\n活動一 花的觀察\n答\n：\n通常\n花的組成構造數目有一定的規律\n：\n單子葉植物的萼片、花瓣數目多\n為 \n3\n，雄蕊及雌蕊多\n為 \n3\n 或 \n6\n（\n或 \n3\n 的\n倍數）；而雙子葉植物則變化較多，\n其\n花瓣、雄蕊\n、雌蕊\n的\n組成數目大致多\n為 \n4\n 或 \n5\n（\n或 \n4\n \n或 \n5\n 的\n倍數）。若有與上述歸納不同者，則多屬經由特別選種培育之結果，例如：重複花瓣數目而導致雄蕊異常或不明顯。\n配合課本 \nP129\n13", "14": "探討活動 \n4-1 \n花與果實的形態與構造\n活動一 花的觀察\n2. \n校園裡或市售的玫瑰花皆是薔薇屬植物，有些玫瑰的花瓣很多，但雄蕊、雌蕊不明顯\n；\n有些則\n僅有 \n5\n 個\n花瓣、很多雄蕊。為何在分類上為同屬的植物，花的構造會有這麼大的差異？\n答\n：\n原始\n薔薇屬的花瓣數為 \n5\n、有很多雄蕊。市售玫瑰花多為園藝培育品種，自然雜交或人工篩選雜交（育種）後，再特別篩選花瓣多重的變異品種，因此才產生同屬植物的花瓣和花蕊有較大差異。\n配合課本 \nP129\n14", "15": "探討活動 \n4-1 \n花與果實的形態與構造\n3. \n在所觀察的雌蕊構造中，具有哪些利於授粉的特性？授粉之後，花的哪些構造可能會發生改變？是怎樣的改變？\n15\n活動一 花的觀察\n配合課本 \nP129", "16": "探討活動 \n4-1 \n花與果實的形態與構造\n活動一 花的觀察\n答\n：\n⑴ 依據\n學生所觀察的植物種類而有所不同。例如\n：\n雌蕊突出花冠外，花柱有特別的彎曲角度，柱頭上具有黏液或多毛等特徵，利於花粉黏附於柱頭上。\n⑵ 授粉後，花粉向胚珠延伸以利受精作用及種子與果實的發育成熟。而外觀上，多數植物的花瓣會枯萎、脫落，接著雌蕊子房以及參與果實發育的其他花構造會持續膨大，花柄也加粗，以利持續運輸來自其他成熟部位所提供的養分與水分。\n配合課本 \nP129\n16", "17": "探討活動 \n4-1 \n花與果實的形態與構造\n活動二 \n果實\n的觀察\n       市售的果實通常已經過\n品種選育，\n特別強化其可食用的部分，然而尚有一些殘餘痕跡可供判斷果實的組成構造。本活動目的是應用果實解剖的基本操作，觀察多樣化的果實，並嘗試分辨這些果實是由一朵花發育成的單花果還是由多朵花所形成的多花果。\n配合課本 \nP130\n17", "18": "探討活動 \n4-1 \n花與果實的形態與構造\n觀察果實的外形與質地，判斷是肉質多汁的肉果還是乾燥的乾果。\n（一） \n果實解剖的基本操作（ \n　\n \n：\n縱切面， \n　\n：\n橫切面）\n步驟\n□ 若為\n肉\n果\n□ 若為乾果\n配合課本 \nP130\n18\n活動二 \n果實\n的觀察", "19": "探討活動 \n4-1 \n花與果實的形態與構造\n活動二 \n果實\n的觀察\n判斷是否會自行裂開。\n將果實從果柄（或有「蒂頭」痕跡處）往下縱切；取另一果實從直徑最大處作橫切（與通過果柄的軸垂直）。\n配合課本 \nP130\n19", "20": "探討活動 \n4-1 \n花與果實的形態與構造\n比較縱、橫兩種切面的不同，例如\n：\n在橫剖面下，果實內部是否有分隔？每個分隔中的種子數目與種子的著生方式等，可用簡單手繪圖輔助，記錄所觀察之特徵。\n配合課本 \nP130\n20\n活動二 \n果實\n的觀察", "21": "探討活動 \n4-1 \n花與果實的形態與構造\n活動二 \n果實\n的觀察\n觀察果皮的組成是否有不同的質地與層次。例如\n：\n桃的果皮有外、中及內果皮之分。\n配合課本 \nP130\n21\n內果皮\n中果皮\n外果皮", "22": "探討活動 \n4-1 \n花與果實的形態與構造\n活動二 \n果實\n的觀察\n有些肉果的組成包含子房以外的構造，嘗試分辨出一朵花的範圍，判斷在果實的肉質部分中，還有哪些不是子房的構造。\n配合課本 \nP130\n22", "23": "探討活動 \n4-1 \n花與果實的形態與構造\n活動二 \n果實\n的觀察\n                        觀察單花果\n選擇豆類、向日葵、蜜棗、桃或柑橘等單純由子房所發育而成的單花果，根據前述的基本操作進行觀察。可用簡單手繪圖輔助，記錄觀察結果。\n（二）單\n花果與多花果的觀察\n步驟\n配合課本 \nP131\n23", "24": "探討活動 \n4-1 \n花與果實的形態與構造\n活動二 \n果實\n的觀察\n觀察蘋果果實的外觀，是否能找到其來自單一朵花的證據，例如\n：\n殘留的萼片或雄蕊等。\n配合課本 \nP131\n24", "25": "探討活動 \n4-1 \n花與果實的形態與構造\n活動二 \n果實\n的觀察\n將蘋果縱切，觀察子房壁與其花萼筒癒合的界線，並拍照記錄。\n配合課本 \nP131\n25\n花萼筒\n種子\n子房壁", "26": "探討活動 \n4-1 \n花與果實的形態與構造\n活動二 \n果實\n的觀察\n取另一蘋果橫切，觀察包含的分隔數，再由種子向外觀察是否有類似\n步驟 \n3\n 的\n癒合界線，亦即子房壁與其外側的花萼筒癒合的痕跡。\n配合課本 \nP131\n26\n花萼筒\n種子\n子房壁", "27": "探討活動 \n4-1 \n花與果實的形態與構造\n活動二 \n果實\n的觀察\n參考\n步驟 \n3\n 的\n操作，觀察草莓的縱切面，草莓的肉質部位與蘋果不同，是由花托發育而成，花托上的許多小顆粒是由雌蕊長成的小果實。若有蘋果與草莓的花，也可觀察花的構造，特別是雌蕊，即可區分此兩種果實的差別。\n配合課本 \nP131\n27\n小果實", "28": "探討活動 \n4-1 \n花與果實的形態與構造\n活動二 \n果實\n的觀察\n步驟\n以鳳梨為例， 先觀察外觀，找到其中單一朵花的範圍（表面略成六角形的小單元），以及其上殘留的苞片。\n配合課本 \nP132\n                        \n觀察多花\n果\n（二）單\n花果與多花果的觀察\n28", "29": "探討活動 \n4-1 \n花與果實的形態與構造\n將鳳梨縱切，觀察其花序軸，配合果實外觀的六角形範圍，嘗試區分出一朵花與類似癒合的痕跡。\n配合課本 \nP132\n29\n一朵花的範圍\n一朵花長成的果實\n苞片\n花序軸\n活動二 \n果實\n的觀察", "30": "探討活動 \n4-1 \n花與果實的形態與構造\n活動二 \n果實\n的觀察\n1. \n在觀察過的果實中，哪些果實的構造仍保留部分花構造的殘跡？\n討論\n答\n：\n單\n花果中的番茄、番石榴、蘋果、梨及草莓等，果實上大多會有殘留的萼片或乾掉的雄蕊。多花果中，鳳梨表面的\n六角形為\n一朵花，此單位上可看到殘留的萼片，另外還有一苞片附在基部、接近鳳梨較成熟的一端（俗稱鳳梨頭）；桑椹的每個肉質小核果尚可見乾掉的花柱或柱頭。\n配合課本 \nP132\n30", "31": "探討活動 \n4-1 \n花與果實的形態與構造\n活動二 \n果實\n的觀察\n2. \n從蘋果的橫切面可看出內部\n有 \n5 \n個\n分隔，且每個小分隔中有種子，故可推知蘋果花的子房內\n有 \n5 \n個\n分隔。以此類推，蘋果花的萼片、花瓣數目\n也是 \n5 \n的\n倍數嗎？對照活動一中各種花的觀察結果，前述推論是否成立？\n配合課本 \nP132\n31", "32": "探討活動 \n4-1 \n花與果實的形態與\n構造\n活動二 \n果實\n的觀察\n答\n：\n(1)\n \n蘋果花的萼片、花瓣數目是 \n5 \n的倍數\n。\n(2)\n 不一定成立。\n花\n的組成部分，萼片、花瓣、雄蕊及雌蕊分隔（心皮）數目大多有固定的倍數，\n此是分類研究所歸納出的通則，但多適用在不同的分類群，依植物類群而異，有些在科或屬的層級\n，其規律性常被視為分類的依據特徵。以蘋果所屬的薔薇科為例，萼片與花瓣數大多\n為 \n5 \n的\n倍數，雄蕊數目多、雌蕊內有單一心皮或\n具有 \n5 \n心\n皮。此外，也有花的組成部分\n為\n \n4\n 的\n倍數者，例如\n：\n阿拉伯芥與甘藍等十字花科植物，其\n萼片 \n4\n、\n花瓣 \n4\n、\n雄蕊 \n4\n＋\n2\n（\n4 \n大 \n2 \n小\n）、\n子房 \n1 \n室\n（因隔膜而分為\n假 \n2 \n室\n）。\n配合課本 \nP132\n32", "33": "探討活動 \n4-1 \n花與果實的形態與構造\n活動二 \n果實\n的觀察\n故在單、雙子葉植物的花組成比較中，通常會描述其\n為 \n4 \n或 \n5 \n的\n倍數。然而，不完全符合上述通則的例子仍然存在。例如\n：\n聖誕紅等大戟科植物是雙子葉植物中子房\n具 \n3 \n心\n皮者，此與多數單子葉植物的子房心皮數相似。所以在歸納時，仍應多方蒐集可參酌的證據。\n配合課本 \nP132\n33"}, "originalCount": 5};

 if(innerWidth>900){const top=fs?12:card.getBoundingClientRect().top,nav=(fs?stage.querySelector('.fs-controls'):el('learn').querySelector('.lnav')).getBoundingClientRect().height,head=card.querySelector('.lhead').getBoundingClientRect().height,cardH=Math.max(230,innerHeight-top-nav-26);root.style.setProperty('--lesson-card-height',cardH+'px');root.style.setProperty('--lesson-body-height',(cardH-head-2)+'px');}
 paginateReading();fitLessonTable();
}

let fitPending=false;
function fit(){if(fitPending)return;fitPending=true;requestAnimationFrame(()=>{fitPending=false;const bar=el('bar'),h=bar.classList.contains('hidden')?0:Math.ceil(bar.getBoundingClientRect().height);if(document.documentElement.style.getPropertyValue('--barh')!==h+'px')document.documentElement.style.setProperty('--barh',h+'px');
 if(PAGE==='learn')fitLesson();
 if(PAGE==='play'&&innerWidth>900){const panel=el('question-panel'),top=panel.getBoundingClientRect().top,fb=el('question-feedback').getBoundingClientRect().height,available=innerHeight-h-top-fb-26;
 const layout=panel.querySelector('.fill-layout'),rail=panel.querySelector('.reference-rail'),img=rail?.querySelector('img');if(img){const ratio=img.naturalWidth/img.naturalHeight||1;for(let pass=0;pass<3;pass++){const caption=rail.querySelector('p').getBoundingClientRect().height+8,width=Math.min(Math.min(STAGES[QI].imageWidth||440,panel.clientWidth-380),Math.max(80,(available-caption)*ratio));if(Math.abs(rail.getBoundingClientRect().width-width)<.1)break;layout.style.setProperty('--reference-width',width+'px');}}
 const match=panel.querySelector('.matching-figure img');if(match){match.style.maxHeight=Math.max(140,available-30)+'px';}
 const organ=panel.querySelector('.organ-grid');if(organ)organ.style.setProperty('--organ-height',Math.max(90,Math.min(230,available-130))+'px');
 const rf=panel.querySelector('.reflection-layout');if(rf){rf.style.setProperty('--reflection-image-height',Math.max(100,available-30)+'px');const label=rf.querySelector('label').getBoundingClientRect().height,guidance=rf.querySelector('.reflection-guidance').getBoundingClientRect().height;rf.style.setProperty('--reflection-field-height',Math.max(100,available-label-guidance-22)+'px');}
 const graph=panel.querySelector('.graph-question');if(graph){graph.style.setProperty('--graph-height',Math.max(80,Math.min(245,available-46))+'px');graph.style.setProperty('--stimulus-height',Math.max(55,Math.min(110,available-132))+'px');}
 const choice=panel.querySelector('.choice-layout img');if(choice){choice.style.maxHeight=Math.max(140,available-30)+'px';}
 } });}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{returnQuestion=PAGE==='play'&&b.dataset.page==='learn';navigate(b.dataset.page)});
el('continue-learn').onclick=()=>navigate('learn',LI);el('back-question').onclick=()=>navigate('play',QI);el('learn-fullscreen').onclick=enterLearnFullscreen;el('fs-exit').onclick=exitLearnFullscreen;
for(const id of ['l-prev','fs-prev'])el(id).onclick=()=>LI>0&&showLearn(LI-1);for(const id of ['l-next','fs-next'])el(id).onclick=()=>LI<LEARN.length-1&&showLearn(LI+1);
el('related-slide').onclick=()=>openShow(DECK.findIndex(d=>d[1]===+(LEARN[LI].src.match(/第 (\d+)/)?.[1]||1)));
el('hint-toggle').setAttribute('aria-haspopup','dialog');el('hint-toggle').onclick=()=>{el('hint-toggle').setAttribute('aria-expanded','true');const d=openDialog('思考提示',`<p>${esc(STAGES[QI].hint)}</p>`);d.addEventListener('close',()=>el('hint-toggle').setAttribute('aria-expanded','false'),{once:true});};el('reference-btn').onclick=()=>openReferences(STAGES[QI]);el('question-learn').onclick=()=>{returnQuestion=true;navigate('learn',STAGES[QI].learn)};el('q-jump').onchange=e=>showQuestion(+e.target.value);el('prev-btn').onclick=()=>QI>0&&showQuestion(QI-1);el('skip-btn').onclick=()=>QI<STAGES.length-1?showQuestion(QI+1):navigate('done');el('check-btn').onclick=check;el('reset-btn').onclick=resetQuestion;el('finish-btn').onclick=()=>navigate('done');
el('shsel').innerHTML=[...new Set(DECK.map(d=>d[1]))].map(n=>`<option value="${n}">第 ${n} 頁 · ${esc(DECK.find(d=>d[1]===n)[2].slice(0,22))}</option>`).join('');el('shsel').onchange=e=>{showStopPlay();SI=DECK.findIndex(d=>d[1]===+e.target.value);showRender();};el('shprev').onclick=()=>showStep(-1);el('shnext').onclick=()=>showStep(1);el('shplay').onclick=()=>{if(SPLAY)showStopPlay();else{if(SI===DECK.length-1)SI=0;showRender();SPLAY=setInterval(()=>{if(SI>=DECK.length-1){showStopPlay();return;}SI++;showRender()},2600);el('shplay').textContent='⏸ 暫停';}};el('shfs').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else el('show').requestFullscreen?.().catch(()=>{el('shfs').textContent='此瀏覽器不支援原生全螢幕'})};el('shclose').onclick=()=>navigate('intro');
el('theme-toggle').onclick=()=>{ST.theme=ST.theme==='dark'?'light':'dark';applyPreferences();save();};el('font-toggle').onclick=()=>{ST.font=(ST.font+1)%3;applyPreferences();save();fit();};function applyPreferences(){document.documentElement.dataset.theme=ST.theme;document.documentElement.style.setProperty('--text',[20,22,24][ST.font]+'px');document.documentElement.dataset.font=ST.font;el('theme-toggle').setAttribute('aria-pressed',String(ST.theme==='dark'));el('font-toggle').title='文字大小 '+[20,22,24][ST.font]+'px';}
document.addEventListener('fullscreenchange',fullscreenSync);document.addEventListener('keydown',e=>{if(e.isComposing||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if(document.querySelector('dialog[open]'))return;const fs=document.fullscreenElement===el('learn-stage')||el('learn-stage').classList.contains('presentation');if(fs){if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();if(LI<LEARN.length-1)showLearn(LI+1);}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();if(LI>0)showLearn(LI-1);}else if(e.key==='Escape')exitLearnFullscreen();return;}if(PAGE==='show'){if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();showStep(1);}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();showStep(-1);}else if(e.key==='Escape')navigate('intro');else if(e.key==='Home'){SI=0;showRender()}else if(e.key==='End'){SI=DECK.length-1;showRender()}return;}if(PAGE==='learn'&&el('flip')){if(e.key==='ArrowRight'){e.preventDefault();flipStop();flipShow(FI+1)}if(e.key==='ArrowLeft'){e.preventDefault();flipStop();flipShow(FI-1)}}});
el('learn-stage').addEventListener('contextmenu',e=>{if(document.fullscreenElement===el('learn-stage')||el('learn-stage').classList.contains('presentation')){e.preventDefault();if(LI<LEARN.length-1)showLearn(LI+1)}});
window.addEventListener('resize',fit);window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden){flipStop();showStopPlay();save();}});new ResizeObserver(fit).observe(el('bar'));
el('slide-text').onclick=()=>openDialog('原PPT第'+DECK[SI][1]+'頁原文',`<p>${esc(CONTENT.pptText[DECK[SI][1]])}</p>`);el('hero-image').src=IMG.overview;el('video-external').href=`https://drive.google.com/file/d/${VIDEO_ID}/view?usp=drivesdk`;el('raw-animation').onclick=()=>{const d=openDialog('原始簡報動畫',`<video controls autoplay playsinline style="width:100%" src="${ANIMATION_SRC}"></video>`);d.addEventListener('close',()=>d.querySelector('video')?.pause(),{once:true});};applyPreferences();const start=['learn','play','done'].includes(ST.page)?ST.page:'intro';navigate(start);if(!saving)storageNotice();
</script></body></html>
