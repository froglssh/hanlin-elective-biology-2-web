const CONTENT={"lessons": [{"id": "b2-12-l01", "t": "第一個生命：三種起源假說", "src": "課本 P15；原始簡報第 2 張", "slide": 2, "figSpec": {"flip": [2]}, "txt": "<h3>讀圖與思考</h3><ul><li>神創論將起源歸於超自然或神聖力量。</li><li>外太空起源說主張隕石將生命帶到地球；仍須解釋生命在其他地方如何起源。</li><li>化學演化討論分子如何在特定條件下形成並逐漸組成生命，可設計實驗檢驗其中步驟。</li><li>生源說處理現今生物的來源，沒有直接回答第一個生命如何出現。</li></ul><p class=\"quote\">學者提出的生命起源假說大致包括神創論、外太空起源說與化學演化；化學演化是目前較容易在實驗室內驗證的假說。<small>課本 P15（忠實整理）</small></p>", "tb": [["page0", "課本 P15 完整頁"]], "sec": "s1"}, {"id": "b2-12-l02", "t": "原始地球：材料與能量", "src": "課本 P15；原始簡報第 3 張", "slide": 3, "figSpec": {"flip": [3]}, "txt": "<h3>讀圖與思考</h3><ul><li>地球剛形成時熾熱；早期氫、氦等輕氣體逸散，後續冷卻與火山噴發形成大氣及海洋。</li><li>課本描述後期原始大氣以氮、二氧化碳、水蒸氣為主，另有少量氫、一氧化碳、甲烷、氨及硫化氫。</li><li>頻繁閃電與高能量輻射，是研究化學反應的能量來源。</li><li>實驗所用的氣體混合物是待檢驗模型，不等於已確知所有時期的大氣組成。</li></ul><p class=\"quote\">最早的大氣中有大量氮、二氧化碳與水蒸氣，以及少量其他氣體；閃電頻繁且有高能量輻射。<small>課本 P15（忠實整理）</small></p>", "tb": [["page0", "課本 P15 完整頁"]]}, {"id": "b2-12-l03", "t": "歐帕林與霍爾丹：原生湯假說", "src": "課本 P16；原始簡報第 4 張", "slide": 4, "figSpec": {"pair": ["fig1_5", "fig1_6"]}, "txt": "<h3>讀圖與思考</h3><ul><li>歐帕林在1920年代提出：原始地球環境可使無機物形成有機物，逐漸產生複雜分子。</li><li>霍爾丹提出分子也能演化，有機物累積於原始海洋形成原生湯。</li><li>兩人觀點相近，當時尚缺少實驗證據；提出假說與證實假說是不同階段。</li></ul><p class=\"quote\">有機分子可能累積在原始海洋，形成濃稠的原生湯；地球上第一個生命可能由其中孕育。<small>課本 P16（忠實整理）</small></p>", "tb": [["page1", "課本 P16 完整頁"]], "sec": "s2"}, {"id": "b2-12-l04", "t": "原生湯圖解：從分子到細胞", "src": "課本 P17；原始簡報第 9 張", "slide": 9, "figSpec": {"image": "fig1_7"}, "txt": "<h3>讀圖與思考</h3><ul><li>先辨認原圖上方的起始材料與能量，再沿箭頭向下看。</li><li>小分子有機物逐步聚合成大分子；可攜帶訊息的分子出現。</li><li>膜的區隔、遺傳物質的複製與催化，是邁向初始細胞的重要歷程。</li><li>圖1-7是演化歷程的假說示意，各分子未依實際比例繪製；不能把箭頭當作全部已證實的步驟。</li></ul><p class=\"quote\">圖1-7：原生湯假說。無機物經化學作用形成小分子有機物，小分子聚合成大分子，遺傳物質自我複製與催化產生初始細胞。<small>課本 P17（忠實整理）</small></p>", "tb": [["fig1_7", "課本 P17 圖1-7 完整圖"]]}, {"id": "b2-12-l05", "t": "知識補給站：氣泡模型", "src": "課本 P16；原始簡報第 8 張", "slide": 8, "figSpec": {"flip": [7, 8]}, "txt": "<h3>讀圖與思考</h3><ul><li>此模型回應能源供給與有機物濃度等問題。</li><li>依課本，海底氣泡上升→分子反應→海面破裂與激發→雨水回到海洋→再包埋。</li><li>模型提供可研究的機制，不能據此宣稱已在實驗室生成完整生命。</li></ul><p class=\"quote\">由於原始大氣無法提供穩定而持續的能源，且早期的地球缺乏臭氧層保護，因此「累積足夠濃度的有機物質形成原生湯，進而產生生命」的假說開始受到質疑，科學家們陸續提出新模型加以修正、解釋。例如：1992年科學家提出的「氣泡模型」認為海底火山噴發的氣泡在逐漸上升到海面的過程中，濃縮在氣泡內的甲烷與氨等分子可發生化學反應，形成有機分子。氣泡在海面破裂後釋出的簡單有機分子，可於大氣中進一步受到輻射線與閃電的激發而複雜化，並隨雨水落入海洋，重新被海浪激發出的泡沫包埋。如此重複進行前述程序，可使有機物累積提高濃度，並進一步複雜化，最後形成可產生新生命的原生湯。<small>課本 P16（忠實整理）</small></p>", "tb": [["bubble", "P16 完整知識補給站"]]}, {"id": "b2-12-l06", "t": "米勒與尤里：材料、能量與結果", "src": "課本 P18；原始簡報第 12 張", "slide": 12, "figSpec": {"flip": [12, 13]}, "txt": "<h3>讀圖與思考</h3><ul><li>裝置通入水、氨、甲烷、氫等材料，加熱使水蒸發並循環。</li><li>電極放電模擬閃電；冷凝管將蒸氣冷卻，產物累積在冷卻液。</li><li>一星期後發現胺基酸，支持在特定模擬條件下可非生物合成小分子有機物。</li><li>沒有直接製造細胞或證明生命起源的全部過程。甲烷本身依化學分類也是有機物，不宜將每種起始氣體都稱為無機物。</li></ul><p class=\"quote\">1950年代，米勒與尤里將水、氨、甲烷、氫等可能的原始大氣成分灌入裝置中，加熱並通以電擊；一星期後冷卻液中出現胺基酸。<small>課本 P18（忠實整理）</small></p>", "tb": [["fig1_8", "P18 圖1-8(a)(b) 完整圖"]], "sec": "s3"}, {"id": "b2-12-l07", "t": "卡爾文：不同能源也能檢驗", "src": "課本 P18；原始簡報第 14 張", "slide": 14, "figSpec": {"image": "fig1_9"}, "txt": "<h3>讀圖與思考</h3><ul><li>1960年，以紫外線與γ射線照射可能的原始大氣成分。</li><li>產生胺基酸、脂肪酸、嘌呤與嘧啶等小分子有機物。</li><li>與米勒—尤里比較：改變的是能源形式；都提供有機分子非生物合成的證據。</li></ul><p class=\"quote\">卡爾文以紫外線與γ射線照射可能的原始地球大氣成分，發現可產生多種小分子有機物。<small>課本 P18（忠實整理）</small></p>", "tb": [["page3", "課本 P18 完整頁"]]}, {"id": "b2-12-l08", "t": "福克斯：由小分子到大分子", "src": "課本 P19；原始簡報第 15 張", "slide": 15, "figSpec": {"flip": [15]}, "txt": "<h3>讀圖與思考</h3><ul><li>1958年，將數種胺基酸混合物置於無氧狀態。</li><li>以170°C加熱3小時，冷卻後加水沖洗並靜置。</li><li>隔天發現具肽鏈、類似蛋白質的物質。</li><li>這是大分子形成的證據，不能直接等同功能完整的蛋白質、遺傳系統或活細胞。</li></ul><p class=\"quote\">福克斯將胺基酸混合物在無氧狀態下以170°C加熱3小時，冷卻後加水、靜置；隔天分析發現具肽鏈、類似蛋白質的物質。<small>課本 P19（忠實整理）</small></p>", "tb": [["page4", "課本 P19 完整頁"]]}, {"id": "b2-12-l09", "t": "三組實驗：證據到哪一步？", "src": "課本 P19；原始簡報第 16 張", "slide": 16, "figSpec": {"table": true}, "txt": "<h3>讀圖與思考</h3><ul><li>米勒—尤里：電擊與氣體混合物→胺基酸。</li><li>卡爾文：紫外線／γ射線→多種小分子有機物。</li><li>福克斯：胺基酸、無氧與加熱→具肽鏈的類蛋白質。</li><li>三組實驗為生命所需分子的形成提供可能證據；不能把「分子」的形成直接說成「生命」的形成。</li></ul><p class=\"quote\">米勒—尤里、卡爾文及福克斯實驗，支持在原始地球的模擬條件下可能形成構成生命的有機分子。<small>課本 P19（忠實整理）</small></p>", "tb": []}, {"id": "b2-12-l10", "t": "知識補給站：有機物不等於生物", "src": "課本 P19；原始簡報第 17 張", "slide": 17, "figSpec": {"image": "methane"}, "txt": "<h3>讀圖與思考</h3><ul><li>甲烷CH₄含碳與氫，屬有機物；在沒有生命的地球也可能存在。</li><li>課本列出火山噴發、燃料開採及厭氧微生物代謝等來源，應區分地球早期與現今情境。</li><li>原文的濃度與暖化數字保留為教材刊載值，不作2026年的即時觀測值；濃度會隨時間改變。</li></ul><p class=\"scope-note\">補充：甲烷濃度是隨時間更新的觀測量，查看NOAA的時間序列時需記錄日期與單位。 <a href=\"https://gml.noaa.gov/ccgg/trends_ch4/\" target=\"_blank\" rel=\"noopener noreferrer\">來源 ↗</a></p><p class=\"quote\">根據化學的定義，甲烷分子因含有碳原子與氫原子而被歸屬於有機物，但是事實上甲烷也存在於早期尚無生命的地球上，主要的來源是火山噴發的氣體。1776年，義大利科學家伏打首先在沼澤的淤泥中發現一種可燃的氣體，並將之稱為沼氣。1866年，德國化學家何夫曼才正式將此氣體命名為甲烷（methane）。現今地球的大氣中，甲烷含量大約只占了0.000179%，雖然比例極低，卻是引起全球暖化的重要溫室氣體之一。相同質量下，甲烷在釋放的100年內，對地球造成的暖化影響是二氧化碳的28～34倍，儘管甲烷含量較低，但對全球暖化效應的影響卻占了10～12%。目前地球上甲烷的主要來源為燃料開採與厭氧微生物的代謝活動所釋出，這些厭氧微生物常生存於沼澤、淤泥、動物排泄物、反芻動物腸胃道以及垃圾掩埋場等處。<small>課本 P19（忠實整理）</small></p>", "tb": [["methane", "P19 完整知識補給站"]]}, {"id": "b2-12-l11", "t": "膜的形成：微球體的內與外", "src": "課本 P20；原始簡報第 21 張", "slide": 21, "figSpec": {"image": "fig1_11"}, "txt": "<h3>讀圖與思考</h3><ul><li>課本以磷脂在水中聚集形成微球體，說明原始膜可能如何出現。</li><li>類似脂雙層的界面可區隔內外，包埋有機分子。</li><li>原圖(b)含10μm比例尺；圖像大小不等於實物大小。</li><li>有膜的微球體不等於已具完整代謝與遺傳的細胞，仍須整合其他功能。</li></ul><p class=\"quote\">微球體具有區隔內、外的功能，可在原生湯中將有機分子包埋於球體內；科學家推測其可能是演化出細胞膜的第一步。<small>課本 P20（忠實整理）</small></p>", "tb": [["fig1_11", "P20 圖1-11(a)(b) 含比例尺"]], "sec": "s4"}, {"id": "b2-12-l12", "t": "遺傳分子：資訊還需要複製", "src": "課本 P21；原始簡報第 22 張", "slide": 22, "figSpec": {"flip": [22]}, "txt": "<h3>讀圖與思考</h3><ul><li>蛋白質與核酸可有複雜結構，但不能只憑「複雜」判定遺傳物質。</li><li>核酸由核苷酸序列儲存訊息，互補配對提供複製與傳遞的基礎。</li><li>DNA與RNA都是核酸；哪一類先在早期生命扮演角色，仍需證據與模型。</li></ul><p class=\"quote\">由於蛋白質不具核酸般的配對和複製特性，核酸成為遺傳物質的最佳候選者；核酸能儲存訊息並透過互補配對複製。<small>課本 P21（忠實整理）</small></p>", "tb": [["page6", "課本 P21 完整頁"]]}, {"id": "b2-12-l13", "t": "核糖核酸酵素：RNA也能催化", "src": "課本 P21；原始簡報第 23 張", "slide": 23, "figSpec": {"image": "ribozyme"}, "txt": "<h3>讀圖與思考</h3><ul><li>課本記錄闕克發現具有催化作用的RNA，並介紹ribozyme。</li><li>RNA可結合資訊與催化兩種角色，是RNA世界假說的重要支持。</li><li>並非所有RNA都具有催化或複製能力。</li><li>1989年諾貝爾化學獎由闕克與Sidney Altman共同獲得，表彰RNA催化性質的發現。</li></ul><p class=\"scope-note\">補充：闕克與Altman共同獲得1989年化學獎；教材原文聚焦闕克，這裡補足共同得獎背景。 <a href=\"https://www.nobelprize.org/prizes/chemistry/1989/8988-the-chemistry-of-life-and-its-central-dogma/\" target=\"_blank\" rel=\"noopener noreferrer\">來源 ↗</a></p><p class=\"quote\">生物通常需要酵素方能有效率地催化進行各種代謝活動。一般常見的酵素都是由蛋白質所構成，但是美國學者闕克發現了具有酵素催化作用的RNA酵素分子，取RNA（ribonucleic acid）的英文名稱前半段與酵素（enzyme）的英文名稱後半段，將之命名ribozyme（核糖核酸酵素）。目前科學家已經發現數十種的核糖核酸酵素，有的可以切除RNA分子的多餘部分，有的可以切割與重新組合RNA分子。由於闕克首先發現核糖核酸酵素，開啟了生物學上的一個新紀元，因此榮獲1989年的諾貝爾化學獎。<small>課本 P21（忠實整理）</small></p>", "tb": [["ribozyme", "P21 完整知識補給站"]]}, {"id": "b2-12-l14", "t": "RNA世界：證據與推論分開", "src": "課本 P21；原始簡報第 24 張", "slide": 24, "figSpec": {"flip": [23, 24]}, "txt": "<h3>讀圖與思考</h3><ul><li>部分RNA能催化與複製相關反應，支持早期RNA可能兼具資訊與催化角色。</li><li>2009年研究利用兩種RNA酵素互相催化合成，且需供應寡核苷酸底物；不是從無機物直接製造活細胞。</li><li>DNA較適合穩定保存訊息，蛋白質可提供專一催化功能；課本以逐步分工描繪其演化。</li><li>這是有證據支持的歷程推論，並非所有中間步驟都已被重現。</li></ul><p class=\"scope-note\">補充：Lincoln與Joyce（2009）展示需底物供給的RNA交互複製系統，是遺傳系統的實驗模型。 <a href=\"https://doi.org/10.1126/science.1167856\" target=\"_blank\" rel=\"noopener noreferrer\">來源 ↗</a></p><p class=\"quote\">遺傳物質能自我催化、複製，是產生初始細胞的重要因素；DNA較穩定，蛋白質專一催化系統可能在後續演化中逐步建立。<small>課本 P21（忠實整理）</small></p>", "tb": []}, {"id": "b2-12-l15", "t": "回看全貌：把材料、膜與遺傳連起來", "src": "課本 P17；原始簡報第 11 張", "slide": 11, "figSpec": {"image": "fig1_7"}, "txt": "<h3>讀圖與思考</h3><ul><li>材料：起始分子形成小分子，再形成較複雜的大分子。</li><li>區隔：膜將內外分開，讓化學系統形成可維持的單位。</li><li>延續：遺傳分子能傳遞資訊，催化可讓反應有效進行。</li><li>學習時為每個箭頭寫出「證據」與「尚待解釋之處」，避免用單一實驗代表整段歷程。</li></ul><p class=\"quote\">本節以化學演化與細胞形成的推論，連結生命出現所需的條件。<small>課本 P17（忠實整理）</small></p>", "tb": [["fig1_7", "P17 原生湯完整圖"]], "sec": "s5"}], "questions": [{"t": "化學演化：把歷程排好", "q": "將四個歷程按課本圖1-7的順序放入。", "sub": "課本 P17；依教材設計的操作練習", "kind": "drag", "learn": 3, "layout": "sequence", "slots": [{"id": "s0", "label": "步驟 1"}, {"id": "s1", "label": "步驟 2"}, {"id": "s2", "label": "步驟 3"}, {"id": "s3", "label" document.addEventListener('fullscreenchange',fullscreenSync);document.addEventListener('keydown',e=>{if(e.isComposing||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if(document.querySelector('dialog[open]'))return;const fs=document.fullscreenElement===el('learn-stage')||el('learn-stage').classList.contains('presentation');if(fs){if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();if(LI<LEARN.length-1)showLearn(LI+1);}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();if(LI>0)showLearn(LI-1);}else if(e.key==='Escape')exitLearnFullscreen();return;}if(PAGE==='show'){if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();showStep(1);}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();showStep(-1);}else if(e.key==='Escape')navigate('intro');else if(e.key==='Home'){SI=0;showRender()}else if(e.key==='End'){SI=DECK.length-1;showRender()}return;}if(PAGE==='learn'&&el('flip')){if(e.key==='ArrowRight'){e.preventDefault();flipStop();flipShow(FI+1)}if(e.key==='ArrowLeft'){e.preventDefault();flipStop();flipShow(FI-1)}}});
el('learn-stage').addEventListener('contextmenu',e=>{if(document.fullscreenElement===el('learn-stage')||el('learn-stage').classList.contains('presentation')){e.preventDefault();if(LI<LEARN.length-1)showLearn(LI+1)}});
window.addEventListener('resize',fit);window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden){flipStop();showStopPlay();save();}});new ResizeObserver(fit).observe(el('bar'));
el('hero-image').src=IMG[DECK.filter(d=>d[1]===9).at(-1)[0]];el('video-external').href=`https://drive.google.com/file/d/${VIDEO_ID}/view?usp=drivesdk`;el('raw-animation').onclick=()=>{const d=openDialog('原始簡報動畫',`<video controls autoplay playsinline style="width:100%" src="${ANIMATION_SRC}"></video>`);d.addEventListener('close',()=>d.querySelector('video')?.pause(),{once:true});};applyPreferences();const start=['learn','play','done'].includes(ST.page)?ST.page:'intro';navigate(start);if(!saving)storageNotice();
</script></body></html>
