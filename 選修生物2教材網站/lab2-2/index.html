tions", "figCaption": "課本 P64；原PPT第 10 頁", "kind": "reflection", "original": true, "sourceSlide": 10, "reflectionLabel": "我的觀察與討論（保存文字，不自動評分）", "reflectionPlaceholder": "材料名稱／器官／方法：\n旱生植物：所見構造、功能推論、證據\n中生植物：所見構造、比較基礎\n水生植物：生活型、所見構造、功能推論\n觀察限制與待查項目：", "reviewPrompts": ["有分清觀察、預測與教材參考嗎？", "有以具體構造連結可能功能嗎？", "有記下材料生活型與待查項目嗎？"], "id": "b2-a22-q08"}], "tags": {"environment": ["環境分類", "依水分供給區分，並辨認浮葉與沉水差異。", "P62–63；PPT3–5"], "function": ["構造與功能", "肉質儲水；大空腔利於通氣；例子不代表所有植物。", "P63、65；PPT6、11"], "method": ["觀察與記錄", "先外形、再內部；保持器官與方法可比較。", "P64；PPT7–9"], "evidence": ["證據與限制", "實測與預測分開；依比例尺判讀，困難時再求證。", "P64–65；PPT9–11"]}, "conceptMap": {"environment": 2, "function": 5, "method": 7, "evidence": 9}, "pptText": {"1": "探討活動 \n2-2 \n營養構造的形態適應與特化\n前言\n       在認識組成植物體的薄壁、厚角及厚壁細胞之特性後，將此概念應用在觀察植物多樣化的營養構造上，你是否能更了解植物的特化構造對其適應環境有何幫助？\n配合課本 \nP62\n1", "2": "探討活動 \n2-2 \n營養構造的形態適應與特化\n目的\n       本活動以常見的中生植物為基礎，比較旱生植物與水生植物的特化構造，藉以探討其可能具有的適應功能。\n2\n配合課本 \nP62", "3": "探討活動 \n2-2 \n營養構造的形態適應與特化\n原理\n◆ 植物可依其生長環境中水分供給量的多寡而區分為旱生植物、中生植物及水生植物\n◇ 旱生植物生長在長期缺水的環境，如蘆薈、石蓮等\n石蓮\n蘆薈\n3\n配合課本 \nP62", "4": "探討活動 \n2-2 \n營養構造的形態適應與特化\n◇ 中生植物生長在水分供給量適中的環境，如百合、向日葵等多數常見的植物\n向日葵\n百合\n配合課本 \nP62\n、\n63\n4", "5": "探討活動 \n2-2 \n營養構造的形態適應與特化\n◇ 水生植物則長期浸在水中，如睡蓮、水蘊草等\n睡蓮\n水蘊草\n5\n配合課本 \nP62\n、\n63", "6": "探討活動 \n2-2 \n營養構造的形態適應與特化\n◆ \n植物的根、莖及葉等營養器官可能有不同的形態，利於適應水分供給量不同的環境\n◇ 多肉植物的根、莖或葉呈現肉質，利於儲存水分\n◇ 部分植物體浮在水面的睡蓮，其莖或葉中通常有較大的空腔，利於交換與疏通氣體\n◇ 整個植株沉浸在水中的水蘊草，其莖、葉的構造則不發達，尤其是維管束組織系統\n配合課本 \nP63\n6", "7": "探討活動 \n2-2 \n營養構造的形態適應與特化\n器材\n每組使用\n修枝剪\n1\n 支\n放大鏡\n1\n 支\n單面刀片\n1\n 片\n鑷子\n1\n 支\n燒杯或培養皿\n1\n 個\n蒸餾水\n1\n 瓶\n載玻片\n數片\n蓋玻片\n數片\n複式顯微鏡\n1\n 臺\n旱生、中生及水生植物的莖和葉\n各 \n1\n 株\n配合課本 \nP64\n7", "8": "探討活動 \n2-2 \n營養構造的形態適應與特化\n步驟\n觀察旱生、中生及水生植物的莖和葉外形結構與特徵，並列表比較。\n配合課本 \nP64\n8", "9": "探討活動 \n2-2 \n營養構造的形態適應與特化\n有些構造可能有維管束退化的情況，遇到困難時，建議先討論再查閱相關資料求證。\n註\n取三類植物的莖和葉，用刀片或修枝剪切下適當大小的片段，以放大鏡觀察莖和葉中是否有許多堅硬的厚\n壁細胞？\n或是多為軟或肉質的薄\n壁細胞？\n必要時可用徒手切片法製成水埋玻片標本。方法參見探討活動 \n2–1\n。\n配合課本 \nP64\n9", "10": "探討活動 \n2-2 \n營養構造的形態適應與特化\n旱生、中生及水生植物分別有哪些構造是對該植物有利的適應？根據紀錄結果，討論可能的理由為何。\n討論\n答\n：\n參考\n所觀察外部形態與內部構造的結果，旱生與水生植物的生長限制因子分別為水或空氣，故其構造的特化與水或空氣的保存有關。\n建議參考本實驗原理進行討論。\n配合課本 \nP64\n10", "11": "探討活動 \n2-2 \n營養構造的形態適應與特化\n睡蓮\n百合\n蘆薈\n配合課本 \nP65\n11"}, "originalCount": 1};

function fit(){if(fitPending)return;fitPending=true;requestAnimationFrame(()=>{fitPending=false;const bar=el('bar'),h=bar.classList.contains('hidden')?0:Math.ceil(bar.getBoundingClientRect().height);if(document.documentElement.style.getPropertyValue('--barh')!==h+'px')document.documentElement.style.setProperty('--barh',h+'px');
 if(PAGE==='learn')fitLesson();
 if(PAGE==='play'&&innerWidth>900){const panel=el('question-panel'),top=panel.getBoundingClientRect().top,fb=el('question-feedback').getBoundingClientRect().height,available=innerHeight-h-top-fb-26;
 const layout=panel.querySelector('.fill-layout'),rail=panel.querySelector('.reference-rail'),img=rail?.querySelector('img');if(img){const ratio=img.naturalWidth/img.naturalHeight||1;for(let pass=0;pass<3;pass++){const caption=rail.querySelector('p').getBoundingClientRect().height+8,width=Math.min(Math.min(STAGES[QI].imageWidth||440,panel.clientWidth-380),Math.max(80,(available-caption)*ratio));if(Math.abs(rail.getBoundingClientRect().width-width)<.1)break;layout.style.setProperty('--reference-width',width+'px');}}
 const match=panel.querySelector('.matching-figure img');if(match){match.style.maxHeight=Math.max(140,available-30)+'px';}
 const organ=panel.querySelector('.organ-grid');if(organ)organ.style.setProperty('--organ-height',Math.max(90,Math.min(230,available-130))+'px');
 const rf=panel.querySelector('.reflection-layout');if(rf){rf.style.setProperty('--reflection-image-height',Math.max(100,available-30)+'px');const label=rf.querySelector('label').getBoundingClientRect().height,guidance=rf.querySelector('.reflection-guidance').getBoundingClientRect().height;rf.style.setProperty('--reflection-field-height',Math.max(100,available-label-guidance-22)+'px');}
 const graph=panel.querySelector('.graph-question');if(graph){graph.style.setProperty('--graph-height',Math.max(80,Math.min(245,available-46))+'px');graph.style.setProperty('--stimulus-height',Math.max(55,Math.min(110,available-132))+'px');}
 const choice=panel.querySelector('.choice-layout img');if(choice){choice.style.maxHeight=Math.max(140,available-30)+'px';}
 } });}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{returnQuestion=PAGE==='play'&&b.dataset.page==='learn';navigate(b.dataset.page)});
el('continue-learn').onclick=()=>navigate('learn',LI);el('back-question').onclick=()=>navigate('play',QI);el('learn-fullscreen').onclick=enterLearnFullscreen;el('fs-exit').onclick=exitLearnFullscreen;
for(const id of ['l-prev','fs-prev'])el(id).onclick=()=>LI>0&&showLearn(LI-1);for(const id of ['l-next','fs-next'])el(id).onclick=()=>LI<LEARN.length-1&&showLearn(LI+1);
el('related-slide').onclick=()=>openShow(DECK.findIndex(d=>d[1]===+(LEARN[LI].src.match(/第 (\d+)/)?.[1]||1)));
el('hint-toggle').setAttribute('aria-haspopup','dialog');el('hint-toggle').onclick=()=>{el('hint-toggle').setAttribute('aria-expanded','true');const d=openDialog('思考提示',`<p>${esc(STAGES[QI].hint)}</p>`);d.addEventListener('close',()=>el('hint-toggle').setAttribute('aria-expanded','false'),{once:true});};el('reference-btn').onclick=()=>openReferences(STAGES[QI]);el('question-learn').onclick=()=>{returnQuestion=true;navigate('learn',STAGES[QI].learn)};el('q-jump').onchange=e=>showQuestion(+e.target.value);el('prev-btn').onclick=()=>QI>0&&showQuestion(QI-1);el('skip-btn').onclick=()=>QI<STAGES.length-1?showQuestion(QI+1):navigate('done');el('check-btn').onclick=check;el('reset-btn').onclick=resetQuestion;el('finish-btn').onclick=()=>navigate('done');
el('shsel').innerHTML=[...new Set(DECK.map(d=>d[1]))].map(n=>`<option value="${n}">第 ${n} 頁 · ${esc(DECK.find(d=>d[1]===n)[2].slice(0,22))}</option>`).join('');el('shsel').onchange=e=>{showStopPlay();SI=DECK.findIndex(d=>d[1]===+e.target.value);showRender();};el('shprev').onclick=()=>showStep(-1);el('shnext').onclick=()=>showStep(1);el('shplay').onclick=()=>{if(SPLAY)showStopPlay();else{if(SI===DECK.length-1)SI=0;showRender();SPLAY=setInterval(()=>{if(SI>=DECK.length-1){showStopPlay();return;}SI++;showRender()},2600);el('shplay').textContent='⏸ 暫停';}};el('shfs').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else el('show').requestFullscreen?.().catch(()=>{el('shfs').textContent='此瀏覽器不支援原生全螢幕'})};el('shclose').onclick=()=>navigate('intro');
el('theme-toggle').onclick=()=>{ST.theme=ST.theme==='dark'?'light':'dark';applyPreferences();save();};el('font-toggle').onclick=()=>{ST.font=(ST.font+1)%3;applyPreferences();save();fit();};function applyPreferences(){document.documentElement.dataset.theme=ST.theme;document.documentElement.style.setProperty('--text',[20,22,24][ST.font]+'px');document.documentElement.dataset.font=ST.font;el('theme-toggle').setAttribute('aria-pressed',String(ST.theme==='dark'));el('font-toggle').title='文字大小 '+[20,22,24][ST.font]+'px';}
document.addEventListener('fullscreenchange',fullscreenSync);document.addEventListener('keydown',e=>{if(e.isComposing||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if(document.querySelector('dialog[open]'))return;const fs=document.fullscreenElement===el('learn-stage')||el('learn-stage').classList.contains('presentation');if(fs){if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();if(LI<LEARN.length-1)showLearn(LI+1);}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();if(LI>0)showLearn(LI-1);}else if(e.key==='Escape')exitLearnFullscreen();return;}if(PAGE==='show'){if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();showStep(1);}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();showStep(-1);}else if(e.key==='Escape')navigate('intro');else if(e.key==='Home'){SI=0;showRender()}else if(e.key==='End'){SI=DECK.length-1;showRender()}return;}if(PAGE==='learn'&&el('flip')){if(e.key==='ArrowRight'){e.preventDefault();flipStop();flipShow(FI+1)}if(e.key==='ArrowLeft'){e.preventDefault();flipStop();flipShow(FI-1)}}});
el('learn-stage').addEventListener('contextmenu',e=>{if(document.fullscreenElement===el('learn-stage')||el('learn-stage').classList.contains('presentation')){e.preventDefault();if(LI<LEARN.length-1)showLearn(LI+1)}});
window.addEventListener('resize',fit);window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden){flipStop();showStopPlay();save();}});new ResizeObserver(fit).observe(el('bar'));
el('slide-text').onclick=()=>openDialog('原PPT第'+DECK[SI][1]+'頁原文',`<p>${esc(CONTENT.pptText[DECK[SI][1]])}</p>`);el('hero-image').src=IMG.overview;el('video-external').href=`https://drive.google.com/file/d/${VIDEO_ID}/view?usp=drivesdk`;el('raw-animation').onclick=()=>{const d=openDialog('原始簡報動畫',`<video controls autoplay playsinline style="width:100%" src="${ANIMATION_SRC}"></video>`);d.addEventListener('close',()=>d.querySelector('video')?.pause(),{once:true});};applyPreferences();const start=['learn','play','done'].includes(ST.page)?ST.page:'intro';navigate(start);if(!saving)storageNotice();
