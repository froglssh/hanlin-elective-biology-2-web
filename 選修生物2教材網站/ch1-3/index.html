const CONTENT={"lessons": [{"id": "b2-13-l01", "t": "生命多樣化：四條交織的線索", "src": "課本 P22；原簡報第 1、2 頁", "slide": 1, "figSpec": {"flip": [1, 2]}, "txt": "<h3>從第一個細胞到多樣生命</h3><ul><li><b>營養：</b>如何取得有機物？</li><li><b>能量：</b>如何由分解反應取得可用能量？</li><li><b>構造：</b>細胞內如何區隔反應？</li><li><b>細胞數：</b>如何形成分工合作？</li></ul><p>這四條線索相互影響，不是所有生物都沿同一條階梯前進。現存原核、單細胞與厭氧生物仍是多樣生命的重要成員。</p><div class=\"quote\">從第一個細胞出現，到現今種類繁多的物種，每個生物體都是生命形式多樣化歷史的一部分。雖然第一個細胞如何形成、如何得到能量以及如何形成遺傳密碼等問題仍多屬未知，但化石資料已顯示生命演化初期的一些重要事實。<small>課本 P22／原簡報（節錄）</small></div><div class=\"quote\"><b>原簡報第1頁文字</b><p>1-3  生命形式的多樣化 1-3.1  細胞營養方式的 演化 —— 由 異營至自營 1-3.2  細胞產生能量的 演化 —— 由 無氧至有氧 1-3.3   細胞 構造的 變化 —— 由 原核到真核 1-3.4  細胞數的 變化 —— 由 單細胞到多細胞 1</p></div><div class=\"quote\"><b>原簡報第2頁文字</b><p>1-3  生命形式的多樣化        從第一個細胞出現，到現今種類繁多的物種，每個生物體都是生命形式多樣化歷史的一部分。雖然許多關於生命起源的問題仍屬未知，但化石資料已顯示一些重要事實 。 配合課本  P22 2</p></div>", "tb": [["pdf22", "課本 P22 完整頁面"]], "sec": "s1"}, {"id": "b2-13-l02", "t": "原始環境：自由氧與臭氧的角色", "src": "課本 P22；原簡報第 3、4 頁", "slide": 3, "figSpec": {"flip": [3, 4]}, "txt": "<h3>環境限定了生存條件</h3><p>課本以原始大氣缺乏自由氧、臭氧層尚未建立的情境，說明早期生命面對的環境。臭氧能吸收部分紫外線；缺乏保護會改變地表有機分子與生物的生存條件。</p><p>原始大氣的組成與演變須靠地質證據推估，不能把教材簡化圖當成已精確測得的全部歷史。</p><div class=\"quote\">經過數十億年的變遷，現今的地球環境與初形成時相差極大。初始的大氣層厚度為現今的一半，沒有氧氣，大氣層上方也沒有臭氧層保護，使得紫外線輻射長驅直入到地表。<small>課本 P22／原簡報（節錄）</small></div><div class=\"quote\"><b>原簡報第3頁文字</b><p>1-3.1  細胞營養方式的 演化 —— 由 異營至自營 現今的地球環境， 經過數十億年的變遷，與初形成時相差極大。 配合課本  P22 3</p></div><div class=\"quote\"><b>原簡報第4頁文字</b><p>       初始的大氣層厚度為現今的一半，沒有氧氣。 1-3.1  細胞營養方式的 演化 —— 由 異營至自營        大氣層上方也沒有臭氧層保護，紫外線輻射可長驅直入到地表。 配合課本  P22 4</p></div>", "tb": [["pdf22", "課本 P22 完整頁面"]]}, {"id": "b2-13-l03", "t": "異營：先取用環境中的有機物", "src": "課本 P22；原簡報第 5 頁", "slide": 5, "figSpec": {"flip": [5]}, "txt": "<h3>判斷有機物的來源</h3><p><b>異營</b>是取用外界已有的有機物作為碳源。課本的早期異營模型假設，化學演化先累積了可供利用的有機物。</p><p>「異營」描述營養／碳的來源；它不等同於「一定無氧」。現今許多異營生物能行有氧呼吸。</p><div class=\"quote\">原始的地球環境中，可以累積從化學演化所產生的許多有機物，因此早期的生物可直接攝取這些環境中自然形成的有機物，並從中獲取能量，這種代謝方式稱為異營。<small>課本 P22／原簡報（節錄）</small></div><div class=\"quote\"><b>原簡報第5頁文字</b><p>1-3.1  細胞營養方式的 演化 —— 由 異營至自營        原 始的地球環境中，可累積從化學演化所產生的許多有機物 。        早期的生物 直接攝取這些有機物 ，並從中獲取能量，這種代謝方式稱為 異營 。 配合課本  P22 5</p></div>", "tb": [["pdf22", "課本 P22 完整頁面"]]}, {"id": "b2-13-l04", "t": "自營：讓有機物有新的來源", "src": "課本 P22；原簡報第 6、7、8 頁", "slide": 6, "figSpec": {"flip": [6, 7, 8]}, "txt": "<h3>資源減少與新的代謝方式</h3><p>依課本模型：環境改變、有機物合成減緩，加上生物消耗，使可取用的有機物減少。</p><p><b>自營</b>生物能以無機碳來源合成有機物；能量可來自光或化學反應。不是每種自營方式都會釋放氧氣。</p><p>自營生物供應有機物，讓食物與代謝關係更豐富。「為適應而演化」是群體經長期演化的結果，並非個體因需要就立即獲得新能力。</p><div class=\"quote\">然而隨著地球環境的改變，有機物合成的速率逐漸減緩，更多生物的出現也加速有機物的消耗，使得生物愈來愈難自外界直接獲取有機物，因此演化出能自行從無機物合成有機物的生物，以適應新的環境，此種代謝方式稱為自營。由於自營生物的出現，使有機物的供應有了穩定的來源，因此生物的代謝方式更形多元，也促進了地球上生物的多樣化。<small>課本 P22／原簡報（節錄）</small></div><div class=\"quote\"><b>原簡報第6頁文字</b><p>1-3.1  細胞營養方式的 演化 —— 由 異營至自營        然而隨著地球環境的改變，有機物合成的速率逐漸減緩，更多生物的出現也加速有機物的消耗 。 配合課本  P22 6</p></div><div class=\"quote\"><b>原簡報第7頁文字</b><p>       因此演化出能 自行從無機物合成有機物 的生物，此種代謝方式稱為 自營 。 1-3.1  細胞營養方式的 演化 —— 由 異營至自營 配合課本  P22 7</p></div><div class=\"quote\"><b>原簡報第8頁文字</b><p>1-3.1  細胞營養方式的 演化 —— 由 異營至自營        由於自營生物的出現，使有機物的供應有了穩定的來源，因此生物的代謝方式更形多元，也促進了地球上生物的多樣化。 配合課本  P22 8</p></div>", "tb": [["pdf22", "課本 P22 完整頁面"]]}, {"id": "b2-13-l05", "t": "無氧產能：糖解作用的線索", "src": "課本 P23；原簡報第 9 頁", "slide": 9, "figSpec": {"flip": [9]}, "txt": "<h3>糖解不需直接消耗氧氣</h3><p>在早期缺乏氧氣的情境中，生物仍需由分解有機物取得能量。糖解作用把葡萄糖轉成丙酮酸；簡報顯示淨得 <b>2 ATP</b> 及 NADH。</p><p>糖解也存在於行有氧呼吸的細胞中，並非只屬於厭氧生物。「無氧產能代謝」是廣義描述，勿把糖解、發酵與嚴格定義的無氧呼吸完全混同。</p><div class=\"quote\">早期的地球大氣中並無氧氣，最初生物應是以無氧的方式將有機物加以分解，而獲取能量來進行代謝反應，例如：糖解作用被認為是最早出現在細胞中的代謝途徑之一。<small>課本 P23／原簡報（節錄）</small></div><div class=\"quote\"><b>原簡報第9頁文字</b><p>1-3.2  細胞產生能量的 演化 —— 由 無氧至有氧 → 例如 ： 糖解作用 被認為是最早出現在細胞中的代謝途徑之一 葡萄糖 丙酮酸 2 2( ADP+Pi ) 2ATP 2NAD + 2NADH ◆  原始 大氣並無氧氣，最初生物是以 無氧 的方式將 有機物加以 分解，而獲取能量 配合課本  P23</p></div>", "tb": [["pdf23", "課本 P23 完整頁面"]], "sec": "s2"}, {"id": "b2-13-l06", "t": "疊層石：從構造讀出生命線索", "src": "課本 P23；原簡報第 10 頁", "slide": 10, "figSpec": {"pair": ["strom-a", "strom-b"]}, "txt": "<h3>照片與層狀構造</h3><p>左圖(a)是澳洲西部疊層石；右圖(b)呈現層狀構造。課本用它們連結早期微生物與地質紀錄。</p><p>課本以約 <b>35 億年前</b> 描述類似藍綠菌的早期生命線索。但疊層構造本身不等於已直接證明當時一定有產氧光合作用；不同證據的判讀仍須區分。</p><p class=\"scope-note\">延伸查證：<a href=\"https://pubmed.ncbi.nlm.nih.gov/19564621/\" target=\"_blank\" rel=\"noopener noreferrer\">疊層石與光合作用的研究</a>。</p><div class=\"quote\">圖1－13：(a)澳洲西部的疊層石，因發現有生存於35億年前、類似藍綠菌的化石而受人注意。(b)疊層石是由海底沉澱物堆積成的層狀構造。<small>課本 P23／原簡報（節錄）</small></div><div class=\"quote\"><b>原簡報第10頁文字</b><p>◆  35  億年 前，出現了可進行光合作用並 產生氧氣 的 生物 1-3.2  細胞產生能量的 演化 —— 由 無氧至有氧 疊層石是由海底沉澱物堆積成的層狀構造 澳洲 西部的疊層石 ，其中發現生存於 35  億年 前、類似藍綠菌的化石 配合課本  P23</p></div>", "tb": [["fig13", "課本圖1-13完整雙圖與圖說"], ["pdf23", "課本 P23 完整頁面"]]}, {"id": "b2-13-l07", "t": "氧氣累積：傷害與新機會", "src": "課本 P23；原簡報第 11 頁", "slide": 11, "figSpec": {"flip": [11]}, "txt": "<h3>環境變化不是對所有生物都有利</h3><p>產氧光合作用釋出氧氣；當氧氣得以累積，對許多厭氧生物形成壓力。課本以約 <b>20 億年前</b> 的「氧氣大災難」概括這段歷程。</p><ul><li>部分厭氧生物留在低氧或無氧環境。</li><li>部分生物具有耐受氧氣傷害的機制。</li><li>有氧呼吸利用氧氣，整體產能效率較高。</li></ul><p>產氧光合作用提供氧氣；有氧呼吸利用氧氣，兩者不是同一反應，也不代表所有生物都必須行有氧呼吸。</p><div class=\"quote\">直到大約35億年前，出現可進行產氧光合作用的生物。由於這些生物的光合作用會持續釋放出氧氣，在距今約20億年前，光合作用產生的氧氣得以在大氣中累積，對當時許多厭氧的生物產生傷害，造成了所謂的「氧氣大災難」。倖存的厭氧生物有的只能存活於無法累積氧氣的角落，有的則發展出可以忍受氧氣傷害的機制，後來更演化出可以利用氧氣行有氧呼吸的好氧性生物，來適應此新環境。事實上，有氧呼吸的產能效率較高於無氧的產能代謝，因此經過長期的演化，逐漸成為大多數生物獲取細胞代謝能量的主要方式。<small>課本 P23／原簡報（節錄）</small></div><div class=\"quote\"><b>原簡報第11頁文字</b><p>◆ 厭氧生物只能存活於無法累積氧氣的角落 ◆  產氧生物光合作用 所釋出的氧氣會在大氣中累積，對厭氧生物產生傷害，造成了「氧氣大災難」 1-3.2  細胞產生能量的 演化 —— 由 無氧至有氧 ◆ 有氧呼吸的產能效率遠高於無氧的產能代謝，因此演化 成 為大多數生物獲取代謝能量的主要方式 ◆   有些 生物發展出可以 忍受氧氣傷害的機制 ，後來更演化出 能利用氧氣行有氧呼吸 的 好氧性生物 ，來適應此新環境 配合課本  P23</p></div>", "tb": [["pdf23", "課本 P23 完整頁面"]]}, {"id": "b2-13-l08", "t": "腦力激盪：今天還能出現新生命嗎？", "src": "課本 P23；原簡報第 12 頁", "slide": 12, "figSpec": {"flip": [12]}, "txt": "<h3>形成有機物 ≠ 完成生命起源</h3><p>原簡報指出，部分海底火山口及高溫無氧溫泉可能提供某些類似條件，但「條件相似」還不足以證明新生命正在形成。</p><ul><li>現存生物可能消耗新形成的有機物，妨礙長期累積。</li><li>含氧環境會改變、破壞部分分子的累積條件。</li></ul><p>課本的回答是現今不太可能重演遠古的完整歷程。回答時請區分：有機物合成、可累積的環境，以及能遺傳與演化的系統。</p><div class=\"quote\">你認為現今的地球環境是否能夠重複進行初始的化學演化，並持續產生新生命呢？原因為何？<small>課本 P23／原簡報（節錄）</small></div><div class=\"quote\"><b>原簡報第12頁文字</b><p>   腦力激盪 　　你 認為現今的地球環境是否能夠重複進行初始的化學演化，並持續產生新生命呢？原因為何？ 答 ： 科學家發現，在大洋海底的火山口與一些高溫無氧的溫泉中有跟初始地球環境類似的條件，因此有些科學家相信這種化學演化可能仍在進行。但是要產生新生命必須克服兩大 障礙 ： ( 1) 被現存生物所捕食，經化學演化產生的有機分子沒有機會累積成原生湯。 (2) 這些有機分子受到環境中氧氣的強烈作用而被分解。因此多數科學家認為現今不太可能重複遠古產生第一個生命的歷程。 配合課本  P23 12</p></div>", "tb": [["pdf23", "課本 P23 完整頁面"]]}, {"id": "b2-13-l09", "t": "膜內陷模型：區隔細胞內反應", "src": "課本 P24；原簡報第 13 頁", "slide": 13, "figSpec": {"image": "fig14"}, "txt": "<h3>核膜與內質網的來源模型</h3><p>依課本圖1-14，細胞膜內陷並摺疊，形成細胞內的膜，進一步形成內質網與核膜。</p><p>具有核膜的細胞可把複製、轉錄與細胞質中其他反應分隔。這是解釋內膜系統起源的模型，不能據此認定真核起源所有事件的先後已完全確定。</p><p>圖中的核膜／內質網形成，與細菌內共生成為粒線體或葉綠體是不同的問題。</p><div class=\"quote\">在演化的歷程中，原核生物的細胞膜首先向內凹陷，形成許多膜狀構造，這些膜狀構造可能包圍住遺傳物質DNA，進而演化為具有雙層細胞核膜的真核細胞。因此真核細胞的遺傳物質可在細胞核內進行複製與轉錄，而不至於受到細胞質中其他酵素或化學反應的干擾。<small>課本 P24／原簡報（節錄）</small></div><div class=\"quote\"><b>原簡報第13頁文字</b><p>◆ 真核細胞的化學反應可在區隔的空間中進行，不至於受到細胞質中其他化學反應的干擾 1-3.3   細胞 構造的 變化 — — 由 原核到真核 ◆ 原核細胞 的 細胞膜向內凹陷，包圍住遺傳 物質  DNA ， 進而演化 成 真核細胞 原核細胞 DNA 細胞質 細胞膜 形成細胞內的膜 內質網 核膜 形成內 質 網 及 核 膜 真核細胞 細胞核和內膜系統 配合課本  P24 細胞膜內陷並摺疊</p></div>", "tb": [["pdf24", "課本 P24 完整頁面"]], "sec": "s3"}, {"id": "b2-13-l10", "t": "內共生的線索：胞器像哪些細菌？", "src": "課本 P24；原簡報第 14 頁", "slide": 14, "figSpec": {"flip": [14]}, "txt": "<h3>多項相似性共同支持解釋</h3><ul><li><b>粒線體：</b>與好氧性細菌有演化關聯。</li><li><b>葉綠體：</b>與藍綠菌有演化關聯。</li><li>雙層膜、自身DNA、分裂方式與序列相似性，是教材列出的支持線索。</li></ul><p>相似不是單一特徵的證明；分子序列與多項特徵要一起比較。胞器可表達部分自身基因，但大量蛋白質由細胞核基因編碼，並不代表能離開宿主獨立生活。</p><div class=\"quote\">除了細胞核，真核細胞亦具有粒線體，可行光合作用的真核細胞還具有葉綠體。粒線體的許多特徵類似好氧性細菌，而葉綠體則類似藍綠菌，例如：葉綠體和粒線體皆有雙層膜與獨立的DNA、DNA序列也分別與好氧菌與藍綠菌的DNA序列有較高的相似性，此外，粒線體與葉綠體的複製方式較類似原核細胞，與真核細胞本身的分裂方式較不同。<small>課本 P24／原簡報（節錄）</small></div><div class=\"quote\"><b>原簡報第14頁文字</b><p>◇  雙層膜 1-3.3   細胞 構造的變化 —— 由原核到真核 粒線體和葉綠體 → 具 環狀  DNA ，   DNA  序列 與原核細胞較相似 →  複製、分裂方式與原核細胞 較 相似 ◆  相似點 ： ◇ 有許多特徵和原核細胞 相似（  粒 線體 似 好氧菌 ， 葉綠體 似 藍綠 菌  ） →  具核糖體 →  可轉錄、轉譯小部分自身蛋白質 配合課本  P24</p></div>", "tb": [["pdf24", "課本 P24 完整頁面"]]}, {"id": "b2-13-l11", "t": "內共生：被吞入，然後長期共存", "src": "課本 P24；原簡報第 15 頁", "slide": 15, "figSpec": {"flip": [15]}, "txt": "<h3>瑪格麗斯所提倡的內共生解釋</h3><p>宿主與被吞入的細菌建立穩定的共生關係，經長期演化及基因整合，形成胞器。</p><ul><li>好氧性細菌的內共生與粒線體起源有關。</li><li>藍綠菌的內共生與葉綠體起源有關。</li></ul><p>「吞入」不等於立即變成胞器；單純消化、暫時共處或兩種細菌在環境中共存，都不等同教材所指的穩定內共生。</p><div class=\"quote\">美國生物學家瑪格麗斯提倡內共生假說，認為好氧菌被宿主細胞吞入，經過長久的演化逐漸轉變為穩定的共生現象而形成粒線體，藍綠菌被吞入後共生而長期演化成葉綠體，此觀點已被廣為接受。<small>課本 P24／原簡報（節錄）</small></div><div class=\"quote\"><b>原簡報第15頁文字</b><p>1-3.3   細胞 構造的變化 —— 由原核到真核 粒線體和葉綠體 ◆ 內共生假說 ： ◇  美國 生物學家 瑪格麗斯 瑪格麗斯 ◇  真核細胞始祖 → 吞入 好氧菌 ，經長期 演  化 轉變為共生現象， 而  形成 粒線體 → 吞入 藍綠 菌 ，經長期 演  化 轉變為共生現象， 而  形成 葉綠體 配合課本  P24</p></div>", "tb": [["pdf24", "課本 P24 完整頁面"]]}, {"id": "b2-13-l12", "t": "三種路徑：比較事件先後", "src": "課本 P25；原簡報第 16 頁", "slide": 16, "figSpec": {"image": "fig15"}, "txt": "<h3>先辨認共同事件，再比較差異</h3><ul><li><b>路徑1：</b>粒線體內共生發生在膜狀胞器尚未出現的早期。</li><li><b>路徑2：</b>內膜形成後發生內共生。</li><li><b>路徑3：</b>細胞核與內膜系統形成，才發生內共生。</li></ul><p>三條路徑皆連向具有粒線體的真核細胞；差別在事件時序。課本將它們稱為假設，不能只憑箭頭圖認定某條路徑是已證實的唯一歷史。</p><p class=\"scope-note\">研究脈絡：<a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC4292153/\" target=\"_blank\" rel=\"noopener noreferrer\">真核起源與粒線體取得時序</a>。</p><div class=\"quote\">真核生物的起源是生物學中的一大謎題，科學家提出真核細胞演化的三種假設路徑，這些假設各自擁有科學證據與觀點，幫助我們深入了解真核細胞的複雜起源，並為未來的研究提供了豐富的線索和啟示。<small>課本 P25／原簡報（節錄）</small></div><div class=\"quote\"><b>原簡報第16頁文字</b><p>◇ 科學家提出三種 演化路徑假設 ： 原核細胞 真核細胞 好氧菌 粒線 體內共生體 配合課本  P25 路徑① 路徑② 路徑③</p></div>", "tb": [["fig15", "課本圖1-15完整路徑圖"], ["pdf25", "課本 P25 完整頁面"]]}, {"id": "b2-13-l13", "t": "葉綠體的取得：真核生命再分支", "src": "課本 P25；原簡報第 17 頁", "slide": 17, "figSpec": {"flip": [17]}, "txt": "<h3>內共生讓代謝能力增加</h3><p>圖1-15下方從真核細胞分出兩支：未取得葉綠體的異營真核細胞始祖，以及經藍綠菌內共生而取得葉綠體的自營真核細胞始祖。</p><p>兩支圖中的細胞都已有粒線體；有葉綠體不代表不需要呼吸作用。此圖描述胞器取得的模型，沒有要求每個現存真核生物都保有葉綠體。</p><div class=\"quote\">圖1－15：真核細胞演化的三種假設路徑。圖示藍綠菌內共生形成葉綠體，連向自營真核細胞始祖。<small>課本 P25／原簡報（節錄）</small></div><div class=\"quote\"><b>原簡報第17頁文字</b><p>異營真核細胞始祖 自營真核細胞始祖 葉綠體 藍綠菌 配合課本  P25</p></div>", "tb": [["fig15", "課本圖1-15完整分支"], ["pdf25", "課本 P25 完整頁面"]]}, {"id": "b2-13-l14", "t": "從假說到學說：證據也要檢核", "src": "課本 P24；原簡報第 18、19 頁", "slide": 18, "figSpec": {"flip": [18, 19]}, "txt": "<h3>重點是充分且一致的證據</h3><p>原簡報把證據分成形態功能與分子生物學兩類。可比較膜、分裂、基因與核糖體，再檢查替代解釋。</p><p>來源畫面的「皆為環狀DNA、70S核糖體、無內含子」不能當成所有胞器的絕對通則。粒線體已演化出多樣結構，例如人體粒線體核糖體為55S，酵母為74S。</p><p>支持內共生不等於每項胞器特徵與細菌完全相同；基因轉移、丟失與後續演化也必須納入解釋。</p><p class=\"scope-note\"><a href=\"https://www.nature.com/articles/s41586-022-05621-0\" target=\"_blank\" rel=\"noopener noreferrer\">粒線體核糖體的原始研究</a>；<a href=\"https://www.nature.com/articles/nature14963\" target=\"_blank\" rel=\"noopener noreferrer\">內共生後基因的演化</a>。</p><div class=\"quote\">有關真核細胞粒線體與葉綠體的起源，最初曾認為這些胞器是在細胞自身演化過程中產生的。然而，現今科學界已普遍接受瑪格麗斯提出的內共生假說，並將其發展為內共生學說。從假說被廣泛接受並轉變為學說，必須依賴充分的科學證據，除了課文中所提到的內容外，你還能查詢並蒐集到其他更多的證據嗎？<small>課本 P24／原簡報（節錄）</small></div><div class=\"quote\"><b>原簡報第18頁文字</b><p>   腦力激盪 　　有關 真核細胞粒線體與葉綠體的起源 ，最初曾 認為 這些胞器是在 細胞自身 演化 過程 中產生的 。然而，現今科學界 已普遍接受 瑪格麗斯 所提倡的內共生 假說，並將其發展為內共生學說 。 從假說被廣泛接受並轉變為學說， 必須 依賴充分 的科學證據，除了課文中所提到 的內容 外， 你還能 查詢並蒐集 到其他更 多的證據嗎 ？ 配合課本  P24 18</p></div><div class=\"quote\"><b>原簡報第19頁文字</b><p>   腦力激盪 答 ： 胞 器內共生的證據大致可分為形態功能與分子生物學兩類。 (1) 形態學與功能上來看 ： 胞器與原核細菌同樣以分裂生殖方式繁殖、具有雙層膜且內膜上有相似的蛋白質和電子傳遞系統、具有自身的環狀  DNA  與  70S  的核糖體，以及對抗生素很敏感等。 (2) 分子生物學上來 看 ： 胞 器與原核細菌相似之處很多，如兩者的  DNA  序列中無內含子、 mRNA  的修飾過程相似並能製造自身的蛋白質、 DNA  複製只有一個起始點、 DNA  上缺乏真核染色體常見的組蛋白、外膜上具細菌才有的膜孔蛋白（ porin protein ）等。 19 配合課本  P24</p></div>", "tb": [["pdf24", "課本 P24 完整頁面"]]}, {"id": "b2-13-l15", "t": "多細胞：聚集之後，還有分工", "src": "課本 P25；原簡報第 20 頁", "slide": 20, "figSpec": {"flip": [20]}, "txt": "<h3>由相連到協調運作</h3><p>課本描述單細胞聚集、依位置產生形態與功能差異，並經分工合作提高資源利用效率。</p><p>原簡報以鏈球菌說明細胞可以相連或聚集；它不因此等同具有組織分化的多細胞生物。判讀時要問細胞是否協調、分工，不能只數有幾個細胞。</p><p>多細胞化是生命多樣化的一條路徑，沒有使單細胞生物消失，也不表示所有生物朝同一個大小或複雜程度演化。</p><div class=\"quote\">在生命演化的歷程中，原始生物是單細胞生物，這些生物體在演化過程中逐漸聚集在一起，依細胞排列的位置差異，進行分工合作而有不同形態、功能運作。這種分工使生物體能更有效的利用資源，提高整體的適應能力，生物體逐漸由單細胞生物演化成多細胞生物。<small>課本 P25／原簡報（節錄）</small></div><div class=\"quote\"><b>原簡報第20頁文字</b><p>補充 生物的演變──由單細胞到多細胞 有些細胞彼此聚在一起或相連在一起，如鏈球菌 多細胞生物 逐漸因分工合作 而 產生不同形態、行使不同功能 ， 且對資源利用更有效率 1-3.4  細胞數的 變化 —— 由 單細胞到多細胞 原始 生物為 單細胞生物 有些單細胞開始聚集在一起生活 配合課本  P25 20</p></div>", "tb": [["pdf25", "課本 P25 完整頁面"]], "sec": "s4"}], "questions": [{"t": "四條演化線索配對", "q": "把描述放回對應的演化面向。", "sub": "課本 P22–P25；原PPT第1頁", "learn": 0, "tag": "axes", "hint": "分別問：碳從哪裡來、如何產能、有哪些胞器、如何分工？", "why": "四個面向相互影響，卻不能互相當作定義。細胞大小不是生命演化的固定方向。", "kind": "drag", "fig": null, "refs": [{"src": "pdf22", "cap": "課本 P22–P25；原PPT第1頁"}], "slots": [{"id": "s0", "label": "營養方式"}, {"id": "s1", "label": "產能方式"}, {"id": "s2", "label": "細胞構造"}, {"id": "s3", "label": "細胞數"}], "pieces": [{"id": "a0", "label": "異營與自營"}, {"id": "a1", "label": "無氧產能與有氧呼吸"}, {"id": "a2", "label": "原核與真核"}, {"id": "a3", "label": "單細胞與多細胞"}, {"id": "a4", "label": "所有生物都必然由小變大"}], "sol": {"s0": "a0", "s1": "a1", "s2": "a2", "s3": "a3"}, "pre": {}}, {"t": "有機物來源的轉變", "q": "依課本的早期異營模型，排出資源變化與自營出現的因果順序。", "sub": "課本 P22；原PPT第5–8頁", "learn": 3, "tag": "nutrition", "hint": "先找有機物供需的改變，再找長期演化後的新能力。", "why": "這是課本描述的假設模型；營養方式和是否利用氧氣是不同面向。", "kind": "drag", "fig": null, "refs": [{"src": "pdf22", "cap": "課本 P22；原PPT第5–8頁"}], "slots": [{"id": "s0", "label": "起點（已給）"}, {"id": "s1", "label": "資源變化"}, {"id": "s2", "label": "生物面臨的限制"}, {"id": "s3", "label": "新的營養方式"}, {"id": "s4", "label": "對生物多樣化的影響"}], "pieces": [{"id": "a0", "label": "化學演化累積有機物"}, {"id": "a1", "label": "有機物合成減緩且消耗增加"}, {"id": "a2", "label": "可直接取得的有機物變少"}, {"id": "a3", "label": "從無機物合成有機物"}, {"id": "a4", "label": "有機物供應更穩定、代謝更多元"}, {"id": "a5", "label": "每個個體因飢餓立刻變成自營"}, {"id": "a6", "label": "自營必然等於產氧光合作用"}], "sol": {"s0": "a0", "s1": "a1", "s2": "a2", "s3": "a3", "s4": "a4"}, "pre": {"s0": "a0"}}, {"t": "氧氣改變了生存條件", "q": "把事件放入因果鏈；保留低氧環境中仍能生存的厭氧生物。", "sub": "課本 P23；原PPT第10–11頁", "learn": 6, "tag": "oxygen", "hint": "分清產氧者、氧氣累積與利用氧氣的代謝。", "why": "氧氣對生物的影響不同；耐氧與有氧呼吸也不能當成同一件事。", "kind": "drag", "fig": null, "refs": [{"src": "pdf23", "cap": "課本 P23；原PPT第10–11頁"}], "slots": [{"id": "s0", "label": "提供氧氣"}, {"id": "s1", "label": "環境改變"}, {"id": "s2", "label": "對厭氧生物的影響"}, {"id": "s3", "label": "其中一種長期演化結果"}], "pieces": [{"id": "a0", "label": "產氧光合作用釋出氧氣"}, {"id": "a1", "label": "氧氣逐漸在環境中累積"}, {"id": "a2", "label": "部分受傷害，部分留在低氧環境"}, {"id": "a3", "label": "利用氧氣行高效率有氧呼吸"}, {"id": "a4", "label": "所有厭氧生物立即消失"}], "sol": {"s0": "a0", "s1": "a1", "s2": "a2", "s3": "a3"}, "pre": {}}, {"t": "內共生對象與胞器", "q": "配對兩種內共生對象與其後續形成的胞器、主要功能。", "sub": "課本 P24–P25 圖1-15；原PPT第15–17頁", "learn": 10, "tag": "symbiosis", "hint": "穩定共生與長期演化是關鍵，圖中的兩種細菌角色不同。", "why": "粒線體與葉綠體分別具有不同的內共生來源；核膜與內質網是另一個起源問題。", "kind": "drag", "fig": "fig15", "refs": [{"src": "fig15", "cap": "課本 P24–P25 圖1-15；原PPT第15–17頁"}], "slots": [{"id": "s0", "label": "好氧性細菌 → 胞器"}, {"id": "s1", "label": "此胞器的主要相關功能"}, {"id": "s2", "label": "藍綠菌 → 胞器"}, {"id": "s3", "label": "此胞器的主要相關功能"}], "pieces": [{"id": "a0", "label": "粒線體"}, {"id": "a1", "label": "有氧呼吸"}, {"id": "a2", "label": "葉綠體"}, {"id": "a3", "label": "光合作用"}, {"id": "a4", "label": "細胞核"}, {"id": "a5", "label": "細菌一被吞入便立刻消失"}], "sol": {"s0": "a0", "s1": "a1", "s2": "a2", "s3": "a3"}, "pre": {}}, {"t": "三種路徑的時序比較", "q": "逐一判讀三條假設路徑；注意「內膜」與「細胞核」出現的時機。", "sub": "課本 P25 圖1-15；原PPT第16頁", "learn": 11, "tag": "routes", "hint": "逐條跟著藍色箭頭，比較膜與粒線體內共生體的位置。", "why": "三條路徑的差異在事件時序，並非以圖中編號宣告已證實的唯一歷史。", "kind": "fill", "fig": "fig15", "refs": [{"src": "fig15", "cap": "課本 P25 圖1-15；原PPT第16頁"}], "rows": [{"q": "路徑1：內共生相對於膜狀胞器出現的時機", "o": ["內共生發生在膜狀胞器尚未出現的早期", "全部膜狀胞器都形成後才內共生", "圖中沒有發生內共生"], "tag": "routes"}, {"q": "路徑2：內共生發生的條件", "o": ["內膜形成後發生內共生", "葉綠體出現後才有內膜", "所有真核胞器已完全形成"], "tag": "routes"}, {"q": "路徑3：內共生前已形成哪些構造？", "o": ["細胞核與內膜系統", "葉綠體與完整多細胞組織", "只有粒線體、沒有內膜"], "tag": "routes"}, {"q": "三條路徑圖可以支持何種結論？", "o": ["它們是比較事件先後的假設，仍需證據檢驗", "三條路徑都已被逐步直接觀察", "路徑號碼就是生物演化年代"], "tag": "routes"}], "imageWidth": 460}, {"t": "證據判讀與多細胞化", "q": "判讀證據能支持什麼，並區分相似、共生及分工。", "sub": "課本 P24–P25；原PPT第14、19–20頁", "learn": 13, "tag": "evidence", "hint": "用多項可比較證據推論；絕對化的「所有／一定」需要特別檢查。", "why": "胞器已經歷後續演化，不能要求所有特徵與細菌完全相同；多細胞化也不只是把細胞聚在一起。", "kind": "fill", "fig": "ppt14-03", "refs": [{"src": "ppt14-03", "cap": "原PPT第14頁：粒線體、葉綠體與原核細胞的相似性"}, {"src": "ppt19-03", "cap": "原PPT第19頁原證據；概括句需配合圖解第14張註記判讀"}, {"src": "pdf25", "cap": "課本P25多細胞與分工原文"}], "rows": [{"q": "胞器有DNA、分裂方式及序列與細菌相似", "o": ["多項特徵共同支持內共生來源", "只要有DNA就一定是獨立細菌", "證明所有胞器DNA皆無內含子"], "tag": "evidence"}, {"q": "來源列出70S核糖體，如何解讀？", "o": ["核糖體有演化關聯，但不能推為所有粒線體都70S", "所有粒線體皆70S，毫無例外", "核糖體大小本身就證明全部起源時序"], "tag": "evidence"}, {"q": "胞器能製造部分自身蛋白質", "o": ["具有部分自身基因表達能力，不代表能獨立生活", "表示完全不需要宿主基因", "表示已經沒有任何DNA"], "tag": "evidence"}, {"q": "鏈球菌細胞相連的例子", "o": ["細胞相連不能單憑外觀等同組織分工", "只要聚集就必然有多細胞組織", "單細胞生物不可能與其他細胞相連"], "tag": "evidence"}, {"q": "多細胞化的重要意義", "o": ["分工合作與資源利用效率提高", "所有單細胞生物因此完全消失", "所有細胞從此具有相同形態和功能"], "tag": "evidence"}], "imageWidth": 470}, {"t": "原題一：RNA世界的線索", "q": "為何科學家會認為 RNA 比 DNA 更可能是最早生命世界的遺傳物質？", "sub": "原PPT第21頁原題；課本P22–P25／銜接1-2", "learn": 0, "tag": "rna", "hint": "回想RNA如何兼具遺傳與催化角色。", "why": "原題答案B：RNA可兼具遺傳資訊與催化作用，RNA複製仍需適當材料與條件。原解析以DNA雙股說明資訊量的句子，不能推論互補的第二股提供兩倍獨立遺傳訊息；本題應聚焦RNA兼具模板與催化能力。", "kind": "single", "fig": null, "refs": [{"src": "ORIGINAL21", "cap": "原PPT第21頁原題與解析"}], "opts": [{"t": "RNA 為核糖核酸 ，分子較 DNA 穩定", "ok": false, "tag": "rna"}, {"t": "某些 RNA 分子可自我複製", "ok": true, "tag": "rna"}, {"t": "RNA 可儲存的遺傳訊息較 DNA 多", "ok": false, "tag": "rna"}, {"t": "RNA 分子結構多樣性比 DNA 低。", "ok": false, "tag": "rna"}], "sourceSlide": 21}, {"t": "原題二：何謂內共生", "q": "瑪格麗斯根據前人的相關研究提倡細胞的內共生假說，何謂內共生假說？", "sub": "原PPT第22頁原題；課本P22–P25", "learn": 10, "tag": "symbiosis", "hint": "找出吞入、穩定共生與胞器演化三個關鍵。", "why": "原題答案D：被吞入的細菌與宿主形成穩定共生並經長期演化，解釋粒線體與葉綠體的來源。膜內陷與在環境中共存皆非本題定義。", "kind": "single", "fig": null, "refs": [{"src": "ORIGINAL22", "cap": "原PPT第22頁原題與解析"}], "opts": [{"t": "原核生物與其他原核生物融合，形成真核生物", "ok": false, "tag": "symbiosis"}, {"t": "真核生物細胞膜凹陷，包裹部分有機物質，形成真核細胞的胞器", "ok": false, "tag": "symbiosis"}, {"t": "好氧性細菌與藍綠菌共生於環境中，共同演化成真核生物", "ok": false, "tag": "symbiosis"}, {"t": "原始真核細胞吞入原核生物後，所產生的穩定共生現象，可解釋粒線體、葉綠體等胞器的演化。", "ok": true, "tag": "symbiosis"}], "sourceSlide": 22}, {"t": "原題三：演化方向的統整", "q": "下列哪些選項符合生命演化的方向？", "sub": "原PPT第23頁原題；課本P22–P25", "learn": 14, "tag": "axes", "hint": "這是多選題；演化不是所有生物都走同一條階梯。", "why": "原題答案C、D、E。此題依課本模型統整；RNA→DNA是起源假說線索，不是已直接觀察的最早歷史。細胞大小沒有固定方向；早期異營模型也不表示自營或異營生物只存在於單一時期。", "kind": "multi", "fig": null, "refs": [{"src": "ORIGINAL23", "cap": "原PPT第23頁原題與解析"}], "opts": [{"t": "小型細胞→大型細胞", "ok": false, "tag": "axes"}, {"t": "自營生物→異營生物", "ok": false, "tag": "axes"}, {"t": "無氧代謝→有氧呼吸", "ok": true, "tag": "axes"}, {"t": "原核細胞→真核細胞", "ok": true, "tag": "axes"}, {"t": "遺傳物質 RNA → DNA。", "ok": true, "tag": "axes"}], "sourceSlide": 23}], "tags": {"axes": ["演化面向", "營養、能量、構造與細胞數是不同面向；演化不是固定的大小階梯。", "課本P22–P25；原PPT第1、20、23頁"], "nutrition": ["異營與自營", "先判斷有機物／碳源的取得方式；勿與用不用氧氣混為一談。", "課本P22；原PPT第5–8頁"], "oxygen": ["氧氣與產能", "分清產氧光合作用、氧氣累積、耐氧與利用氧氣呼吸。", "課本P23；原PPT第9–11頁"], "symbiosis": ["內共生的對象", "長期穩定共生與演化才是關鍵；粒線體、葉綠體的來源不同。", "課本P24–P25；原PPT第14–17頁"], "routes": ["假設路徑時序", "比較內膜、細胞核與粒線體內共生事件的先後；圖不等同已證實歷史。", "課本P25圖1-15；原PPT第16頁"], "evidence": ["證據與推論界線", "用多項證據推論，避免把個別胞器特徵當成絕對通則；聚集不等於組織分工。", "課本P24–P25；原PPT第19–20頁"], "rna": ["RNA世界", "RNA兼具模板與催化潛力；原題保留，不把RNA世界當成已觀察的最早生命。", "原PPT第21頁；銜接1-2RNA世界"]}, "conceptMap": {"axes": 0, "nutrition": 3, "oxygen": 6, "symbiosis": 10, "routes": 11, "evidence": 13, "rna": 0}, "pptText": {"1": "1-3  生命形式的多樣化 1-3.1  細胞營養方式的 演化 —— 由 異營至自營 1-3.2  細胞產生能量的 演化 —— 由 無氧至有氧 1-3.3   細胞 構造的 變化 —— 由 原核到真核 1-3.4  細胞數的 變化 —— 由 單細胞到多細胞 1", "2": "1-3  生命形式的多樣化        從第一個細胞出現，到現今種類繁多的物種，每個生物體都是生命形式多樣化歷史的一部分。雖然許多關於生命起源的問題仍屬未知，但化石資料已顯示一些重要事實 。 配合課本  P22 2", "3": "1-3.1  細胞營養方式的 演化 —— 由 異營至自營 現今的地球環境， 經過數十億年的變遷，與初形成時相差極大。 配合課本  P22 3", "4": "       初始的大氣層厚度為現今的一半，沒有氧氣。 1-3.1  細胞營養方式的 演化 —— 由 異營至自營        大氣層上方也沒有臭氧層保護，紫外線輻射可長驅直入到地表。 配合課本  P22 4", "5": "1-3.1  細胞營養方式的 演化 —— 由 異營至自營        原 始的地球環境中，可累積從化學演化所產生的許多有機物 。        早期的生物 直接攝取這些有機物 ，並從中獲取能量，這種代謝方式稱為 異營 。 配合課本  P22 5", "6": "1-3.1  細胞營養方式的 演化 —— 由 異營至自營        然而隨著地球環境的改變，有機物合成的速率逐漸減緩，更多生物的出現也加速有機物的消耗 。 配合課本  P22 6", "7": "       因此演化出能 自行從無機物合成有機物 的生物，此種代謝方式稱為 自營 。 1-3.1  細胞營養方式的 演化 —— 由 異營至自營 配合課本  P22 7", "8": "1-3.1  細胞營養方式的 演化 —— 由 異營至自營        由於自營生物的出現，使有機物的供應有了穩定的來源，因此生物的代謝方式更形多元，也促進了地球上生物的多樣化。 配合課本  P22 8", "9": "1-3.2  細胞產生能量的 演化 —— 由 無氧至有氧 → 例如 ： 糖解作用 被認為是最早出現在細胞中的代謝途徑之一 葡萄糖 丙酮酸 2 2( ADP+Pi ) 2ATP 2NAD + 2NADH ◆  原始 大氣並無氧氣，最初生物是以 無氧 的方式將 有機物加以 分解，而獲取能量 配合課本  P23", "10": "◆  35  億年 前，出現了可進行光合作用並 產生氧氣 的 生物 1-3.2  細胞產生能量的 演化 —— 由 無氧至有氧 疊層石是由海底沉澱物堆積成的層狀構造 澳洲 西部的疊層石 ，其中發現生存於 35  億年 前、類似藍綠菌的化石 配合課本  P23", "11": "◆ 厭氧生物只能存活於無法累積氧氣的角落 ◆  產氧生物光合作用 所釋出的氧氣會在大氣中累積，對厭氧生物產生傷害，造成了「氧氣大災難」 1-3.2  細胞產生能量的 演化 —— 由 無氧至有氧 ◆ 有氧呼吸的產能效率遠高於無氧的產能代謝，因此演化 成 為大多數生物獲取代謝能量的主要方式 ◆   有些 生物發展出可以 忍受氧氣傷害的機制 ，後來更演化出 能利用氧氣行有氧呼吸 的 好氧性生物 ，來適應此新環境 配合課本  P23", "12": "   腦力激盪 　　你 認為現今的地球環境是否能夠重複進行初始的化學演化，並持續產生新生命呢？原因為何？ 答 ： 科學家發現，在大洋海底的火山口與一些高溫無氧的溫泉中有跟初始地球環境類似的條件，因此有些科學家相信這種化學演化可能仍在進行。但是要產生新生命必須克服兩大 障礙 ： ( 1) 被現存生物所捕食，經化學演化產生的有機分子沒有機會累積成原生湯。 (2) 這些有機分子受到環境中氧氣的強烈作用而被分解。因此多數科學家認為現今不太可能重複遠古產生第一個生命的歷程。 配合課本  P23 12", "13": "◆ 真核細胞的化學反應可在區隔的空間中進行，不至於受到細胞質中其他化學反應的干擾 1-3.3   細胞 構造的 變化 — — 由 原核到真核 ◆ 原核細胞 的 細胞膜向內凹陷，包圍住遺傳 物質  DNA ， 進而演化 成 真核細胞 原核細胞 DNA 細胞質 細胞膜 形成細胞內的膜 內質網 核膜 形成內 質 網 及 核 膜 真核細胞 細胞核和內膜系統 配合課本  P24 細胞膜內陷並摺疊", "14": "◇  雙層膜 1-3.3   細胞 構造的變化 —— 由原核到真核 粒線體和葉綠體 → 具 環狀  DNA ，   DNA  序列 與原核細胞較相似 →  複製、分裂方式與原核細胞 較 相似 ◆  相似點 ： ◇ 有許多特徵和原核細胞 相似（  粒 線體 似 好氧菌 ， 葉綠體 似 藍綠 菌  ） →  具核糖體 →  可轉錄、轉譯小部分自身蛋白質 配合課本  P24", "15": "1-3.3   細胞 構造的變化 —— 由原核到真核 粒線體和葉綠體 ◆ 內共生假說 ： ◇  美國 生物學家 瑪格麗斯 瑪格麗斯 ◇  真核細胞始祖 → 吞入 好氧菌 ，經長期 演  化 轉變為共生現象， 而  形成 粒線體 → 吞入 藍綠 菌 ，經長期 演  化 轉變為共生現象， 而  形成 葉綠體 配合課本  P24", "16": "◇ 科學家提出三種 演化路徑假設 ： 原核細胞 真核細胞 好氧菌 粒線 體內共生體 配合課本  P25 路徑① 路徑② 路徑③", "17": "異營真核細胞始祖 自營真核細胞始祖 葉綠體 藍綠菌 配合課本  P25", "18": "   腦力激盪 　　有關 真核細胞粒線體與葉綠體的起源 ，最初曾 認為 這些胞器是在 細胞自身 演化 過程 中產生的 。然而，現今科學界 已普遍接受 瑪格麗斯 所提倡的內共生 假說，並將其發展為內共生學說 。 從假說被廣泛接受並轉變為學說， 必須 依賴充分 的科學證據，除了課文中所提到 的內容 外， 你還能 查詢並蒐集 到其他更 多的證據嗎 ？ 配合課本  P24 18", "19": "   腦力激盪 答 ： 胞 器內共生的證據大致可分為形態功能與分子生物學兩類。 (1) 形態學與功能上來看 ： 胞器與原核細菌同樣以分裂生殖方式繁殖、具有雙層膜且內膜上有相似的蛋白質和電子傳遞系統、具有自身的環狀  DNA  與  70S  的核糖體，以及對抗生素很敏感等。 (2) 分子生物學上來 看 ： 胞 器與原核細菌相似之處很多，如兩者的  DNA  序列中無內含子、 mRNA  的修飾過程相似並能製造自身的蛋白質、 DNA  複製只有一個起始點、 DNA  上缺乏真核染色體常見的組蛋白、外膜上具細菌才有的膜孔蛋白（ porin protein ）等。 19 配合課本  P24", "20": "補充 生物的演變──由單細胞到多細胞 有些細胞彼此聚在一起或相連在一起，如鏈球菌 多細胞生物 逐漸因分工合作 而 產生不同形態、行使不同功能 ， 且對資源利用更有效率 1-3.4  細胞數的 變化 —— 由 單細胞到多細胞 原始 生物為 單細胞生物 有些單細胞開始聚集在一起生活 配合課本  P25 20", "21": "   Question 1.  為何科學家會認為 RNA 比 DNA 更可能是最早生命世界的遺傳物質 ？　 ( A )   RNA  為 核糖核酸 ，分子較  DNA   穩定　 ( B) 某些  RNA  分子 可自我 複製　 ( C )   RNA  可 儲存的遺傳訊息 較  DNA   多　 ( D )   RNA  分子結構 多樣性 比  DNA  低 。 解答 ： ( B) 解析 ： ( A )   DNA  分子的安定性較  RNA  高 ， RNA  較 不穩定，但可能更有利早期生命的演化 。 ( C )   DNA  為 雙股 ，  RNA  為 單股，同樣長度的多核苷酸， DNA  可 儲存的訊息較多 。 ( D )   RNA  為 單股，分子結構多樣性較高，可折疊出不同的 構形。 21", "22": "   Question 2.  瑪格麗斯根據前人的相關研究提倡細胞的內共生假說，何謂內共生假說 ？　 ( A) 原核生物與其他原核生物融合，形成真核 生物　 ( B) 真核生物細胞膜凹陷，包裹部分有機物質，形成真核細胞的胞 器　 ( C) 好氧性細菌與藍綠菌共生於環境中，共同演化成真核 生物　 ( D) 原始真核細胞吞入原核生物後，所產生的穩定共生現象，可解釋粒線體、葉綠體等胞器的演化。 解答 ： ( D) 解析 ： 瑪 格麗斯綜合前人對粒線體、葉綠體的看法，提倡內共生假說。 22", "23": "   Question 3 .  下列哪些選項符合生命演化的方向 ？ 　 ( A) 小型細胞→大型 細胞 　 ( B) 自營生物→異營生 物 　 ( C) 無氧代謝→有氧 呼吸 　 ( D) 原核細胞→真核 細胞 　 ( E) 遺傳 物質  RNA → DNA  。 解答 ： ( C)(D)(E) 解析 ： ( A) 細胞大小在生命演化過程沒有一定方向。   ( B) 異營生物→自營生物。 23"}};

document.addEventListener('fullscreenchange',fullscreenSync);document.addEventListener('keydown',e=>{if(e.isComposing||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if(document.querySelector('dialog[open]'))return;const fs=document.fullscreenElement===el('learn-stage')||el('learn-stage').classList.contains('presentation');if(fs){if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();if(LI<LEARN.length-1)showLearn(LI+1);}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();if(LI>0)showLearn(LI-1);}else if(e.key==='Escape')exitLearnFullscreen();return;}if(PAGE==='show'){if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();showStep(1);}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();showStep(-1);}else if(e.key==='Escape')navigate('intro');else if(e.key==='Home'){SI=0;showRender()}else if(e.key==='End'){SI=DECK.length-1;showRender()}return;}if(PAGE==='learn'&&el('flip')){if(e.key==='ArrowRight'){e.preventDefault();flipStop();flipShow(FI+1)}if(e.key==='ArrowLeft'){e.preventDefault();flipStop();flipShow(FI-1)}}});
el('learn-stage').addEventListener('contextmenu',e=>{if(document.fullscreenElement===el('learn-stage')||el('learn-stage').classList.contains('presentation')){e.preventDefault();if(LI<LEARN.length-1)showLearn(LI+1)}});
window.addEventListener('resize',fit);window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden){flipStop();showStopPlay();save();}});new ResizeObserver(fit).observe(el('bar'));
el('slide-text').onclick=()=>openDialog('原PPT第'+DECK[SI][1]+'頁原文',`<p>${esc(CONTENT.pptText[DECK[SI][1]])}</p>`);el('hero-image').src=IMG[DECK.filter(d=>d[1]===16).at(-1)[0]];el('video-external').href=`https://drive.google.com/file/d/${VIDEO_ID}/view?usp=drivesdk`;el('raw-animation').onclick=()=>{const d=openDialog('原始簡報動畫',`<video controls autoplay playsinline style="width:100%" src="${ANIMATION_SRC}"></video>`);d.addEventListener('close',()=>d.querySelector('video')?.pause(),{once:true});};applyPreferences();const start=['learn','play','done'].includes(ST.page)?ST.page:'intro';navigate(start);if(!saving)storageNotice();
</script></body></html>
