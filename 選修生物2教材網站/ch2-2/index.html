，由於其壽命通<br>常有限，故會從頂芽或側芽長出新葉以替換枯黃老葉。<br>葉的外部構造<br>維管束植物的葉子一般多為扁平狀。雙子葉植物<br>的葉的構造包含葉片、葉柄和托葉，葉片是葉的主體構<br>造，為進行光合作用的主要部位；葉柄可將葉片連接到<br>莖，為支撐葉片的角色；托葉位於葉柄基部，具保護芽<br>的功能。單子葉植物的葉則可分為葉片及葉鞘，不具托<br>葉，葉鞘呈鞘狀包在莖上連接葉片，亦具支持葉片的功<br>用（圖 2－20）。<br>葉片　blade<br>葉柄　petiole<br>托葉　stipule<br>葉鞘　leaf sheath<br> 圖 2－20　葉的外部構造<br>54　選修生物 Ⅱ (全)<br><small>課本 P54（PDF 第 13 頁）</small></div><div class=\"quote\"><strong>原PPT第 50 頁</strong><br>2-2.3 <br>葉<br>葉的外部構造<br>雙子葉植物<br>◆<br> <br>葉片<br>：<br>◆<br> <br>葉柄<br>：<br>◆<br> <br>托葉<br>：<br>◇ <br>行光合作用的主要部位<br>◇ <br>連接葉片與莖<br>◇ <br>運輸和支持葉片<br>托葉<br>葉片<br>葉柄<br>◇ 位<br>於葉柄基部<br>◇ <br>保護芽<br>葉的形態與功能<br>配合課本 <br>P54</div><div class=\"quote\"><strong>原PPT第 51 頁</strong><br>2-2.3 <br>葉<br>葉的外部構造<br>◆<br> <br>葉片<br>：<br>◆<br> <br>葉鞘<br>：<br>◇ 行光合作用的主要部位<br>◇ <br>呈鞘狀包在莖上<br>◇ <br>連接葉片與莖<br>◇ <br>運輸和支持葉片<br>單<br>子葉植物<br>葉片<br>葉鞘<br>配合課本 <br>P54</div>", "tb": [["BOOK13", "P54 完整頁面"]]}, {"id": "b2-22-l22", "t": "葉的剖面：茶葉與玉米葉", "src": "課本 P55；原簡報第 52、53 頁", "slide": 52, "figSpec": {"image": "leafsections"}, "sec": "s4", "txt": "<h3>葉的剖面：茶葉與玉米葉</h3><ul><li>原圖並列茶葉與玉米葉，標示表皮、葉肉、維管束與氣孔。</li><li>比較時要保留原圖中的上下方向與比例尺，不能把不同倍率的照片大小當作厚度。</li></ul><div class=\"think\">兩種葉的葉肉分化與氣孔分布有何異同？</div><div class=\"quote\"><strong>課本原文</strong><br>葉的內部構造<br>葉片由外而內包括表皮、葉肉及維管束。葉片的表皮通常只有一層細胞，主要由表皮<br>細胞與保衛細胞構成。表皮多有角質層覆蓋，可以減少水分散失，保護葉肉。保衛細胞通<br>常成對存在，此兩細胞與其間的孔洞合稱為氣孔，是氣體進出、水分蒸散的門戶。<br>葉肉位於上、下表皮之間，由具葉綠體的薄壁細胞所構成，是行光合作用的主要場<br>所。多數雙子葉植物的葉肉依細胞形狀與排列可分為兩型，靠近上表皮的細胞多呈長條<br>形，排列較整齊，稱為柵狀葉肉細胞；靠近下表皮的細胞形狀不一，排列不整齊，細胞<br>間有許多空隙，稱為海綿葉肉細胞（圖 2－21a）。大部分單子葉植物的葉肉則較無上述<br>形態差異（圖 2－21b）。此外，在接近氣孔處，葉肉細胞常圍出一個大型空腔，稱為氣<br>室，是氣體暫存與交換的空間。<br>葉肉　mesophyll<br>保衛細胞　guard cell<br>氣孔　stoma<br>柵狀葉肉細胞　palisade mesophyll cell<br> 圖 2－21　被子植物葉橫切面的比較<br>木質部<br>木質部<br>韌皮部<br>下表皮<br>海綿葉肉細胞<br>柵狀葉肉細胞<br>上表皮<br>韌皮部<br>維管束<br>氣室<br>氣孔<br>25<br>保衛<br>細胞<br>葉肉<br>維管束<br>上表皮<br>下表皮<br>氣孔<br>氣室<br>氣孔<br>雙子葉植物：茶樹<br>雙子葉植物：茶樹<br>a<br>單子葉植物：玉米<br>單子葉植物：玉米<br>b<br>海綿葉肉細胞　spongy mesophyll cell<br>氣室　substomatal chamber<br>第 2 章  植物體的構造與功能　55<br><sm 托花，不要把整片苞葉叫作花瓣。</li></ul><div class=\"think\">柑橘的莖刺與仙人掌的葉刺，如何用起源區分？</div><div class=\"quote\"><strong>課本原文</strong><br>苞葉<br>九重葛<br>捲鬚葉<br>豌豆<br>刺<br>仙人掌<br>捕蟲葉<br>捕蠅草<br>本文所舉出的特化葉實<br>例分別有什麼功能？你還可<br>舉出哪些例子？<br>腦力激盪<br>維管束分布於葉肉中，在葉片表面呈現出明顯葉<br>脈，具有支持平展葉片及運輸水分與養分的功能，木質<br>部位於近上表皮側，韌皮部位於近下表皮側。雙子葉與<br>單子葉植物間的葉脈分布有明顯差異，前者多為網狀<br>脈，後者多為平行脈。<br>葉的特化<br>有些植物的葉在形態或構造上不同於一般的葉，具<br>特殊的功能或使植物能適應特殊的生存環境。常見的<br>特化葉包括：仙人掌的刺、九重葛花下方顏色鮮豔的<br>苞葉、豌豆的捲鬚葉，以及捕蠅草的捕蟲葉等（圖 2－<br>22）。<br> 圖 2－22　多樣的特化葉<br>56　選修生物 Ⅱ (全)<br><small>課本 P56（PDF 第 15 頁）</small></div><div class=\"quote\"><strong>原PPT第 57 頁</strong><br>2-2.3 <br>葉<br>葉的特化<br>仙人掌<br>刺<br>九重葛<br>苞葉<br>配合課本 <br>P56</div><div class=\"quote\"><strong>原PPT第 58 頁</strong><br>2-2.3 <br>葉<br>葉的特化<br>豌豆<br>捲鬚葉<br>捕蠅草<br>捕蟲葉<br>配合課本 <br>P56</div><div class=\"quote\"><strong>原PPT第 61 頁</strong><br>  <br>腦力激盪<br>　　本文所舉出的特化葉實例分別有什麼功能？你還可舉出哪些例子？<br>答<br>：<br>1. <br>仙人掌的「刺」可減少水分散失，並兼具防禦的作用；九重葛的苞葉可吸引昆蟲造訪，協助傳粉；豌豆葉的捲鬚可纏繞於接觸物上，協助植物體攀爬；捕蠅草的捕蟲葉可藉由葉的閉合來困住小型昆蟲，並分泌酵素分解屍體，再吸收含氮養分。<br>2. <br>麒麟花的刺是托葉的特化，具防禦的作用；豬籠草的葉特化為瓶狀，與毛氈苔葉上的許多腺毛等都是食蟲植物捕捉小蟲的陷阱；炮仗花的小葉捲鬚、印度鞭藤的葉尖反捲皆可協助植物體攀爬。<br>配合課本 <br>P56<br>61</div>", "tb": [["BOOK15", "P56 完整頁面"]]}, {"id": "b2-22-l26", "t": "苞葉與花：顏色不能代替構造判斷", "src": "課本 P57；原簡報第 59、60 頁", "slide": 59, "figSpec": {"image": "bracts"}, "sec": "s4", "txt": "<h3>苞葉與花：顏色不能代替構造判斷</h3><ul><li>聖誕紅鮮豔的苞葉位在花的周圍；可協助吸引授粉者。</li><li>銀柳可觀察苞葉與其內的花序；原圖保留各構造的位置與標示。</li></ul><div class=\"think\">一片鮮豔構造，還需要哪些證據才能稱為花瓣？</div><div class=\"quote\"><strong>課本原文</strong><br>苞片、萼片及花瓣都是特化葉<br>九重葛與聖誕紅（圖a）上的鮮豔苞葉，還有植物在秋冬時節枝條頂芽（營養芽）與花芽（生殖芽）<br>外的鱗片狀構造（圖bc）皆統稱為苞片，其形態雖多樣化，但皆為葉的特化，具有保護功能。同理，花<br>的萼片與花瓣也是具保護作用或吸引傳粉媒介的特化葉。<br>剝去銀柳的棕色苞片即可看到一個個白色小毛球（圖c），這些白毛球是許多雄花聚集而成的雄花<br>序，棕色苞片是花序芽的保護構造。銀柳和臺語的「銀兩」發音很相近，所以常被當作春節的裝飾。<br>知識補給站<br> a聖誕紅，因鮮紅苞葉而得名；b紅楠（又稱豬腳楠）有多層淡綠至粉紅色的芽苞片，嫩葉也呈粉<br>紅色；c銀柳的雄花序與棕色苞片。<br>苞片　bract<br>苞葉<br>花序<br>雄花序<br>苞片<br>苞片<br>嫩葉<br>a<br>c<br>b<br>第 2 章  植物體的構造與功能　57<br><small>課本 P57（PDF 第 16 頁）</small></div><div class=\"quote\"><strong>原PPT第 59 頁</strong><br>  <br>知 長　<br>(<br>E)<br>維管束形成層亦可增加周皮厚度。<br>解答<br>：<br>(B)(C)(D)<br> <br>解析<br>：<br>(A)<br>木栓層不透氣。<br>(E)<br>維管束形成層向外增生韌皮部，不屬於周皮範圍。<br>62</div><div class=\"quote\"><strong>原PPT第 63 頁</strong><br>  <br>Question<br>2. <br>下圖是樹幹的部分區域，請依照圖示判斷下列敘述哪些正確？<br>(A)1<br>、<br>3<br>是晚材，<br>2<br>、<br>4<br>是早<br>材　<br>(<br>B)<br>生成順序 <br>1<br>→<br>2<br>→<br>3<br>→<br>4<br>　<br>(<br>C)<br>從 <br>1<br>、<br>2<br>、<br>3<br>、<br>4 <br>分成四個區域來判斷，範圍內的細胞至少生長了 <br>4 <br>年　<br>(<br>D)<br>除了 <br>1<br>、<br>2<br>、<br>3<br>、<br>4 <br>四個區域外，其餘都是由活細胞<br>組成　<br>(<br>E)<br>畫面中除了髓與 <br>1<br>、<br>2<br>、<br>3<br>、<br>4 <br>四個區域外，其他部分為樹皮。<br>63<br>髓</div><div class=\"quote\"><strong>原PPT第 64 頁</strong><br>  <br>Question<br>解答<br>：<br>(B)(E)<br> <br>解析<br>：<br>(A)<br> <br>2<br>、<br>4<br> 是晚材，<br>1<br>、<br>3<br> 是早材。<br>(C)<br> <br>1<br>、<br>2<br> 為一年內的生長範圍，故 <br>1<br>、<br>2<br>、<br>3<br>、<br>4<br> 至少生長了 <br>2<br> 年。<br>(D)<br>樹皮中有木栓層，細胞壁含有木栓質，為死細胞。<br>64</div><div class=\"quote\"><strong>原PPT第 65 頁</strong><br>  <br>Question<br>3.<br> <br>多年生木本植物莖的樹皮厚薄不同，尤其是外側的木栓層特別厚。例如<br>：<br>西班牙栓皮櫟的木栓層很厚，可以拿來當作酒瓶塞。農民在採收木栓層時，通常會在不同時間切割樹幹上不同部位的木栓層，而不會一次把整個樹幹的木栓層剝去（如圖<br>一<br>）。<br>參考課本第 <br>2<br> 章第 <br>2 <br>節圖 <br>2–19 <br>的樹皮組成，回答以下問題<br>：<br>圖一<br>65</div><div class=\"quote\"><strong>原PPT第 66 頁</strong><br>  <br>Question<br>(1)<br> 農民所切下的木栓層，包含樹皮所有組成的組織嗎？<br>(2)<br> 如圖一，採收之後，被切除的部分會再生長回來嗎？如何長出來？<br>(3)<br> 若樹幹上的樹皮被剝落而露出木質部（如圖<br>二<br>中箭頭所指處），該處的樹皮會再生長回來嗎？理由為何？<br>圖二<br>66</div><div class=\"quote\"><strong>原PPT第 67 頁</strong><br>  <br>Question<br>解答<br>：<br>(1)<br> 農民所切下的木栓層只包含樹皮最外面的木栓組織，通常沒有破壞到木栓形成層。<br>(2)<br> <br>外層切除後，仍有剩餘的木栓層及其內的木栓形成層，故仍可藉由木栓形成層的分裂而向外增生新的木栓組織，並把暴露出來的木栓層再向外推出去，其顏色也會漸轉為較深的褐色。<br>(3)<br> 不會再長出樹皮。樹幹上被剝落的樹皮因已露出木質部，可知是從接近維管束形成層的一些活細胞剝離的。該處所遺留的木質部組成細胞多為死的細胞，不容易再去分化為分生組織，因此無法長出樹皮。<br>67</div>", "tb": [["BOOK12", "P53 完整頁面"]]}], "questions": [{"id": "b2-22-q01", "t": "根尖四區的工作", "q": "把根尖各區與主要作用配對。", "sub": "課本 P42；依教材設計的判讀題組", "learn": 1, "tag": "root", "hint": "先比對教材圖的標示、方向與各構造功能。", "why": "根冠保護；分生區分裂；伸長區伸長；成熟區分 外增生韌皮部，不屬於周皮範圍。題目中的木栓形成層來源以木本莖為範圍。", "refs": [{"src": "PPT62S3", "cap": "原PPT第62頁：完整原題與解答"}], "kind": "multi", "original": true, "opts": [{"t": "木栓層富含木栓質，為不透水可透氣的組織", "ok": false, "tag": "wood"}, {"t": "木栓形成層來自靠近表皮的皮層細胞特化", "ok": true, "tag": "wood"}, {"t": "具有周皮的植物多為木本植物", "ok": true, "tag": "wood"}, {"t": "栓皮層來自次級生長，原始皮層來自初級生長", "ok": true, "tag": "wood"}, {"t": "維管束形成層亦可增加周皮厚度。", "ok": false, "tag": "wood"}]}, {"id": "b2-22-q11", "t": "原題二：樹幹的四個區域", "q": "下圖是樹幹的部分區域，請依照圖示判斷下列敘述哪些正確？", "sub": "原PPT 第63–64頁原題；課本 P52–53", "learn": 26, "tag": "wood", "hint": "先比對教材圖的標示、方向與各構造功能。", "why": "原解答：(B)(E)。2、4是晚材，1、3是早材；1、2為一年內的生長範圍，因此四區至少對應2年。樹皮含有木栓層，其成熟細胞為死細胞。", "fig": "original-ring", "refs": [{"src": "PPT63S3", "cap": "原PPT第63頁完整原題"}, {"src": "PPT64S3", "cap": "原PPT第64頁原解析"}, {"src": "BOOK12", "cap": "課本 P53完整原圖"}], "kind": "multi", "sourceSlide": 63, "original": true, "opts": [{"t": "1、3是晚材，2、4是早材", "ok": false, "tag": "wood"}, {"t": "生成順序1→2→3→4", "ok": true, "tag": "wood"}, {"t": "從1、2、3、4分成四個區域來判斷，範圍內的細胞至少生長了4年", "ok": false, "tag": "wood"}, {"t": "除了1、2、3、4四個區域外，其餘都是由活細胞組成", "ok": false, "tag": "wood"}, {"t": "畫面中除了髓與1、2、3、4四個區域外，其他部分為樹皮。", "ok": true, "tag": "wood"}]}, {"id": "b2-22-q12", "t": "原題三：木栓採收與樹皮傷口", "q": "多年生木本植物莖的樹皮厚薄不同，尤其是外側的木栓層特別厚。例如：西班牙栓皮櫟的木栓層很厚，可以拿來當作酒瓶塞。農民在採收木栓層時，通常會在不同時間切割樹幹上不同部位的木栓層，而不會一次把整個樹幹的木栓層剝去（如圖一）。參考課本第2章第2節圖2–19的樹皮組成，回答以下問題：", "sub": "原PPT 第65–67頁原題；課本 P53", "learn": 26, "tag": "wood", "hint": "先找圖一的木栓採收面與圖二裸露的木質部。原始圖二未顯示題幹所述箭頭，請以明顯裸露區域判讀。", "why": "原PPT第67頁參考解答：Question解答：(1)農民所切下的木栓層只包含樹皮最外面的木栓組織，通常沒有破壞到木栓形成層。(2)外層切除後，仍有剩餘的木栓層及其內的木栓形成層，故仍可藉由木栓形成層的分裂而向外增生新的木栓組織，並把暴露出來的木栓層再向外推出去，其顏色也會漸轉為較深的褐色。(3)不會再長出樹皮。樹幹上被剝落的樹皮因已露出木質部，可知是從接近維管束形成層的一些活細胞剝離的。該處所遺留的木質部組成細胞多為死的細胞，不容易再去分化為分生組織，因此無法長出樹皮。67 適用範圍：原解析以該處失去形成層、留下成熟木質部為前提，作答保留原題答案。實際傷口再生會因樹種、剩餘活細胞與環境而不同，不能推論所有剝皮傷口都無法再生。杜仲的研究觀察到未成熟木質部細胞可轉分化並參與樹皮再生。", "fig": "original-bark", "refs": [{"src": "PPT65S3", "cap": "圖一與完整情境"}, {"src": "PPT66S3", "cap": "三個小題與圖二箭頭"}, {"src": "PPT67S3", "cap": "原解析"}, {"src": "BOOK12", "cap": "課本 P53樹皮組成"}], "kind": "fill", "imageWidth": 440, "rows": [{"q": "農民所切下的木栓層，包含樹皮所有組成的組織嗎？", "o": ["只包含最外木栓組織，通常未破壞木栓形成層", "包含所有樹皮及木質部", "只有髓"], "tag": "wood"}, {"q": "如圖一，採收之後，被切除的部分會再生長回來嗎？如何長出來？", "o": ["可由保留的木栓形成層向外增生新的木栓", "由所有成熟木栓死細胞直接分裂", "只要裸露就必定完全失去所有分生組織"], "tag": "wood"}, {"q": "若樹幹上的樹皮被剝落而露出木質部（如圖二中箭頭所指處），該處的樹皮會再生長回來嗎？理由為何？", "o": ["依原解析不會：該處失去形成層，留下的木質部多為死細胞", "一定會：成熟導管可以持續分裂形成全部樹皮", "任何樹種任何傷口都沒有活細胞參與再生的可能"], "tag": "wood"}], "original": true}], "tags": {"root": ["根的分區與起源", "區分根毛的表皮起源、側根的周鞘起源及不定根。", "課本 P42–46；原PPT 3–23"], "organ": ["器官與特化", "以節、芽、起源和功能比較，不只看地下位置或外形。", "課本 P45–49、P56–57"], "vascular": ["維管束與形成層", "先辨識方向、排列與組織起源，再推論運輸與生長。", "課本 P44、P50–52"], "wood": ["周皮、年輪與傷口", "分清木栓形成層與維管束形成層；早晚材合成一年輪。", "課本 P51–53；原PPT 62–67"], "leaf": ["葉的構造與功能", "比對表皮、保衛細胞、葉肉與葉脈；辨認特化葉。", "課本 P54–57"]}, "conceptMap": {"root": [1, 2, 4, 8], "organ": [6, 9, 11, 24], "vascular": [3, 13, 16, 19], "wood": [14, 15, 17, 18, 26], "leaf": [20, 21, 22, 23, 24, 25]}, "pptText": {"1": "2-2 \n植物體的營養器官\n2-2.1 \n根\n2-2.2 \n莖\n2-2.3 \n葉", "2": "◆ 根的功能\n◇\n 固定、\n支持植物體\n◇\n 吸收水、無機鹽\n◇ \n儲存水、養分\n◇ \n光合作用合成養分\n◆ \n葉的功能\n2-2 \n植物體的營養器官\n◇ \n運輸水分、無機鹽、養分\n◆ \n莖的功能\n◇ \n支持植物體\n◇ \n光合作用合成養分\n根\n、\n莖\n、\n葉為營養器官\n配合課本 \nP42", "3": "2-2.1 \n根\n縱切面\n成熟區\n延長區\n分生區\n◆\n \n根冠（ 根帽 ）\n：保護\n分生區\n◆\n \n分生區（ 頂端分生組織、生長點、始源細胞 ）\n：\n有絲\n分裂\n◆\n \n延長\n區\n：\n細胞體積增\n加\n◆\n \n成熟\n區\n：\n分化為\n表皮\n、\n皮層\n、\n中柱\n。\n表皮\n細胞向外突出形成\n根毛\n，\n維管束\n細胞完全分化\n使根伸長\n根冠\n配合課本 \nP42\n→\n為根進行吸收的主要部位\n→補\n充\n根\n冠\n細胞\n，或形成\n延長\n區\n細胞", "4": "2-2.1 \n根\n縱切面\n雙子葉植物\n根\n表皮\n皮層\n中柱\n根毛\n支根\n表皮\n皮層\n中柱\n支根\n頂端分生組織\n成熟區\n配合課本 \nP42", "5": "表皮\n皮層\n中柱\n雙子葉植物\n根（ 毛茛 ）\n2-2.1 \n根\n橫切面\n配合課本 \nP43\n、\n44", "6": "2-2.1 \n根\n橫切面\n雙子葉植物\n根（ 毛茛 ）\n內\n皮\n周鞘\n木質部\n韌皮部\n中柱\n配合課本 \nP43\n、\n44", "7": "2-2.1 \n根\n橫切面\n雙子葉植物\n根（ 毛茛 ）\n周鞘\n木質部\n韌皮部\n中柱\n皮層\n表皮\n內\n皮\n皮層\n配合課本 \nP43\n、\n44", "8": "表皮\n：\n表皮\n細胞\n排列\n緊密\n　\n　　\n→\n保護\n、\n吸收\n根毛\n：\n表皮細胞向外\n突出\n　\n　　→\n增加吸收面積\n皮層\n：\n薄壁細胞\n排列\n疏鬆\n　\n　　→\n儲存\n養分\n內\n皮\n：\n皮層最內部的一層細胞，\n排列緊密，細胞壁局部不透\n水\n　\n　　→\n管制\n水分\n和無機鹽進入中柱\n2-2.1 \n根\n橫切面\n表皮\n皮層\n內皮細胞的細胞壁有局部增厚、含木質素或部分木栓質的帶狀結構，稱為卡氏帶，能夠管制水與溶於水中的物質進入中柱。\n配合課本 \nP43\n8", "9": "2-2.1 \n根\n橫切面\n周\n鞘\n：\n薄壁\n細胞\n　\n　　\n→\n具分裂功能，可向外長出\n支\n根\n維管束\n：\n木質部\n由維管束中央向外輻射狀排列，\n韌皮部\n則分布於木質部\n之間\n　\n　　　→\n木質部與韌皮部呈輻射鑲嵌狀排列\n中柱\n配合課本 \nP44", "10": "表皮\n皮層\n中柱\n單\n子葉植物\n根（ \n玉米 ）\n2-2.1 \n根\n橫切面\n配合課本 \nP44", "11": "中柱\n單\n子葉植物\n根（ \n玉米 ）\n2-2.1 \n根\n橫切面\n周鞘\n韌皮部\n木質部\n髓\n內\n皮\n配合課本 \nP44", "12": "中柱\n單\n子葉植物\n根（ \n玉米 ）\n2-2.1 \n根\n橫切面\n周鞘\n韌皮部\n木質部\n髓\n內\n皮\n皮層\n表皮\n皮層\n配合課本 \nP44", "13": "髓\n：\n排列疏鬆的薄壁\n細胞\n　\n　\n→\n儲存\n養分\n維管束\n：\n木質部\n與\n韌皮部\n在髓的外側\n呈環狀相間排列\n2-2.1 \n根\n橫切面\n中柱\n配合課本 \nP44", "14": "      \n雙子葉植物\n單子葉植物\n維管束排列\n \n  \n髓\n \n \n輻射鑲嵌狀排列\n環狀相間排列\n無\n有\n◆ \n根的橫切面之比較\n2-2.1 \n根\n橫切面\n單子葉植物與雙子葉植物的根、莖比較\n補充", "15": "  \n腦力激盪\n在細胞組成與功能方面， 如何區別支根與根毛？\n答\n：\n(\n1) \n構造上\n◆ 支根是完整的根，具有根冠、根頂端分生組織、延長區及成熟區\n◆ 根毛是表皮細胞突出的結果\n(2)\n 功能上\n◆ 支根有典型根的所有功能\n◆ 根毛則是吸收水及無機鹽的主要細胞\n→ 換言之，根毛只是支根表皮的一部分\n配合課本 \nP44\n15", "16": "  \n知識補給站\n周鞘細胞如何長出支根？\n       成熟的根多會長出支根。一般而言，雙子葉與單子葉植物的根皆可長出支根，且形成支根的方式也相同。\n根中的周鞘細胞會密集進行細胞分裂，形成支根的頂端分生組織\n逐漸伸長的支根會推擠成熟根的皮層，向外突出生長\n皮層\n表皮\n周鞘\n內\n皮\n支根的頂端分生組織再繼續增生新的組織\n配合課本 \nP45\n16", "17": "◆ \n軸根系\n：\n有主根、支根之分\n◆ \n鬚根系\n：\n由莖\n基\n部\n叢生出許多鬚根，沒有主根、支根之分\n綠豆 \n(\n軸根系\n)\n大蒜 \n(\n鬚\n根系\n)\n→\n多數\n雙子葉植物\n→\n多數\n單子葉植物\n2-2.1 \n根\n根的外部形態\n根的形態與功能\n補充", "18": "2-2.1 \n根\n根的特化\n玉米\n支持根\n海茄苳\n呼吸根\n呼吸根\n落羽松美景 全臺吹起搶種熱潮\n配合課本 \nP45", "19": "2-2.1 \n根\n根的特化\n蘭花\n氣生根\n胡蘿蔔\n儲藏\n根\n配合課本 \nP45", "20": "  \n知識補給站\n不定根\n       \n典型的根\n是由種子萌發所產生的\n初生根\n發育而來。然而，有些植物的特化根是直接從\n莖\n或\n葉\n產生，由於這些根\n不是源自根部組織\n，故稱為\n不定根\n。\n       不定根與一般的根具有相似的構造與功能，如玉米的支持根與蘭花的氣生根。\n配合課本 \nP46\n20", "21": "  \n知識補給站\n不定根\n       此外，不定根會因生長而改變其名稱，例如\n：\n榕樹莖上有鬚狀的根懸垂在空中，稱為\n氣生根\n，可直接吸收空氣中的氧及水分。這些氣生根可持續生長至接觸地面，然後伸入土中，協助吸收水分，並加粗如同許多小樹幹般，以支持植物體。此時，這些粗壯的不定根改稱為\n支持根\n，兼具吸收水分與支持的功能。\n支持根\n氣生根\n配合課本 \nP46\n21", "22": "  \n知識補給站\n根的側生分生組織來自何處？\n       在木本雙子葉植物負責支持的成熟根中，\n周鞘細胞\n可再特化為\n木栓形成層\n，向外產生木栓層取代表皮，而\n維管束形成層\n則是由\n位於木質部與韌皮部之間的薄壁細胞\n所特化而來。如同木本植物莖的次級生長，根亦藉由增生組織的堆疊而成木質根。\n周鞘\n皮層\n表皮\n木質部\n維管束\n形成層\n表皮\n木栓層\n木栓形成層\n韌\n皮部\n維管束\n形成層\n韌皮部\n配合課本 \nP46\n次級生長\n22", "23": "  \n腦力激盪\n　　木本雙子葉植物幼根的木質部呈現實心的星芒狀\n（如上頁圖紅色\n部分），若木質部與韌皮部之間有維管束形成層增生出木質部與韌皮部組織，加粗之後的根為什麼外觀還是圓柱狀，而沒有像星芒狀的稜角？或者，維管束形成層是如何增生新的木質部組織，才使木質部整體呈現圓柱狀？\n答\n：\n星芒狀凹處的維管束形成層分裂較頻繁，且先生成次生木質部而將初生韌皮部推擠出去，最後木質部外圍成為圓柱狀，其相鄰的維管束形成層細胞也是圍成一個圓圈。\n配合課本 \nP46\n23", "24": "2-2.2 \n莖\n頂芽\n頂芽\n側芽\n節\n節間\n從節的位置能長出葉子或花\n莖和根的主要區別是\n莖上有節，節上有葉及芽著生\n芽是未發育的枝條\n莖的外部形態\n莖的形態與功能\n配合課本 \nP47\n莖", "25": "2-2.2 \n莖\n◆ 維管束植物根據莖的柔軟程度與構造，可分為\n草本植物\n和\n木本植物\n◇ \n草本植物\n：\n草質莖柔軟，高度和粗細受到限制\n◇ \n木\n本植物\n：\n木質莖較為堅硬，支持力強，通常可持續加粗長高\n莖的外部形態\n配合課本 \nP47", "26": "2-2.2 \n莖\n莖的外部形態\n◆ 木本植物根據高度、分枝及攀爬性，可區分為\n喬木\n、\n灌木\n及\n木質藤本\n楓香\n喬木             \n配合課本 \nP47\n血藤\n木質藤本             \n鵝掌藤\n灌木             ", "27": "2-2.2 \n莖\n莖的特化\n馬鈴薯\n塊莖\n草莓\n走莖\n走莖\n配合課本 \nP48", "28": "2-2.2 \n莖\n莖的特化\n地上的直立莖\n薑\n根莖\n地下的根莖\n柑橘\n刺狀莖\n刺\n配合課本 \nP48", "29": "  \n腦力激盪\n　　本文所舉出的特化莖實例分別有什麼功能？你還可舉出哪些例子？\n答\n：\n1.\n 馬鈴薯的塊莖可儲存養分；草莓的走莖可延伸植物體的範圍，並可在節上長出新個體；薑的根莖可延伸植物體的範圍，並可再長出新芽，內部能儲藏大量養分；柑橘植物莖節上有「刺」，具防禦功能。\n2.\n 劍\n蘭的球莖可儲存養分；竹子有根莖，可延伸植物體的範圍，並可再長出新芽；瓜類植物、百香果（西番蓮）的捲鬚是由側芽長出，利於攀緣；九重葛有側芽刺，利於攀緣與防禦。\n配合課本 \nP48\n29", "30": "  \n知識補給站\n為何馬鈴薯是塊莖，而不是儲藏根？\n       對於形態不典型的構造如馬鈴薯，該如何判斷它是哪個部位特化而成？\n       由於馬鈴薯是從土裡挖出來的，可能會聯想到它應該是根，然而，透過馬鈴薯的生長過程便可得知它是地下莖膨大的結果。\n配合課本 \nP49\n30", "31": "  \n知識補給站\n為何馬鈴薯是塊莖，而不是儲藏根？\n其生長過程為\n：\n① 由主莖基部長出橫走的莖伸入土中\n② \n近頂芽處膨大\n③ \n持續儲存養分而膨大至塊狀\n配合課本 \nP49\n31", "32": "  \n知識補給站\n為何馬鈴薯是塊莖，而不是儲藏根？\n       此外，也可由莖上有節、節上有葉及芽著生來判斷，這是根所沒有的特性。馬鈴薯的芽眼即是其塊莖節上的芽。\n節上葉的痕跡\n芽眼\n配合課本 \nP49\n32", "33": "2-2.2 \n莖\n莖的內部構造\n草本雙子葉植物莖\n表皮\n皮層\n維管束\n韌皮纖維\n韌皮部\n維管束形成層\n木質部\n髓\n配合課本 \nP50", "34": "◆\n \n表皮\n：\n◆\n \n皮層\n：\n◇\n \n單層\n表皮細胞\n排列緊密\n→保護和\n防止水分散失\n◇\n \n具氣孔、角質層\n◇\n \n薄壁細胞排列疏鬆\n→儲存澱粉\n◇\n \n鄰近表皮的薄壁細胞具葉綠體\n→行光合作用\n2-2.2 \n莖\n莖的內部構造\n配合課本 \nP50", "35": "◆\n \n維管束\n：\n◇\n \n環狀排列\n◆\n \n髓\n：\n◇\n \n薄壁細胞排列疏鬆\n→儲存澱粉\n◇\n \n外側為韌皮部，內側為木質部，之間有維管束形成層\n◇\n \n受植物本身生長或壽命的限制，一般無法產生大量維管束組織，莖直徑的增加不明顯\n2-2.2 \n莖\n莖的內部構造\n配合課本 \nP50", "36": "2-2.2 \n莖\n單\n子葉植物莖\n表皮\n維管束\n韌皮部\n木質部\n基本組織\n莖的內部構造\n配合課本 \nP50", "37": "◆\n \n基本組織\n：\n◆\n \n維管束\n：\n◇\n \n排列疏鬆的薄壁細胞\n→儲存澱粉\n◇\n \n缺乏維管束形成層，所以莖無法持續加粗\n◇\n \n散生在基本組織中\n◇\n \n靠近表皮處分布較密集、較小\n2-2.2 \n莖\n莖的內部構造\n配合課本 \nP50", "38": "2-2.2 \n莖\n莖的內部構造\n周皮\n表皮\n樹皮\n維管束形成層\n皮層\n韌皮部\n木質部\n髓\n木材\n初生木質部\n次生木質部\n次生\n韌皮部\n初生\n韌皮部\n木\n本雙子葉植物莖\n配合課本 \nP52", "39": "◆\n木本雙子葉植物莖\n分為三個部分\n：\n1. \n樹皮\n：\n表皮\n→\n木栓層\n→\n木栓形成層\n→\n栓皮層\n→皮層→\n韌皮部\n→\n細胞壁含木栓質，具\n保護\n、\n防止水分散失\n的功能\n(1)\n \n木栓層\n：\n木栓形成層向外分裂形成\n(2)\n \n木栓形成層\n：\n當木本莖持續增粗\n時\n，\n由表皮內\n側\n的皮層\n細胞\n特化而\n成\n→功能與皮層相似\n木栓層\n、\n木栓形成層\n及\n栓皮層\n合稱為\n周皮\n，可取代表皮的保護\n功能\n(3)\n \n栓\n皮\n層\n：\n木栓形成層向\n內\n分裂形成\n2-2.2 \n莖\n莖的內部構造\n整排木棉樹慘被剝皮 恐真菌感染死亡\n配合課本 \nP51", "40": "2-2.2 \n莖\n失去功能的表皮\n木栓層\n木栓形成層\n栓皮層\n皮層\n周皮\n表皮\n皮層\n草\n本雙子葉植物莖\n莖的內部構造\n木本雙子葉植物莖\n配合課本 \nP51", "41": "在成長過程中，木栓層外層常形成破裂缺口，稱為皮孔，植物體可藉由皮孔進行氣體交換\n2-2.2 \n莖\n福祿桐\n皮孔\n0.5\n \nmm\n莖的內部構造\n配合課本 \nP51", "42": "2. \n維管束形成層\n：\n→ 向內增生較向外快，堅硬的木質部組織累積形成木材，而使莖長成粗壯的木質莖\n2-2.2 \n莖\n莖的內部構造\n◆\n木本雙子葉植物莖\n分為三個部分\n：\n配合課本 \nP52", "43": "3. \n木質部 \n(\n木材\n)\n→ 生長季節分明的樹種，木質部細胞會因生長速度差異會形成\n年輪\n2-2.2 \n莖\n莖的內部構造\n◆\n木本雙子葉植物莖\n分為三個部分\n：\n皮層\n周皮\n韌皮部\n維管束形成層\n木質部\n樹皮\n年輪\n配合課本 \nP53", "44": "(2)\n \n秋\n材\n：\n①\n \n生長季節晚期\n (\n夏\n末初秋\n)\n②\n \n又稱\n晚\n材\n③\n \n細胞小而色深\n(1)\n \n春\n材\n：\n①\n \n生長季節早期\n (\n春季\n)\n②\n \n又稱\n早\n材\n③\n \n細胞大而色淺\n→ \n年輪\n由\n春材\n和\n秋\n材\n交替形成\n2-2.2 \n莖\n莖的內部構造\n年輪裡有什麼秘密？\n配合課本 \nP53\n春材（ 早材 ）\n秋材（ 晚材 ）", "45": "2-2.2 \n莖\n莖的內部構造\n周皮\n表皮\n樹皮\n維管束形成層\n皮層\n韌皮部\n木質部\n髓\n木材\n初生木質部\n次生木質部\n次生\n韌皮部\n初生\n韌皮部\n第一年生長季節晚期 \n(\n秋\n材\n)\n第\n二\n年生長季節早期 \n(\n春材\n)\n第\n二\n年生長季節晚期 \n(\n秋\n材\n)\n第一年生長季節早期 \n(\n春材\n)\n配合課本 \nP52 \n、 \n53", "46": "皮層\n周皮\n韌皮部\n維管束形成層\n木質部\n樹皮\n2-2.2 \n莖\n莖的內部構造\n心材\n邊材\n(1)\n \n邊材\n：\n①\n \n外側\n年輕\n的木質部\n②\n \n色淡\n③\n \n具運輸功能\n→\n \n木質部又分為\n邊材\n和\n心材\n(2)\n \n心材\n：\n①\n \n中央部分\n老化的木質部\n②\n \n色深\n③\n \n不具運輸功能\n配合課本 \nP53", "47": "  \n腦力激盪\n　　溫帶地區的雙子葉樹木莖中有年輪，它的根也會有年輪嗎？說明推測的理由。\n答\n：\n因為根的維管束形成層可增生新的木質部組織，以構成木材，但根部組織生長與莖不同，其組織的增生不一定會與莖同步。故根的木材所出現的環紋不一定代表每一年的生長變化（即所謂的年輪）。\n配合課本 \nP53\n47", "48": " \n雙子葉植物莖\n單子葉植物莖\n維管束排列\n \n \n形成層\n \n \n皮質\n \n \n髓\n基本組織\n環狀\n散生\n有\n無\n有\n無\n有\n無\n無\n有\n◆ 莖\n的橫切面之比較\n2-2.2 \n莖\n莖的內部構造\n補充", "49": "莖\n根\n有節和節間\n沒有節和節間\n可長葉子及芽\n不長葉子及芽\n可行\n光合作用\n不可行\n光合作用\n有氣孔或皮孔\n沒有氣孔，但木本植物根具皮孔\n由\n側\n芽長出枝條\n有角質層\n由周鞘長出支根\n無角質層\n◆ 根和莖\n的比較\n2-2 \n植物體的營養器官\n補充", "50": "2-2.3 \n葉\n葉的外部構造\n雙子葉植物\n◆\n \n葉片\n：\n◆\n \n葉柄\n：\n◆\n \n托葉\n：\n◇ \n行光合作用的主要部位\n◇ \n連接葉片與莖\n◇ \n運輸和支持葉片\n托葉\n葉片\n葉柄\n◇ 位\n於葉柄基部\n◇ \n保護芽\n葉的形態與功能\n配合課本 \nP54", "51": "2-2.3 \n葉\n葉的外部構造\n◆\n \n葉片\n：\n◆\n \n葉鞘\n：\n◇ 行光合作用的主要部位\n◇ \n呈鞘狀包在莖上\n◇ \n連接葉片與莖\n◇ \n運輸和支持葉片\n單\n子葉植物\n葉片\n葉鞘\n配合課本 \nP54", "52": "2-2.3 \n葉\n葉的內部構造\n雙子葉植物葉（ 茶樹 ）\n上表皮\n下表皮\n海綿葉肉\n細胞\n柵狀葉肉細胞\n韌皮部\n維管束\n木質部\n氣室\n氣孔\n保衛細胞\n配合課本 \nP55", "53": "2-2.3 \n葉\n葉的內部構造\n單\n子葉植物葉（ \n玉米 ）\n上表皮\n下表皮\n葉肉\n配合課本 \nP55\n氣孔\n氣孔\n維管束\n木質部\n韌皮部\n維管束\n氣室", "54": "◇\n \n通常只有一層細胞\n2-2.3 \n葉\n葉的內部構造\n◆\n \n表皮\n：\n◇\n \n表皮細胞\n不具\n有\n葉綠體\n◇\n \n保衛細胞\n具有葉綠體\n，\n一對保衛細胞與其間的孔洞合稱\n氣孔\n◇\n \n具\n角質層\n，減少水分散失\n配合課本 \nP55", "55": "◇ 在\n接近氣孔處，葉肉細胞常圍出一個大型空腔，稱為\n氣室\n，是氣體暫存與交換的空間\n◆\n \n葉肉\n：\n◇ 光合作用\n的主要場所\n◇\n \n由具葉綠體的薄壁細胞構成\n2-2.3 \n葉\n葉的內部構造\n◇ \n雙子葉植物\n：\n▪ \n柵狀葉肉細胞\n：\n靠近上表皮，細胞多呈長條形，排列較整齊\n▪ \n海綿\n葉肉\n細胞\n：\n靠近下表皮\n，\n細胞形狀不一，排列不整齊，細胞間有許多空隙\n◇ \n單子葉植物\n：\n無上述形態差異\n配合課本 \nP55", "56": "◇\n \n支持平展葉片、運輸水分與養分\n2-2.3 \n葉\n葉的內部構造\n◆\n \n維管束\n：\n◇ 木質部\n位於近上表皮側，韌皮部位於近下表皮側\n◇ 雙子葉植物多為網狀脈，單子葉植物\n多為平行脈\n配合課本 \nP55", "57": "2-2.3 \n葉\n葉的特化\n仙人掌\n刺\n九重葛\n苞葉\n配合課本 \nP56", "58": "2-2.3 \n葉\n葉的特化\n豌豆\n捲鬚葉\n捕蠅草\n捕蟲葉\n配合課本 \nP56", "59": "  \n知識補給站\n苞片、萼片及花瓣都是特化葉\n       九重葛與聖誕紅上的鮮豔苞葉，還有植物在秋冬時節枝條頂芽（營養芽）與花芽（生殖芽）外的鱗片狀構造皆統稱為苞片，其形態雖多樣化，但皆為葉的特化，具有保護功能。同理，花的萼片與花瓣也是具保護作用或吸引傳粉媒介的特化葉。\n苞葉\n苞片\n苞葉\n配合課本 \nP57\n59", "60": "  \n知識補給站\n苞片、萼片及花瓣都是特化葉\n       剝去銀柳的棕色苞片即可看到一個個白色小毛球，這些白毛球是許多雄花聚集而成的雄花序，棕色苞片是花序芽的保護構造。銀柳和臺語的「銀兩」發音很相近，所以常被當作春節的裝飾。\n配合課本 \nP57\n60", "61": "  \n腦力激盪\n　　本文所舉出的特化葉實例分別有什麼功能？你還可舉出哪些例子？\n答\n：\n1. \n仙人掌的「刺」可減少水分散失，並兼具防禦的作用；九重葛的苞葉可吸引昆蟲造訪，協助傳粉；豌豆葉的捲鬚可纏繞於接觸物上，協助植物體攀爬；捕蠅草的捕蟲葉可藉由葉的閉合來困住小型昆蟲，並分泌酵素分解屍體，再吸收含氮養分。\n2. \n麒麟花的刺是托葉的特化，具防禦的作用；豬籠草的葉特化為瓶狀，與毛氈苔葉上的許多腺毛等都是食蟲植物捕捉小蟲的陷阱；炮仗花的小葉捲鬚、印度鞭藤的葉尖反捲皆可協助植物體攀爬。\n配合課本 \nP56\n61", "62": "  \nQuestion\n1. \n下列有關周皮的敘述，哪些正確\n？　\n(\nA)\n木栓層富含木栓質，為不透水可透氣的\n組織　\n(\nB)\n木栓形成層來自靠近表皮的皮層細胞特\n化　\n(\nC)\n具有周皮的植物多為\n木本植物　\n(\nD)\n栓皮層來自次級生長，原始皮層來自初級\n生長　\n(\nE)\n維管束形成層亦可增加周皮厚度。\n解答\n：\n(B)(C)(D)\n \n解析\n：\n(A)\n木栓層不透氣。\n(E)\n維管束形成層向外增生韌皮部，不屬於周皮範圍。\n62", "63": "  \nQuestion\n2. \n下圖是樹幹的部分區域，請依照圖示判斷下列敘述哪些正確？\n(A)1\n、\n3\n是晚材，\n2\n、\n4\n是早\n材　\n(\nB)\n生成順序 \n1\n→\n2\n→\n3\n→\n4\n　\n(\nC)\n從 \n1\n、\n2\n、\n3\n、\n4 \n分成四個區域來判斷，範圍內的細胞至少生長了 \n4 \n年　\n(\nD)\n除了 \n1\n、\n2\n、\n3\n、\n4 \n四個區域外，其餘都是由活細胞\n組成　\n(\nE)\n畫面中除了髓與 \n1\n、\n2\n、\n3\n、\n4 \n四個區域外，其他部分為樹皮。\n63\n髓", "64": "  \nQuestion\n解答\n：\n(B)(E)\n \n解析\n：\n(A)\n \n2\n、\n4\n 是晚材，\n1\n、\n3\n 是早材。\n(C)\n \n1\n、\n2\n 為一年內的生長範圍，故 \n1\n、\n2\n、\n3\n、\n4\n 至少生長了 \n2\n 年。\n(D)\n樹皮中有木栓層，細胞壁含有木栓質，為死細胞。\n64", "65": "  \nQuestion\n3.\n \n多年生木本植物莖的樹皮厚薄不同，尤其是外側的木栓層特別厚。例如\n：\n西班牙栓皮櫟的木栓層很厚，可以拿來當作酒瓶塞。農民在採收木栓層時，通常會在不同時間切割樹幹上不同部位的木栓層，而不會一次把整個樹幹的木栓層剝去（如圖\n一\n）。\n參考課本第 \n2\n 章第 \n2 \n節圖 \n2–19 \n的樹皮組成，回答以下問題\n：\n圖一\n65", "66": "  \nQuestion\n(1)\n 農民所切下的木栓層，包含樹皮所有組成的組織嗎？\n(2)\n 如圖一，採收之後，被切除的部分會再生長回來嗎？如何長出來？\n(3)\n 若樹幹上的樹皮被剝落而露出木質部（如圖\n二\n中箭頭所指處），該處的樹皮會再生長回來嗎？理由為何？\n圖二\n66", "67": "  \nQuestion\n解答\n：\n(1)\n 農民所切下的木栓層只包含樹皮最外面的木栓組織，通常沒有破壞到木栓形成層。\n(2)\n \n外層切除後，仍有剩餘的木栓層及其內的木栓形成層，故仍可藉由木栓形成層的分裂而向外增生新的木栓組織，並把暴露出來的木栓層再向外推出去，其顏色也會漸轉為較深的褐色。\n(3)\n 不會再長出樹皮。樹幹上被剝落的樹皮因已露出木質部，可知是從接近維管束形成層的一些活細胞剝離的。該處所遺留的木質部組成細胞多為死的細胞，不容易再去分化為分生組織，因此無法長出樹皮。\n67"}, "originalCount": 3, "source": {"pdfPages": 16, "printPages": "P42–57", "pptPages": 67}};

function readingBlocks(node){

  if(child.nodeType===3){if(child.textContent.trim()){const p=document.createElement('p');p.textContent=child.textContent;blocks.push(p);}continue;}
  if(child.matches('ul,ol'))for(const li of child.children){const list=document.createElement(child.tagName);list.append(li.cloneNode(true));blocks.push(list);}
  else blocks.push(child.cloneNode(true));
 }return blocks;
}

function splitBlock(node,body){
 // Range fragments keep inline emphasis and every character when a long paragraph needs another page.
 const length=node.textContent.length;if(!length)return [node];const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT),texts=[];let n,offset=0;while(n=walker.nextNode()){texts.push({node:n,start:offset,end:offset+n.length});offset+=n.length;}

}
