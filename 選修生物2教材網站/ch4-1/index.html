: true, "sourceSlide": 11, "requiresReflection": true, "reflectionLabel": "種植例子與判斷理由（只保存，不自動判分）", "reflectionPlaceholder": "使用哪種材料？如何繁殖？沒有經驗可寫教材例子。"}], "tags": {"organ": ["繁殖器官與方式", "辨認根、莖、葉或種子，再檢查繁殖過程。", "課本P108；PPT2、9"], "potential": ["再生能力與條件", "成熟活細胞可能被誘導再生，不等於所有細胞都可無條件成株。", "課本P108–110；PPT3、10"], "evidence": ["觀察與機制推論", "區分照片能看到的現象與需要細胞追蹤驗證的機制。", "課本P109圖4-2；PPT4"], "culture": ["組織培養流程", "取材、培養、分裂、分化、小苗、環境適應是本圖的六步。", "課本P110圖4-3；PPT5–7"], "diversity": ["複製與遺傳多樣性", "比較一般趨勢與實際條件；複製不保證完全沒有變異。", "課本P108–110；PPT11"]}, "conceptMap": {"organ": 1, "potential": 2, "evidence": 3, "culture": 5, "diversity": 7}, "pptText": {"1": "4-1.1 \n植物細胞的全潛能性\n4-1 \n被子植物的無性生殖\n1", "2": "4-1 \n被子植物的無性生殖\n◆ \n營養繁殖\n：\n藉由\n根\n、\n莖\n及\n葉\n等\n構造的片段\n產生\n子代\n柳樹的莖\n蓮花\n的\n塊莖\n配合課本 \nP108\n落地生根的葉\n葉\n芽\n大理花的塊根\n塊根", "3": "◆ 植物之所以能進行營養繁殖，是因為其多數細胞在成熟後，仍能被誘導而進行分裂與特化，稱為\n全潛能性\n4-1.1 \n植物細胞的全潛能性\n◆ 以\n成熟樹幹上\n長出\n新分枝為\n例\n：\n樹皮內成熟的活細胞，如皮層細胞或韌皮部細胞\n分裂並特化形成\n莖的頂端\n分生組織\n進一步分裂並特化為新的莖、葉組織\n突出樹皮形成新分枝\n多樣的繁殖方式\n縮時攝影：落地生根\n配合課本 \nP108\n、\n109", "4": "4-1.1 \n植物細胞的全潛能性\n小葉欖仁的主幹因颱風而折斷\n一個月之後，有枝枒從仍有殘留樹皮的樹幹上長出\n無樹皮\n有樹皮\n配合課本 \nP109", "5": "4-1.1 \n植物細胞的全潛能性\n◆ \n組織培養\n：\n利用植物細胞的全潛能性，在無菌環境中，以含有特定\n植物激素\n與\n營養成分\n的培養基誘導一小塊活組織的生長，可大量產生所選定優良品種的複製個體\n配合課本 \nP110\n參考\n影片\nPlant Reproduction: Asexual Reproduction (\nBritannica.com\n)\nhttps://www.youtube.com/watch?v=NfPP2CQGuC0\n◆", "6": "4-1.1 \n植物細胞的全潛能性\n①\n \n取\n成熟植株的活組織經特殊處理\n② 以\n培養基進行培養\n③ 細胞分裂形成未分化的細胞團（癒傷組織）\n④ \n細胞\n分化形成根、芽等構造\n配合課本 \nP110", "7": "4-1.1 \n植物細胞的全潛能性\n⑤ 植物體生長為小苗\n⑥ 植物體\n移出培養基，經環境適應成為複製個體\n植物的組織培養\n智慧農業－\n\n組織培養苗智慧化生產管理\n配合課本 \nP110", "8": "  \n知識補給站\n組織培養與植物細胞全潛能性的發現\n       \n1885\n 年\n德國\n動物學家\n胡斯\n最早分離出部分雞胚的組織，放在保溫的生理食鹽水中培養長\n達 \n13\n 天\n，此實驗建立了將活組織分離至試管中培養的基礎原理。\n       植物細胞的全潛能性是\n在 \n1902\n 年\n由\n奧地利\n植物學家\n哈伯蘭德\n所提出，他認為\n：\n「理論上，每個體細胞的細胞核都含有個體發育的全部基因，只要條件許可，所有植物細胞都可發育成完整植株」，並稱此特性為「\ntotipotentiality\n」，意即藉由組織培養以及組織間相互影響，可以將分離出來的活細胞或組織獨立培養成完整個體。\n配合課本 \nP110\n8", "9": "  \nQuestion\n1\n. \n下列植物的繁殖方式，何者是有性生殖\n？　\n(\nA)\n西瓜利用種子\n繁殖　\n(\nB)\n番薯利用塊根\n繁殖　\n(\nC)\n蓮藕利用莖\n繁殖　\n(\nD)\n使茶樹枝條發根，種植後產生新植株 \n(E)\n取金線蓮部分組織，誘使發根、發芽長成新植株。\n【106.\n學測\n】\n解答\n：\n(\nA)\n解析\n：\n(\nB\n)(\nC\n)(\nD)\n是利用營養器官繁殖\n，\n(\nE)\n是植物的組織培養，皆為無性生殖。\n9", "10": "  \nQuestion\n2. \n下列有關植物細胞全潛能性的敘述，何者正確\n？　\n\n(\nA)\n植物成體僅剩分生組織具有分化的\n可能性　\n(\nB)\n薄壁組織可經誘導刺激形成分生組織，繼而分裂與分化為完整\n植株　\n(\nC)\n所有的植物細胞都具有全潛能\n性　\n\n(\nD)\n選用葉片的薄壁細胞進行組織培養僅能分化發育為葉片。\n解答\n：\n(\nB)\n解析\n：\n(\nA)\n植物的多數細胞能被誘導，而進行分裂與特化。\n(C)\n植物的厚壁細胞是死細胞。\n(D)\n植物的多數細胞都具有全潛能性，可分化為完整的植株。\n10", "11": "  \nQuestion\n3.\n 在日常生活中，我們都可能種過花草。經由本章的介紹，你當初種植時所應用的是植物的無性生殖還是有性生殖呢？此外，你認為植物採用無性或有性生殖方式繁衍，分別有何優、缺點？\n類\n　\n型\n優\n　\n點\n缺\n　\n點\n無性生殖\n快速產生大量子代\n較不能適應多變的環境\n有性生殖\n子代基因多樣性高，在多變環境下仍有可存活的個體\n子代\n產生\n的\n效\n率較慢\n解答\n：\n11"}, "originalCount": 3};

function flipShow(i){FI=Math.max(0,Math.min(FL.length-1,i));el('fimg').src=IMG[FL[FI][0]];el('fimg').alt=FL[FI][2];el('fno').textContent=`${FI+1} / ${FL.length}`;el('fcap').textContent=FL[FI][2];fit();el('fdots').innerHTML=FL.map((x,j)=>`<button class="${j===FI?'on':''}" data-j="${j}" aria-label="第 ${j+1} 步：${esc(x[2])}"></button>`).join('');el('fdots').querySelectorAll('button').forEach(b=>b.onclick=()=>{flipStop();flipShow(+b.dataset.j)});}

function targetHTML(s,id,label){const d=draft(s),p=s.pieces.find(x=>x.id===d.place[id]),given=id in (s.pre||{}),n=s.slots.findIndex(x=>x.id===id)+1;return `<button class="target ${p?'filled':''} ${given?'given':''}" data-slot="${id}" ${given?'aria-disabled="true"':''} aria-label="第 ${n} 格${label?' '+esc(label):''}${p?'：'+esc(p.label):'，尚未放置'}"><span class="target-no">${n}</span><span>${p?esc(p.label):(label?esc(label)+' · 待放':'點選卡片後放這裡')}${given?'<small>已給答案 · 鎖定</small>':''}</span></button>`;}
function candidatesHTML(s){const d=draft(s),placed=new Set(Object.values(d.place)),available=s.pieces.filter(p=>!Object.values(s.pre||{}).includes(p.id));let perm=available.map((p,i)=>[p,(i*7+QI*11+3)%17]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);return `<aside class="candidate-area"><h3>選擇答案 <span style="font-size:12px;font-weight:400">${available.length} 張</span></h3><div class="candidates">${perm.map(p=>`<button class="candidate ${selected===p.id?'selected':''} ${placed.has(p.id)?'used':''}" data-piece="${p.id}" draggable="${!result(s).passed}" aria-pressed="${selected===p.id}"><span>${placed.has(p.id)?'✓ ':selected===p.id?'● ':''}${esc(p.label)}</span></button>`).join('')}</div><p class="candidate-help">點卡片，再點目標 · ✓ 已放入</p></aside>`;}
function renderQuestion(){const s=STAGES[QI],d=draft(s);let main='';if(s.kind==='drag'){
