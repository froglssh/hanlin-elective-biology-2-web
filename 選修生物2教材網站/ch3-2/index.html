const CONTENT={"lessons": [{"id": "b2-32-l01", "t": "水如何從根抵達葉？", "src": "課本 P74；原PPT第 1 頁–2 頁", "slide": 1, "figSpec": {"flip": [1, 2]}, "txt": "<ul><li>水與無機鹽進入根的木質部後，沿莖運送到葉。</li><li>本節追蹤三種機制：<b>根壓、毛細作用與蒸散拉力</b>。</li><li>先辨認水在哪裡，再問使它移動的力從哪裡來。</li></ul><p class=\"think\">思考：切斷莖後仍有汁液流出，能支持哪一類運輸動力？</p><div class=\"quote\">3-2 <br>植物體內水與無機鹽的運輸<br>3-2.1 <br>水分在木質部運輸的機制<br>1<small>原PPT第 1 頁（完整原文）</small></div><div class=\"quote\">3-2 <br>植物體內水與無機鹽的運輸<br>→ <br>根壓<br>、<br>毛細作用<br>與<br>蒸散作用<br>◆ 由根部吸收的水與無機鹽在進入根中柱的木質部後，是如何向上運輸到莖與葉等部位呢？<br>將植物由莖的基部切斷，切口處即流出汁液<br>水和無機鹽在植物體<br>內運輸的機制<small>原PPT第 2 頁（完整原文）</small></div><div class=\"quote\">由根部吸收的水與無機鹽在進入根中柱的木質部<br>後，是如何向上運輸到莖與葉等部位呢？<br>3-2.1 水分在木質部運輸的機制<br>木質部內的水分往上單向運輸至植物體各部位，其<br>運輸的動力來自根壓、毛細作用與蒸散作用。<br>根　壓<br>將植物由莖的基部切斷，一段時間後觀察切口處會<br>流出汁液（圖 3－3），這是因為根的中柱內滲透壓較高<br>且水勢較低，故水能自土壤中不斷地滲入中柱細胞內，<br>進而產生向上推擠的力量，將水送至植物的地上部，這<br>種因滲透產生的壓力稱為根壓（圖 3－4a），是根推動<br>水分的基本動力。<br>草本植物可藉根壓運輸水分與無機鹽，然而在數十<br>公尺高的木本植物中，僅藉根壓不足以推送至末端的枝<br>葉，主要藉由毛細作用與蒸散作用所產生的拉力來接續<br>物質的運輸。<br>毛細作用<br>因木質部的導管與管胞管徑細窄，水分子與管壁間<br>的附著力及水分子間的內聚力產生毛細作用，形成從<br>根、莖至葉的連續水柱，持續向上輸送（圖 3－4b）。<br>蒸散作用<br>蒸散作用是指水蒸氣由植物體表面散失的過程，是<br>水分運輸的主要動力（圖 3－4c）。<br>根壓　root pressure<br>毛細作用　capillarity<br>蒸散作用　transpiration<br> 圖 3－3　 <br>根壓使黃豆幼苗的切口流出<br>汁液<br>泌溢現象<br>當夜晚溼度高、氣溫低<br>時，植物氣孔關閉，造成蒸<br>散作用減弱或暫停。然而草<br>本植物會因根壓作用使水分<br>仍持續運輸到葉部，造成多<br>餘水分無法由氣孔蒸散，只<br>好從葉緣的排水孔排出，於<br>是可以在清晨觀察到葉子邊<br>緣有整齊的水珠。<br> 草莓葉子的泌溢現象<br>知識補給站<br>-2 植物體內水與無機鹽的運輸<br>3<br>74　選修生物 Ⅱ (全)<small>課本 PDF 第 1 頁，印刷 P74（完整原文）</small></div>", "tb": [["BOOK1", "P74 完整課本頁"]], "sec": "s1"}, {"id": "b2-32-l02", "t": "根壓：離子累積後的滲透推力", "src": "課本 P74；原PPT第 3 頁", "slide": 3, "figSpec": {"image": "rootpanel"}, "txt": "<ul><li>根部細胞調控離子進入中柱，使水沿水勢梯度移動。</li><li>水滲入木質部，形成由根向上的<b>正壓推力</b>，稱為根壓。</li><li>切斷莖後的汁液滲出，是觀察根壓的教材例子。</li></ul><p class=\"think\">思考：根壓來自毛細作用，還是溶質累積造成的滲透？</p><p class=\"scope-note\">適用範圍：圖中的水勢排序是教材設定的情境；實際水勢也受壓力等條件影響，不能只看濃度。</p><div class=\"quote\">◆ 說明<br>：<br>3-2.1 <br>水分在木質部運輸的機制<br>根壓<br>滲透壓<br>：<br>土壤<br>&lt;<br>表皮<br>&l 木本植物中，僅藉根壓不足以推送至末端的枝<br>葉，主要藉由毛細作用與蒸散作用所產生的拉力來接續<br>物質的運輸。<br>毛細作用<br>因木質部的導管與管胞管徑細窄，水分子與管壁間<br>的附著力及水分子間的內聚力產生毛細作用，形成從<br>根、莖至葉的連續水柱，持續向上輸送（圖 3－4b）。<br>蒸散作用<br>蒸散作用是指水蒸氣由植物體表面散失的過程，是<br>水分運輸的主要動力（圖 3－4c）。<br>根壓　root pressure<br>毛細作用　capillarity<br>蒸散作用　transpiration<br> 圖 3－3　 <br>根壓使黃豆幼苗的切口流出<br>汁液<br>泌溢現象<br>當夜晚溼度高、氣溫低<br>時，植物氣孔關閉，造成蒸<br>散作用減弱或暫停。然而草<br>本植物會因根壓作用使水分<br>仍持續運輸到葉部，造成多<br>餘水分無法由氣孔蒸散，只<br>好從葉緣的排水孔排出，於<br>是可以在清晨觀察到葉子邊<br>緣有整齊的水珠。<br> 草莓葉子的泌溢現象<br>知識補給站<br>-2 植物體內水與無機鹽的運輸<br>3<br>74　選修生物 Ⅱ (全)<small>課本 PDF 第 1 頁，印刷 P74（完整原文）</small></div>", "tb": [["BOOK1", "P74 完整課本頁"]], "sec": "s5"}, {"id": "b2-32-l17", "t": "原題三：蒸散因素與缺水反應", "src": "課本 P77；原PPT第 20 頁", "slide": 20, "figSpec": {"flip": [20]}, "txt": "<ul><li>原題以水分供應與氣溫適當為背景，答案是 A、C。</li><li>空氣溼度過高，水蒸氣散失的梯度減小。</li><li>土壤含水量大減，可能引發氣孔關閉；不能只看高溫或光照。</li></ul><p class=\"think\">思考：為何題目的「適當範圍內提高」不能省略？</p><div class=\"quote\">  <br>Question<br>3<br>. <br>下列哪些因素會增強植物的蒸散作用<br>？　<br>(<br>A)<br>光合作用<br>旺盛　<br>(<br>B)<br>氣孔周圍空氣的溼度<br>過高　<br>(<br>C)<br>周圍氣溫在適當範圍內<br>提高　<br>(<br>D)<br>葉內氧氣的濃度<br>下降　<br>(<br>E)<br>土壤中的含水量大幅減少。<br>解答<br>：<br>(A)(C)<br>解析<br>：<br>(B)<br>溼度過高不利水蒸氣蒸散，蒸散作用減弱。 <br>(D)<br>氧氣濃度不直接影響氣孔開閉。<br>(E)<br>缺水環境下氣孔會關閉。<br>20<small>原PPT第 20 頁（完整原文）</small></div><div class=\"quote\">剪<br> <br>斷絲瓜藤<br>自地面上方處剪斷<br>擇沒有結瓜的粗藤<br>傍晚時處理較佳<br>選<br> <br>收  <br>集流出的汁液<br>將剪斷的蔓藤一端插入乾淨的瓶子<br>中，包住瓶口以防止異物或水進入<br>製 <br>成絲瓜水<br>將收集好的汁液靜置 3∼<br>7 天，過濾雜質後，即為<br>製成的絲瓜水<br>切斷絲瓜藤後，從遠根端（右圖 A 處）<br>還是近根端 （右圖 B 處）能收到較多<br>的絲瓜水？原理是什麼？<br>想想看<br>A<br>B<br>自古以來，民間利用絲瓜水來解毒、清熱，也因為絲瓜<br>水含有醣類、維生素及黏液等，平時還可用它來保養、滋潤<br>及美白肌膚。絲瓜水從何而來？原來主要是絲瓜藤中運輸的<br>水分。<br>腦力激盪<br>影響蒸散作用的因素<br>光照、氣溫、溼度、風、葉內二氧化碳含量等環境因素以及植物體的構造，皆會影響<br>蒸散作用的效率。環境因素通常會共同影響氣孔開閉，進而影響蒸散量，例如：藍光可促<br>進氣孔打開，促使葉肉細胞行光合作用降低葉內二氧化碳的含量，更可使氣孔維持開啟狀<br>態而導致蒸散量增加。氣溫過高時，蒸散作用還可以降低葉面溫度。但植株內水分不足<br>時，即使葉片溫度增加，氣孔仍會關閉，使蒸散量下降。空氣流動愈快，蒸散速率愈快，<br>但若空氣溼度過低，則會使氣孔關閉、蒸散速率減緩。植物體本身的構造，例如：葉面積<br>的大小、角質層的厚薄、葉面是否有毛茸、氣孔的分布位置和數量，都會影響蒸散作用。<br>第 3 章  植物體內物質的吸收、合成及運輸　77<small>課本 PDF 第 4 頁，印刷 P77（完整原文）</small></div>", "tb": [["BOOK4", "P77 完整課本頁"]]}, {"id": "b2-32-l18", "t": "原題四：固定橫軸，再比較兩條曲線", "src": "課本 P76；原PPT第 21 頁–22 頁", "slide": 21, "figSpec": {"image": "originalgraph"}, "txt": "<ul><li>橫軸是保衛細胞膨壓，縱軸是氣孔寬度。</li><li>固定同一保衛細胞膨壓，比較周圍表皮細胞膨壓 0 與 0.9 MPa 的曲線。</li><li>此圖支持原答案 B；兩個條件不足以推出所有表皮膨壓值的通則。</li></ul><p class=\"think\">思考：選項 D 與 B 的差別，是哪一個控制條件與推論範圍？</p><p class=\"scope-note\">適用範圍：原解析「2 MPa 以上才打開」照錄，但不是普遍閾值。Franks 等（1998）的特定實驗報告約 1.25 MPa；教材圖為簡化判讀，仍以相同橫軸值比較。原題中文植物名與學名照錄，依學名辨識研究對象。<a href=\"https://onlinelibrary.wiley.com/doi/full/10.1046/j.1365-3040.1998.00248.x\" target=\"_blank\" rel=\"noopener\">原始研究</a>。</p><div class=\"quote\">  <br>Question<br>4. <br>右圖是科學家利用壓力探針測量圓葉鴨跖草（<br>Tradescantia virginiana<br>）保衛細胞膨壓與其周圍表皮細胞膨壓變化與氣孔寬度相關性的數據，請依此數據判斷下列何者正確<br>？　<br>(<br>A)<br>保衛細胞周圍表皮細胞的膨壓提升會降低保衛細胞的膨<br>壓　<br>(<br>B)<br>在相同保衛細胞膨壓下，周圍表皮細胞的膨壓較高時，會降低氣孔<br>寬度　<br>(<br>C)<br>保衛細胞周圍的表皮細胞若含水量增加，也會讓氣孔寬度變<br>大　<br>(<br>D)<br>周圍表皮細胞的膨壓愈高，氣孔寬度愈小。<br>21<small>原PPT第 21 頁（完整原文）</small></div><div class=\"quote\">  <br>Question<br>解答<br>：<br>(B)<br>解析<br>：<br>從題圖中可知，相同保衛細胞膨壓下，周圍表皮細胞膨壓提高到 <br>0.9<br> <br>MPa<br> <br>時，會顯著減少氣孔寬度，保衛細胞的膨壓要提高到 <br>2<br> <br>MPa<br> <br>以上氣孔才打開<br>。<br>(<br>A)<br>保衛細胞周圍的表皮細胞膨壓提升會降低氣孔寬度，而非降低保衛細胞膨壓<br>。<br>(<br>C)<br>含水量增加表示膨壓增加，會減少氣孔寬度<br>。<br>(<br>D)<br>題圖中僅顯示周圍表皮細胞 <br>0<br> <br>MPa<br>、<br>0.9<br> <br>MPa<br> <br>時氣孔寬度的變化，無其他數據判斷。<br>22<small>原PPT第 22 頁（完整原文）</small></div><div class=\"quote\">當水自葉表面蒸散後，對木質部中的水形<br>成負壓，拉動葉肉細胞間隙的水，使木質部內<br>的水滲出至葉肉細胞間隙，牽引木質部中的連<br>續水柱不斷從根部向上運輸至莖與葉。<br>事實上，植物根所吸收的水，除了少部分<br>供植物生長與代謝利用之外，大部分都會因蒸<br>散作用而散失，因為在植物進行光合作用時，<br>氣孔會打開以利二氧化碳進入葉內，但同時水<br>蒸氣也會由氣孔散失（圖 3－5）。<br>微纖絲　microfibril<br>氣孔開閉機制<br>氣孔開閉受環境因子的影響，例如：藍光。若植物體內含水量充足，保衛細胞膜上的藍光受體接受藍<br>光刺激時，會促使鉀離子進入細胞內，使得胞內滲透壓上升且水勢下降，水因而滲透流入胞內，保衛細胞<br>吸水膨脹，膨壓也跟著增加，使氣孔打開（如下圖）。<br>當細胞吸水膨脹時，細胞壁上的纖維素微纖絲因橫向平行排列，使細胞只能向縱徑擴大，又因保衛細<br>胞細胞壁有不均勻增厚現象，外側細胞壁較內側薄、易延長，因而使保衛細胞彎曲，延伸造成氣孔張開。<br>若是光合作用進行時，細胞內CO2 濃度下降，氣孔也會打開以利氣體交換。然而當細胞受到某些植<br>物激素的刺激後，會促進鉀離子離開保衛細胞，使滲透壓下降且水勢上升，水因滲透作用離開細胞，最後<br>膨壓下降，氣孔關閉。<br>知識補給站<br ": "腦力激盪：絲瓜水從哪一端流出？", "q": "切斷絲瓜藤後，從遠根端（右圖 A 處）還是近根端（右圖 B 處）能收到較多的絲瓜水？原理是什麼？", "sub": "課本 P77；原PPT第17頁腦力激盪與延伸判讀", "learn": 14, "tag": "root", "hint": "逐一判讀，先找出比較條件，再確認水的狀態、位置與因果。", "why": "原教材答案是近根端 B。連接根部的一端可受根壓推動而流出汁液；原答的單方向是此情境的淨輸送概括，不能推論木質部具有單向閥。本題只探討運輸，不以收集實驗證明絲瓜水的功效。", "refs": [{"src": "luffacut", "cap": "課本 P77；原PPT第17頁腦力激盪與延伸判讀"}], "fig": "luffacut", "kind": "fill", "imageWidth": 560, "figCaption": "原PPT第17頁 A、B 圖", "rows": [{"q": "教材預期流出較多的部位", "o": ["近根端 B", "遠根端 A", "兩端必定完全相等"], "tag": "root"}, {"q": "主要解釋", "o": ["近根端連接根，根壓可推動汁液", "氣孔直接把液態水噴入瓶中", "絲瓜有木質部單向閥"], "tag": "root"}, {"q": "比較兩端時應如何收集", "o": ["同時段收集並控制供水等條件", "兩端收集時間可以任意不同", "只比較瓶子的顏色"], "tag": "root"}]}, {"t": "原題一：植物水分運輸", "q": "下列有關植物水分運輸的敘述，哪些正確？", "sub": "原PPT第18頁原題【108指考修訂】；課本 P74–77", "learn": 15, "tag": "forces", "hint": "只根據題目給定的條件與資料判讀；檢查每個敘述是否過度概括。", "why": "原解答 B、D。卡氏帶限制質外體路徑直接通過內皮；原生質絲連接細胞。根壓來自離子累積與滲透，菌根協助吸收。教材區分木質部蒸散流與韌皮部壓力流用語，不代表木質部流動沒有壓力梯度。", "refs": [{"src": "PPT18S3", "cap": "原PPT第18頁完整原題"}], "kind": "multi", "opts": [{"t": "水分可沿細胞壁及細胞間隙通過根部內皮的細胞壁而進入木質部", "ok": false, "tag": "forces"}, {"t": "細胞之間相連的原生質絲提供水分進入木質部的途徑", "ok": true, "tag": "forces"}, {"t": "根壓是由於根部維管束強烈的毛細作用而形成的作用力", "ok": false, "tag": "forces"}, {"t": "共生性的真菌菌根有助於植物根部吸收水分與無機鹽", "ok": true, "tag": "forces"}, {"t": "植物的莖部木質部利用壓力流使水分自然上升。", "ok": false, "tag": "forces"}], "sourceSlide": 18, "original": true}, {"t": "原題二：哪些作用力相關？", "q": "下列哪些現象或作用力與植物水分運輸的機制相關？", "sub": "原PPT第19頁原題；課本 P74–77", "learn": 15, "tag": "forces", "hint": "只根據題目給定的條件與資料判讀；檢查每個敘述是否過度概括。", "why": "原解答 A、B、D。根部離子累積所產生的濃度梯度有助形成根壓，水分子間氫鍵及與管壁的附著力協助水柱連續。蒸散仍是教材強調的主要輸水動力。", "refs": [{"src": "PPT19S3", "cap": "原PPT第19頁完整原題"}], "kind": "multi", "opts": [{"t": "根部細胞主動運輸所產生的濃度梯度", "ok": true, "tag": "forces"}, {"t": "水分子間的氫鍵", "ok": true, "tag": "forces"}, {"t": "大氣壓力", "ok": false, "tag": "forces"}, {"t": "水分子與管壁的附著力", "ok": true, "tag": "forces"}, {"t": "光合作用的光水解。", "ok": false, "tag": "forces"}], "sourceSlide": 19, "original": true}, {"t": "原題三：增強蒸散的因素", "q": "下列哪些因素會增強植物的蒸散作用？", "sub": "原PPT第20頁原題；課本 P74–77", "learn": 16, "tag": "environment", "hint": "只根據題目給定的條件與資料判讀；檢查每個敘述是否過度概括。", "why": "原解答 A、C。溼度過高不利蒸散；氧氣濃度不直接作為本題的開閉孔訊號。土壤水分大幅減少可促進氣孔關閉。C 的「適當範圍內」與供水條件不可省略。", "refs": [{"src": "PPT20S3", "cap": "原PPT第20頁完整原題"}], "kind": "multi", "opts": [{"t": "光合作用旺盛", "ok": true, "tag": "environment"}, {"t": "氣孔周圍空氣的溼度過高", "ok": false, "tag": "environment"}, {"t": "周圍氣溫在適當範圍內提高", "ok": true, "tag": "environment"}, {"t": "葉內氧氣的濃度下降", "ok": false, "tag": "environment"}, {"t": "土壤中的含水量大幅減少。", "ok": false, "tag": "environment"}], "sourceSlide": 20, "original": true}, {"t": "原題四：氣孔膨壓的數據判讀", "q": "右圖是科學家利用壓力探針測量圓葉鴨跖草（Tradescantia virginiana）保衛細胞膨壓與其周圍表皮細胞膨壓變化與氣孔寬度相關性的數據，請依此數據判斷下列何者正確？", "sub": "原PPT第21頁原題；課本 P74–77", "learn": 17, "tag": "evidence", "hint": "只根據題目給定的條件與資料判讀；檢查每個敘述是否過度概括。", "why": "原解答 B。固定相同橫軸值，比較周圍表皮細胞膨壓為 0 與 0.9 MPa 的兩條曲線：後者氣孔寬度較小。A 混淆氣孔寬度與保衛細胞膨壓，C 與圖示方向相反，D 超出兩個比較條件。原解析的「2 MPa」照錄於來源與圖解，但不是普遍開孔閾值；原始研究在特定條件下約 1.25 MPa。", "refs": [{"src": "PPT21S3", "cap": "原PPT第21頁完整原題"}, {"src": "PPT22S3", "cap": "原PPT第22頁完整原解析"}], "fig": "originalgraph", "kind": "single", "opts": [{"t": "保衛細胞周圍表皮細胞的膨壓提升會降低保衛細胞的膨壓", "ok": false, "tag": "evidence"}, {"t": "在相同保衛細胞膨壓下，周圍表皮細胞的膨壓較高時，會降低氣孔寬度", "ok": true, "tag": "evidence"}, {"t": "保衛細胞周圍的表皮細胞若含水量增加，也會讓氣孔寬度變大", "ok": false, "tag": "evidence"}, {"t": "周圍表皮細胞的膨壓愈高，氣孔寬度愈小。", "ok": false, "tag": "evidence"}], "sourceSlide": 21, "original": true}], "tags": {"forces": ["運輸動力與吸收路徑", "分開溶質累積與滲透、毛細作用、蒸散拉力；跨越內皮須注意卡氏帶。", "課本 P74–75；原PPT第3、6、18–19頁"], "root": ["根壓與泌溢", "檢查是否仍連接根、蒸散強弱與水的狀態；不要把所有草本固定歸因於根壓。", "課本 P74、77；原PPT第3–5、16–17頁"], "pull": ["蒸散與連續水柱", "從葉肉壁表面水膜的蒸發開始，沿負壓與水柱追蹤到根。", "課本 P75–76；原PPT第7–10頁"], "stoma": ["氣孔的構造與滲透", "離子累積、水勢下降、水進入、膨壓上升與形狀改變依序連結。", "課本 P76；原PPT第11–12頁"], "environment": ["環境因素與缺水反應", "同時考慮水分、適當溫度、光、CO₂、溼度與風，避免無條件概括。", "課本 P77；原PPT第13–15、20頁"], "evidence": ["控制變項與推論範圍", "固定保衛細胞膨壓比較兩條曲線；只有兩種表皮膨壓，不能推出所有條件。", "原PPT第21–22頁；課本 P76"]}, "conceptMap": {"forces": 4, "root": 1, "pull": 6, "stoma": 10, "environment": 13, "evidence": 17}, "pptText": {"1": "3-2 \n植物體內水與無機鹽的運輸\n3-2.1 \n水分在木質部運輸的機制\n1", "2": "3-2 \n植物體內水與無機鹽的運輸\n→ \n根壓\n、\n毛細作用\n與\n蒸散作用\n◆ 由根部吸收的水與無機鹽在進入根中柱的木質部後，是如何向上運輸到莖與葉等部位呢？\n將植物由莖的基部切斷，切口處即流出汁液\n水和無機鹽在植物體\n內運輸的機制", "3": "◆ 說明\n：\n3-2.1 \n水分在木質部運輸的機制\n根壓\n滲透壓\n：\n土壤\n<\n表皮\n<\n皮層\n<\n中柱\n水勢\n：\n土壤\n>\n表皮\n>\n皮層\n>\n中柱\n水自土壤滲入中柱，進而產生向上推擠的力量\n這種因滲透所產生的壓力稱為根壓\n將植物由莖的基部切斷，切口處即流出汁液\n配合課本 \nP74", "4": "  \n知識補給站\n泌溢現象\n       當\n夜晚溼度高\n、\n氣溫低\n時，植物\n氣孔關閉\n，造成\n蒸散作用\n減弱或暫停。然而草本植物會因\n根壓作用\n使水分仍持續運輸到葉部，造成多餘水分無法由氣孔蒸散，只好從葉緣的\n排水孔\n排出，於是可以在清晨觀察到葉子邊緣有整齊的水珠。\n草莓葉子的泌溢現象\n配合課本 \nP74\n4", "5": "◆\n \n草本植物\n木質部中水分運輸的主要動力\n◆ \n木本植物\n木質部中水分運輸的主要動力\n3-2.1 \n水分在木質部運輸的機制\n→ 主要是\n根壓\n→ 除了\n根壓\n，尚需\n毛細作用\n、\n蒸散作用\n配合課本 \nP74", "6": "3-2.1 \n水分在木質部運輸的機制\n毛細作用\n◆\n 說明\n：\n水分子\n和\n水分子\n之間的內聚力\n水分子\n和\n管壁\n之間的附著力\n產生毛細作用，形成連續水柱\n水的內聚力\n水的附著力\n配合課本 \nP74 \n、\n75\n細胞壁", "7": "3-2.1 \n水分在木質部運輸的機制\n配合課本 \nP74 \n、\n75\n蒸散作用\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n葉脈\n葉肉細胞\n表皮細胞\n保衛細胞\n◆ 說明\n：\n蒸散作用是指水蒸氣由植物體表面散失的過程，是水分運輸的主要動力\n：\n蒸散作用還可降低葉面的溫度\n註", "8": "3-2.1 \n水分在木質部運輸的機制\n蒸散作用\n配合課本 \nP74\n～\n76\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n水\n葉脈\n葉肉細胞\n表皮細胞\n保衛細胞\n水自葉表面蒸散\n表面張力改變\n，\n產生負壓，\n拉動葉肉細胞間隙的水\n木質部內水滲出至葉肉細胞間隙，牽引木質部中的連續水柱\n水柱\n不斷從根部往上運輸至莖與葉", "9": "3-2.1 \n水分在木質部運輸的機制\n◆ 植物進行光合作用時，氣孔會打開以利二氧化碳進入葉內，但同時水蒸氣也會由氣孔散失\n◆ 植物根所吸收的水，除了少部分供植物生長與代謝利用之外，大部分都會因蒸散作用而散失\n配合課本 \nP74\n～\n76\n蒸散作用", "10": "3-2.1\n葉肉細胞\n葉脈\n葉肉細胞\n間隙\n保衛細胞\n氣孔\n蒸散作用\n毛細作用\n根壓\n根毛\n木質部\n配合課本 \nP75\n水分在木質部運輸的機制", "11": "  \n知識補給站\n氣孔開閉機制\n◇\n \n外側細胞壁較薄，內側細胞壁較厚\n◇\n \n纖維素微纖絲橫向平行排列\n◆ 保衛細胞細胞壁的構造\n：\n微纖絲\n配合課本 \nP76\n11", "12": "  \n知識補給站\n氣孔開閉機制\n水\nK\n+\nK\n+\n \n進入保衛細胞 \n(\n主動運輸\n)\n保衛細胞水勢下降\n水進入保衛細胞 \n(\n滲透作用\n)\n保衛細胞膨壓增加\n保衛細胞向外彎曲\n◆ 氣孔開閉機制\n：\n氣孔開啟\n配合課本 \nP76\n12", "13": "3-2.1 \n水分在木質部運輸的機制\n影響蒸\n散\n作用的因素\n◇ \n植物體的構造\n▪ \n葉面積的大小\n▪ \n角質層的厚薄\n▪ \n葉面是否有毛茸\n▪ \n氣孔的分布位置、數目\n配合課本 \nP77", "14": "◇ 影響氣孔開閉的因素\n，也\n會影響蒸散作用\n3-2.1 \n水分在木質部運輸的機制\n▪\n \n藍光\n保衛細胞細胞膜上的藍光受體接收藍光\n氣孔打開\n進行光合作用時，\n葉\n內 \nCO\n2\n \n濃度下降\n▪\n \nCO\n2\n \n濃度\n氣孔打開\n配合課本 \nP77\n影響蒸\n散\n作用的因素", "15": "3-2.1 \n水分在木質部運輸的機制\n▪\n \n溫度\n葉面溫度升高\n氣孔打開\n，促進蒸散作用以利降溫\n▪\n \n水分\n氣孔關閉\n植株水分不足\n離層酸\n（ \n植物激素\n \n）\n增加\n空氣流動愈快，蒸散速率愈快，但若造成溼度過低\n▪\n 溼度\n◇ \n以上\n因素通常會共同影響氣孔開閉\n氣孔關閉\n配合課本 \nP77\n影響蒸\n散\n作用的因素", "16": "  \n腦力激盪\n       自古以來，民間利用絲瓜水來解毒、清熱，也因為絲瓜水含有醣類、維生素及黏液等，平時還可用它來保養、滋潤及美白肌膚。絲瓜水從何而來？原來主要是絲瓜藤中運輸的水分。\n擇沒有結瓜的粗藤\n選\n剪\n收\n製\n斷絲瓜藤\n集流出的汁液\n成絲瓜水\n傍晚時處理較佳\n自地面上方處剪斷\n將\n剪斷的蔓藤一端\n插入乾淨的瓶子中，包住瓶口以防止異物或水進入\n將\n收好的汁液靜置 \n3~7\n 天，過濾雜質後，即為製成的絲瓜水\n本土農產立大功 絲瓜水年產百萬瓶\n配合課本 \nP77\n16", "17": "  \n腦力激盪\n　　切斷絲瓜藤後，從遠根端（右圖 \nA \n處） 還是近根端 （右圖 \nB \n處）能收到較多的絲瓜水？\n原理是什麼？\nA\nB\n答\n：\n近根端（\nB\n 處），因為水分從根部向莖部單方向運輸。\n配合課本 \nP77\n17", "18": "  \nQuestion\n \n1. \n下列有關植物水分運輸的敘述，哪些正確\n？　\n(\nA)\n水分可沿細胞壁及細胞間隙通過根部內皮的細胞壁而進入\n木質部　\n(\nB)\n細胞之間相連的原生質絲提供水分進入木質部的\n途徑　\n(\nC)\n根壓是由於根部維管束強烈的毛細作用而形成的作\n用力　\n(\nD)\n共生性的真菌菌根有助於植物根部吸收水分\n與無機鹽 \n(E)\n植物的莖部木質部利用壓力流使水分自然上升。\n【108\n 指考修訂\n】\n解答\n：\n(B)(D)\n解析\n：\n(A)\n內皮細胞壁具有卡氏帶，水分無法直接通過。 \n(C)\n根壓來自根部細胞主動運輸產生的\n滲透壓。\n(E)\n木質部內水分的上升動力主要來自蒸散流。\n18", "19": "  \nQuestion\n2. \n下列哪些現象或作用力與植物水分運輸的機制相關\n？　\n\n(\nA)\n根部細胞主動運輸所產生的濃度梯\n度　\n(\nB)\n水分子間\n的氫鍵　\n(\nC)\n大氣壓力　\n(\nD)\n水分子與管壁的\n附著力　\n(\nE)\n光合作用的光水解。\n解答\n：\n(A)(B)(D)\n解析\n：\n(A)\n產生根壓。\n(B)(D)\n毛細作用。此外，水蒸氣從植物體表面散失的蒸散作用，是植物水分運輸的主要動力。\n19", "20": "  \nQuestion\n3\n. \n下列哪些因素會增強植物的蒸散作用\n？　\n(\nA)\n光合作用\n旺盛　\n(\nB)\n氣孔周圍空氣的溼度\n過高　\n(\nC)\n周圍氣溫在適當範圍內\n提高　\n(\nD)\n葉內氧氣的濃度\n下降　\n(\nE)\n土壤中的含水量大幅減少。\n解答\n：\n(A)(C)\n解析\n：\n(B)\n溼度過高不利水蒸氣蒸散，蒸散作用減弱。 \n(D)\n氧氣濃度不直接影響氣孔開閉。\n(E)\n缺水環境下氣孔會關閉。\n20", "21": "  \nQuestion\n4. \n右圖是科學家利用壓力探針測量圓葉鴨跖草（\nTradescantia virginiana\n）保衛細胞膨壓與其周圍表皮細胞膨壓變化與氣孔寬度相關性的數據，請依此數據判斷下列何者正確\n？　\n(\nA)\n保衛細胞周圍表皮細胞的膨壓提升會降低保衛細胞的膨\n壓　\n(\nB)\n在相同保衛細胞膨壓下，周圍表皮細胞的膨壓較高時，會降低氣孔\n寬度　\n(\nC)\n保衛細胞周圍的表皮細胞若含水量增加，也會讓氣孔寬度變\n大　\n(\nD)\n周圍表皮細胞的膨壓愈高，氣孔寬度愈小。\n21", "22": "  \nQuestion\n解答\n：\n(B)\n解析\n：\n從題圖中可知，相同保衛細胞膨壓下，周圍表皮細胞膨壓提高到 \n0.9\n \nMPa\n \n時，會顯著減少氣孔寬度，保衛細胞的膨壓要提高到 \n2\n \nMPa\n \n以上氣孔才打開\n。\n(\nA)\n保衛細胞周圍的表皮細胞膨壓提升會降低氣孔寬度，而非降低保衛細胞膨壓\n。\n(\nC)\n含水量增加表示膨壓增加，會減少氣孔寬度\n。\n(\nD)\n題圖中僅顯示周圍表皮細胞 \n0\n \nMPa\n、\n0.9\n \nMPa\n \n時氣孔寬度的變化，無其他數據判斷。\n22"}, "originalCount": 4};

let READING=null,tableState=null,resultObserver=null;
function readingBlocks(node){
 const blocks=[];for(const child of [...node.childNodes]){
  if(child.nodeType===3){if(child.textContent.trim()){const p=document.createElement('p');p.textContent=child.textContent;blocks.push(p);}continue;}
  if(child.matches('ul,ol'))for(const li of child.children){const list=document.createElement(child.tagName);list.append(li.cloneNode(true));blocks.push(list);}
  else blocks.push(child.cloneNode(true));
 }return blocks;
}
function prepareLesson(){

 for(const child of [...text.childNodes]){if(child.nodeType===1&&child.matches('.note-label,.note-prompt,.lesson-note'))notes.append(child);else if(child.nodeType===1&&child.matches('.quote'))ref.append(child);else core.append(child);}
 const canvas=document.createElement('div'),tools=document.createElement('div');canvas.className='figure-canvas';tools.className='figure-tools';
 for(const child of [...fig.children]){
  if(child.matches('.cap')){ref.append(child);continue;}
  if(child.matches('details.tbx')){const img=child.querySelector('img'),b=document.createElement('button');b.textContent='課本原圖';b.title=img.alt;b.onclick=()=>zoom(img.src,img.alt);tools.append(b);continue;}
  if(child.matches('.fctl,.fdots,button'))tools.append(child);else canvas.append(child);
 }
 fig.replaceChildren(canvas,tools);const groups=[{name:'教學重點',nodes:readingBlocks(core)},{name:'原文與圖說',nodes:readingBlocks(ref)},{name:'思考筆記',notes}];
 if(!groups[1].nodes.length){const p=document.createElement('p');p.className='cap';p.textContent=LEARN[LI].src;groups[1].nodes=[p];}

  const result=sim.querySelector('#simres'),layout=document.createElement('div');layout.className='sim-layout';layout.append(sim.querySelector('svg'),sim.querySelector('.simctl'));sim.replaceChildren(layout);
  result.hidden=true;fig.append(result);groups.push({name:'實驗結果',nodes:[document.createElement('p')]});
  resultObserver=new MutationObserver(()=>{if(!READING||LI!==SIM_CARD)return;READING.groups[3].nodes=readingBlocks(result);if(!READING.groups[3].nodes.length){const p=document.createElement('p');p.textContent=result.textContent;READING.groups[3].nodes=[p];}READING.cache='';if(result.textContent.includes('結果')||result.textContent.includes('無法確定'))selectReadingTab(3);fit();});
  groups[3].nodes[0].textContent=result.textContent;resultObserver.observe(result,{childList:true,subtree:true,characterData:true});
 }
 READING={groups,tab:0,indices:groups.map(()=>0),pages:[],cache:''};
 const tabs=document.createElement('div');tabs.className='reading-tabs';tabs.setAttribute('role','tablist');tabs.setAttribute('aria-label','圖解解說分頁');
 groups.forEach((g,i)=>{const b=document.createElement('button');b.id='reading-tab-'+i;b.textContent=g.name;b.setAttribute('role','tab');b.setAttribute('aria-controls','reading-pane-'+i);b.onclick=()=>selectReadingTab(i);b.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();e.stopPropagation();const n=e.key==='Home'?0:e.key==='End'?groups.length-1:(i+(e.key==='ArrowRight'?1:-1)+groups.length)%groups.length;selectReadingTab(n);tabs.children[n].focus();}};tabs.append(b);});
 text.replaceChildren(tabs);groups.forEach((g,i)=>{const pane=document.createElement('section');pane.className='reading-pane'+(g.notes?' notes-pane':'');pane.id='reading-pane-'+i;pane.setAttribute('role','tabpanel');pane.setAttribute('aria-labelledby','reading-tab-'+i);if(g.notes){pane.append(...g.notes.childNodes);pane.querySelector('textarea').oninput=e=>{ST.notes[LEARN[LI].id]=e.target.value;save();};}else{pane.innerHTML='<div class="reading-body"></div><div class="reading-pager"><button aria-label="上一頁解說">←</button><span aria-live="polite"></span><button aria-label="下一頁解說">→</button></div>';const buttons=pane.querySelectorAll('button');buttons[0].onclick=()=>stepReading(-1);buttons[1].onclick=()=>stepReading(1);}text.append(pane);});
 const table=canvas.querySelector('.cmp2');if(table){canvas.classList.add('table-canvas');const rows=[...table.rows].slice(1),pager=document.createElement('div');pager.className='table-pager';pager.innerHTML='<button>← 前組</button><span></span><button>後組 →</button><button>完整表格 ↗</button>';tools.append(pager);tableState={table,rows,index:0,count:1,pager,original:table.outerHTML};const b=pager.querySelectorAll('button');b[0].onclick=()=>{tableState.index--;fitLessonTable();};b[1].onclick=()=>{tableState.index++;fitLessonTable();};b[2].onclick=()=>openDialog('完整實驗設計比較表',tableState.original);}

}
function selectReadingTab(i){if(!READING)return;READING.tab=i;el('lcard').querySelectorAll('.reading-tabs button').forEach((b,j)=>{b.setAttribute('aria-selected',String(i===j));b.tabIndex=i===j?0:-1;});el('lcard').querySelectorAll('.reading-pane').forEach((p,j)=>p.hidden=i!==j);READING.cache='';fit();}
function stepReading(d){if(!READING)return;const i=READING.tab;READING.indices[i]=Math.max(0,Math.min((READING.pages[i]?.length||1)-1,READING.indices[i]+d));renderReading();}
function splitBlock(node,body){
 // Range fragments keep inline emphasis and every character when a long paragraph needs another page.
 const length=node.textContent.length;if(!length)return [node];const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT),texts=[];let n,offset=0;while(n=walker.nextNode()){texts.push({node:n,start:offset,end:offset+n.length});offset+=n.length;}
 function fragment(a,b){const range=document.createRange(),start=texts.find(t=>t.end>a),end=texts.find(t=>t.end>=b);range.setStart(start.node,a-start.start);range.setEnd(end.node,b-end.start);const clone=node.cloneNode(false);clone.append(range.cloneContents());return clone;}
 const parts=[];let from=0;while(from<length){let lo=from+1,hi=length,best=lo;while(lo<=hi){const mid=(lo+hi)>>1,c=fragment(from,mid);body.replaceChildren(c);if(body.scrollHeight<=body.clientHeight+1){best=mid;lo=mid+1;}else hi=mid-1;}
  if(best<length){const s=node.textContent.slice(from,best),breakAt=Math.max(s.lastIndexOf('。'),s.lastIndexOf('；'),s.lastIndexOf('，'));if(breakAt>Math.max(20,s.length*.55))best=from+breakAt+1;}
  parts.push(fragment(from,best));from=best;
 }body.replaceChildren();return parts;
}
function paginateReading(){
 if(!READING)return;const i=READING.tab,g=READING.groups[i];if(g.notes)return;const pane=el('reading-pane-'+i),body=pane.querySelector('.reading-body'),pager=pane.querySelector('.reading-pager');pager.hidden=false;
 const key=[i,body.clientWidth,body.clientHeight,ST.font,innerWidth>900].join(':');if(READING.cache===key){renderReading();return;}
 const pages=[[]];body.replaceChildren();
 if(innerWidth<=900){pages[0]=g.nodes.map(x=>x.cloneNode(true));}
 else for(const original of g.nodes){let node=original.cloneNode(true);body.append(node);if(body.scrollHeight<=body.clientHeight+1){pages.at(-1).push(node);continue;}node.remove();if(pages.at(-1).length){pages.push([]);body.replaceChildren();}body.append(node);if(body.scrollHeight<=body.clientHeight+1){pages.at(-1).push(node);continue;}
  body.replaceChildren();const parts=splitBlock(original,body);for(const part of parts){if(pages.at(-1).length)pages.push([]);pages.at(-1).push(part);}body.replaceChildren(...pages.at(-1));
 }
 READING.pages[i]=pages;READING.cache=key;READING.indices[i]=Math.min(READING.indices[i],pages.length-1);renderReading();
}
function renderReading(){if(!READING)return;const i=READING.tab,pages=READING.pages[i];if(!pages)return;const pane=el('reading-pane-'+i),j=READING.indices[i];pane.querySelector('.reading-body').replaceChildren(...pages[j].map(x=>x.cloneNode(true)));const pager=pane.querySelector('.reading-pager');pager.hidden=pages.length<2;pager.querySelector('span').textContent=`${j+1} / ${pages.length} 頁`;const b=pager.querySelectorAll('button');b[0].disabled=j===0;b[1].disabled=j===pages.length-1;bindZoom(pane);}
function fitLessonTable(){if(!tableState)return;const {table,rows,pager}=tableState,canvas=table.closest('.figure-canvas');rows.forEach(r=>r.hidden=false);if(innerWidth<=900){tableState.count=rows.length;tableState.index=0;}else{const head=table.rows[0].getBoundingClientRect().height,room=canvas.clientHeight-head-2;let height=0,count=0;for(const row of rows){const h=row.getBoundingClientRect().height;if(height+h>room&&count)break;height+=h;count++;}tableState.count=Math.max(1,count);tableState.index=Math.max(0,Math.min(Math.ceil(rows.length/tableState.count)-1,tableState.index));}
 const {count,index}=tableState;rows.forEach((r,i)=>r.hidden=i<index*count||i>=(index+1)*count);pager.querySelector('span').textContent=`${index+1} / ${Math.ceil(rows.length/count)} 組`;const b=pager.querySelectorAll('button');b[0].disabled=index===0;b[1].disabled=(index+1)*count>=rows.length;
}
function fitLesson(){
