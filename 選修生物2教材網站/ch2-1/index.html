const CONTENT={"lessons": [{"id": "b2-21-l01", "t": "從植物演化，走進構造層次", "src": "課本 P32；原簡報第 1、2 頁", "slide": 1, "figSpec": {"image": "evolution"}, "sec": "s1", "txt": "<h3>構造支持陸地生活</h3><p>教材比較蘚苔、蕨類、裸子植物與被子植物。沿演化樹辨認<b>維管束、種子與花</b>出現的分支位置。</p><p>樹上的分支表示共同祖先與分化；現生蘚苔不是現生被子植物的祖先，也不把圖解讀成所有植物依序變成另一類。</p><p>本節以<b>被子植物</b>的構造為例，從細胞連到組織、組織系統與器官。</p><div class=\"quote\"><p>多細胞植物的構造層次與多細胞動物相似，是由許多不同<br>類型的細胞所組成。而細胞所組成的不同組織，在植物體內可<br>相互連結而縱貫整個植物體，形同組成特定功能的系統，特稱<br>為組織系統，不同的組織系統組成了器官。但與動物不同，在<br>植物體內不具有由器官所組成的系統層次。如圖 2－2，本節將<br>以被子植物為例，介紹植物細胞與組織系統的層次。<br>-1 植物體的構造與組成層次<br>2<br>　　目前我們所見到的植物多為陸生、多細胞的生物，有根、莖、葉的分<br>化。一般認為陸生植物與綠藻類有最近的共同祖先，於植物登陸後往兩個<br>方向演化，其中一群發展出有輸導及支持功能的維管束，個體高大，稱為<br>維管束植物；另一群則未發展出維管束構造，個體大多矮小，稱為蘚苔植<br>物。維管束植物可依照其形態及構造，區分為蕨類植物、裸子植物與被子<br>植物（圖 2－1）。<br>組織系統　tissue system<br>2<br>32　選修生物 Ⅱ (全)<br> 圖 2－1　陸生植物的演化示意圖<br>種子的形成<br>花的形成<br>維管束植物<br>維管束的形成<br>蘚<br>苔<br>類<br>蕨<br>類<br>裸<br>子<br>植<br>物<br>被<br>子<br>植<br>物<br>陸生<br>水生<br>陸生植物<br>與綠藻類<br>的共同祖先</p><small>課本 P32完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>2-1 <br>植物體的構造與組成層次<br>2-1.1 <br>植物細胞的種類<br>2-1.2 <br>植物組織的種類<br>2-1.3 <br>由組織系統看植物<br>本節以被子植物為例，介紹植物細胞與組織系統的層次。</p><small>原PPT第1頁完整文字</small></div><div class=\"quote\"><p>植物體的構造演變<br>2-1 <br>植物體的構造與組成層次<br>裸子植物<br>蕨類<br>蘚苔類<br>陸生<br>水生<br>被子植物<br>維管束的形成<br>種子的形成<br>花的形成<br>維管束植物<br>一般認為植物是<br>由類似綠藻的生物演化而來<br>配合課本 <br>P32<br>陸生植物<br><br>與綠藻類<br><br>的共同祖先</p><small>原PPT第2頁完整文字</small></div>", "tb": [["BOOK1", "課本 P32 完整頁面"]]}, {"id": "b2-21-l02", "t": "細胞 → 組織 → 系統 → 器官", "src": "課本 P33；原簡報第 3、4、5 頁", "slide": 3, "figSpec": {"image": "hierarchy"}, "sec": "s1", "txt": "<h3>同一株植物，不同觀察尺度</h3><p>以葉為例：柵狀細胞是細胞層次，葉肉可由組織觀察；基本、表皮與維管束組織系統共同構成<b>葉這個器官</b>。</p><p>根、莖、葉、花、果實與種子均可作為植物器官。不能把「維管束組織系統」和「根」放在同一層。</p><p class=\"scope-note\">本課本採「細胞 → 組織 → 組織系統 → 器官 → 植物體」的教學架構。其他教材也將植物器官分為根系統與莖葉系統；「植物沒有器官系統」不是所有教材共用的分類。<a href=\"https://openstax.org/books/biology/pages/30-1-the-plant-body\" target=\"_blank\" rel=\"noopener\">OpenStax 植物體</a></p><div class=\"quote\"><p>保衛細胞<br 細胞（圖 2－3a）或表皮和維管束之間的皮層，其內的薄壁細胞可儲存水<br>分和養分；根尖內的薄壁細胞則可行細胞分裂。<br>厚角細胞為活細胞，有不均勻加厚的初生細胞壁，細胞成熟後仍可生長，有利於支持<br>幼嫩構造，多位在莖或葉柄的表皮下方，例如：西洋芹葉柄的厚角細胞（圖 2－3b）。<br> 圖 2－3　<br>薄壁、厚角及厚壁細胞。a香蕉的果肉細胞以及染色的澱粉粒；b西洋芹葉柄的厚角細胞，紅色框的範圍<br>是一個細胞；c兩種厚壁細胞：左為梨果肉中的石細胞，右為維管束纖維細胞。<br>薄壁細胞　parenchyma cell <br>厚角細胞　collenchyma cell<br>厚壁細胞　sclerenchyma cell<br>初生細胞壁　primary cell wall<br>34　選修生物 Ⅱ (全)</p><small>課本 P34完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>2-1.1 <br>植物細胞的種類<br>◆ 植物細胞可依細胞壁的厚薄與組成成分而區分為<br><br>薄壁細胞<br>、<br>厚角細胞<br>、<br>厚壁細胞<br>三類<br>薄壁細胞<br>厚角細胞<br>厚<br>壁細胞<br>配合課本 <br>P34</p><small>原PPT第6頁完整文字</small></div>", "tb": [["BOOK3", "課本 P34 完整頁面"]]}, {"id": "b2-21-l04", "t": "薄壁細胞：儲存、光合與分裂", "src": "課本 P34；原簡報第 7、8、9 頁", "slide": 7, "figSpec": {"image": "thin"}, "sec": "s2", "txt": "<h3>活細胞有多種分工</h3><p>薄壁細胞多為活細胞，有細胞質與液胞；葉肉中的薄壁細胞可行光合作用，根、莖的髓與皮層可儲存物質。</p><p>原圖香蕉果肉的<b>澱粉粒與 25 µm 比例尺</b>是判讀依據。根尖薄壁細胞仍可分裂，成熟的儲存細胞則常有較大的液胞。</p><p>不同位置有不同特化；不能推成每一個薄壁細胞都有澱粉粒或都行光合作用。</p><div class=\"quote\"><p>25 µm<br>a薄壁細胞<br>澱粉粒<br>表皮<br>皮層<br>厚角<br>細胞<br>薄壁<br>細胞<br>70 µm <br>b厚角細胞<br>不均勻加厚的初生細胞壁<br>細胞質<br>澱粉粒<br>2-1.1 植物細胞的種類<br>植物的根、莖及葉是由不同類型的特化細胞共同構成。植物細胞可依細胞壁的厚薄與<br>組成成分而區分為薄壁細胞、厚角細胞、厚壁細胞三類。<br>薄壁細胞為具有生長與分化潛力的活細胞，通常只有較薄的初生細胞壁，細胞排列疏<br>鬆有細胞間隙，多數細胞內有大型液泡。不同位置的薄壁細胞有不同的功能，例如：水果<br>可食部位的薄壁細胞（圖 2－3a）或表皮和維管束之間的皮層，其內的薄壁細胞可儲存水<br>分和養分；根尖內的薄壁細胞則可行細胞分裂。<br>厚角細胞為活細胞，有不均勻加厚的初生細胞壁，細胞成熟後仍可生長，有利於支持<br>幼嫩構造，多位在莖或葉柄的表皮下方，例如：西洋芹葉柄的厚角細胞（圖 2－3b）。<br> 圖 2－3　<br>薄壁、厚角及厚壁細胞。a香蕉的果肉細胞以及染色的澱粉粒；b西洋芹葉柄的厚角細胞，紅色框的範圍<br>是一個細胞；c兩種厚壁細胞：左為梨果肉中的石細胞，右為維管束纖維細胞。<br>薄壁細胞　parenchyma cell <br>厚角細胞　collenchyma cell<br>厚壁細胞　sclerenchyma cell<br>初生細胞壁　primary cell wall<br>34　選修生物 Ⅱ (全)</p><small>課本 P34完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>◆<br> <br>形態<br>：<br>2-1.1 <br>植物細胞的種類<br>◆<br> <br>活細胞<br>◇<br> <br>僅具<br>初生細胞壁<br>◇<br> <br>細胞排列疏鬆，具細胞間隙，多數細胞內具大型液泡<br>薄壁細胞<br>配合課本 <br>P34</p><small>原PPT第7頁完整文字</small></div><div class=\"quote\"><p>25<br> <br>µm<br>2-1.1 <br>植物細胞的種類<br>薄壁細胞<br>→ 例如<br>：<br>水果可食部位的薄壁細胞或<br>表皮和維管束之間的<br>皮層<br>，其內  "<h3>厚的次生壁形成支持</h3><p>厚壁細胞在初生壁內側堆疊<b>次生細胞壁</b>，常木質化，成熟後<b>多為死細胞</b>。</p><p>梨子果肉的石細胞形成粗硬口感；維管束的纖維支持植物體。照片保留石細胞 <b>50 µm</b>、纖維 <b>200 µm</b> 比例尺。</p><p>課本使用「多」描述成熟狀態；不要把所有具有支持功能的細胞，或維管束中的全部細胞，都說成死細胞。</p><div class=\"quote\"><p>細胞特化時細胞壁的變化<br>薄壁、厚角及厚壁細胞是如何特化形成？<br>主要是植物細胞分裂後，纖維素層在細胞壁的<br>堆疊方式不同（如圖 1），剛形成的細胞壁較<br>薄，稱為初生細胞壁，是由排列鬆散的纖維素<br>組成支撐結構。細胞膜上的纖維素合成 會持<br>續合成纖維素，且向細胞膜外堆疊而使初生細<br>胞壁逐層增厚。細胞壁的增厚就像在空間內側<br>牆上持續貼上層層壁紙，且每次貼的方向與材<br>料不完全相同。<br>正在生長中的細胞，其初生細胞壁具延<br>展性，可容許細胞增大後，特化成薄壁細胞或<br>厚角細胞（如圖2）。但厚壁細胞是細胞增大<br>後，在初生細胞壁內側增加排列緻密的纖維素<br>層，稱為次生細胞壁，甚至可加入木質素加強<br>其支撐結構。此時的細胞壁無法再延展，細胞<br>也就不能改變形狀。<br>知識補給站<br>200 µm<br>50 µm<br>c厚壁細胞<br>維<br>管<br>束<br>纖<br>維<br>細<br>胞<br>細胞壁<br>空腔<br>石細胞<br>次生細胞壁　secondary cell wall<br>厚壁細胞在形成過程中，會在細胞膜及初<br>生細胞壁之間堆疊次生細胞壁，使得整個細胞<br>因厚壁或再添增木質素而更為堅固。此類細胞<br>在成熟後不再生長，多成為排列緊密的死細<br>胞。常見的厚壁細胞有石細胞和纖維細胞，例<br>如：梨果肉中有聚集成團的石細胞；維管束中<br>有成束的細長纖維細胞可協助支持植物體（圖 <br>2－3c）。<br> 圖 2　植物細胞的特化<br>特化<br>特化<br>特化<br>特化<br>薄壁細胞<br>厚度均勻的初生細胞壁<br>不均勻加厚的初生細胞壁<br>新細胞<br>初生<br>細胞壁<br>特化<br>加厚的次生細胞壁<br>厚壁細胞<br>厚角細胞<br> 圖 1　纖維素層在細胞壁的堆疊方式<br>纖維素<br>木質素<br>中膠層<br>次生細胞壁<br>初生細胞壁<br>細胞膜<br>纖維素<br>合成<br>第 2 章  植物體的構造與功能　35</p><small>課本 P35完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>2-1.1 <br>植物細胞的種類<br>◆<br> <br>形態<br>：<br>◇<br> <br>排列緊密<br>◇ 具<br>初生細胞壁<br>和<br>次生細胞壁<br>，厚度均勻<br>◆ 成熟後變為死細胞<br>厚壁細胞<br>配合課本 <br>P35</p><small>原PPT第12頁完整文字</small></div><div class=\"quote\"><p>2-1.1 <br>植物細胞的種類<br>厚壁細胞<br>50<br> <br>µ<br>m<br>→ <br>例如<br>：<br>梨果肉中有聚集成團的<br>石細胞<br>石細胞<br>細胞壁<br>空腔<br>配合課本 <br>P35</p><small>原PPT第13頁完整文字</small></div><div class=\"quote\"><p>2-1.1 <br>植物細胞的種類<br>→ <br>例如<br>：<br>維管束中有成束的細長<br>纖維細胞<br>可協助支持植物體<br>細胞壁<br>空腔<br>200<br> <br>µ<br>m<br>維管束<br>纖維細胞<br>厚壁細胞<br>配合課本 <br>P35</p><small>原PPT第14頁完整文字</small></div>", "tb": [["BOOK4", "課本 P35 完整頁面"]]}, {"id": "b2-21-l07", "t": "初生壁、次生壁與細胞特化", "src": "課本 P35；原簡報第 15、16、17、18 頁", "slide": 15, "figSpec": {"image": "wall"}, "sec": "s2", "txt": "<h3>壁由內側添加，功能逐漸改變</h3><p>新形成的細胞先有初生細胞壁；細胞生長時，較具延展性的初生壁能隨之擴展。</p><p>部分細胞停止擴大後，在初生壁內側添加次生壁。圖中<b>纖維素與木質素</b>對應不同排列與支持特性；中膠層位於相鄰細胞之間。</p><p>次生壁不是直接取代或在初生壁外側生成；細胞種類與組織位置共同影響特化方向。</p><div class=\"quote\"><p>細胞特化時細胞壁的變化<br>薄壁、厚角及厚壁細胞是如何特化形成？<br>主要是植物細胞分裂後，纖維素層在細胞壁的<br>堆疊方式不同（如圖 1），剛形成的細胞壁較<br>薄，稱為初生細胞壁，是由排列鬆散的纖維素<br>組成支撐結構。細胞膜上的纖維素合成 會持<br>續合成纖維素，且向細胞膜外堆疊而使初生細<br>胞壁逐層增厚。細胞壁的增厚就像在空間內側<br>牆上持續貼上層層壁紙，且每次貼的方向與材<br>料不完全相同。<br>正在生長中的細胞，其初生細胞壁具延<br>展性，可容許細胞增大後，特化成薄壁細胞或<br>厚角細胞（如圖2）。但厚壁細胞是細胞增大<br>後，在初生細胞壁內側增加排列緻密的纖維素<br>層，稱為次生細胞壁，甚至可加入木質素加強<br>其支撐結構。此時的細胞壁無法再延展，細胞<br>也就不能改變形狀。<br>知識補給站<br>200 µm<br>50 µm<br>c厚壁細胞<br>維<br>管<br>束<br>纖<br>維<br>細<br>胞<br>細胞壁<br>空腔<br>石細胞<br>次生細胞壁　secondary cell wall<br>厚壁細胞在形成過程中，會在細胞膜及初<br>生細胞壁之間堆疊次生細胞壁，使得整個細胞<br>因厚壁或再添增木質素而更為堅固。此類細胞<br>在成熟後不再生長，多成為排列緊密的死細<br>胞。常見的厚壁細胞有石細胞和纖維細胞，例<br>如：梨果肉中有聚集成團的石細胞；維管束中<br>有成束的細長纖維細胞可協助支持植物體（圖 <br>2－3c）。<br> 圖 2　植物細胞的特化<br>特化<br>特化<br>特化<br>特化<br>薄壁細胞<br>厚度均勻的初生細胞壁<br>不均勻加厚的初生細胞壁<br>新細胞<br>初生<br>細胞壁<br>特化<br>加厚的次生細胞壁<br>厚壁細胞<br>厚角細胞<br> 圖 1　纖維素層在細胞壁的堆疊方式<br>纖維素<br>木質素<br>中膠層<br>次生細胞壁<br>初生細胞壁<br>細胞膜<br>纖維素<br>合成<br>第 2 章  植物體的構造與功能　35</p><small>課本 P35完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>  <br>知識補給站<br>細胞特化時細胞壁的變化<br>       薄壁、厚角及厚壁細胞是如何特化形成？主要是植物細胞分裂後，纖維素層在細胞壁的堆疊方式不同<br>。<br>中膠層<br>木質素<br>次生細胞壁<br>細胞膜<br>初生細胞壁<br>纖維素<br>纖維素合成酶<br>配合課本 <br>P35<br>15</p><small>原PPT第15頁完整文字</small></div><div class=\"quote\"><p>  <br>知識補給站<br>細胞特化時細胞壁的變化<br>       剛形成的<br>細胞壁較薄，<br>稱為<br>初生細胞壁<br>，是由排列鬆散的纖維素組成支撐結構。細胞膜上的纖維素合成<br>酶<br>會持續合成纖維素，且向細胞膜外堆疊而使初生細胞壁逐層增厚。細胞壁的增厚就像在空間內側牆上持續貼上層層壁紙，且每次貼的方向與材料不完全相同。<br>配合課本 <br>P35<br>16</p><small>原PPT第16頁完整文字</small></div><div class=\"quote\"><p>  <br>知識補給站<br>細胞特化時細胞壁的變化<br>       正在生長中的細胞，其初生細胞壁<br>具延展性<br>，可容許細胞增大後，特化成<br>薄壁細胞<br>或<br>厚角細胞<br>。<br>       但<br>厚壁細胞<br>是細胞增大後，在<br>初生細胞壁內側<br>增加排列緻密的纖維素層，稱為<br>次生細胞壁<br>，甚至可加入<br>木質素<br>加強其支撐結構。此時的細胞壁<br>無法再延展<br>，細胞也就不能改變形狀。<br>配合課本 <br>P35<br>17</p><small>原PPT第17頁完整文字</small></div><div class=\"quote\"><p>  <br>知識補給站<br>細胞特化時細胞壁的變化<br>特化<br>特化<br>特化<br>初生細胞壁<br>不均勻加厚的初生細胞壁<br>特化<br>特化<br>加厚的<br>次生細胞壁<br>初生細胞壁<br>厚壁細胞<br>新細胞<br>細胞膜<br>薄壁細胞<br>厚角細胞<br>配合課本 <br>P35<br>18<br>厚度均勻的初生細胞壁</p><small>原PPT第18頁完整文字</small></div>", "tb": [["BOOK4", "課本 P35 完整頁面"]]}, {"id": "b2-21-l08", "t": "組織的來源：初生與次生生長", "src": "課本 P36；原簡報第 19、20 頁", "slide": 19, "figSpec": {"image": "derivation"}, "sec": "s3", "txt": "<h3>從分生組織追蹤產物</h3><p>教材分為分生、表皮、基本與維管束組織。分生組織持續分裂，提供新細胞。</p><p><b>頂端分生組織</b>促進根、莖延長，形成初生組織；<b>側生分生組織</b>促進次生生長，增加粗度。</p><p>圖2-4的兩條路徑分別追蹤<b>維管束形成層</b>與<b>木栓形成層</b>，不能把兩者產物互換。</p><div class=\"quote\"><p>2-1.2 植物組織的種類<br>植物體成長的關鍵是因為具有可持續增生新細胞的分生組織。由分生組織的細胞進行<br>分裂，再分化形成植物體的各種構造（圖 2－4）。位於植物體最外層的表皮組織，具有保<br>護等功能；縱貫於根、莖、葉內部的維管束組織，具有運輸物質的角色；填充在植物體體<br>內的基本組織，具有多種不同的功能。<br>分生組織<br>分生組織是由未分化的薄壁細胞所組成，細胞小、液泡小或無、細胞核在細胞中所占<br>比例較大，且細胞週期短。整個植物體最基本的生長起始於莖頂與根尖的分生組織，稱為<br>頂端分生組織，又稱為初生分生組織，可使植物體往上或往下生長。這些由頂端分生組織<br>所產生的新組織是植物體的基礎組成，而此種生長稱為初級生長（圖 2－5ab）。一般小<br>型、草本的雙子葉植物如芹菜、白菜等，以及單子葉植物如玉米、蝴蝶蘭等，其植物體即<br>是由初級生長所產生的組織構成。<br>分生組織　meristem<br>表皮組織　dermal tissue<br>維管束組織　vascular tissue<br>基本組織　ground tissue<br>頂端分生組織　apical meristem<br>初生分生組織　primary meristem<br> 圖 2－4　植物組織的生長與變化（<br> 初級生長；<br> 由初生組織轉變為側生分生組織；<br> 次級生長）<br>次生組織<br>側生分生組織<br>(次生分生組織)<br>初級生長<br>次級生長<br>初生組織<br>頂端分生組織<br>(初生分生組織)<br>原始表皮<br>原始形成層<br>表　皮<br>木栓形成層<br>木栓層<br>栓皮層<br>髓<br>初生韌皮部<br>初生木質部<br>維管束形成層<br>次生韌皮部<br>次生木質部<br>表皮<br>組織系統<br>頂端<br>（莖、根）<br>基本分生組織<br>基本<br>組織系統<br>維管束<br>組織系統<br>皮  層<br>初級生長　primary growth<br> <br>36　選修生物 Ⅱ (全)</p><small>課本 P36完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>2-1.2 <br>植物組織的種類<br>基本組織<br>維管束<br>組織<br>表皮<br>組織<br>◆ 除分生組織外，其餘組織係由成熟且完成分化的細胞共同組成<br>分生組織<br>植物的組織<br>配合課本 <br>P36</p><small>原PPT第19頁完整文字</small></div><div class=\"quote\"><p>◆ <br>植物組織的生長與變化：<br>初級生長<br>次級生長<br>  頂端分生組織（ 初生分生組織 ）<br>初生組織<br>   側生分生組織<br>（ 次生分生組織 <br>）<br>次生組織<br>   頂端<br>（ 莖、根 ）<br>原始表皮<br>基本 分生組織<br>原始<br><br>形成層<br>表皮<br><br>組織<br>系統<br>表皮<br>基本<br><br>組織<br>系統<br>皮層<br>髓<br>木栓形成層<br>栓皮層<br>木栓層<br>(<br>     <br>初級生長<br>初生組織轉變為側生分生組織<br>次級生長<br>)<br>維管束<br><br>組織系統<br>初生韌皮部<br>初生木質部<br>維管束形成層<br>次生韌皮部<br>次生木質部<br>配合課本 <br>P36<br>20</p><small>原PPT第20頁完整文字</small></div>", "tb": [["BOOK5", "課本 P36 完整頁面"]]}, {"id": "b2-21-l09", "t": "分生組織：小細胞持續分裂", "src": "課本 P36；原簡報第 21 頁", "slide": 21, "figSpec": {"flip": [21]}, "sec": "s3", "txt": "<h3>形態和功能相互對照</h3><p>分生細胞通常較小、細胞壁薄、液胞小，細胞核相對明顯；細胞可持續分裂，補充後續特化的細胞。</p><p>分裂、細胞伸長與分化是不同過程。根尖的生長不能只歸因於某一個成熟組織變大。</p><p>依壁型可描述為薄壁細胞；依功能則屬分生組織，兩者不矛盾。</p><div class=\"quote\"><p>2-1.2 植物組織的種類<br>植物體成長的關鍵是因為具有可持續增生新細胞的分生組織。由分生組織的細胞進行<br>分裂，再分化形成植物體的各種構造（圖 2－4）。位於植物體最外層的表皮組織，具有保<br>護等功能；縱貫於根、莖、葉內部的維管束組織，具有運輸物質的角色；填充在植物體體<br>內的基本組織，具有多種不同的功能。<br>分生組織<br>分生組織是由未分化的薄壁細胞所組成，細胞小、液泡小或無、細胞核在細胞中所占<br>比例較大，且細胞週期短。整個植物體最基本的生長起始於莖頂與根尖的分生組織，稱為<br>頂端分生組織，又稱為初生分生組織，可使植物體往上或往下生長。這些由頂端分生組織<br>所產生的新組織是植物體的基礎組成，而此種生長稱為初級生長（圖 2－5ab）。一般小<br>型、草本的雙子葉植物如芹菜、白菜等，以及單子葉植物如玉米、蝴蝶蘭等，其植物體即<br>是由初級生長所產生的組織構成。<br>分生組織　meristem<br>表皮組織　dermal tissue<br>維管束組織　vascular tissue<br>基本組織　ground tissue<br>頂端分生組織　apical meristem<br>初生分生組織　primary meristem<br> 圖 2－4　植物組織的生長與變化（<br> 初級生長；<br> 由初生組織轉變為側生分生組織；<br> 次級生長）<br>次生組織<br>側生分生組織<br>(次生分生組織)<br>初級生長<br>次級生長<br>初生組織<br>頂端分生組織<br>(初生分生組織)<br>原始表皮<br>原始形成層<br>表　皮<br>木栓形成層<br>木栓層<br>栓皮層<br>髓<br>初生韌皮部<br>初生木質部<br>維管束形成層<br>次生韌皮部<br>次生木質部<br>表皮<br>組織系統<br>頂端<br>（莖、根）<br>基本分生組織<br>基本<br>組織系統<br>維管束<br>組織系統<br>皮  層<br>初級生長　primary growth<br> <br>36　選修生物 Ⅱ (全)</p><small>課本 P36完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>2-1.2 <br>植物組織的種類<br>分生組織<br>◆<br> 特性<br>：<br>未分化，具分裂能力，細胞分裂後再分化為其他的組織<br>◆<br> 形態<br>：<br>薄壁、細胞小、<br>細胞核在細胞中所占比例較大<br>、液泡小或無<br>◆  種類<br>：<br>初生分生組織<br>、<br>次生分生組織<br>配合課本 <br>P36</p><small>原PPT第21頁完整文字</small></div>", "tb": [["BOOK5", "課本 P36 完整頁面"]]}, {"id": "b2-21-l10", "t": "頂端與側生：變長還是變粗？", "src": "課本 P37、P38；原簡報第 22、23 頁", "slide": 22, "figSpec": {"image": "meristem"}, "sec": "s3", "txt": "<h3>位置決定生長方向</h3><ul><li>根與芽的頂端分生組織：初生生長，延長根、莖。</li><li>維管束形成層：向內形成<b>次生木質部</b>，向外形成<b>次生韌皮部</b>。</li><li>木栓形成層：向外形成木栓層，向內形成栓皮層。</li></ul><p>本節示意典型次生生長。木栓形成層的起源會因器官與植物而異，不把簡報「皮層轉變」當成所有植物唯一來源。</p><p>完整圖保留根、芽的顯微放大框、形成層位置與比例尺。</p><div class=\"quote\"><p>圖 2－5　<br>植物的分生組織分布。頂端分生組織分別位於莖頂與根尖：a莖的頂端分生組織（1 ）細胞小，染色後顏<br>色較深，其下方兩側（2 ）是在葉腋的休眠側芽，也是將長成側枝的頂端分生組織；b根的頂端分生組織<br>外圍的細胞分裂旺盛，新生細胞再分別特化成根的組織。以上的組織增生屬於初級生長。c在木本植物<br>中，可見兩種形成層，合稱為側生分生組織，此增生方式屬於次級生長（在此僅以莖的示意圖為代表）。<br>初級生長<br>次級生長<br>1<br>2<br>2<br>400 µm<br>c側生分生組織<br>a莖的頂端分生組織<br>b根的頂端分生組織<br>250 µm<br>維管束<br>形成層<br>木栓<br>形成層<br>莖頂<br>根冠<br>根尖<br>第 2 章  植物體的構造與功能　37</p><small>課本 P37完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>有些植物除了有初級生長之外，還會在莖與根的成熟組織中再分化形成側生分<br>生組織（圖 2－5c），又稱為次生分生組織，可以橫向增生新細胞與組織。這些側<br>生分生組織並非直接源自頂端分生組織，例如：在木本植物的樹皮中，靠近表皮的<br>薄壁細胞特化成木栓形成層，位在木質部與韌皮部之間的薄壁細胞則特化成維管束<br>形成層。此種藉由形成層橫向增生新組織的生長方式，稱為次級生長。<br>表皮組織<br>表皮組織主要由排列緊密的單層扁平狀表皮細胞組成，覆蓋在植物體表面，具有<br>保護的功能。陸生植物的表皮組織外面常有角質層的構造，防止水分散失。不同部位<br>的表皮細胞各有特化的形態與功能，例如：通常位於下表皮的保衛細胞，能控制氣孔<br>開閉；根部表皮往外突出延長的根毛，能增加吸收物質的表面積。<br>基本組織<br>基本組織主要由薄壁細胞與少數的厚角細胞或厚壁細胞組成。植物體不同位置<br>的基本組織有不同功能，例如：葉肉具有光合作用的能力；莖中心的髓、介於表皮<br>和維管束之間的皮層，具有儲存水分和養分的功能。<br>維管束組織<br>植物體內的維管束組織主要由具有運輸物質功能的管狀厚壁及薄壁細胞所組<br>成，能輸送水分、有機物質及無機鹽，也有支持的作用，其構造包含木質部和韌皮<br>部。<br>木質部<br>木質部是由導管、管胞、木質纖維和薄壁細胞所組成。導管和管胞是具有運輸水<br>分、無機鹽及少數有機物質的厚壁細胞，但因形態不同，以致輸水效率有所差異（圖 <br>2－6）。在形態構造上，導管細胞較粗短，細胞上、下相接的細胞壁完全或部分消<br>失，連接成連續的中空管道，稱為穿孔，進而組成穿孔板結構；而管胞細胞則兩端尖<br>細，上、下相鄰細胞之間的細胞壁沒有消失，無法直接相通。<br>側生分生組織　lateral meristem<br>次生分生組織　secondary meristem<br>木栓形成層　cork cambium<br>維管束形成層　vascular cambium <br>次級生長　secondary growth<br>導管　vessel<br>管胞　tracheid<br>木質纖維　xylem fiber<br>穿孔　perforation<br>38　選修生物 Ⅱ (全)</p><small>課本 P38完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>木栓形成層<br>莖頂或根尖的分生組織<br>頂端分生組織 <br>（ 初生分生組織 ）<br>2-1.2 <br>植物組織的種類<br>分生組織<br>◇ 使莖或根增長<br>◇ <br>位於<br>木本雙子葉植物的根和莖內，介於皮層與木栓層之間<br>側生分生組織 <br>（ 次生分生組織 ）<br>維管束形成層<br>◇ 位於雙子葉植物的根和莖內，介於韌皮部與木質部之間<br>◇ 使莖或根加粗<br>◇ 次級生長<br>◇ <br>初級生長<br>◇ 轉變自原始形成層<br>◇ 轉變自皮層<br>◇ 向外產生次生韌皮部，向內產生次生木質部<br>◇ 次級生長<br>◇ 向外產生木栓層，  向內產生栓皮層<br>◇ 形成保護構造<br>22<br>配合課本 <br>P36<br>、<br>37</p><small>原PPT第22頁完整文字</small></div><div class=\"quote\"><p>2-1.2 <br>植物組織的種類<br>分生組織<br>初級生長<br>莖的頂端分生組織<br>根冠<br>根尖<br>莖頂<br>根的頂端分生組織<br>次級生長 ，具有不均勻<br>增厚的次生細胞壁，因而會形成不同的紋路，例如：螺<br>旋紋、梯紋、孔紋等。這兩種輸水細胞側面皆具有相鄰<br>的壁孔對，為細胞壁較薄之處，只具初生細胞壁，有利<br>於相鄰細胞間的水分通透，進行橫向運輸。<br>在輸水效率上，水分在管胞間的運送較導管慢，因<br>為水分須經由壁孔流至相鄰管胞，且壁孔處仍有初生細<br>胞壁阻隔，故減緩了水流。而導管中的水分運輸則因導<br>管的上、下細胞間有穿孔，故水流較快速；又因為導管<br>的直徑比管胞大，故輸水量也較管胞多。<br>穿孔板　perforation plate<br>壁孔對　pit pair<br>導管與管胞的功能互補<br>既然導管的輸水效率較<br>管胞佳，為何被子植物的木<br>質部中還有管胞？這是因為<br>導管雖然輸水量大，然而經<br>由導管送至葉片的水分也較<br>易從葉片蒸散而增加水分<br>喪失。反觀管胞則因直徑小<br>且有細胞壁相隔，較不易失<br>水，有利於儲水。因此，在<br>缺水時，木質部內的管胞仍<br>維持有水，可彌補導管易失<br>水的缺點。<br>知識補給站<br> 圖 2－6　<br> 木質部導管與管胞的形態及水分運輸效率。a導管與管胞的示意圖（粗箭頭：水量多；細箭頭：水量<br>少）；b木質部的縱切面。<br>a<br>次<br>生<br>細<br>胞<br>壁<br>100 µm <br>b<br>導<br>管<br>導<br>管<br>細<br>胞<br>管<br>胞<br>壁孔<br>壁孔對<br>H2O<br>管<br>胞<br>細<br>胞<br>H2O<br>壁<br>孔<br>壁<br>孔<br>對<br>導<br>管<br>細<br>胞<br>穿<br>孔<br>穿<br>孔<br>板<br>H2O<br>初<br>生<br>細<br>胞<br>壁<br>第 2 章  植物體的構造與功能　39</p><small>課本 P39完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>有些植物除了有初級生長之外，還會在莖與根的成熟組織中再分化形成側生分<br>生組織（圖 2－5c），又稱為次生分生組織，可以橫向增生新細胞與組織。這些側<br>生分生組織並非直接源自頂端分生組織，例如：在木本植物的樹皮中，靠近表皮的<br>薄壁細胞特化成木栓形成層，位在木質部與韌皮部之間的薄壁細胞則特化成維管束<br>形成層。此種藉由形成層橫向增生新組織的生長方式，稱為次級生長。<br>表皮組織<br>表皮組織主要由排列緊密的單層扁平狀表皮細胞組成，覆蓋在植物體表面，具有<br>保護的功能。陸生植物的表皮組織外面常有角質層的構造，防止水分散失。不同部位<br>的表皮細胞各有特化的形態與功能，例如：通常位於下表皮的保衛細胞，能控制氣孔<br>開閉；根部表皮往外突出延長的根毛，能增加吸收物質的表面積。<br>基本組織<br>基本組織主要由薄壁細胞與少數的厚角細胞或厚壁細胞組成。植物體不同位置<br>的基本組織有不同功能，例如：葉肉具有光合作用的能力；莖中心的髓、介於表皮<br>和維管束之間的皮層，具有儲存水分和養分的功能。<br>維管束組織<br>植物體內的維管束組織主要由具有運輸物質功能的管狀厚壁及薄壁細胞所組<br>成，能輸送水分、有機物質及無機鹽，也有支持的作用，其構造包含木質部和韌皮<br>部。<br>木質部<br>木質部是由導管、管胞、木質纖維和薄壁細胞所組成。導管和管胞是具有運輸水<br>分、無機鹽及少數有機物質的厚壁細胞，但因形態不同，以致輸水效率有所差異（圖 <br>2－6）。在形態構造上，導管細胞較粗短，細胞上、下相接的細胞壁完全或部分消<br>失，連接成連續的中空管道，稱為穿孔，進而組成穿孔板結構；而管胞細胞則兩端尖<br>細，上、下相鄰細胞之間的細胞壁沒有消失，無法直接相通。<br>側生分生組織　lateral meristem<br>次生分生組織　secondary meristem<br>木栓形成層　cork cambium<br>維管束形成層　vascular cambium <br>次級生長　secondary growth<br>導管　vessel<br>管胞　tracheid<br>木質纖維　xylem fiber<br>穿孔　perforation<br>38　選修生物 Ⅱ (全)</p><small>課本 P38完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>100<br> <br>µ<br>m<br>◆ 由導管、管胞、木質纖維和薄壁細胞所組成<br>木質部<br>2-1.2 "sec": "s5", "txt": "<h3>同一系統可跨不同器官</h3><ul><li><b>表皮組織系統：</b>外層保護及特化功能。</li><li><b>維管束組織系統：</b>木質部、韌皮部構成運輸路線。</li><li><b>基本組織系統：</b>充填、光合、儲存與支持。</li></ul><p>圖2-8保留整株植物、葉／莖／根三個剖面與<b>顏色圖例</b>。辨認色塊位置，再連到實際功能。</p><div class=\"quote\"><p>表皮組織系統<br>基本組織系統<br>維管束組織系統<br>維管束組織系統<br>為運輸物質的功能<br>基本組織系統<br>填充在表皮與維<br>管束之間<br>表皮組織系統<br>具保護作用<br>葉<br>莖<br>根<br>2-1.3 由組織系統看植物<br>不論根、莖、葉皆具有相同特定功能的組織，可歸<br>納為保護作用的表皮組織、運輸物質的維管束組織以及<br>填充在表皮與維管束之間的基本組織。此三類組織皆<br>可相互連結而使其功能貫通根、莖及葉，如同組成特<br>定功能的系統結構縱貫整個植物體，故稱為組織系統<br>（圖 2－8）。從組織系統的角度來思考植物生長，更易<br>於了解植物如何從莖與根的頂端長成完整植株的結構。<br>在根、莖、葉中，表皮<br>組織、維管束組織及基本組<br>織的組成分別包括哪些細<br>胞？若依細胞壁來區分，這<br>些組織的組成細胞可分別歸<br>為薄壁、厚角或厚壁中的哪<br>一類？<br>腦力激盪<br>圖 2－8　植物體的 3 個主要組織系統分布情形<br>第 2 章  植物體的構造與功能　41</p><small>課本 P41完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>葉<br>根<br>莖<br>表皮組織系統<br>具保護作用<br>2-1.3 <br>由組織系統看植物<br>◆ 表皮組織、維管束組織及基本組織皆<br>縱貫整個植物體<br>，如同組成特定功能的系統，故稱為組織系統<br>維管束組織系統<br>運輸物質<br>基本組織系統<br>填充在表皮與維管束之間<br>配合課本 <br>P41</p><small>原PPT第36頁完整文字</small></div>", "tb": [["BOOK10", "課本 P41 完整頁面"]]}, {"id": "b2-21-l18", "t": "整合判讀：一個器官，多種細胞", "src": "課本 P41；原簡報第 37、38、39、40 頁", "slide": 37, "figSpec": {"flip": [37, 38, 39, 40]}, "sec": "s5", "txt": "<h3>用三個問題讀表</h3><ol><li>目前在看根、莖或葉的哪個部位？</li><li>它屬哪個組織或組織系統？</li><li>其中可能包含哪些壁型的細胞？</li></ol><p>木質部有導管／管胞，也有薄壁細胞與纖維；韌皮部有篩管、伴細胞與韌皮纖維。組織名稱不能直接等同唯一細胞種類。</p><p>教材表格按典型位置列舉，實際構造也受植物類群、器官年齡及發育階段影響。</p><div class=\"quote\"><p>表皮組織系統<br>基本組織系統<br>維管束組織系統<br>維管束組織系統<br>為運輸物質的功能<br>基本組織系統<br>填充在表皮與維<br>管束之間<br>表皮組織系統<br>具保護作用<br>葉<br>莖<br>根<br>2-1.3 由組織系統看植物<br>不論根、莖、葉皆具有相同特定功能的組織，可歸<br>納為保護作用的表皮組織、運輸物質的維管束組織以及<br>填充在表皮與維管束之間的基本組織。此三類組織皆<br>可相互連結而使其功能貫通根、莖及葉，如同組成特<br>定功能的系統結構縱貫整個植物體，故稱為組織系統<br>（圖 2－8）。從組織系統的角度來思考植物生長，更易<br>於了解植物如何從莖與根的頂端長成完整植株的結構。<br>在根、莖、葉中，表皮<br>組織、維管束組織及基本組<br>織的組成分別包括哪些細<br>胞？若依細胞壁來區分，這<br>些組織的組成細胞可分別歸<br>為薄壁、厚角或厚壁中的哪<br>一類？<br>腦力激盪<br>圖 2－8　植物體的 3 個主要組織系統分布情形<br>第 2 章  植物體的構造與功能　41</p><small>課本 P41完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>  <br>腦力激盪<br>　　在根、莖、葉中，表皮組織、維管束組織及基本組織的組成 有較薄的初生細胞壁，細胞排列疏<br>鬆有細胞間隙，多數細胞內有大型液泡。不同位置的薄壁細胞有不同的功能，例如：水果<br>可食部位的薄壁細胞（圖 2－3a）或表皮和維管束之間的皮層，其內的薄壁細胞可儲存水<br>分和養分；根尖內的薄壁細胞則可行細胞分裂。<br>厚角細胞為活細胞，有不均勻加厚的初生細胞壁，細胞成熟後仍可生長，有利於支持<br>幼嫩構造，多位在莖或葉柄的表皮下方，例如：西洋芹葉柄的厚角細胞（圖 2－3b）。<br> 圖 2－3　<br>薄壁、厚角及厚壁細胞。a香蕉的果肉細胞以及染色的澱粉粒；b西洋芹葉柄的厚角細胞，紅色框的範圍<br>是一個細胞；c兩種厚壁細胞：左為梨果肉中的石細胞，右為維管束纖維細胞。<br>薄壁細胞　parenchyma cell <br>厚角細胞　collenchyma cell<br>厚壁細胞　sclerenchyma cell<br>初生細胞壁　primary cell wall<br>34　選修生物 Ⅱ (全)</p><small>課本 P34完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>細胞特化時細胞壁的變化<br>薄壁、厚角及厚壁細胞是如何特化形成？<br>主要是植物細胞分裂後，纖維素層在細胞壁的<br>堆疊方式不同（如圖 1），剛形成的細胞壁較<br>薄，稱為初生細胞壁，是由排列鬆散的纖維素<br>組成支撐結構。細胞膜上的纖維素合成 會持<br>續合成纖維素，且向細胞膜外堆疊而使初生細<br>胞壁逐層增厚。細胞壁的增厚就像在空間內側<br>牆上持續貼上層層壁紙，且每次貼的方向與材<br>料不完全相同。<br>正在生長中的細胞，其初生細胞壁具延<br>展性，可容許細胞增大後，特化成薄壁細胞或<br>厚角細胞（如圖2）。但厚壁細胞是細胞增大<br>後，在初生細胞壁內側增加排列緻密的纖維素<br>層，稱為次生細胞壁，甚至可加入木質素加強<br>其支撐結構。此時的細胞壁無法再延展，細胞<br>也就不能改變形狀。<br>知識補給站<br>200 µm<br>50 µm<br>c厚壁細胞<br>維<br>管<br>束<br>纖<br>維<br>細<br>胞<br>細胞壁<br>空腔<br>石細胞<br>次生細胞壁　secondary cell wall<br>厚壁細胞在形成過程中，會在細胞膜及初<br>生細胞壁之間堆疊次生細胞壁，使得整個細胞<br>因厚壁或再添增木質素而更為堅固。此類細胞<br>在成熟後不再生長，多成為排列緊密的死細<br>胞。常見的厚壁細胞有石細胞和纖維細胞，例<br>如：梨果肉中有聚集成團的石細胞；維管束中<br>有成束的細長纖維細胞可協助支持植物體（圖 <br>2－3c）。<br> 圖 2　植物細胞的特化<br>特化<br>特化<br>特化<br>特化<br>薄壁細胞<br>厚度均勻的初生細胞壁<br>不均勻加厚的初生細胞壁<br>新細胞<br>初生<br>細胞壁<br>特化<br>加厚的次生細胞壁<br>厚壁細胞<br>厚角細胞<br> 圖 1　纖維素層在細胞壁的堆疊方式<br>纖維素<br>木質素<br>中膠層<br>次生細胞壁<br>初生細胞壁<br>細胞膜<br>纖維素<br>合成<br>第 2 章  植物體的構造與功能　35</p><small>課本 P35完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>  <br>Question<br>1. <br>植物可依細胞壁的厚薄與組成成分區分為薄壁、厚壁及厚角細胞，下列有關此三種細胞的敘述，何者正確？<br>(A)<br>薄壁細胞僅有初生細胞壁，無次生<br>細胞壁　<br>(<br>B)<br>具有支持功能的厚壁細胞及厚角細胞皆為死<br>細胞　<br>(<br>C)<br>韌皮部的細胞屬於薄壁<br>細胞　<br>(<br>D)<br>厚壁細胞發育的過程會直接形成次生細胞壁，使細胞更堅固。<br>解答<br>：<br>(A)<br>解析<br>：<br>(B)<br>厚角細胞為活細胞。<br>(C)<br>韌皮部<br>包含的篩管及伴<br>細胞為薄壁細胞，韌皮纖維為厚壁細胞。<br>(D)<br>厚壁細胞在特化過程會在初生細胞壁內側堆疊次生細胞壁。<br>41</p><small>原PPT第41頁完整文字</small></div><div class=\"quote\"><p>  <br>Question<br>2<br>. <br>下列植物的細胞與其種類及功能的配對，哪些正確？<br>細　胞<br>細胞種類<br>主要功能<br>(A)<br>保衛細胞<br>薄壁細胞<br>保護植 n \n器官\n \n→\n \n器官\n系統\n \n→\n 動物\n體\n2-1 \n植物體的構造與組成層次\n補充", "6": "2-1.1 \n植物細胞的種類\n◆ 植物細胞可依細胞壁的厚薄與組成成分而區分為\n\n薄壁細胞\n、\n厚角細胞\n、\n厚壁細胞\n三類\n薄壁細胞\n厚角細胞\n厚\n壁細胞\n配合課本 \nP34", "7": "◆\n \n形態\n：\n2-1.1 \n植物細胞的種類\n◆\n \n活細胞\n◇\n \n僅具\n初生細胞壁\n◇\n \n細胞排列疏鬆，具細胞間隙，多數細胞內具大型液泡\n薄壁細胞\n配合課本 \nP34", "8": "25\n \nµm\n2-1.1 \n植物細胞的種類\n薄壁細胞\n→ 例如\n：\n水果可食部位的薄壁細胞或\n表皮和維管束之間的\n皮層\n，其內的薄壁細胞具有\n儲存水分和養分\n的功能\n香蕉的果肉細胞以及染色的澱粉粒\n配合課本 \nP34\n薄壁細胞\n澱粉粒\n澱粉粒", "9": "→ 例如\n：\n位於根尖的\n生長點\n，其內的\n薄壁細胞可行\n細胞分裂\n2-1.1 \n植物細胞的種類\n植物根尖（ \n縱切面 ）\n薄壁細胞\n配合課本 \nP34\n、\n37\n生長點", "10": "2-1.1 \n植物細胞的種類\n◆\n \n位置\n：\n多位在莖、葉柄表皮下方\n◆\n \n形態\n：\n僅具\n初生細胞壁\n，\n厚度不均勻\n◆\n \n活細胞\n◆ 功能\n：\n具支持作用\n厚角細胞\n配合課本 \nP34", "11": "2-1.1 \n植物細胞的種類\n厚角細胞\n70\n \nµ\nm\n→ \n例如\n：\n西洋芹葉柄的厚角細胞\n表皮\n厚角細胞\n皮層\n細胞質\n不均勻加厚的初生細胞壁\n西洋芹葉柄\n配合課本 \nP34", "12": "2-1.1 \n植物細胞的種類\n◆\n \n形態\n：\n◇\n \n排列緊密\n◇ 具\n初生細胞壁\n和\n次生細胞壁\n，厚度均勻\n◆ 成熟後變為死細胞\n厚壁細胞\n配合課本 \nP35", "13": "2-1.1 \n植物細胞的種類\n厚壁細胞\n50\n \nµ\nm\n→ \n例如\n：\n梨果肉中有聚集成團的\n石細胞\n石細胞\n細胞壁\n空腔\n配合課本 \nP35", "14": "2-1.1 \n植物細胞的種類\n→ \n例如\n：\n維管束中有成束的細長\n纖維細胞\n可協助支持植物體\n細胞壁\n空腔\n200\n \nµ\nm\n維管束\n纖維細胞\n厚壁細胞\n配合課本 \nP35", "15": "  \n知識補給站\n細胞特化時細胞壁的變化\n       薄壁、厚角及厚壁細胞是如何特化形成？主要是植物細胞分裂後，纖維素層在細胞壁的堆疊方式不同\n。\n中膠層\n木質素\n次生細胞壁\n細胞膜\n初生細胞壁\n纖維素\n纖維素合成酶\n配合課本 \nP35\n15", "16": "  \n知識補給站\n細胞特化時細胞壁的變化\n       剛形成的\n細胞壁較薄，\n稱為\n初生細胞壁\n，是由排列鬆散的纖維素組成支撐結構。細胞膜上的纖維素合成\n酶\n會持續合成纖維素，且向細胞膜外堆疊而使初生細胞壁逐層增厚。細胞壁的增厚就像在空間內側牆上持續貼上層層壁紙，且每次貼的方向與材料不完全相同。\n配合課本 \nP35\n16", "17": "  \n知識補給站\n細胞特化時細胞壁的變化\n       正在生長中的細胞，其初生細胞壁\n具延展性\n，可容許細胞增大後，特化成\n薄壁細胞\n或\n厚角細胞\n。\n       但\n厚壁細胞\n是細胞增大後，在\n初生細胞壁內側\n增加排列緻密的纖維素層，稱為\n次生細胞壁\n，甚至可加入\n木質素\n加強其支撐結構。此時的細胞壁\n無法再延展\n，細胞也就不能改變形狀。\n配合課本 \nP35\n17", "18": "  \n知識補給站\n細胞特化時細胞壁的變化\n特化\n特化\n特化\n初生細胞壁\n不均勻加厚的初生細胞壁\n特化\n特化\n加厚的\n次生細胞壁\n初生細胞壁\n厚壁細胞\n新細胞\n細胞膜\n薄壁細胞\n厚角細胞\n配合課本 \nP35\n18\n厚度均勻的初生細胞壁", "19": "2-1.2 \n植物組織的種類\n基本組織\n維管束\n組織\n表皮\n組織\n◆ 除分生組織外，其餘組織係由成熟且完成分化的細胞共同組成\n分生組織\n植物的組織\n配合課本 \nP36", "20": "◆ \n植物組織的生長與變化：\n初級生長\n次級生長\n  頂端分生組織（ 初生分生組織 ）\n初生組織\n   側生分生組織\n（ 次生分生組織 let READING=null,tableState=null,resultObserver=null;
function readingBlocks(node){
 const blocks=[];for(const child of [...node.childNodes]){
  if(child.nodeType===3){if(child.textContent.trim()){const p=document.createElement('p');p.textContent=child.textContent;blocks.push(p);}continue;}
  if(child.matches('ul,ol'))for(const li of child.children){const list=document.createElement(child.tagName);list.append(li.cloneNode(true));blocks.push(list);}
  else blocks.push(child.cloneNode(true));
 }return blocks;
}
function prepareLesson(){

 for(const child of [...text.childNodes]){if(child.nodeType===1&&child.matches('.note-label,.note-prompt,.lesson-note'))notes.append(child);else if(child.nodeType===1&&child.matches('.quote'))ref.append(child);else core.append(child);}
 const canvas=document.createElement('div'),tools=document.createElement('div');canvas.className='figure-canvas';tools.className='figure-tools';
 for(const child of [...fig.children]){
  if(child.matches('.cap')){ref.append(child);continue;}
  if(child.matches('details.tbx')){const img=child.querySelector('img'),b=document.createElement('button');b.textContent='課本原圖';b.title=img.alt;b.onclick=()=>zoom(img.src,img.alt);tools.append(b);continue;}
  if(child.matches('.fctl,.fdots,button'))tools.append(child);else canvas.append(child);
 }
 fig.replaceChildren(canvas,tools);const groups=[{name:'教學重點',nodes:readingBlocks(core)},{name:'原文與圖說',nodes:readingBlocks(ref)},{name:'思考筆記',notes}];
 if(!groups[1].nodes.length){const p=document.createElement('p');p.className='cap';p.textContent=LEARN[LI].src;groups[1].nodes=[p];}

  const result=sim.querySelector('#simres'),layout=document.createElement('div');layout.className='sim-layout';layout.append(sim.querySelector('svg'),sim.querySelector('.simctl'));sim.replaceChildren(layout);
  result.hidden=true;fig.append(result);groups.push({name:'實驗結果',nodes:[document.createElement('p')]});
  resultObserver=new MutationObserver(()=>{if(!READING||LI!==SIM_CARD)return;READING.groups[3].nodes=readingBlocks(result);if(!READING.groups[3].nodes.length){const p=document.createElement('p');p.textContent=result.textContent;READING.groups[3].nodes=[p];}READING.cache='';if(result.textContent.includes('結果')||result.textContent.includes('無法確定'))selectReadingTab(3);fit();});
  groups[3].nodes[0].textContent=result.textContent;resultObserver.observe(result,{childList:true,subtree:true,characterData:true});
 }
 READING={groups,tab:0,indices:groups.map(()=>0),pages:[],cache:''};
 const tabs=document.createElement('div');tabs.className='reading-tabs';tabs.setAttribute('role','tablist');tabs.setAttribute('aria-label','圖解解說分頁');
 groups.forEach((g,i)=>{const b=document.createElement('button');b.id='reading-tab-'+i;b.textContent=g.name;b.setAttribute('role','tab');b.setAttribute('aria-controls','reading-pane-'+i);b.onclick=()=>selectReadingTab(i);b.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();e.stopPropagation();const n=e.key==='Home'?0:e.key==='End'?groups.length-1:(i+(e.key==='ArrowRight'?1:-1)+groups.length)%groups.length;selectReadingTab(n);tabs.children[n].focus();}};tabs.append(b);});
 text.replaceChildren(tabs);groups.forEach((g,i)=>{const pane=document.createElement('section');pane.className='reading-pane'+(g.notes?' notes-pane':'');pane.id='reading-pane-'+i;pane.setAttribute('role','tabpanel');pane.setAttribute('aria-labelledby','reading-tab-'+i);if(g.notes){pane.append(...g.notes.childNodes);pane.querySelector('textarea').oninput=e=>{ST.notes[LEARN[LI].id]=e.target.value;save();};}else{pane.innerHTML='<div class="reading-body"></div><div class="reading-pager"><button aria-label="上一頁解說">←</button><span aria-live="polite"></span><button aria-label="下一頁解說">→</button></div>';const buttons=pane.querySelectorAll('button');buttons[0].onclick=()=>stepReading(-1);buttons[1].onclick=()=>stepReading(1);}text.append(pane);});
 const table=canvas.querySelector('.cmp2');if(table){canvas.classList.add('table-canvas');const rows=[...table.rows].slice(1),pager=document.createElement('div');pager.className='table-pager';pager.innerHTML='<button>← 前組</button><span></span><button>後組 →</button><button>完整表格 ↗</button>';tools.append(pager);tableState={table,rows,index:0,count:1,pager,original:table.outerHTML};const b=pager.querySelectorAll('button');b[0].onclick=()=>{tableState.index--;fitLessonTable();};b[1].onclick=()=>{tableState.index++;fitLessonTable();};b[2].onclick=()=>openDialog('完整實驗設計比較表',tableState.original);}

}
function selectReadingTab(i){if(!READING)return;READING.tab=i;el('lcard').querySelectorAll('.reading-tabs button').forEach((b,j)=>{b.setAttribute('aria-selected',String(i===j));b.tabIndex=i===j?0:-1;});el('lcard').querySelectorAll('.reading-pane').forEach((p,j)=>p.hidden=i!==j);READING.cache='';fit();}
function stepReading(d){if(!READING)return;const i=READING.tab;READING.indices[i]=Math.max(0,Math.min((READING.pages[i]?.length||1)-1,READING.indices[i]+d));renderReading();}
function splitBlock(node,body){
 // Range fragments keep inline emphasis and every character when a long paragraph needs another page.
 const length=node.textContent.length;if(!length)return [node];const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT),texts=[];let n,offset=0;while(n=walker.nextNode()){texts.push({node:n,start:offset,end:offset+n.length});offset+=n.length;}
 function fragment(a,b){const range=document.createRange(),start=texts.find(t=>t.end>a),end=texts.find(t=>t.end>=b);range.setStart(start.node,a-start.start);range.setEnd(end.node,b-end.start);const clone=node.cloneNode(false);clone.append(range.cloneContents());return clone;}
 const parts=[];let from=0;while(from<length){let lo=from+1,hi=length,best=lo;while(lo<=hi){const mid=(lo+hi)>>1,c=fragment(from,mid);body.replaceChildren(c);if(body.scrollHeight<=body.clientHeight+1){best=mid;lo=mid+1;}else hi=mid-1;}
  if(best<length){const s=node.textContent.slice(from,best),breakAt=Math.max(s.lastIndexOf('。'),s.lastIndexOf('；'),s.lastIndexOf('，'));if(breakAt>Math.max(20,s.length*.55))best=from+breakAt+1;}
  parts.push(fragment(from,best));from=best;
 }body.replaceChildren();return parts;
}
function paginateReading(){
 if(!READING)return;const i=READING.tab,g=READING.groups[i];if(g.notes)return;const pane=el('reading-pane-'+i),body=pane.querySelector('.reading-body'),pager=pane.querySelector('.reading-pager');pager.hidden=false;
 const key=[i,body.clientWidth,body.clientHeight,ST.font,innerWidth>900].join(':');if(READING.cache===key){renderReading();return;}
 const pages=[[]];body.replaceChildren();
 if(innerWidth<=900){pages[0]=g.nodes.map(x=>x.cloneNode(true));}
 else for(const original of g.nodes){let node=original.cloneNode(true);body.append(node);if(body.scrollHeight<=body.clientHeight+1){pages.at(-1).push(node);continue;}node.remove();if(pages.at(-1).length){pages.push([]);body.replaceChildren();}body.append(node);if(body.scrollHeight<=body.clientHeight+1){pages.at(-1).push(node);continue;}
  body.replaceChildren();const parts=splitBlock(original,body);for(const part of parts){if(pages.at(-1).length)pages.push([]);pages.at(-1).push(part);}body.replaceChildren(...pages.at(-1));
 }
 READING.pages[i]=pages;READING.cache=key;READING.indices[i]=Math.min(READING.indices[i],pages.length-1);renderReading();
}
function renderReading(){if(!READING)return;const i=READING.tab,pages=READING.pages[i];if(!pages)return;const pane=el('reading-pane-'+i),j=READING.indices[i];pane.querySelector('.reading-body').replaceChildren(...pages[j].map(x=>x.cloneNode(true)));const pager=pane.querySelector('.reading-pager');pager.hidden=pages.length<2;pager.querySelector('span').textContent=`${j+1} / ${pages.length} 頁`;const b=pager.querySelectorAll('button');b[0].disabled=j===0;b[1].disabled=j===pages.length-1;bindZoom(pane);}
function fitLessonTable(){if(!tableState)return;const {table,rows,pager}=tableState,canvas=table.closest('.figure-canvas');rows.forEach(r=>r.hidden=false);if(innerWidth<=900){tableState.count=rows.length;tableState.index=0;}else{const head=table.rows[0].getBoundingClientRect().height,room=canvas.clientHeight-head-2;let height=0,count=0;for(const row of rows){const h=row.getBoundingClientRect().height;if(height+h>room&&count)break;height+=h;count++;}tableState.count=Math.max(1,count);tableState.index=Math.max(0,Math.min(Math.ceil(rows.length/tableState.count)-1,tableState.index));}
 const {count,index}=tableState;rows.forEach((r,i)=>r.hidden=i<index*count||i>=(index+1)*count);pager.querySelector('span').textContent=`${index+1} / ${Math.ceil(rows.length/count)} 組`;const b=pager.querySelectorAll('button');b[0].disabled=index===0;b[1].disabled=(index+1)*count>=rows.length;
}
function fitLesson(){
