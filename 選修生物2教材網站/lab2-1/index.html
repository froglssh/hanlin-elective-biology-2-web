const CONTENT={"lessons": [{"id": "b2-a21-l01", "t": "一片切片，三類細胞的分工", "src": "課本 P58；原PPT第 1 頁", "slide": 1, "sourcePages": [1, 2], "sec": "s1", "figSpec": {"flip": [1, 2]}, "txt": "<ul><li>本活動比較向日葵莖永久切片與新鮮西洋芹葉柄。</li><li>先找組織所在位置，再依細胞壁特徵辨認細胞類型。</li><li>目標是用觀察證據連結細胞、組織與功能。</li></ul><p class=\"think\">思考：切片中不同位置的細胞，是否需要相同的細胞壁？</p><div class=\"quote\">探討活動 <br>2-1 <br>植物的細胞與組織<br>前言<br>       在學過植物體的基本構造，並認識厚壁、厚角、薄壁等三種組成細胞類型後，你有注意到這三<br>種細胞的<br>分布位置不太相同嗎？從功能特性來看，這對植物有什麼幫助？還有，為什麼課本中所看到的植物組織照片會有顏色？而你自己切的卻沒有？<br>配合課本 <br>P58<br>1<small>原PPT第 1 頁（完整原文）</small></div><div class=\"quote\">探討活動 <br>2<br>-<br>1 <br>植物的細胞與組織<br>       本活動以顯微鏡觀察向日葵莖橫切面的永久切片標本，學習從中辨別表皮、皮層或維管束等不同組織，並分析這些組織的組成細胞類型屬於薄壁、厚角或厚壁細胞，然後歸納出表皮、皮層或維管束等組織的組成與功能之異同。此外，透過對新鮮植物材料進行徒手切片，練習辨識活體的內部構造，以利進一步推論各類組織在不同植物體內的功能。<br>目的<br>2<br>配合課本 <br>P58<small>原PPT第 2 頁（完整原文）</small></div><div class=\"quote\">探討活動 <br>前　言<br>在學過植物體的基本構造，並認識厚壁、厚角、薄壁等三種組成細胞類型後，<br>你有注意到這三種細胞的分布位置不太相同嗎？從功能特性來看，這對植物有什麼<br>幫助？還有，為什麼課本中所看到的植物組織照片會有顏色？而你自己切的卻沒<br>有？<br>目　的<br>本活動以顯微鏡觀察向日葵莖橫切面的永久切片標本，學習從中辨別表皮、皮<br>層或維管束等不同組織，並分析這些組織的組成細胞類型屬於薄壁、厚角或厚壁細<br>胞，然後歸納出表皮、皮層或維管束等組織的組成與功能之異同。此外，透過對新<br>鮮植物材料進行徒手切片，練習辨識活體的內部構造，以利進一步推論各類組織在<br>不同植物體內的功能。<br>原　理<br>在本章第 1 節已說明植物體的結構可依功能區分為保護的表皮組織系統、運輸<br>物質的維管束組織系統，以及填充在表皮與維管束之間的基本組織系統。觀察永久<br>切片時，可對照圖 2－3、2－15 及 2－21 等相關照片，以利辨識各類組織。<br>此外，一般永久切片標本的製程包括固定材料、包埋於石蠟中、切薄片及雙重<br>染色等過程。在染色時，必須將切片以不同溶液與染液浸泡、沖洗。雙重染色通常<br>採用番紅－固綠染色法（Safranin O－Fast green staining），會將薄壁細胞染成淡綠<br>色、厚壁細胞染成紅色。<br>在技術上，與永久切片相比，徒手切片的結果無法切得很薄，所以不易觀察組<br>織組成細胞的微細構造。然而，此技術可即時觀察植物構造，有利於快速了解整體<br>概況，因此仍是常用於操作草本或幼嫩植物材料的技術。<br>－1 植物的細胞與組織<br>2<br>58　選修生物 Ⅱ (全)<small>課本 PDF 第 1 頁，印刷 P58（完整原文）</small></div>", "tb": [["BOOK1", "P58 完整課本頁"]]}, {"id": "b2-a21-l02", "t": "三個組織系統：位置與功能", "src": "課本 P58；原PPT第 3 頁", "slide": 3, "sourcePages": [3], "sec": "s1", "figSpec": {"flip": [3]}, "txt": "<ul><li>表皮組織系統：位於外側，具有保護功能。</li><li>維管束組織系統：包括運輸相關組織。</li><li>基本組織系統：包含皮層、髓等區域，可有儲存與支持功能。</li></ul><p class=\"think\">思考：組織系統名稱與薄壁、厚角、厚壁細胞名稱，是相同層級嗎？</p><p class=\"scope-note\">判讀提醒：細胞類型與組織系統分開辨認；同一組織可含不只一種細胞。本活動未附跨節圖2-3、2-15、2-21，請依課本指定圖另行對照。</p><div class=\"quote\">探討活動 <br>2<br>-<br>1 <br>植物的細胞與組織<br>◆ 在本章<br>第 <br>1<br> 節<br>已說明植物體的結構可依功能區分為保護的表皮組織系統、運輸物質的維管束組織系統，以及填充在表皮與維管束之間的基本組織系統。<br>原理<br>◆ 觀察永久切片時，可<br>對照課本圖 <br>2-3<br>、<br>2-15<br> 及 <br>2-21<br> 等<br>相關照片，以利辨識各類組織。<br>配合課本 <br>P58<br>3<small>原PPT第 3 頁（完整原文）</small></div><div class=\"quote\">探討活動 <br>前　言<br>在學過植物體的基本構造，並認識厚壁、厚角、薄壁等三種組成細胞類型後，<br>你有注意到這三種細胞的分布位置不太相同嗎？從功能特性來看，這對植物有什麼<br>幫助？還有，為什麼課本中所看到的植物組織照片會有顏色？而你自己切的卻沒<br>有？<br>目　的<br>本活動以顯微鏡觀察向日葵莖橫切面的永久切片標本，學習從中辨別表皮、皮<br>層或維管束等不同組織，並分析這些組織的組成細胞類型屬於薄壁、厚角或厚壁細<br>胞，然後歸納出表皮、皮層或維管束等組織的組成與功能之異同。此外，透過對新<br>鮮植物材料進行徒手切片，練習辨識活體的內部構造，以利進一步推論各類組織在<br>不同植物體內的功能。<br>原　理<br>在本章第 1 節已說明植物體的結構可依功能區分為保護的表皮組織系統、運輸<br>物質的維管束組織系統，以及填充在表皮與維管束之間的基本組織系統。觀察永久<br>切片時，可對照圖 2－3、2－15 及 2－21 等相關照片，以利辨識各類組織。<br>此外，一般永久切片標本的製程包括固定材料、包埋於石蠟中、切薄片及雙重<br>染色等過程。在染色時，必須將切片以不同溶液與染液浸泡、沖洗。雙重染色通常<br>採用番紅－固綠染色法（Safranin O－Fast green staining），會將薄壁細胞染成淡綠<br>色、厚壁細胞染成紅色。<br>在技術上，與永久切片相比，徒手切片的結果無法切得很薄，所以不易觀察組<br>織組成細胞的微細構造。然而，此技術可即時觀察植物構造，有利於快速了解整體<br>概況，因此仍是常用於操作草本或幼嫩植物材料的技術。<br>－1 植物的細胞與組織<br>2<br>58　選修生物 Ⅱ (全)<small>課本 PDF 第 1 頁，印刷 P58（完整原文）</small></div>", "tb": [["BOOK1", "P58 完整課本頁"]]}, {"id": "b2-a21-l03", "t": "染色與切片厚度：圖像如何產生", "src": "課本 P58；原PPT第 4 頁", "slide": 4, "sourcePages": [4], "sec": "s1", "figSpec": {"flip": [4]}, "txt": "<ul><li>永久切片經固定、石蠟包埋、切薄片與染色。</li><li>教材番紅—固綠染色例子：薄壁細胞淡綠，厚壁細胞紅色。</li><li>徒手切片較厚，但可快速觀察新鮮材料的組織概況。</li></ul><p class=\"think\">思考：新鮮切片沒有同樣的顏色，是否表示沒有這類細胞？</p><p class=\"scope-note\">判讀提醒：染色顏色與製片方法有關，不能只靠顏色判定細胞類型；還須核對位置與細胞壁特徵。</p><div class=\"quote\">探討活動 <br>2-1 <br>植物的細胞與組織<br>◆ 一般永久切片標本的製程包括固定材料、包埋於石蠟中、切薄片及雙重染色等過程。在染色時，必須將切片以不同溶液與染液浸泡、沖洗。雙重染色通常採用番<br>紅<br>—<br>固<br>綠染色法（<br>Safranin<br> <br>O—Fast <br>green staining<br>），會將薄壁細胞染成淡綠色、厚壁細胞染成紅色。<br>◆ 在技術上，與永久切片相比，徒手切片的結果無法切得很薄，所以不易觀察組織組成細胞的微細構造。然而，此技術可即時觀察植物構造，有利於快速了解整體概況，因此仍是常用於操作草本或幼嫩植物材料的技術。<br>配合課本 <br>P58<br>4<small>原PPT第 4 頁（完整原文）</small></div><div class=\"quote\">探討活動 <br>前　言<b 圖"}, {"src": "PPT18S3", "cap": "原PPT第18頁末段代表畫面"}, {"src": "BOOK4", "cap": "P61 完整課本頁"}], "fig": "celeryTable", "kind": "reflection", "original": true, "sourceSlide": 18, "reflectionLabel": "我的觀察與討論（保存文字，不自動評分）", "reflectionPlaceholder": "材料／倍率：\n與向日葵莖的比較：\n支持葉片的細胞與位置：\n觀察證據及功能解釋：\n限制或待查：", "reviewPrompts": ["有記錄材料、倍率與估算方法嗎？", "有分清實測、教材示範與推論嗎？", "能以位置與細胞特徵解釋功能嗎？"], "id": "b2-a21-q10"}], "tags": {"method": ["製片與觀察", "先低倍率定位，再高倍率看特徵；選薄片製作水埋片。", "P59–61；PPT6–13"], "structure": ["細胞與組織", "細胞類型、所在位置與組織系統分開判讀。", "P58–61；PPT3、7、17、21"], "ratio": ["比例與證據", "說明估算分母、方法與限制；面積比例不等於細胞數目比例。", "P61；PPT14–20"], "support": ["葉柄與支持", "厚角細胞支持幼嫩器官；比例最高者不一定主導支持。", "P61；PPT18–21"]}, "conceptMap": {"method": 10, "structure": 5, "ratio": 13, "support": 17}, "pptText": {"1": "探討活動 \n2-1 \n植物的細胞與組織\n前言\n       在學過植物體的基本構造，並認識厚壁、厚角、薄壁等三種組成細胞類型後，你有注意到這三\n種細胞的\n分布位置不太相同嗎？從功能特性來看，這對植物有什麼幫助？還有，為什麼課本中所看到的植物組織照片會有顏色？而你自己切的卻沒有？\n配合課本 \nP58\n1", "2": "探討活動 \n2\n-\n1 \n植物的細胞與組織\n       本活動以顯微鏡觀察向日葵莖橫切面的永久切片標本，學習從中辨別表皮、皮層或維管束等不同組織，並分析這些組織的組成細胞類型屬於薄壁、厚角或厚壁細胞，然後歸納出表皮、皮層或維管束等組織的組成與功能之異同。此外，透過對新鮮植物材料進行徒手切片，練習辨識活體的內部構造，以利進一步推論各類組織在不同植物體內的功能。\n目的\n2\n配合課本 \nP58", "3": "探討活動 \n2\n-\n1 \n植物的細胞與組織\n◆ 在本章\n第 \n1\n 節\n已說明植物體的結構可依功能區分為保護的表皮組織系統、運輸物質的維管束組織系統，以及填充在表皮與維管束之間的基本組織系統。\n原理\n◆ 觀察永久切片時，可\n對照課本圖 \n2-3\n、\n2-15\n 及 \n2-21\n 等\n相關照片，以利辨識各類組織。\n配合課本 \nP58\n3", "4": "探討活動 \n2-1 \n植物的細胞與組織\n◆ 一般永久切片標本的製程包括固定材料、包埋於石蠟中、切薄片及雙重染色等過程。在染色時，必須將切片以不同溶液與染液浸泡、沖洗。雙重染色通常採用番\n紅\n—\n固\n綠染色法（\nSafranin\n \nO—Fast \ngreen staining\n），會將薄壁細胞染成淡綠色、厚壁細胞染成紅色。\n◆ 在技術上，與永久切片相比，徒手切片的結果無法切得很薄，所以不易觀察組織組成細胞的微細構造。然而，此技術可即時觀察植物構造，有利於快速了解整體概況，因此仍是常用於操作草本或幼嫩植物材料的技術。\n配合課本 \nP58\n4", "5": "探討活動 \n2-1 \n植物的細胞與組織\n器材\n每組使用\n向日葵莖橫切面的永久片標本\n1\n 片\n單面刀片\n數片\n燒杯或培養皿\n1\n 個\n鑷子\n1\n 支\n蒸餾水\n1\n 瓶\n載玻片\n數片\n蓋玻片\n數片\n複式顯微鏡\n1\n 臺\n新鮮西洋芹葉柄\n1\n 支\n配合課本 \nP59\n5", "6": "探討活動 \n2-1 \n植物的細胞與組織\n取向日葵莖的永久切片標本，以低倍率在顯微鏡下觀察表皮、維管束及基本組織（如皮層、髓）在莖橫切面中的分布與所占的比例，以及其維管束的排列方式。\n(\n一\n)\n 永久切片的觀察\n步驟\n永久切片標本\n配合課本 \nP59\n6", "7": "探討活動 \n2-1 \n植物的細胞與組織\n(\n一\n)\n 永久切片的觀察\n再以高倍率繼續觀察表皮、維管束及基本組織（如皮層、髓）各構造的細胞形態\n，例如\n：\n細胞壁的厚薄、是否具細胞核、有無細胞內含物等。\n配合課本 \nP59\n7", "8": "探討活動 \n2-1 \n植物的細胞與組織\n(\n一\n)\n 永久切片的觀察\n記錄觀察結果並繪製示意圖，標示出各項構造的所在位置。\n註\n並非所有構造皆會出現在同一切片中。\n配合課本 \nP59\n8", "9": "探討活動 \n2-1 \n植物的細胞與組織\n(\n二\n)\n \n新鮮植物切片的觀察\n步驟\n取西洋芹的葉柄，用刀片切下適當大小的片段，以便進行徒手切片。\n配合課本 \nP60\n9", "10": "探討活動 \n2-1 \n植物的細胞與組織\n(\n二\n)\n \n新鮮植物切片的觀察\n一手以拇指與食指穩住欲切的材料，另一手持穩刀片，將材料橫切成薄片。\n註\n橫切是指從與材料主軸垂直的方式切下；若欲橫切葉片，則將主脈當作主軸，以垂直主脈的方向來切。\n配合課本 \nP60\n10", "11": "探討活動 \n2-1 \n植物的細胞與組織\n(\n二\n)\n \n新鮮植物切片的觀察\n反覆操作步驟 \n2\n，將切下的薄片移至裝水的培養皿或燒杯中。\n配合課本 \nP60\n11", "12": "探討活動 \n2-1 \n植物的細胞與組織\n(\n二\n)\n \n新鮮植物切片的觀察\n取一載玻片，於中央加一滴蒸餾水，從\n步驟 \n3\n 的\n培養皿（燒杯）中選取較薄的切片（呈現半透明狀者較佳，切片愈薄愈易觀察），以鑷子將切片移至載玻片上，蓋上蓋玻片，製成水埋玻片標本。\n配合課本 \nP61\n12", "13": "探討活動 \n2-1 \n植物的細胞與組織\n(\n二\n)\n \n新鮮植物切片的觀察\n在顯微鏡下，以低倍率觀察切片中的不同組織，與上述永久切片的組織觀察結果作比較，特別注意維管束的分布以及表皮內側的厚角組織。接著在高倍率下，觀察厚角細胞的細胞壁特徵，然後記錄觀察結果。\n配合課本 \nP61\n13", "14": "探討活動 \n2-1 \n植物的細胞與組織\n討論\n1. \n從向日葵的莖橫切面中，分別估算薄壁、厚角及厚壁細胞的比例，哪一類細胞所占的比例較高？這對向日葵有何益處？嘗試從此三類組成細胞在莖中的功能（詳\n見課本第 \n34\n、\n35\n 頁\n）來討論。\n配合課本 \nP61\n14", "15": "探討活動 \n2-1 \n植物的細胞與組織\n總橫切面中\n所占比例\n三種細胞在個別構造中\n所占比例\n與功能\n薄壁\n細胞／功能\n厚角\n細胞／功能\n厚壁\n細胞／功能\n表皮\n3%\n100\n%\n／保護\n-\n-\n皮層\n28%\n60\n%\n／儲存\n40\n%\n／支持\n-\n維管束\n21%\n20\n%\n／輸送\n養分\n-\n80\n%\n／支持\n、\n輸送水分\n髓\n48%\n100\n%\n／儲存\n-\n-\n答\n：\n配合課本 \nP61\n15", "16": "探討活動 \n2-1 \n植物的細胞與組織\n向日葵\n的莖橫切面中薄壁、厚角及厚壁細胞的比例及其\n功能以上表為例（\n表格中的數值為單一取樣之相對估計值，僅供參考）。\n整體而言，薄壁細胞所占比例較高。若單從維管束中的細胞數目來看，厚壁細胞的數目並沒有比薄壁細胞多，然而就所占面積來看，木質部中負責輸水的導管細胞是厚壁細胞，其面積較大，故所占比例大。\n配合課本 \nP61\n16", "17": "探討活動 \n2-1 \n植物的細胞與組織\n而薄壁細胞的功能則會因所在植物部位的不同而略有差異，例如：表皮的薄壁細胞緊密連接，具有保護其內部組織的功能，而位於皮層內部的薄壁細胞以及莖中央的髓則可儲存水分與其他代謝產物。\n在幼莖靠近表皮的皮層組織中有大量的厚\n角細胞，\n具有協助支持的功能，隨著向日葵的逐漸成熟，莖已經在維管束中藉由維管束形成層增加次級生長的組織，如此將逐漸增加木質部的支持功能。\n配合課本 \nP61\n17", "18": "探討活動 \n2-1 \n植物的細胞與組織\n2. \n承上題，在西洋芹的葉柄中，有類似的結果嗎？西洋芹的莖短縮，葉柄才是地上部分的主要構造，能支撐葉片且生長快速。從三類組成細胞的功能來看，葉柄中的何種\n細胞是\n提供支撐葉片功能的主要組成？\n配合課本 \nP61\n18", "19": "探討活動 \n2-1 \n植物的細胞與組織\n總橫切面中\n所占比例\n三種細胞在個別構造中\n所占比例\n與功能\n薄壁\n細胞／功能\n厚角\n細胞／功能\n厚壁\n細胞／功能\n表皮\n3%\n100\n%\n／保護\n-\n-\n皮層\n16%\n60\n%\n／儲存\n40\n%\n／支持\n-\n維管束\n6%\n40\n%\n／輸送\n養分\n-\n60\n%\n／支持\n、\n輸送水分\n基本組織\n75%\n100\n%\n／儲存\n-\n-\n答\n：\n配合課本 \nP61\n19", "20": "探討活動 \n2-1 \n植物的細胞與組織\n西洋\n芹的葉柄中薄壁、厚角及厚壁細胞所占的比例及其\n功能以上表為例（\n表格中的數值為單一取樣之相對估計值，僅供參考）。\n西洋芹葉柄的表皮與基本組織的\n組成大部分為\n薄壁\n細胞\n，維管束\n數目與向日葵莖相比雖然較多，但不再增生新組織，所占比例較低。\n配合課本 \nP61\n20", "21": "探討活動 \n2-1 \n植物的細胞與組織\n在快速生長的幼嫩葉柄中，靠近表皮的皮層有集中成束的厚\n角細胞，\n具有協助支持的功能。然而西洋芹葉柄為草本，以薄壁組織為主，維管束不發達，且因沒有維管束形成層的特化，因此不會持續發育或變大。\n配合課本 \nP61\n21"}, "originalCount": 2};

el('shsel').innerHTML=[...new Set(DECK.map(d=>d[1]))].map(n=>`<option value="${n}">第 ${n} 頁 · ${esc(DECK.find(d=>d[1]===n)[2].slice(0,22))}</option>`).join('');el('shsel').onchange=e=>{showStopPlay();SI=DECK.findIndex(d=>d[1]===+e.target.value);showRender();};el('shprev').onclick=()=>showStep(-1);el('shnext').onclick=()=>showStep(1);el('shplay').onclick=()=>{if(SPLAY)showStopPlay();else{if(SI===DECK.length-1)SI=0;showRender();SPLAY=setInterval(()=>{if(SI>=DECK.length-1){showStopPlay();return;}SI++;showRender()},2600);el('shplay').textContent='⏸ 暫停';}};el('shfs').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else el('show').requestFullscreen?.().catch(()=>{el('shfs').textContent='此瀏覽器不支援原生全螢幕'})};el('shclose').onclick=()=>navigate('intro');
el('theme-toggle').onclick=()=>{ST.theme=ST.theme==='dark'?'light':'dark';applyPreferences();save();};el('font-toggle').onclick=()=>{ST.font=(ST.font+1)%3;applyPreferences();save();fit();};function applyPreferences(){document.documentElement.dataset.theme=ST.theme;document.documentElement.style.setProperty('--text',[20,22,24][ST.font]+'px');document.documentElement.dataset.font=ST.font;el('theme-toggle').setAttribute('aria-pressed',String(ST.theme==='dark'));el('font-toggle').title='文字大小 '+[20,22,24][ST.font]+'px';}
document.addEventListener('fullscreenchange',fullscreenSync);document.addEventListener('keydown',e=>{if(e.isComposing||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if(document.querySelector('dialog[open]'))return;const fs=document.fullscreenElement===el('learn-stage')||el('learn-stage').classList.contains('presentation');if(fs){if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();if(LI<LEARN.length-1)showLearn(LI+1);}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();if(LI>0)showLearn(LI-1);}else if(e.key==='Escape')exitLearnFullscreen();return;}if(PAGE==='show'){if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();showStep(1);}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();showStep(-1);}else if(e.key==='Escape')navigate('intro');else if(e.key==='Home'){SI=0;showRender()}else if(e.key==='End'){SI=DECK.length-1;showRender()}return;}if(PAGE==='learn'&&el('flip')){if(e.key==='ArrowRight'){e.preventDefault();flipStop();flipShow(FI+1)}if(e.key==='ArrowLeft'){e.preventDefault();flipStop();flipShow(FI-1)}}});
el('learn-stage').addEventListener('contextmenu',e=>{if(document.fullscreenElement===el('learn-stage')||el('learn-stage').classList.contains('presentation')){e.preventDefault();if(LI<LEARN.length-1)showLearn(LI+1)}});
window.addEventListener('resize',fit);window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden){flipStop();showStopPlay();save();}});new ResizeObserver(fit).observe(el('bar'));
el('slide-text').onclick=()=>openDialog('原PPT第'+DECK[SI][1]+'頁原文',`<p>${esc(CONTENT.pptText[DECK[SI][1]])}</p>`);el('hero-image').src=IMG.overview;el('video-external').href=`https://drive.google.com/file/d/${VIDEO_ID}/view?usp=drivesdk`;el('raw-animation').onclick=()=>{const d=openDialog('原始簡報動畫',`<video controls autoplay playsinline style="width:100%" src="${ANIMATION_SRC}"></video>`);d.addEventListener('close',()=>d.querySelector('video')?.pause(),{once:true});};applyPreferences();const start=['learn','play','done'].includes(ST.page)?ST.page:'intro';navigate(start);if(!saving)storageNotice();
</script></body></html>
