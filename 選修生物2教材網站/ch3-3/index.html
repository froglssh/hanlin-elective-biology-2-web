種是發生於\n光合作用的光反應\n，\n特稱為\n光合磷酸化\n；\n另一種為發生於\n呼吸作用\n，特稱為\n氧化磷酸化\n。\n配合課本 \nP86\n38", "39": "◆\n \n總結\n：\n　　　\n3-3.2 \n光合作用的反應\n光反應的過程\n◇\n 反應式\n：\nH\n2\nO\n＋\nNADP\n＋\n＋\nADP\n＋\nPi\n→\n \nO\n2\n＋\nNADPH\n＋\nATP\n◇\n \n過程\n：\n光系統吸收\n光\n能\n \n→\n \n反應中心釋出高能電子\n \n\n→\n \n經電子傳遞鏈產生\n \nNADPH\n \n和形成\n \nH\n＋\n \n濃度梯度\n \n→\n \n光合\n磷酸化產生\n \nATP\n◇ \n能量\n變化\n：\n光\n能\n \n→\n \n化學能（\n \nNADPH\n \n和\n \nATP\n \n）\n配合課本 \nP84\n～\n86", "40": "◆ 固碳反應\n最初是由\n卡爾文\n等人以 \n14\nCO\n2\n \n為反應物，分析追蹤 \n14\nC\n 在綠球藻行光合作用過程中的轉變途徑得到，\n故\n固碳反應也稱為\n卡爾文循環\n3-3.2 \n光合作用的反應\n◆ 固碳反應發生在\n葉綠體基質\n中，是利用光反應產生的 \nATP\n \n與 \nNADPH\n \n將 \nCO\n2\n \n轉變為\n醣類\n的過程\n固碳反應\n【\n來點兒科學\n】\n植物固碳怎麼固\n配合課本 \nP87\n40", "41": "3-3.2 \n光合作用的反應\n固碳反應\n◆\n \n位置\n：\n葉綠體的\n基質\n，含固定二氧化碳形成葡萄糖的酵素\n葉綠體\n基質\n光合作用－固碳反應\n41\n配合課本 \nP87", "42": "3-3.2 \n光合作用的反應\n固碳反應\n再生階段\n還原\n階段\n6 ADP + 6 Pi\nATP\n6\n三碳化合物\n12\n12\n \nADP + 12\n \nPi\nATP\n12\n12 NADP\n+\nNADPH\n12\n三碳醣\n12\n再轉變成葡萄糖、蔗糖、澱粉等有機物\n◆\n \n過程\n：\n固碳階段\n6\n五碳醣\n配合課本 \nP87\n42\n三\n碳醣\n2\nCO\n2\n6", "43": "3-3.2 \n光合作用的反應\n固碳反應\n◆\n \n總結\n：\n　　　\n◇\n \n反應式\n：\nCO\n2\n＋\nNADPH\n＋\nATP\n→\n \nC\n6\nH\n12\nO\n6\n＋\nNADP\n+\n＋\nADP + Pi\n◇\n \n過程\n：\n固碳階段\n→\n 還原階段 \n→\n 再生階段\n◇\n \n能量變化\n：\n化學\n能\n \n(\n \nNADPH\n \n和\n \nATP\n \n)\n \n→\n \n化學能\n \n(\n醣類\n)\n配合課本 \nP87", "44": "3-3.2 \n光合作用的反應\n \n光反應\n固碳反應\n位　置\n類囊體\n基質\n \n反應物\nH\n2\nO\n、\nADP+Pi\n、\nNADP\n+\n \nCO\n2\n、\nATP\n、\nNADPH\n \n生成物\nO\n2\n、\nATP\n、\nNADPH\n醣類、\nADP+Pi\n、\nNADP\n+\n \n能量\n來源\n光\nATP\n、\nNADPH\n \n反應條件\n光反應必須在光照下才能進行\n反應中部分酵素需照光才有活性\n能量\n轉變\n \n光能→化學能\n \n化學能→化學能\n反應過程\n光系統吸收太陽能→反應中心釋出電子→電子傳遞鏈→光合磷酸化\n固\n碳階段\n→\n還原階段\n→再生\n階段\n◆ 光反應\n和固碳反應的\n比較\n：\n補充", "45": "3-3.2 \n光合作用的反應\n◆ \n藻類和植物等生物透過光合作用將光能轉換為化學能，並利用大氣中的碳，進而將能量儲存在三碳醣中，再經由其他代謝反應合成醣類與其他有機物，除了作為\n能量來源\n，亦是\n構成個體組成的材料\n配合課本 \nP88\n45", "46": "◆ \n從一棵小苗長成大樹的過程中，光合作用所產生的有機物不斷地積存在植物體各部位的組織中\n3-3.2 \n光合作用的反應\n◆ 在生態系中，藻類與植物是生產者，這些有機物將經由食物網的轉移，甚至影響到地球上其他的生物\n配合課本 \nP88", "47": "  \n知識補給站\n影響光合作用的環境因子\n◆ 光波長\n光\n　　　\n→ \n市面上販賣的植物生長燈是參考光合色素吸收光譜，以波長 \n400\n∼\n520\n \nnm\n（藍光）和波長 \n610\n∼\n720\n \nnm\n（紅光）所設計的植物燈\n配合課本 \nP88\n47", "48": "  \n知識補給站\n影響光合作用的環境因子\n溫度\n　　　\n◆ 適當溫度範圍內\n→ \n溫度愈高，光合作用速率愈高\n◆ \n溫度過高\n→ \n使參與光反應和固碳反應的酵素變性或影響類囊體的結構，造成光合作用速率下降，甚至暫停\n配合課本 \nP88\n48", "49": "  \n知識補給站\n影響光合作用的環境因子\n◆\n \n植物體內的 \nCO\n2\n \n濃度愈高，反應速率愈快，最後達到最大反應速率\nCO\n2\n　　　\n◆ 當達最大的光合作用速率時，即使 \nCO\n2\n \n濃度變得更高，光合作用速率也不再上升\n配合課本 \nP88\n49", "50": "  \nQuestion\n1. 1940 \n年代科學家以 \n18\nO \n進行光合作用的追蹤實驗，希望能釐清光合作用氧氣產生的來源，下列結果何者正確\n？　\n\n(\nA)\n若以 \nH\n2\n18\nO\n 進行反應，則會出現 \n18\nO\n2\n　\n(\nB)\n若以 \nH\n2\n18\nO\n 進行反應，則會出現 \nCH\n2\n18\nO\n　\n(\nC)\n若以 \nC\n18\nO\n2\n \n進行反應，則會出現 \n18\nO\n2\n　\n(\nD)\n不論以 \nC\n18\nO\n2\n \n或 \nH\n2\n18\nO\n 進行反應，都不會出現 \n18\nO\n2\n \n。\n解答\n：\n(\nA)\n \n解析\n：\n光反應產生的氧氣來自水的分解，而醣類中的氧原子來自二氧化碳。\n50", "51": "  \nQuestion\n2\n. \n右圖是植物光反應發生的過程，下列有關光反應的敘述何者正確\n？　\n(\nA)\n光系統中僅反應中心可吸收\n光能　 \n(\nB) PSII\n 的電子被光能激發出來後會進入電子傳遞鏈，產生 \nATP\n 後再開始分解水產生\n氧氣　\n(\nC) P680\n 是葉綠素 \na\n，\nP700\n 是葉綠素 \nb\n　\n(\nD) PSI\n 釋出電子後，來自 \nPSII\n 的電子會遞補給 \nPSI\n。\n51", "52": "  \nQuestion\n解析\n：\n(A)\n光合色素皆可吸收光能。\n(B)\n電子進入電子傳遞鏈的同時，\nPSII\n 會促使水被分解，產生 \nO\n2\n、\nH\n＋\n、\ne\n－\n。\n(C) P680\n、\nP700\n 皆為葉綠素 \na\n。\n解答\n：\n(D\n)\n \n52", "53": "  \nQuestion\n3. \n固碳反應是卡爾文等人利用 \n14\nCO\n2 \n作為追蹤劑所發現的，下列有關固碳反應的敘述何者正確\n？　\n(\nA)\n包含固碳、還原、再生三個階段，三階段皆需消耗 \nATP\n　\n(\nB)\n二氧化碳與五碳醣結合成穩定的三碳\n化合物　\n(\nC)\n過程中僅少量的三碳醣逸出卡爾文循環，合成其他的\n有機\n物\n　\n(\nD)\n大部分的三碳醣會消耗 \nNADPH \n形成五碳醣循環使用。\n解答\n：\n(C\n)\n \n解析\n：\n(A)\n還原階段需要消耗 \nATP\n、\nNADPH\n，再生階段需要消耗 \nATP\n。\n(B)\n二氧化碳與五碳醣反應後，分解形成不穩定的三碳化合物。\n(D)\n再生階段消耗 \nATP\n。\n53"}, "originalCount": 3};

}
function renderReading(){if(!READING)return;const i=READING.tab,pages=READING.pages[i];if(!pages)return;const pane=el('reading-pane-'+i),j=READING.indices[i];pane.querySelector('.reading-body').replaceChildren(...pages[j].map(x=>x.cloneNode(true)));const pager=pane.querySelector('.reading-pager');pager.hidden=pages.length<2;pager.querySelector('span').textContent=`${j+1} / ${pages.length} 頁`;const b=pager.querySelectorAll('button');b[0].disabled=j===0;b[1].disabled=j===pages.length-1;bindZoom(pane);}
function fitLessonTable(){if(!tableState)return;const {table,rows,pager}=tableState,canvas=table.closest('.figure-canvas');rows.forEach(r=>r.hidden=false);if(innerWidth<=900){tableState.count=rows.length;tableState.index=0;}else{const head=table.rows[0].getBoundingClientRect().height,room=canvas.clientHeight-head-2;let height=0,count=0;for(const row of rows){const h=row.getBoundingClientRect().height;if(height+h>room&&count)break;height+=h;count++;}tableState.count=Math.max(1,count);tableState.index=Math.max(0,Math.min(Math.ceil(rows.length/tableState.count)-1,tableState.index));}
 const {count,index}=tableState;rows.forEach((r,i)=>r.hidden=i<index*count||i>=(index+1)*count);pager.querySelector('span').textContent=`${index+1} / ${Math.ceil(rows.length/count)} 組`;const b=pager.querySelectorAll('button');b[0].disabled=index===0;b[1].disabled=(index+1)*count>=rows.length;
}
function fitLesson(){

}

 } });}
