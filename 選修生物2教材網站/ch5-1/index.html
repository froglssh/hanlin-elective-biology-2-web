<br>（<br>IAA<br>）<br>是最早被發現的一種<br>◆<br> <br>分泌處<br>：<br>莖<br>頂的分生組織、<br>幼<br>葉<br>、<br>根尖及發育<br>中的<br>種子<br>配合課本 <br>P139<small>原PPT第 4 頁（完整原文）</small></div><div class=\"quote\">5-1.1 生長素<br>生長素的發現來自英國的達爾文父子對芽鞘向光<br>性的研究（見探討活動5－1）。生長素是一種能促<br>進植物生長發育的有機物質，包含天然產生的<br>乙<br>酸（IAA）和人工合成的化合物〔<br>乙酸（NAA）、<br>二氯苯氧乙酸（2,4-D）〕。生長素主要在莖頂、幼<br>葉、根尖及發育中的種子等幼嫩部位生成，經運送至<br>其他部位，促進細胞的延長與組織的特化。然而 IAA <br>濃度對根、芽或莖等不同部位會造成不同的生長反應<br>（圖 5－1），對莖是促進生長的濃度，對根可能是抑<br>制生長，如莖與根的向性差異。植物莖的正向光性，<br>即是由於光照方向影響莖的向光側與背光側 IAA 含量<br>不同，而使兩側細胞的生長情況不同（圖 5－2）。<br>同理，莖的背地彎曲生長（負向地性）主要也是受到 <br>IAA 的影響。<br> 圖 5－1　生長素對植物體不同部位的生長有不同的影響<br>植物體內生長素濃度的對數（log10）值<br>相<br>對<br>生<br>長<br>︵<br>百<br>分<br>比<br>︶<br>莖<br>芽<br>200<br>100<br>－100<br>0<br>0<br>1<br>2<br>3<br>－1<br>－2<br>－3<br>－4<br>－5<br>－6<br>根<br>吲<br>乙酸　indoleacetic acid<br>向光性　phototropism<br>向地性　geotropism<br>IAA<br>右側照光<br> 圖 5－2　<br>嫩莖在側光照射下，因莖細胞<br>中 IAA 含量不同而呈現向光生長。<br>達爾文　Charles Robert Darwin, 1809∼1882<br>第 5 章  植物體的生長發育　139<small>課本 PDF 第 2 頁，印刷 P139（完整原文）</small></div>", "tb": [["BOOK2", "P139 完整課本頁"]]}, {"id": "b2-51-l04", "t": "看濃度曲線：根、芽、莖不同", "src": "課本 P139；原PPT第 5 頁", "slide": 5, "sec": "s2", "figSpec": {"image": "auxinGraph"}, "txt": "<ul><li>橫軸是濃度的對數；向右表示濃度增加，不是時間增加。</li><li>根在較低濃度就呈現反應；根、芽、莖的曲線峰值位置不同。</li><li>同一濃度可能促進莖的生長，卻抑制根的生長。</li></ul><p class=\"think\">思考：如果只說「生長素促進生長」，漏掉了哪些條件？</p><p class=\"scope-note\">教材判讀：曲線為教材示意，應讀相對趨勢，不從圖中估算田間用藥濃度。</p><div class=\"quote\">→ 生長素對植物體不同部位的生長有不同的影響<br>5-1.1 <br>生長素<br>◇ <br>促細胞延長與組織的特化<br>◆ <br>作用<br>：<br>促進莖生長的濃度，對根可能是抑制<br>根<br>芽<br>莖<br>配合課本 <br>P139<br>200<br>100<br>0<br>-100<br>植物體內生長素濃度的對數（<br>log<br>10<br>）值<br> <br>相對生長（百分比）<br>-<br>７<br>-<br>６<br>-<br>５<br>-<br>４<br>-<br>３<br>-<br>２<br>-<br>１<br>０<br>１<br>２<br>３<br>４<small>原PPT第 5 頁（完整原文）</small></div><div class=\"quote\">5-1.1 生長素<br>生長素的發現來自英國的達爾文父子對芽鞘向光<br>性的研究（見探討活動5－1）。生長素是一種能促<br>進植物生長發育的有機物質，包含天然產生的<br>乙<br>酸（IAA）和人工合成的化合物〔<br>乙酸（NAA）、<br>二氯苯氧乙酸（2,4-D）〕。生長素主要在莖頂、幼<br>葉、根尖及發育中的種子等幼嫩部位生成，經運送至<br>其他部位，促進細胞的延長與組織的特化。然而 IAA <br>濃度對根 第 12 頁", "slide": 12, "sec": "s3", "figSpec": {"flip": [12, 13, 14]}, "txt": "<ul><li>教材從稻苗異常徒長，追蹤真菌分泌物及培養液的作用。</li><li>觀察症狀、培養液測試、物質分離，是不同層次的研究證據。</li><li>原文完整保留澤田兼吉、黑澤英一與藪田貞治郎等研究史。</li></ul><p class=\"think\">思考：培養液有作用，是否已足以證明其中只有一種有效物質？</p><p class=\"scope-note\">教材判讀：年份、人物與歷史學名依教材保留；歷史名稱不當作現行真菌分類名稱。</p><div class=\"quote\">  <br>知識補給站<br>吉貝素與<br>臺灣<br>的淵源<br>       吉貝素的發現是源於日治時期<br>臺灣總督府<br> <br>農業試驗場<br>對「水稻馬鹿苗病（<br>bakanae<br> disease<br>）」的研究。水稻馬鹿苗病就是水稻徒長病，特徵為染病的稻苗莖部會不正常抽長，之後也無法結實。<br>◆<br> <br>1912<br> 年，<br>臺灣總督府<br> <br>農業試驗場<br>的技師<br>澤田兼吉<br>指出，水稻馬鹿苗病可能是由致病真菌所分泌的物質造成稻苗的不正常徒長<br>◆ 1919<br> 年，另一名技師<br>藤黑與三郎<br>與<br>澤田兼吉<br>將這類真菌命名為「藤倉赤霉（<br>Lisea<br> <br>fujikuroi<br> <br>Sawada<br>）」<br>配合課本 <br>P142<br>12<small>原PPT第 12 頁（完整原文）</small></div><div class=\"quote\">  <br>知識補給站<br>吉貝素與<br>臺灣<br>的淵源<br>◆ 1926<br> 年，<br>臺灣總督府<br> <br>中央研究所<br>的技師<br>黑澤英一<br>發現，從染病稻苗萃取濾出的培養液同樣會導致水稻及其他亞熱帶的禾草有如同馬鹿苗病一樣的症狀，自此證實了「藤倉赤霉」能分泌某種化學物質。該學名於 <br>1931<br> 年統一為<br>Gibberella<br> <br>fujikuroi<br>（<br>Sawada<br>）<br>Wollenw<br>.<br>◆ <br> <br>1933<br> 年，<br>黑澤英一<br>從<br>臺灣<br>返回<br>日本<br>，提供<br>臺灣<br>的「藤倉赤霉」真菌樣品給<br>東京帝國大學<br> <br>藪田貞治郎<br>教授，開始進行物質純化工作<br>配合課本 <br>P142<br>13<small>原PPT第 13 頁（完整原文）</small></div><div class=\"quote\">  <br>知識補給站<br>吉貝素與<br>臺灣<br>的淵源<br>◆ 1934<br> 年，<br>藪田貞治郎<br>成功分離出此物質，並確認有化學活性，將其定名為「吉貝素（<br>Gibberellin<br>）」。這個重大發現雖引起注意，但之後時逢第二次世界大戰，待至戰後才<br>有再展開一連串<br>的相關研究<br>配合課本 <br>P142<br>14<small>原PPT第 14 頁（完整原文）</small></div><div class=\"quote\">吉貝素與臺灣的淵源<br>吉貝素的發現是源於日治時期臺灣總督府 農業試驗場對「水稻馬鹿苗病（bakanae disease）」的研<br>究。水稻馬鹿苗病就是水稻徒長病，特徵為染病的稻苗莖部會不正常抽長，之後也無法結實。<br>1912 年，臺灣總督府 農業試驗場的技師澤田兼吉指出，水稻馬鹿苗病可能是由致病真菌分泌的物質<br>造成稻苗不正常徒長。1919 年，另一名技師藤黑與三郎與澤田兼吉將這類真菌命名為「藤倉赤霉（Lisea <br>fujikuroi Sawada）」。1926 年，臺灣總督府 中央研究所的技師黑澤英一發現，從染病稻苗萃取濾出的<br>培養液，同樣會導致水稻及其他亞熱帶的禾草有如同馬鹿苗病一樣的症狀，自此證實了「藤倉赤霉」能分<br>泌某種化學物質。「藤倉赤霉」學名於1931 年統一為Gibberella fujikuroi（Sawada）Wollenw.。<br>1933 年，黑澤英一從臺灣返回日本，提供臺灣的「藤倉赤霉」真菌樣品給東京帝國大學 藪田貞治郎<br>教授，開始進行物質純化工作。1934 年，藪田貞治郎成功分離出此物質，並確認有化學活性，將其定名<br>為「吉貝素（Gibberellin）」。這個重大發現雖引起注意，但之後時逢第二次世界大戰，待至戰後才有再<br>展開一連串的相關研究。<br>知識補給站<br>澤田兼吉　Kaneyoshi Sawada, 1883∼1950<br>藤黑與三郎　Yosaburo Fujikuro<br>黑澤英一　Eiichi Kurosawa, 1894∼1953<br>藪田貞治郎　Teijiro Yabuta, 1888∼1977<br> 圖 5－7　<br>彩葉甘藍，箭頭所指處為吉貝素<br>促進花莖生長並開花。<br>促進開花與果實生長<br>在適當的光照時間下，GA 能刺激植物長出花芽，促進植物開花，常<br>應用在誘導彩葉甘藍開花（圖5－7）；GA 對於果實的發育也會有所影<br>響，可使節間生長而增加花的間距，提供果實更多生長的空間，進而使果<br>實長得肥大多汁，例如：葡萄花穗的節間變長（圖5－8）。<br> 圖 5－8　<br>吉貝素可改善葡萄結實。右側因添<br>加 GA 而使果實明顯大於左側。<br>142　選修生物 Ⅱ (全)<small>課本 PDF 第 5 頁，印刷 P142（完整原文）</small></div>", "tb": [["BOOK5", "P142 完整課本頁"]]}, {"id": "b2-51-l11", "t": "節間伸長：GA 的反應要看情境", "src": "課本 P141；原PPT第 15 頁", "slide": 15, "sec": "s3", "figSpec": {"image": "cabbage"}, "txt": "<ul><li>添加 GA 可使教材中的矮性捲心甘藍節間明顯伸長。</li><li>GA 可促進細胞分裂及延長，造成莖的節間生長。</li><li>補回合成不足與對 GA 不敏感，是不同的情況，不能混為一談。</li></ul><p class=\"think\">思考：若矮性植株對 GA 沒反應，可否直接斷定沒有生長激素？</p><p class=\"scope-note\">教材判讀：原PPT及原題二以正常植株對外加 GA 反應有限的模型判讀；不能擴成「所有正常植物一定無反應」。豌豆研究顯示反應會隨發育階段改變。<a href=\"https://pubmed.ncbi.nlm.nih.gov/24186655/\" target=\"_blank\" rel=\"noopener\">GA 與豌豆節間生長研究</a></p><div class=\"quote\">→ 正常莖<br>5-1.2 <br>吉貝素<br>◆<br> <br>作用：<br>◇<br> <br>促進<br>細胞分裂和細胞<br>延長<br>，<br>造成<br>莖的節間伸長，植物長高<br>▪ <br>矮莖植株（<br>天生缺乏吉貝素<br>）<br>→ 施加吉貝素<br>→ 正常莖<br>▪ 正常莖植株<br>→ 施加吉貝素<br>矮性捲心甘藍<br>添加 <br>GA<br> 之後<br>配合課本 <br>P141<small>原PPT第 15 頁（完整原文）</small></div><div class=\"quote\">1<br>2<br>3<br>4<br>GA<br>GA<br>水解<br>酵素<br>小分子<br>養分<br>水<br>胚乳<br>種皮<br>胚芽<br>糊粉層<br>胚根<br>子葉<br>（子葉盤）<br>GA 自胚芽及子葉<br>進入胚乳<br>種子吸水，<br>胚產生GA<br>糊粉層分泌水解酵素，<br>分解胚乳的大分子養分<br>小分子養分被子葉<br>吸收，供幼苗生長<br>5-1.2 吉貝素<br>吉貝素（GA）的發現與臺灣的水稻栽種歷史有很深的關係。在<br>植物體內，GA 主要由根尖和莖頂的初生分生組織、植株嫩芽處及種<br>子內的胚所產生。<br>促進節間生長<br>GA 可促進細胞分裂和細胞的延長，以造成莖的節間生長，讓植<br>物長高，例如：一些矮性植物如捲心甘藍（高麗菜），其節間較野生<br>植株短，若添加GA 後，則可促進莖的節間生長（圖5－5），使此矮<br>莖植株長至與野生植株相似。<br>促進種子萌發<br>當單子葉植物種子成熟時，胚中 GA 的濃度會升高而促進種子的<br>萌發與幼苗的生長。例如：大麥種子浸水後，GA 會從胚芽與子葉擴<br>散進入胚乳，並促進位於胚乳外層的糊粉層產生水解酵素，分解胚乳<br>中的澱粉養分與蛋白質，形成葡萄糖與胺基酸等小分子，提供幼苗生<br>長所需（圖 5－6）。<br> 圖 5－5　<br>矮性捲心甘藍<br>（左下方）添<br>加 GA 之後，莖<br>的節間明顯生長<br>（右側）。<br> 圖 5－6 ": ["flowerGA", "grapeGA"]}, "txt": "<ul><li>在適當光照時間等條件下，GA 可促進教材中的彩葉甘藍開花。</li><li>葡萄花穗節間增長，花之間空間增加，影響果實生長。</li><li>果實長大與果實成熟，是不同現象，不可用同一名稱代替。</li></ul><p class=\"think\">思考：要比較 GA 對葡萄的作用，需要控制哪些生長條件？</p><p class=\"scope-note\">教材判讀：依本節例子判讀，並非所有物種開花都由 GA 單獨決定。</p><div class=\"quote\">▪ <br>在適當的光照時間下，<br>GA <br>能刺激植物長出花芽，促進植物開花<br>5-1.2 <br>吉貝素<br>→ <br>例如<br>：<br>誘導彩葉甘藍等長日照植物開花<br>◇<br> <br>促進開花<br>彩葉甘藍，箭頭所指處為吉貝素促進花莖伸長並開花<br>配合課本 <br>P142<small>原PPT第 18 頁（完整原文）</small></div><div class=\"quote\">◇<br> <br>影響<br>果實生長<br>→<br> <br>例如<br>：<br>葡萄花穗的節間變長<br>▪ <br>使節間增長而增加花的間距，提供果實更多生長的空間，進而使果實長得肥大多汁<br>5-1.2 <br>吉貝素<br>吉貝素可改善葡萄結實。右側因添加 <br>GA<br> 而使果實明顯大於左側者<br>配合課本 <br>P142<small>原PPT第 19 頁（完整原文）</small></div><div class=\"quote\">吉貝素與臺灣的淵源<br>吉貝素的發現是源於日治時期臺灣總督府 農業試驗場對「水稻馬鹿苗病（bakanae disease）」的研<br>究。水稻馬鹿苗病就是水稻徒長病，特徵為染病的稻苗莖部會不正常抽長，之後也無法結實。<br>1912 年，臺灣總督府 農業試驗場的技師澤田兼吉指出，水稻馬鹿苗病可能是由致病真菌分泌的物質<br>造成稻苗不正常徒長。1919 年，另一名技師藤黑與三郎與澤田兼吉將這類真菌命名為「藤倉赤霉（Lisea <br>fujikuroi Sawada）」。1926 年，臺灣總督府 中央研究所的技師黑澤英一發現，從染病稻苗萃取濾出的<br>培養液，同樣會導致水稻及其他亞熱帶的禾草有如同馬鹿苗病一樣的症狀，自此證實了「藤倉赤霉」能分<br>泌某種化學物質。「藤倉赤霉」學名於1931 年統一為Gibberella fujikuroi（Sawada）Wollenw.。<br>1933 年，黑澤英一從臺灣返回日本，提供臺灣的「藤倉赤霉」真菌樣品給東京帝國大學 藪田貞治郎<br>教授，開始進行物質純化工作。1934 年，藪田貞治郎成功分離出此物質，並確認有化學活性，將其定名<br>為「吉貝素（Gibberellin）」。這個重大發現雖引起注意，但之後時逢第二次世界大戰，待至戰後才有再<br>展開一連串的相關研究。<br>知識補給站<br>澤田兼吉　Kaneyoshi Sawada, 1883∼1950<br>藤黑與三郎　Yosaburo Fujikuro<br>黑澤英一　Eiichi Kurosawa, 1894∼1953<br>藪田貞治郎　Teijiro Yabuta, 1888∼1977<br> 圖 5－7　<br>彩葉甘藍，箭頭所指處為吉貝素<br>促進花莖生長並開花。<br>促進開花與果實生長<br>在適當的光照時間下，GA 能刺激植物長出花芽，促進植物開花，常<br>應用在誘導彩葉甘藍開花（圖5－7）；GA 對於果實的發育也會有所影<br>響，可使節間生長而增加花的間距，提供果實更多生長的空間，進而使果<br>實長得肥大多汁，例如：葡萄花穗的節間變長（圖5－8）。<br> 圖 5－8　<br>吉貝素可改善葡萄結實。右側因添<br>加 GA 而使果實明顯大於左側。<br>142　選修生物 Ⅱ (全)<small>課本 PDF 第 5 頁，印刷 P142（完整原文）</small></div>", "tb": [["BOOK5", "P142 完整課本頁"]]}, {"id": "b2-51-l14", "t": "細胞分裂素：旺盛分裂的部位", "src": "課本 P143；原PPT第 20 頁", "slide": 20, "sec": "s4", "figSpec": {"flip": [20]}, "txt": "<ul><li>CK 是一群含腺嘌呤的植物激素，可促進細胞分裂。</li><li>萌發中的種子、根尖等分裂旺盛的部位是教材列出的產生部位。</li><l （完整原文）</small></div><div class=\"quote\">5-1.5 <br>乙烯<br>葉內 <br>IAA<br> 濃度高，抑制葉柄基部對乙烯的敏感度<br>葉老化時，葉內 <br>IAA<br> <br> <br>濃度降低，葉柄基部因乙烯增加而形成離層<br>老葉脫落<br>IAA<br>IAA<br>降低<br>乙烯<br>側芽<br>葉柄<br>離層<br>葉脫落的痕跡<br>配合課本 <br>P146<small>原PPT第 32 頁（完整原文）</small></div><div class=\"quote\">農產品和花卉的保鮮<br>一般農產品和花卉為了降低採收後和運輸時的消耗，會採取保鮮措施。像是對農產品採取「預冷」的<br>降溫處理，藉由低溫減少乙烯的作用；或是為延長切花的保存期限，會加入乙烯抑制劑作為保鮮劑，以抑<br>制乙烯的合成。<br>乙烯的合成與楊氏循環<br>關於植物細胞合成乙烯的過程，是由曾擔任美國<br> 國家科學院、臺灣<br> 中央研究院院士和副院長的楊<br>祥發先生發現的，由於其卓越的研究成果，因此細胞合成乙烯過程的中間產物循環路徑，稱為楊氏循環<br>（Yang cycle）。他也獲得了沃爾夫農業獎的殊榮，相當於「農業界的諾貝爾獎」。<br>知識補給站<br>楊祥發　Shang Fa Yang, 1932∼2007<br>146　選修生物 Ⅱ (全)<br>促進細胞老化與離層形成<br>植物體隨著季節變化會有生長快慢的差異，尤其是落葉性植株，其葉片會隨季節更<br>替。在葉片生長至老化、脫落的過程中，主要由三種植物激素負責調控：乙烯促進葉的老<br>化，而 IAA 與CK 則延緩葉的老化，彼此間具有拮抗作用。<br>在葉生長的初期，幼葉內的 IAA 濃度高，可減低葉柄基部細胞對乙烯的敏感度，故能<br>避免乙烯誘導葉柄基部形成離層；然而，當葉趨向老化時，葉肉細胞不再生成 IAA，反而<br>產生較多的乙烯，加速葉的老化並形成離層，老葉隨之脫落（圖 5－13）。<br>IAA<br>葉脫落的痕跡<br>乙烯<br>濃度降低<br>IAA<br>1<br>2<br>3<br>老葉脫落<br>幼葉內IAA 濃度高，抑制葉<br>柄基部細胞對乙烯的敏感度<br>葉老化時，葉內IAA 濃度降低，葉柄基部因乙烯<br>增加而形成離層<br>側芽<br>葉柄<br>離層<br> 圖 5－13　乙烯與 IAA 對葉脫落過程的調控作用（紅色與黑色箭號分別表示兩種激素的釋出）<br>146　選修生物 Ⅱ (全)<small>課本 PDF 第 9 頁，印刷 P146（完整原文）</small></div>", "tb": [["BOOK9", "P146 完整課本頁"]]}, {"id": "b2-51-l24", "t": "採後保鮮與楊氏循環", "src": "課本 P146；原PPT第 33 頁", "slide": 33, "sec": "s6", "figSpec": {"flip": [33, 34]}, "txt": "<ul><li>預冷可減低採後代謝及乙烯相關作用，延緩品質變化。</li><li>教材介紹切花乙烯抑制與保存期限的關係。</li><li>楊祥發對乙烯生合成研究的貢獻，以楊氏循環名稱保留於原文。</li></ul><p class=\"think\">思考：保鮮處理延長期限，是否代表果實或花已停止所有生命活動？</p><p class=\"scope-note\">教材判讀：乙烯抑制劑可影響合成或作用，需依實際藥劑區分；本網頁不提供用藥程序。</p><div class=\"quote\">  <br>知識補給站<br>農產品和花卉的保鮮<br>       一般農產品和花卉為了降低採收後和運輸的消耗，會採取保鮮措施。像是對農產品採取「預冷」的降溫處理，藉由低溫減少乙烯的作用；或是為延長切花的保存期限，會加入乙烯抑制劑作為保鮮劑，以抑制乙烯的合成。<br>配合課本 <br>P146<br>33<small>原PPT第 33 頁（完整原文）</small></div><div class=\"quote\">  <br>知識補給站<br>乙烯的合成與楊氏循環<br>       關於植物細胞合成乙烯的過程，是由曾擔任<br>美國<br> <br>國家科學院<br>、<br>臺灣<br> <br>中央研究院<br>院士和副院長的<br>楊祥發<br>先生發現的，由於其卓越的研究成果，因此細胞合成乙烯過程中的中間產物循環路徑，稱為楊氏循環（<br>Yang cycle<br>）。他也獲得了沃爾夫農業獎的殊榮，相當於「農業界的諾貝爾獎」。<br>配合課本 這些種子<br>都能順利萌發成幼苗，並繼續發育成熟嗎？ <br>138　選修生物 Ⅱ (全)<small>課本 PDF 第 1 頁，印刷 P138（完整原文）</small></div>", "tb": [["BOOK1", "P138 完整課本頁"]]}, {"id": "b2-51-l27", "t": "原題二：GA 效果的教材範圍", "src": "課本 P141；原PPT第 38 頁", "slide": 38, "sec": "s7", "figSpec": {"flip": [38]}, "txt": "<ul><li>原題答案 <b>B</b>，保留教材的正常植株與矮性植株比較。</li><li>萌發、開花及葡萄品質是教材列出的 GA 作用情境。</li><li>實際 GA 反應仍需考慮物種、發育階段、內源量及敏感度。</li></ul><p class=\"think\">思考：怎樣把題目限定情境，避免把原答案當成普遍定律？</p><p class=\"scope-note\">教材判讀：原解析「無法使正常高度的植株長得更高」過度概括；本題依原教材模型作答。研究中正常型豌豆在某些階段仍可回應外加 GA。<a href=\"https://pubmed.ncbi.nlm.nih.gov/24186655/\" target=\"_blank\" rel=\"noopener\">豌豆 GA 研究</a></p><div class=\"quote\">  <br>Question<br>2. <br>小翰在網路商城買了吉貝素做實驗，請問下列哪一項將<br>無法<br>如預期般達成<br>？　<br>(<br>A)<br>促進製備麥芽糖用的大麥種子<br>萌發　<br>(<br>B)<br>促使正常高度的植株長得更<br>高　<br>(<br>C)<br>誘導短夜植物<br>開花　<br>(<br>D)<br>提高葡萄品質。<br>解答<br>：<br>(B)<br>解析<br>：<br>(B)<br>吉貝素可使突變的矮性植物生長至與野生植株相似，但無法使正常高度的植株長得更高。<br>38<small>原PPT第 38 頁（完整原文）</small></div><div class=\"quote\">1<br>2<br>3<br>4<br>GA<br>GA<br>水解<br>酵素<br>小分子<br>養分<br>水<br>胚乳<br>種皮<br>胚芽<br>糊粉層<br>胚根<br>子葉<br>（子葉盤）<br>GA 自胚芽及子葉<br>進入胚乳<br>種子吸水，<br>胚產生GA<br>糊粉層分泌水解酵素，<br>分解胚乳的大分子養分<br>小分子養分被子葉<br>吸收，供幼苗生長<br>5-1.2 吉貝素<br>吉貝素（GA）的發現與臺灣的水稻栽種歷史有很深的關係。在<br>植物體內，GA 主要由根尖和莖頂的初生分生組織、植株嫩芽處及種<br>子內的胚所產生。<br>促進節間生長<br>GA 可促進細胞分裂和細胞的延長，以造成莖的節間生長，讓植<br>物長高，例如：一些矮性植物如捲心甘藍（高麗菜），其節間較野生<br>植株短，若添加GA 後，則可促進莖的節間生長（圖5－5），使此矮<br>莖植株長至與野生植株相似。<br>促進種子萌發<br>當單子葉植物種子成熟時，胚中 GA 的濃度會升高而促進種子的<br>萌發與幼苗的生長。例如：大麥種子浸水後，GA 會從胚芽與子葉擴<br>散進入胚乳，並促進位於胚乳外層的糊粉層產生水解酵素，分解胚乳<br>中的澱粉養分與蛋白質，形成葡萄糖與胺基酸等小分子，提供幼苗生<br>長所需（圖 5－6）。<br> 圖 5－5　<br>矮性捲心甘藍<br>（左下方）添<br>加 GA 之後，莖<br>的節間明顯生長<br>（右側）。<br> 圖 5－6　吉貝素對大麥等穀類種子萌發的作用<br>糊粉層　aleurone layer<br>第 5 章  植物體的生長發育　141<small>課本 PDF 第 4 頁，印刷 P141（完整原文）</small></div>", "tb": [["BOOK4", "P141 完整課本頁"]]}, {"id": "b2-51-l28", "t": "原題三：必須比較同一個現象", "src": "課本 P147；原PPT第 39 頁", "slide": 39, "sec": "s7", "figSpec": {"flip": [39]}, "txt": "<ul><li>原題答案 <b>A、C、E</b>：側芽生長、葉片老化、種子萌發。</li><li>ABA 名字中雖有離層，但不是教材所指離層形成的主要激素。</li><li>比較激素 也\n不同\n◆ 常見的植物激素包括\n生長素（\n吲哚\n乙酸\n，\nIAA\n）\n、\n吉貝素（\nGA\n）\n、\n細胞分裂素（\nCK\n）\n、\n離層酸（\nABA\n）\n及\n乙烯\n\n等五類\n配合課本 \nP138", "3": "  \n知識補給站\n植物激素與動物激素的差異\n       植物激素與動物激素雖然都是可調節生長的物質，但兩者產生與運送的方式並不相同。\n動物激素\n特定腺體生成\n植物激素\n主要為血液運送\n某一部位生成或合成\n擴散\n或維管束運送\n產生方式\n運送方式\n配合課本 \nP138\n3", "4": "5-1.1 \n生長素\n◆\n \n生長素的發現來自\n英國\n的\n達爾文\n父子對芽鞘向光性的研究（見探討活動 \n5–1\n）\n◆\n \n生長素是泛指一群功能相近的有機物質，其中\n吲哚乙酸\n（\nIAA\n）\n是最早被發現的一種\n◆\n \n分泌處\n：\n莖\n頂的分生組織、\n幼\n葉\n、\n根尖及發育\n中的\n種子\n配合課本 \nP139", "5": "→ 生長素對植物體不同部位的生長有不同的影響\n5-1.1 \n生長素\n◇ \n促細胞延長與組織的特化\n◆ \n作用\n：\n促進莖生長的濃度，對根可能是抑制\n根\n芽\n莖\n配合課本 \nP139\n200\n100\n0\n-100\n植物體內生長素濃度的對數（\nlog\n10\n）值\n \n相對生長（百分比）\n-\n７\n-\n６\n-\n５\n-\n４\n-\n３\n-\n２\n-\n１\n０\n１\n２\n３\n４", "6": "→ 例如\n：\n向光性\n、向地性\n5-1.1 \n生長素\n◇\n \n與\n向性\n有關\n→ 植物體\n接受環境刺激後，生長素分布不均所導致\n配合課本 \nP139\n右側照光", "7": "去除頂芽\n+NAA\n（添入羊毛脂塗於切口處）\n側芽些微生長\n去除頂芽\n側芽生長明顯\n◇ \n頂芽優勢\n5-1.1 \n生長素\n▪ \n頂芽存在時\n，\nIAA\n 濃度較高有利於頂芽生長，\n並\n抑制側芽生長\n▪ \n若切除頂芽，側芽會開始萌發長出分枝\n不作處理\n側芽不生長\n對照組\n實驗組\n配合課本 \nP140\n7", "8": "◇ \n促進不定根的形成\n，提高扦插繁殖的成功率\n◇ \n刺激形成層細胞的分裂\n，有助於嫁接的成功率\n5-1.1 \n生長素\n◇ \n抑制離層的產\n生\n，避免果實未成熟前提早落果\n配合課本 \nP140", "9": "不作處理，正常發育的草莓\n在花托發育初期剔除中間一圈小果實，造成花托中間凹陷\n在花托發育初期剔除全部的小果實，則花托不發育\n對已剔除全部小果實的花托施加 \nNAA\n，則花托發育正常\n對照組\n實驗組\n5-1.1 \n生長素\n◇\n \n促進果實發育\n配合課本 \nP140\n9", "10": "◆\n 人工\n合成的生長素\n：\n→ 作為\n除草劑\n，除去田間的雙子葉植物雜草，保全單子葉植物的農作物（如玉米、水稻、小麥等）\n5-1.1 \n生長素\n◇ \n萘乙酸（\nNAA\n）\n◇\n \n二氯苯氧乙酸（\n2,4-D\n）\n配合課本 \nP140", "11": "5-1.2 \n吉貝素\n◆\n \n吉貝素（ \nGA\n ）為\n一群相似結構的有機分子之泛稱\n，並非單一個化學分子\n◆\n \n產生部位\n：\n根尖、莖頂的分生組織、嫩芽、種子的胚\n◆\n \n普遍存在於植物、真菌內\n◆\n \n吉貝素（ \nGA\n ）的發現與\n臺灣\n的水稻栽種歷史有很深的關係（ 見下頁知識補給站 ）\n配合課本 \nP141", "12": "  \n知識補給站\n吉貝素與\n臺灣\n的淵源\n       吉貝素的發現是源於日治時期\n臺灣總督府\n \n農業試驗場\n對「水稻馬鹿苗病（\nbakanae\n disease\n）」的研究。水稻馬鹿苗病就是水稻徒長病，特徵為染病的稻苗莖部會不正常抽長，之後也無法結實。\n◆\n \n1912\n 年，\n臺灣總督府\n \n農業試驗場\n的技師\n澤田兼吉\n指出，水稻馬鹿苗病可能是由致病真菌所分泌的物質造成稻苗的不正常徒長\n◆ 1919\n 年，另一名技師\n藤黑與三郎\n與\n澤田兼吉\n將這類真菌命名為「藤倉赤霉（\nLisea\n \nfujikuroi\n \nSawada\n）」\n配合課本 \nP142\n12", "13": "  \n知識補給站\n吉貝素與\n臺灣\n的淵源\n◆ 1926\n 年，\n臺灣總督府\n \n中央研究所\n的技師\n黑澤英一\n發現，從染病稻苗萃取濾出的培養液同樣會導致水稻及其他亞熱帶的禾草有如同馬鹿苗病一樣的症狀，自此證實了「藤倉赤霉」能分泌某種化學物質。該學名於 \n1931\n 年統一為\nGibberella\n \nfujikuroi\n（\nSawada\n）\nWollenw\n.\n◆ \n \n1933\n 年，\n黑澤英一\n從\n臺灣\n返回\n日本\n，提供\n臺灣\n的「藤倉赤霉」真菌樣品給\n東京帝國大學\n \n藪田貞治郎\n教授，開始進行物質純化工作\n配合課本 \nP142\n13", "14": "  \n知識補給站\n吉貝素與\n臺灣\n的淵源\n◆ 1934\n 年，\n藪田貞治郎\n成功分離出此物質，並確認有化學活性，將其定名為「吉貝素（\nGibberellin\n）」。這個重大發現雖引起注意，但之後時逢第二次世界大戰，待至戰後才\n有再展開一連串\n的相關研究\n配合課本 \nP142\n14", "15": "→ 正常莖\n5-1.2 \n吉貝素\n◆\n \n作用：\n◇\n \n促進\n細胞分裂和細胞\n延長\n，\n造成\n莖的節間伸長，植物長高\n▪ \n矮莖植株（\n天生缺乏吉貝素\n）\n→ 施加吉貝素\n→ 正常莖\n▪ 正常莖植株\n→ 施加吉貝素\n矮性捲心甘藍\n添加 \nGA\n 之後\n配合課本 \nP141", "16": "種皮\n糊粉層\n胚乳\n胚芽\n胚根\n子葉\n（子葉盤）\n水\nGA\n5-1.2 \n吉貝素\n◇\n \n促\n進\n種子萌發\n和促使幼苗生長\n→ 例如\n：\n大麥\n等穀類種子，泡水處理\nGA\n水解酵素\n② \nGA\n 促進\n糊粉層產生水解酵素\n① 吸水後，\n胚產生\n \nGA\n配合課本 \nP141\n16", "17": "5-1.2 \n吉貝素\n◇\n \n促\n進\n種子萌發\n和促使幼苗生長\n→ 例如\n：\n大麥\n等穀類種子，泡水處理\n水解酵素\n小分子養分\n小分子養分\n③ 水解酵素\n促\n使\n胚乳中\n儲\n存的大分子養分分解\n④ \n小分子養分被子葉吸收，供幼苗生長\n配合課本 \nP141\n17", "18": "▪ \n在適當的光照時間下，\nGA \n能刺激植物長出花芽，促進植物開花\n5-1.2 \n吉貝素\n→ \n例如\n：\n誘導彩葉甘藍等長日照植物開花\n◇\n \n促進開花\n彩葉甘藍，箭頭所指處為吉貝素促進花莖伸長並開花\n配合課本 \nP142", "19": "◇\n \n影響\n果實生長\n→\n \n例如\n：\n葡萄花穗的節間變長\n▪ \n使節間增長而增加花的間距，提供果實更多生長的空間，進而使果實長得肥大多汁\n5-1.2 \n吉貝素\n吉貝素可改善葡萄結實。右側因添加 \nGA\n 而使果實明顯大於左側者\n配合課本 \nP142", "20": "5-1.3 \n細胞分裂素\n◆\n \n1940\n 年代\n美國\n的科學家\n斯科格\n從椰奶中分離出可促進細胞分裂的嘌呤類化學物質\n◆\n \n細胞分裂素（ \nCK\n ）是\n一群含腺嘌呤的植物激素\n◆\n \n產生部位\n：\n根尖的分生組織、\n萌發中的種子\n配合課本 \nP143", "21": "◇\n \n促進細胞分裂和分化\n5-1.3 \n細胞分裂素\n→ 由於 \nCK \n能促進細胞分裂的發生，所以在植物\n組織培養\n中常加入培養基內，和\n生長素\n一起影響組織的分化現象\n◆\n \n作用：\n配合課本 \nP143\n癒傷組織", "22": "→\n \n當培養基中所含的生長素與細胞分裂素的濃度\n，\n\n保持\n特定\n比例\n時，細胞會不斷分裂而形成一些\n未分化\n的\n癒傷組織\n5-1.3 \n細胞分裂素\n→\n \n當生長素對細胞分裂素濃度的\n比例\n高時，細胞\n會分化\n並長出\n根\n→\n \n當生長素對細胞分裂素濃度的\n比例\n低時，細胞\n會分化\n而長\n芽\n◆ \n植物組織培養\n：\n配合課本 \nP143", "23": "◇\n \n促進\n幼苗、側\n芽生長\n \n→ \n植株在具有頂芽優勢的情況下，若在\n側\n芽上施加細胞分裂素，\n側\n芽便會開始生長\n生長素頂芽優勢\n拮抗\n→\n \n細胞分裂素\n側\n芽生長 \n5-1.3 \n細胞分裂素\n◇\n \n促進開花\n→ \n適當濃度的 \nCK\n 可促進如洋桔梗、蘋果及荔枝開花\n配合課本 \nP143", "24": "5-1.3 \n細胞分裂素\n◇\n \n延緩老化\n→ \n常用於延長花卉與蔬果的保存期限\n菸草葉老化黃枯\n添加 \nCK \n之後\n配合課本 \nP143", "25": "5-1.4 \n離層酸\n◆\n \n當植物處於惡劣環境時，會促進\n離層酸（\n \nABA\n ）\n與\n乙烯\n生成，調節細胞的生理活動，協助個體度過逆境\n◆\n 科學家\n研究離層的原因時，從落葉\n中\n\n萃取\n出一種酸性物質，因而命名為\n離\n\n層\n酸。後來的研究才發現真正造成\n離\n\n層\n的主因是乙烯，而非離層酸\n◆\n \n分泌處\n：\n植物體大部分細胞\n都可\n產生\n離層\n意指植物構造自然脫落的現象，例如\n：\n落葉、落花和落果。\n配合課本 \nP144", "26": "◆\n \n作用\n：\n5-1.4 \n離層酸\n◇\n \n抑制\n細胞\n生長\n◇\n \n促進芽和種子休眠\n，\nABA\n 又稱\n休眠素\n→ \n種子是否萌發，主要是受\n離層\n酸\n與\n吉貝素\n濃度的影響\n種子成熟時\nABA\n↑，\nGA↓\n，抑制萌發\n種子打破休眠後\nABA\n↓，\nGA\n↑，促進萌發\nABA\n 和 \nGA\n 對種子萌發具有拮抗作用\n配合課本 \nP144", "27": "種子內若缺乏 \nABA\n，則無法抑制其萌發，例如\n：\n紅樹林植物水筆仔會在母株上形成胎生苗\n5-1.4 \n離層酸\n果實\n幼苗\n果實\n幼苗\n配合課本 \nP144", "28": "◇\n \n抑制莖\n的\n伸\n長\n5-1.4 \n離層酸\n◇\n \n促進氣孔關閉\n▪ \n根產生 \nABA\n，經由木質部快速送至葉片，使氣孔維持關閉狀態\n→ 植物遭遇缺水逆境時\n▪ \n葉產生 \nABA\n，促使葉片的氣孔關閉\n▪\n \nABA\n 又稱\n逆境激素\n生長素促進莖的生長\n拮抗\n→\n \n離層酸抑制莖\n的伸長\n配合課本 \nP144", "29": "5-1.5 \n乙烯\n◆\n \n分泌處\n：\n植物體的大部分細胞均可生成\n◆\n \n氣態\n◆\n \n作用\n：\n◇\n \n促\n進果實成熟\n→ 種子萌發時，乙烯會抑制幼苗胚軸伸長的速率，促使胚軸加粗，造成幼苗粗短，有助於幼嫩植株成長茁壯\n◇\n \n抑制細胞生長（\n伸\n長\n）和促使莖粗短\n水果催熟都靠「它」\n配合課本 \nP145", "30": "◇\n \n細胞計畫性死亡\n5-1.5 \n乙烯\n在長期淹水逆境而缺氧時，植物體會產生乙烯，誘導部分根的皮層細胞\n計畫性死\n亡而增加空隙，以利氣體交換\n淹水處理後，缺氧的根皮層中出現明顯的空隙\n不缺氧的根\n乙烯促進細胞\n計畫性死\n亡而形成的空隙\n表\n皮\n內皮\n皮\n層\n配合課本 \nP145", "31": "5-1.5 \n乙烯\n◇\n \n促進組織老化\n◇\n \n促進\n離層\n形成\n→\n 加速葉的老化並形成離層，老葉隨之脫落\n▪ \n葉生長的初期\n→\n \nIAA\n 濃度高，可減低葉柄基部細胞對乙烯的敏感度\n→\n \n抑制\n葉柄基部形成離層\n▪ \n葉趨向老化時\n→\n 葉肉細胞不再生成 \nIAA\n，反而產生較多的乙烯\nIAA\n 和 \nCK\n 延緩葉的老化\n拮抗\n→\n \n乙烯促進葉的老化\n配合課本 \nP146", "32": "5-1.5 \n乙烯\n葉內 \nIAA\n 濃度高，抑制葉柄基部對乙烯的敏感度\n葉老化時，葉內 \nIAA\n \n \n濃度降低，葉柄基部因乙烯增加而形成離層\n老葉脫落\nIAA\nIAA\n降低\n乙烯\n側芽\n葉柄\n離層\n葉脫落的痕跡\n配合課本 \nP146", "33": "  \n知識補給站\n農產品和花卉的保鮮\n       一般農產品和花卉為了降低採收後和運輸的消耗，會採取保鮮措施。像是對農產品採取「預冷」的降溫處理，藉由低溫減少乙烯的作用；或是為延長切花的保存期限，會加入乙烯抑制劑作為保鮮劑，以抑制乙烯的合成。\n配合課本 \nP146\n33", "34": "  \n知識補給站\n乙烯的合成與楊氏循環\n       關於植物細胞合成乙烯的過程，是由曾擔任\n美國\n \n國家科學院\n、\n臺灣\n \n中央研究院\n院士和副院長的\n楊祥發\n先生發現的，由於其卓越的研究成果，因此細胞合成乙烯過程中的中間產物循環路徑，稱為楊氏循環（\nYang cycle\n）。他也獲得了沃爾夫農業獎的殊榮，相當於「農業界的諾貝爾獎」。\n配合課本 \nP146\n34", "35": "  \n知識補給站\n植物生長\n種子萌發\nGA\nIAA\nCK\nABA\n function readingBlocks(node){

  if(child.nodeType===3){if(child.textContent.trim()){const p=document.createElement('p');p.textContent=child.textContent;blocks.push(p);}continue;}
  if(child.matches('ul,ol'))for(const li of child.children){const list=document.createElement(child.tagName);list.append(li.cloneNode(true));blocks.push(list);}
  else blocks.push(child.cloneNode(true));
 }return blocks;
}

function splitBlock(node,body){
 // Range fragments keep inline emphasis and every character when a long paragraph needs another page.
 const length=node.textContent.length;if(!length)return [node];const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT),texts=[];let n,offset=0;while(n=walker.nextNode()){texts.push({node:n,start:offset,end:offset+n.length});offset+=n.length;}

}
function paginateReading(){
