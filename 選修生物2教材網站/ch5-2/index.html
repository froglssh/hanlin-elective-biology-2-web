花的關鍵，因此短日照植物也可稱<br>為長夜植物；長日照植物也可稱為短夜植物。<br>要如何得知某種植物開花的光週期呢？以菠菜與菊<br>花為例進行不同光週期處理，測試開花的光照條件，若<br>以開花率達 50% 作為開花的基準，結果發現菊花需接<br>受日照短於16 小時才開花，菠菜卻需長於 14 小時才<br>開花（圖 5－16）。可見16 或14 小時的日照時間分別<br>是這兩種植物達 50% 開花率的分界，故稱之為臨界日<br>長。因此，在日照時間短於臨界日長的環境下開花者，<br>稱為短日照植物，如菊花；在日照時間長於臨界日長的<br>環境下開花者，稱為長日照植物，如菠菜。<br>加納　Wightman Wells Garner, 1875∼1955<br>艾拉德　Harry Ardell Allard, 1880∼1963<br>光週期　photoperiod <br>光週期性　photoperiodism<br>臨界夜長　critical night length<br>臨界日長　critical day length <br>開<br>花<br>率<br>︵<br>％<br>︶<br>每天日照時間（小時）<br>菊花（短日照植物）<br>菠菜（長日照植物）<br>20<br>40<br>60<br>50<br>80<br>100<br>0<br>6<br>8<br>10<br>2<br>4<br>12<br>14<br>16<br>18<br>20<br> 圖 5－16　臨界日長的界定<br>長日照、短日照及中性日照<br>植物<br>1920 年代，美國 的 加<br>納 和 艾拉德 研究菸草品種<br>時，以多種晝夜週期測試對<br>菸草開花的影響，最初認為<br>晝長是決定是否開花的關<br>鍵。他們接著找出誘導不同<br>植物開花所需的晝長條件，<br>故稱在短晝下開花的植物為<br>短日照植物，而長晝下開花<br>者為長日照植物，並界定臨<br>界日長，亦即短日照植物在<br>白晝短於臨界日長會開花，<br>長日照植物在白晝長於臨界<br>日長會開花。然而有些植物<br>的開花不受光週期影響，故<br>稱為中性日照植物。<br>知識補給站<br>第 5 章  植物體的生長發育　149<small>課本 PDF 第 2 頁，印刷 P149（完整原文）</small></div>", "tb": [["BOOK2", "P149 完整課本頁"]]}, {"id": "b2-52-l10", "t": "臨界日長：從 50% 開花率讀圖", "src": "課本 P149；原PPT第 12 頁", "slide": 12, "sec": "s2", "figSpec": {"image": "dayGraph"}, "txt": "<ul><li>教材用開花率達 50% 作為分界：菊花臨界日長 16 小時，菠菜 14 小時。</li><li>菊花在較短日照下開花；菠菜在較長日照下開花。</li><li>橫軸是每日照光時間，不能把 16 小時直接當成此圖的夜長。</li></ul><p class=\"think\">思考：一天 24 小時，16 小時日照對應多少黑暗？</p><p class=\"scope-note\">教材判讀：臨界值依物種、品種與實驗而異。PPT15–19另用菊花／鳶尾臨界日長8小時、夜長16小時的模型，不可與此圖混用。</p><div class=\"quote\">◆ 當光週期的光照及黑暗長短，介於適不適合開花的分界，即<br>開花率達 <br>50%<br>，此時光照的時間稱為<br>臨界日長<br>◆ 臨界日長的界定<br>：<br>菊花（短日照植物）<br>菠菜（長日照植物）<br>5-2.1 <br>環境對植物開花的影響<br>光週期性<br>臨界日長<br>臨界日長<br>配合課本 <br>P149<br>0<br>開花率（　）<br>50<br>100<br>2<br>8<br>10<br>12<br>14<br>每天日照時間（小時）<br>4<br>6<br>16<br>18<br>20<br>%<br>60<br>80<br>40<br>20<small>原PPT第 12 頁（完整原文）</small></div><div class=\"quote\">◆ <br>在<br>日照時間<br>短<br>於臨界日長<br>的環境下開花者，稱為<br>短<br>日照植物<br>，如<br>菊花<br>；<br>在日照時間<br>長於臨界日長<br>的環境下開花者，稱為<br>長日照植物<br>，如菠菜<br>5-2.1 <br>環境對植物開花的影響<br>光週期性<b 素通常是在常<br>溫下作用，過高或太低的溫度都會降低酵素的活性。例<br>如：有些溫帶地區的植物種子在秋天成熟，故需度過寒<br>冬，等待翌年環境恢復溫暖後，種子才得以萌發。因<br>此，若希望這些種子在其他季節萌發，可先將種子以低<br>溫處理，再回到常溫下，種子便可萌發。<br>休眠　dormancy<br>第 5 章  植物體的生長發育　153<small>課本 PDF 第 6 頁，印刷 P153（完整原文）</small></div>", "tb": [["BOOK6", "P153 完整課本頁"]]}, {"id": "b2-52-l23", "t": "水與氧：軟化、代謝與呼吸", "src": "課本 P153；原PPT第 34 頁", "slide": 34, "sec": "s5", "figSpec": {"flip": [34]}, "txt": "<ul><li>水可軟化種皮、沖去部分抑制物並啟動代謝。</li><li>氧可供有氧呼吸產生能量。</li><li>長時間浸泡不等於越多水越好，缺氧可妨礙萌發。</li></ul><p class=\"think\">思考：泡水後種皮已軟，仍不萌發時要檢查什麼？</p><div class=\"quote\">5-2.2 <br>環境對種子萌發的影響<br>◆ 可沖掉種皮表面抑制萌發的物質<br>水<br>◆ 可軟化種皮<br>◆ 使細胞內酵素活化，促使新陳代謝的進行<br>◆ 供細胞進行有氧呼吸產生能量<br>氧<br>◆ 泡水軟化種皮、去除種皮或增加供氧，皆可使氧更容易進入種子，加速種子萌發<br>配合課本 <br>P153<br>影響種子萌發的環境因子有哪些<br>?<small>原PPT第 34 頁（完整原文）</small></div><div class=\"quote\">圖 5－21　<br>木瓜種子外的透明層會抑制萌發<br>5-2.2 環境對種子萌發的影響<br>有些植物的種子在成熟後即可萌發，然而有些種子<br>的外觀似乎已成熟或已從果實釋出，但即使遇到適當環<br>境卻仍不萌發，此現象稱為休眠。種子休眠的原因通常<br>有胚尚未發育完全、種皮乾燥堅硬或表面有抑制萌發的<br>物質存在（圖 5－21）等。<br>影響種子萌發的環境因子有哪些？我們常將種子<br>泡水、冷藏或置於暗處，甚至用刮磨或用酸來處理種<br>皮，促使種子萌發。以上這些處理即是利用水、氧、溫<br>度、光、外力等環境因子來影響種子萌發。<br>水<br>水可沖掉種皮表面抑制萌發的物質，也可使種皮吸<br>水軟化，種子內部的細胞逐漸獲得足夠水分，使得酵素<br>活化，促使新陳代謝的進行。<br>氧<br>氧可供應細胞進行有氧呼吸產生能量，泡水軟化<br>種皮、去除種皮或增加供氧，皆可使氧更容易進入種<br>子，加速種子萌發。<br>溫　度<br>種子內部細胞中，參與新陳代謝的酵素通常是在常<br>溫下作用，過高或太低的溫度都會降低酵素的活性。例<br>如：有些溫帶地區的植物種子在秋天成熟，故需度過寒<br>冬，等待翌年環境恢復溫暖後，種子才得以萌發。因<br>此，若希望這些種子在其他季節萌發，可先將種子以低<br>溫處理，再回到常溫下，種子便可萌發。<br>休眠　dormancy<br>第 5 章  植物體的生長發育　153<small>課本 PDF 第 6 頁，印刷 P153（完整原文）</small></div>", "tb": [["BOOK6", "P153 完整課本頁"]]}, {"id": "b2-52-l24", "t": "溫度：萌發與春化要分清", "src": "課本 P153；原PPT第 35 頁", "slide": 35, "sec": "s5", "figSpec": {"flip": [35]}, "txt": "<ul><li>合適溫度影響酵素與代謝，過冷或過熱可能不利萌發。</li><li>部分種子需低溫解除休眠，再回到合適溫度萌發。</li><li>春化的判準是低溫促進後續開花能力，與解除種子休眠區分。</li></ul><p class=\"think\">思考：同樣經低溫處理，如何從觀察結果區分兩種效應？</p><p class=\"scope-note\">教材判讀：PPT35把萌發後春化列在溫度段，課本P153另述低溫解除休眠；兩項原文保留，但教學與判分分開。</p><div class=\"quote\">5-2.2 <br>環境對種子萌發的影響<br>◆<br> <br>有些溫帶地區的植物種子在<br>萌發後，需經春化作用，才能開花、結果<br>溫度<br>◆ 酵素通常是在常溫下作用，過高或太低的溫度都會降低酵素的活性< 3 <br>逆境對植物生長發育的影響<br>◆ 對植物而言，凡是不利於生長發育的環境因素，皆可統稱為逆境<br>◆ 面對逆境，植物體通常會有適度的反應來降低受傷的程度，避免因逆境而死亡<br>◆ <br>離層酸（ <br>ABA <br>）<br>與<br>乙烯<br>，<br>是植物體在面對逆境時，主要協助調節生長的激素<br>配合課本 <br>P155<small>原PPT第 42 頁（完整原文）</small></div><div class=\"quote\">逆境　stress<br>熱休克蛋白　heat shock protein<br>5-2.3 逆境對植物生長發育的影響<br>對植物而言，凡是不利於生長發育的環境因素，皆可<br>統稱為逆境。例如：水分與溫度等非生物逆境，以及遭受<br>細菌、真菌、昆蟲等病蟲危害則屬生物逆境。面對這些逆<br>境，植物體通常會有適度的反應來降低受傷的程度，避免<br>因逆境而死亡。<br>植物激素對逆境中植物的生長調節<br>面臨逆境時，離層酸（ABA）與乙烯是主要協助植<br>物體調節生長的激素。例如：乾旱時，植物體內的ABA<br>增加，促使葉片氣孔關閉；乙烯增加，促進葉柄基部的<br>離層形成及加速葉片老化等。淹水時，根部組織缺氧會<br>誘導乙烯的產生，造成細胞計畫性死亡而形成空隙（詳<br>見 5-1.5、圖 5－12）。<br>當幼苗遭經常性的觸摸等機械性傷害時，乙烯可誘導<br>幼苗的生長方向改變，從向上抽長改變為橫向加粗，造成<br>幼苗長得粗而短。應用此原理，農民藉由輕撫秧苗來促使<br>其長得粗壯。<br>高溫或低溫對植物體內生理運作的影響<br>植物的細胞膜結構會因溫度而改變其整體之穩定性。<br>高溫或低溫導致膜的組成與結構改變，甚至造成離子滲出<br>膜外，或各種通道的運送受阻，這些改變都可能阻礙光合<br>作用與呼吸作用等生理代謝之進行。因此，生長在溫度變<br>化明顯的溫帶闊葉植物多能感應到溫度的逐漸上升或下<br>降，其體內便會產生熱休克蛋白來保護細胞內的酵素與蛋<br>白質，或是改變體內生理狀態而形成耐寒的特性。<br>熱休克蛋白<br>熱休克蛋白最初命名是<br>因高溫誘導而增量產生的<br>蛋白質，此現象普遍發生在<br>動、植物甚至細菌細胞中，<br>後續研究發現也會受低溫等<br>逆境誘導而產生。熱休克蛋<br>白有多種型式，以高溫逆境<br>為例，若在可耐受的高溫範<br>圍內，有利於維持細胞基本<br>代謝；若在致死的高溫下，<br>則會啟動局部細胞的計畫性<br>死亡、穩定體內溫度，以降<br>低更多組織的損傷。<br>知識補給站<br>第 5 章  植物體的生長發育　155<small>課本 PDF 第 8 頁，印刷 P155（完整原文）</small></div>", "tb": [["BOOK8", "P155 完整課本頁"]]}, {"id": "b2-52-l29", "t": "缺水和淹水：不同生理問題", "src": "課本 P155；原PPT第 43 頁", "slide": 43, "sec": "s6", "figSpec": {"flip": [43]}, "txt": "<ul><li>教材缺水模型：ABA 增加促氣孔關閉，乙烯參與葉片老化與離層。</li><li>淹水使根缺氧，教材以乙烯誘導部分細胞死亡形成空隙。</li><li>乾旱限制水；淹水可能限制氧，不能只看水的多少。</li></ul><p class=\"think\">思考：水多的根，為何反而可能缺氧？</p><p class=\"scope-note\">教材判讀：激素反應依物種、組織與時間而異；原題三依本節情境作答，不推論所有乾旱都使全部激素同向變化。</p><div class=\"quote\">◆ ABA <br>增加，促使葉片氣孔關閉<br>5-2.3 <br>逆境對植物生長發育的影響<br>水分<br>乾旱<br>◆ 根部組織缺氧<br>，<br>誘導乙烯的產生，促使細胞計畫性死亡而形成空隙<br>◆ 乙烯增加，促進葉柄基部的離<br>層形成及<br>加速葉片老化<br>水分<br>淹水<br>配合課本 <br>P155<small>原PPT第 43 頁（完整原文）</small></div><div class=\"quote\">逆境　stress<br>熱休克蛋白　heat shock protein<br>5-2.3 逆境對植物生長發育的影響<br>對植物而言，凡是不利於生長發育的環境因素，皆可<br>統稱為逆境。例如：水分與溫度等非生物逆境，以及遭受<br>細菌、真菌、昆蟲等病蟲危害則屬生物逆境。面對這些逆<br>境 ，也可能會<br>引發生物性的防禦策<br>略，例如：當玉米葉被<br>玉米螟幼蟲啃食時，會<br>釋放揮發性物質，吸引<br>寄生蜂前來產卵寄生於<br>玉米螟幼蟲身上，最終<br>使玉米螟死亡。<br>知識補給站<br>156　選修生物 Ⅱ (全)<small>課本 PDF 第 9 頁，印刷 P156（完整原文）</small></div>", "tb": [["BOOK9", "P156 完整課本頁"]]}, {"id": "b2-52-l38", "t": "原題一：15 小時臨界長夜", "src": "課本 P151；原PPT第 55 頁", "slide": 55, "sec": "s8", "figSpec": {"image": "nightQuestion"}, "txt": "<ul><li>原答案 A、C、D 保留，必須完整閱讀五組處理。</li><li>B 未達臨界夜長；E 被紅光閃爍中斷。</li><li>D 的白光後接續遠紅光，在教材模型中逆轉光中斷的影響。</li></ul><p class=\"think\">思考：為何不能只加總 E 圖所有黑暗片段？</p><p class=\"scope-note\">教材判讀：原題將剛達15小時的甲列為可開花；本題按原答案的臨界邊界判讀，不自行改成必須嚴格大於15小時。</p><div class=\"quote\">  <br>Question<br>1<br>. <br>有一株臨界夜長 <br>15<br> 小時的長夜植物，請問下圖的哪些處理方式可以使其開花？<br>(A)<br>甲　<br>(<br>B)<br>乙　<br>(<br>C)<br>丙　<br>(<br>D)<br>丁　<br>(<br>E)<br>戊。<br>55<small>原PPT第 55 頁（完整原文）</small></div><div class=\"quote\">  <br>Question<br>解答<br>：<br>(A)(C)(D)<br>解析<br>：<br>(B)<br>連續黑暗未達臨界夜長，開花率不足 <br>50<br>％。<br><br>(E)<br>連續黑暗被紅光閃爍中斷，不足臨界夜長。<br>56<small>原PPT第 56 頁（完整原文）</small></div><div class=\"quote\">短日照植物<br>長日照植物<br>圓形示意圖<br>光照  黑暗處理<br>a<br>f<br>e<br>d<br>c<br>b<br>菊花<br>鳶尾<br>R：紅光<br>FR：遠紅光<br>臨<br>界<br>夜<br>長<br>R<br>R FR<br>R<br>R<br>FR<br>R<br>R<br>FR<br>FR<br>24 小時<br>24 小時<br>臨界夜長<br>黑暗<br>光照<br>黑暗<br>光照<br>R FR<br>FR<br>R<br>R FR<br>R<br>R<br>FR<br>R<br> 圖 5－19　<br>紅光及遠紅光對不同植物開花的影響。 a連續黑暗的時間短於臨界夜長時，可促進長日照植物開花；b<br>連續黑暗的時間長於臨界夜長時，則短日照植物會開花 。c∼f若連續黑暗因照射紅光（R）或遠紅光<br>（FR）的處理不同，則會影響植物是否開花。（e：臨界夜長因植物種類而異）<br>植物體對光週期的感應部位主要在葉片，葉片接收<br>到光的刺激後，會將訊息傳至莖頂或側芽而影響花芽的<br>產生與否。當長日照植物處於連續黑暗的時間短於臨界<br>夜長時，葉肉細胞的 Pfr 轉為 Pr 的量較少，使 Pfr 所占<br>的比例增加而促進長日照植物開花（圖 5－19a）；同<br>理，對於短日照植物而言，當連續黑暗時間長於臨界夜<br>長時，大部分的 Pfr 都轉為 Pr，導致 Pfr 比例減少而無法<br>抑制短日照植物開花（圖 5－19b）。<br>第 5 章  植物體的生長發育　151<small>課本 PDF 第 4 頁，印刷 P151（完整原文）</small></div>", "tb": [["BOOK4", "P151 完整課本頁"]]}, {"id": "b2-52-l39", "t": "原題二：低溫、光與缺氧", "src": "課本 P153；原PPT第 57 頁", "slide": 57, "sec": "s8", "figSpec": {"flip": [57]}, "txt": "<ul><li>原答案 D 保留：部分種子經動物處理後有利萌發。</li><li>春化指促進開花能力，不是低溫後萌發的通稱。</li><li>長期浸泡可能缺氧；並非所有種子萌發都需光。</li></ul><p class=\"think\">思考：哪個選項將某些種子的條件擴成所有種子？</p><div class=\"quote\">  <br>Question<br>2<br>. <br>下列有關環境對種子萌發的影響，何者正確<br>？<br>　<br>(<br>A)<br>某些植物的種子經過一次性低溫後即可萌芽，此為春化作<br>用<br>　<br>(<br>B)<br>所有的種子萌發都需有適當的<br>光照<br>　<br>(<br>C)<br>泡水的種子無法順利萌發是因為種皮太過<br>堅硬<br>　<br>(<br>D)<br>部分種子需要經過動物食用後才能順利萌發。<br>解答<br>：<br>(D)<br>解析<br>：<br>(A)<br>春化作用是指某些植物經過低溫刺激後，可以促進產生花芽。<br>(B)<br>僅部分種類的種子萌發會受到光線影響。<br>(C)<br>泡水種子已把種皮浸軟，無法順利萌發主要是因為缺氧。<br>57<small>原PPT第 57 頁（完整原文）</small></div><div class=\"quote\">圖 5－21　<br>木瓜種子外的透明層會抑制萌發<br>5-2.2 環境對種子萌發的影響<br>有些植物的種子在成熟後即可萌發，然而有些種子<br>的外觀似乎已成熟或已從果實釋出，但即使遇到適當環<br>境卻仍不萌發，此現象稱為休眠。種子休眠的原因通常<br>有胚尚未發育完全、種皮乾燥堅硬或表面有抑制萌發的<br>物質存在（圖 5－21）等。<br>影響種子萌發的環境因子有哪些？我們常將種子<br>泡水、冷藏或置於暗處，甚至用刮磨或用酸來處理種<br>皮，促使種子萌發。以上這些處理即是利用水、氧、溫<br>度、光、外力等環境因子來影響種子萌發。<br>水<br>水可沖掉種皮表面抑制萌發的物質，也可使種皮吸<br>水軟化，種子內部的細胞逐漸獲得足夠水分，使得酵素<br>活化，促使新陳代謝的進行。<br>氧<br>氧可供應細胞進行有氧呼吸產生能量，泡水軟化<br>種皮、去除種皮或增加供氧，皆可使氧更容易進入種<br>子，加速種子萌發。<br>溫　度<br>種子內部細胞中，參與新陳代謝的酵素通常是在常<br>溫下作用，過高或太低的溫度都會降低酵素的活性。例<br>如：有些溫帶地區的植物種子在秋天成熟，故需度過寒<br>冬，等待翌年環境恢復溫暖後，種子才得以萌發。因<br>此，若希望這些種子在其他季節萌發，可先將種子以低<br>溫處理，再回到常溫下，種子便可萌發。<br>休眠　dormancy<br>第 5 章  植物體的生長發育　153<small>課本 PDF 第 6 頁，印刷 P153（完整原文）</small></div>", "tb": [["BOOK6", "P153 完整課本頁"]]}, {"id": "b2-52-l40", "t": "原題三：逆境反應的範圍", "src": "課本 P155；原PPT第 58 頁", "slide": 58, "sec": "s8", "figSpec": {"flip": [58]}, "txt": "<ul><li>原答案 B、D 保留，採本節的逆境情境。</li><li>不論何種逆境 ABA 都增加、任何高溫 HSP 都有效，皆過度概括。</li><li>淹水形成皮層空隙的教材訊號是乙烯，非生長素。</li></ul><p class=\"think\">思考：把「不論」改成限定條件，能否修正錯誤敘述？</p><p class=\"scope-note\">教材判讀：原題D按教材缺水模型判分；實際激素變化須看物種、時間及組織。HSP的保護不等於直接降低體溫。<a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC139847/\" target=\"_blank\" rel=\"noopener\">HSP101 耐熱研究</a></p><div class=\"quote\">  <br>Question<br>3. <br>下列有關植物面對逆境的反應哪些正確<br>？<br>　<br>(<br>A)<br>不論面對何種逆境，植物的離層酸都會<br>增加<br>　<br>(<br>B)<br>幼苗若遭受經常性觸碰的機械性傷害，會透過乙烯誘導幼苗改變生長<br>方向<br>　<br>(<br>C)<br>不論高溫程度，熱休克蛋白都可保護細胞內的酵素與<br>蛋白質　<br>(<br>D)<br>缺水時，離層酸與乙烯的濃度都會<br>上升<br>　<br>(<br>E)<br>淹水時，植物透過誘導生長素的產生，造成根部組織出現空隙。<br>解答<br>：<br>(B)(D)<br>解析<br>：<br>(A)<br>植物面對不同逆境會以不同的反應來應對，不一定每一種逆境中的離層酸都會增加。<br>(C)<br>在可耐受的高溫範圍內，熱休克蛋白可協助維持細胞基本代謝。<br>(E)<br>淹水時，植物透過誘導乙烯產生，造成根部<br>細胞計畫性死亡<br>而形成空隙。<br>58<small>原PPT第 58 頁（完整原文）</small></div><div class=\"quote\">逆境　stress<br>熱休克蛋白　heat shock protein<br>5-2.3 逆境對植物生長發育的影響<br>對植物而言，凡是不利於生長發育的環境因素，皆可<br>統稱為逆境。例如：水分與溫度等非生物逆境，以及遭受<br>細菌、真菌、昆蟲等病蟲危害則屬生物逆境。面對這些逆<br>境，植物體通常會有適度的反應來降低受傷的程度，避免<br>因逆境而死亡。<br>植物激素對逆境中植物的生長調節<br>面臨逆境時，離層酸（ABA）與乙烯是主要協助植<br>物體調節生長的激素。例如：乾旱時，植物體內的ABA<br>增加，促使葉片氣孔關閉；乙烯增加，促進葉柄基部的<br>離層形成及加速葉片老化等。淹水時，根部組織缺氧會<br>誘導乙烯的產生，造成細胞計畫性死亡而形成空隙（詳<br>見 5-1.5、圖 5－12）。<br>當幼苗遭經常性的觸摸等機械性傷害時，乙烯可誘導<br>幼苗的生長方向改變，從向上抽長改變為橫向加粗，造成<br>幼苗長得粗而短。應用此原理，農民藉由輕撫秧苗來促使<br>其長得粗壯。<br>高溫或低溫對植物體內生理運作的影響<br>植物的細胞膜結構會因溫度而改變其整體之穩定性。<br>高溫或低溫導致膜的組成與結構改變，甚至造成離子滲出<br>膜外，或各種通道的運送受阻，這些改變都可能阻礙光合<br>作用與呼吸作用等生理代謝之進行。因此，生長在溫度變<br>化明顯的溫帶闊葉植物多能感應到溫度的逐漸上升或下<br>降，其體內便會產生熱休克蛋白來保護細胞內的酵素與蛋<br>白質，或是改變體內生理狀態而形成耐寒的特性。<br>熱休克蛋白<br>熱休克蛋白最初命名是<br>因高溫誘導而增量產生的<br>蛋白質，此現象普遍發生在<br>動、植物甚至細菌細胞中，<br>後續研究發現也會受低溫等<br>逆境誘導而產生。熱休克蛋<br>白有多種型式，以高溫逆境<br>為例，若在可耐受的高溫範<br>圍內，有利於維持細胞基本<br>代謝；若在致死的高溫下，<br>則會啟動局部細胞的計畫性<br>死亡、穩定體內溫度，以降<br>低更多組織的損傷。<br>知識補給站<br>第 5 章  植物體的生長發育　155<small>課本 PDF 第 8 頁，印刷 P155（完整原文）</small></div>", "tb": [["BOOK8", "P155 完整課本頁"]]}], "questions": [{"t": "植物運動：刺激與反應配對", "q": "把本節四個例子放回合適的反應。", "learn": 1, "tag": "movement", "hint": "先分辨生長與膨壓，再看刺激與反應方向。", "why": "向性的正負依刺激方向判定；含羞草閉合是本節可逆膨壓運動。", "sub": "P148；PPT2–10", "refs": [{"src": "PPT02S3", "cap": "原PPT第2頁末段代表畫面"}, {"src": "BOOK1", "cap": "P148 完整課本頁"}], "kind": "drag", "slots": [{"id": "s0", "label": "嫩莖朝光源彎曲"}, {"id": "s1", "label": "根朝重力方向彎曲"}, {"id": "s2", "label": "捲鬚接觸支持物後纏繞"}, {"id": "s3", "label": "含羞草觸發後小葉閉合"}], "pieces": [{"id": "a0", "label": "正向光性"}, {"id": "a1", "label": "正向地性"}, {"id": "a2", "label": "向觸性"}, {"id": "a3", "label": "葉枕膨壓改變的傾性運動"}], "sol": {"s0": "a0", "s1": "a1", "s2": "a2", "s3": "a3"}, "pre": {"s0": "a0"}, "id": "b2-52-q01"}, {"t": "向地性：根與莖為何不同？", "q": "依原簡報逐一判讀水平放置後的反應。", "learn": 4, "tag": "movement", "hint": "同一較高濃 7"}, {"t": "萵苣種子：讀完整百分比表", "q": "依原表逐一判讀，不把抑制當作零萌發。", "learn": 25, "tag": "germ", "hint": "同時讀處理順序和實際數據。", "why": "末次R的組為98–100%，FR末次組43–54%；光抑制不是全數不萌發。", "sub": "P150 補給站；PPT37–39", "refs": [{"src": "lettuceTable", "cap": "萵苣種子：讀完整百分比表完整教材圖"}, {"src": "PPT37S3", "cap": "原PPT第37頁末段代表畫面"}, {"src": "BOOK3", "cap": "P150 完整課本頁"}], "fig": "lettuceTable", "kind": "fill", "imageWidth": 570, "figCaption": "P150 補給站；PPT37–39", "rows": [{"q": "黑暗處理的萌發率", "o": ["9%", "0%", "98%"], "tag": "germ"}, {"q": "R→FR→R 的萌發率", "o": ["100%", "54%", "9%"], "tag": "germ"}, {"q": "R→FR 的 54% 表示", "o": ["低於單次R，但不是全部不萌發", "完全等同黑暗9%", "種子已全部死亡"], "tag": "germ"}, {"q": "本表交替照光的趨勢", "o": ["末次R通常較末次FR高", "只看第一次光就足夠", "所有FR末次組都是0%"], "tag": "germ"}], "id": "b2-52-q08"}, {"t": "萌發條件：因子與作用配對", "q": "把五個環境因子配回教材的作用。", "learn": 22, "tag": "germ", "hint": "因子不一定對所有物種都需同一程度。", "why": "水、氧、溫度影響代謝，光與外力則依種子特性而異；春化另指促進開花。", "sub": "P153–154；PPT34–41", "refs": [{"src": "PPT34S3", "cap": "原PPT第34頁末段代表畫面"}, {"src": "BOOK6", "cap": "P153 完整課本頁"}], "kind": "drag", "slots": [{"id": "s0", "label": "水"}, {"id": "s1", "label": "氧"}, {"id": "s2", "label": "適合溫度"}, {"id": "s3", "label": "光（萵苣模型）"}, {"id": "s4", "label": "外力"}], "pieces": [{"id": "a0", "label": "軟化種皮並啟動代謝"}, {"id": "a1", "label": "供有氧呼吸產生能量"}, {"id": "a2", "label": "提供合適酵素作用條件"}, {"id": "a3", "label": "經光敏素影響萌發"}, {"id": "a4", "label": "破除種皮或果皮的障礙"}], "sol": {"s0": "a0", "s1": "a1", "s2": "a2", "s3": "a3", "s4": "a4"}, "pre": {}, "id": "b2-52-q09"}, {"t": "防禦與逆境：訊號在哪裡作用？", "q": "依本節情境辨認作用及防禦範圍。", "learn": 35, "tag": "defense", "hint": "區分訊號、作用部位和防禦方式。", "why": "乾旱與淹水的問題不同；系統性防禦擴及遠處，寄生蜂提供間接防禦。", "sub": "P155–157；PPT43、53–54", "refs": [{"src": "PPT53S3", "cap": "防禦與逆境：訊號在哪裡作用？完整教材圖"}, {"src": "PPT52S3", "cap": "原PPT第52頁末段代表畫面"}, {"src": "BOOK10", "cap": "P157 完整課本頁"}], "fig": "PPT53S3", "kind": "fill", "imageWidth": 560, "figCaption": "P155–157；PPT43、53–54", "rows": [{"q": "教材缺水時 ABA 促進", "o": ["氣孔關閉", "所有蛋白立即死亡", "光敏素變成酵素"], "tag": "defense"}, {"q": "淹 面對逆境的反應哪些正確？", "learn": 39, "tag": "stress", "hint": "依原圖及原教材情境判讀；原答案完整保留。", "why": "<ul><li>原答案 B、D 保留，採本節的逆境情境。</li><li>不論何種逆境 ABA 都增加、任何高溫 HSP 都有效，皆過度概括。</li><li>淹水形成皮層空隙的教材訊號是乙烯，非生長素。</li></ul><p class=\"think\">思考：把「不論」改成限定條件，能否修正錯誤敘述？</p><p class=\"scope-note\">教材判讀：原題D按教材缺水模型判分；實際激素變化須看物種、時間及組織。HSP的保護不等於直接降低體溫。<a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC139847/\" target=\"_blank\" rel=\"noopener\">HSP101 耐熱研究</a></p>", "sub": "原PPT第 58 頁原題；原答案保留", "refs": [{"src": "PPT58S3", "cap": "原PPT第58頁末段代表畫面"}, {"src": "BOOK8", "cap": "P155 完整課本頁"}], "kind": "multi", "original": true, "sourceSlide": 58, "sourcePages": [58], "originalKey": [1, 3], "opts": [{"t": "不論面對何種逆境，植物的離層酸都會增加", "ok": false, "tag": "stress"}, {"t": "幼苗若遭受經常性觸碰的機械性傷害，會透過乙烯誘導幼苗改變生長方向", "ok": true, "tag": "stress"}, {"t": "不論高溫程度，熱休克蛋白都可保護細胞內的酵素與蛋白質", "ok": false, "tag": "stress"}, {"t": "缺水時，離層酸與乙烯的濃度都會上升", "ok": true, "tag": "stress"}, {"t": "淹水時，植物透過誘導生長素的產生，造成根部組織出現空隙。", "ok": false, "tag": "stress"}], "id": "b2-52-q13"}], "tags": {"movement": ["運動與向性", "方向、器官及膨壓／生長機制需一起判讀。", "P148；PPT2–10"], "photo": ["光週期與臨界值", "依當前圖的數值，讀連續黑暗而非加總夜長。", "P149–151；PPT11–25"], "signal": ["光敏素與開花訊號", "分清 Pr/Pfr 轉換、感應葉片和開花部位。", "P150–152；PPT20–28"], "cold": ["低溫與發育", "春化促開花，不等同低溫解除休眠。", "P152–153；PPT29–35"], "germ": ["萌發條件與光", "不同種子條件不同；光抑制不等於萌發率為零。", "P150、153–154；PPT33–41"], "stress": ["逆境調節", "區分缺水與缺氧，熱休克蛋白有耐受限度。", "P155；PPT42–46、58"], "defense": ["防禦範圍與訊號", "屏障、局部、系統性及間接防禦分開辨認。", "P156–157；PPT47–54"]}, "conceptMap": {"movement": 4, "photo": 12, "signal": 14, "cold": 19, "germ": 25, "stress": 30, "defense": 35}, "pptText": {"39": "◆ 萌發會受光影響的種子，其\n作用機制主要與種子或幼苗細胞內的\n光敏素\n有關，依其 \nP\nfr\n \n所占的比例而表現不同的生理反應\n5-2.2 \n環境對種子萌發的影響\n配合課本 \nP154", "33": "◆ 有些植物的種子在成熟後即可萌發，然而有些種子的外觀似乎已成熟或已從果實釋出，但即使\n遇到適當環境卻仍不萌發\n，此現象稱為\n休眠\n5-2.2 \n環境對種子萌發的影響\n◆ 種子休眠的原因\n：\n◇ 胚尚未發育完全\n◇ 種皮乾燥堅硬\n◇ 種子\n表面有抑制萌發的物質存在\n木瓜種子外的透明層會抑制萌發\n配合課本 \nP153", "34": "5-2.2 \n環境對種子萌發的影響\n◆ 可沖掉種皮表面抑制萌發的物質\n水\n◆ 可軟化種皮\n◆ 使細胞內酵素活化，促使新陳代謝的進行\n◆ 供細胞進行有氧呼吸產生能量\n氧\n◆ 泡水軟化種皮、去除種皮或增加供氧，皆可使氧更容易進入種子，加速種子萌發\n配合課本 \nP153\n影響種子萌發的環境因子有哪些\n?", "35": "5-2.2 \n環境對種子萌發的影響\n◆\n \n有些溫帶地區的植物種子在\n萌發後，需經春化作用，才能開花、結果\n溫度\n◆ 酵素通常是在常溫下作用，過高或太低的溫度都會降低酵素的活性\n配合課本 \nP153", "36": "5-2.2 \n環境對種子萌發的影響\n光\n◆ 有些植物種子的萌發會受光促進，如\n：\n萵苣種子\n◆ 有些植物種子的萌發會受光抑制，如\n：\n番茄種子\n◆ 有些則不受光照影響\n配合課本 \nP154", "37": "  \n知識補給站\n光敏素影響萵苣\n種子萌發\n配合課本 \nP150\n、\n154\n◆ 萵苣種子在連續黑暗中接受紅光和遠紅光的短暫干擾，結果發現紅光能促進萵苣種子萌發，遠紅光則相反\n照射紅光\n照射遠紅光\n37", "58": "  \nQuestion\n3. \n下列有關植物面對逆境的反應哪些正確\n？\n　\n(\nA)\n不論面對何種逆境，植物的離層酸都會\n增加\n　\n(\nB)\n幼苗若遭受經常性觸碰的機械性傷害，會透過乙烯誘導幼苗改變生長\n方向\n　\n(\nC)\n不論高溫程度，熱休克蛋白都可保護細胞內的酵素與\n蛋白質　\n(\nD)\n缺水時，離層酸與乙烯的濃度都會\n上升\n　\n(\nE)\n淹水時，植物透過誘導生長素的產生，造成根部組織出現空隙。\n解答\n：\n(B)(D)\n解析\n：\n(A)\n植物面對不同逆境會以不同的反應來應對，不一定每一種逆境中的離層酸都會增加。\n(C)\n在可耐受的高溫範圍內，熱休克蛋白可協助維持細胞基本代謝。\n(E)\n淹水時，植物透過誘導乙烯產生，造成根部\n細胞計畫性死亡\n而形成空隙。\n58", "32": "  \n腦力激盪\n　　從前述所介紹的植物激素，以及環境刺激對植物體生長與開花結果的影響，你能列舉出哪些應用在農業上的實例？例如\n：\n「花農是如何調整菊花的開花時間，來供應不同時節的市場需求」。\n例如\n：\n(1)\n 菊花田藉由不同光週期調整開花時間。\n(2)\n 給予冬小麥、櫻花等植株低溫處理，以調整開花時間。\n(3)\n 蔬菜、果實等農產品運送過程中，以低溫、細胞分裂素處理以減緩蔬果提早老化或成熟。抵達銷售地後，在銷售之前再以乙烯催熟，如香蕉，可讓果皮黃化程度相同。\n(4)\n 培植稻米秧苗時，經常輕拂秧苗，藉此讓植株因受刺激而產生乙烯，使植株橫向加粗而長得較粗壯。\n配合課本 \nP152\n32", "31": "◆ \n需春化作用的\n植物多生長在\n四季分明的溫帶\n，因為春化作用表現的關鍵因素為\n一定的低溫刺激\n與\n持續低溫的時間\n5-2.1 \n環境對植物開花的影響\n春化作用\n◆ 莖的頂端\n分生組織\n經冬天低溫刺激後，會由產生莖與葉的營養芽轉為產生花的生殖芽\n配合課本 \nP152", "30": "5-2.1 \n環境對植物開花的影響\n春化作用\n◆ 春化作用最初由農作栽種發現\n：\n春小麥\n：\n第一年春\n播種\n第一年秋\n開花、收成\n冬小麥\n：\n第一年秋\n播種\n第一年春\n萌發\n第二年春夏\n開花、收成\n經過冬天\n自然春化\n人工春化\n低溫處理\n第一年夏秋\n開花、收成\n配合課本 \nP152", "24": "5-2.1 \n環境對植物開花的影響\n光週期性\n時間（小時）\n2\n4\n6\n8\n10\n12\n14\n18\n16\n20\n0\n22\n24\n開花\n臨界夜長\n開花\n不開花\n◇ 菊花是長夜植物，臨界夜長 \n16\n 小時\n：\n不開花\n紅光\n遠紅光\n配合課本 \nP150 \n、\n151", "25": "5-2.1 \n環境對植物開花的影響\n光週期性\n時間（小時）\n2\n4\n6\n8\n10\n12\n14\n18\n16\n20\n0\n22\n24\n臨界夜長\n不開花\n開花\n不開花\n開花\n◇ 鳶尾是短夜植物，臨界夜長 \n16 \n小時\n：\n配合課本 \nP150 \n、\n151\n紅光\n遠紅光", "26": "5-2.1 \n環境對植物開花的影響\n光週期性\n◆ 光週期 \nvs. \n開花的關係\n葉片\n接收光的刺激\n光敏素\n形態改變\n訊息傳至莖頂或側芽\n影響花芽的產生\n配合課本 \nP151", "27": "  \n知識補給站\n開花素\n◆ \n若把兩\n株\n短日照植物嫁接在一起，其中一株接受促進開花的光週期處理，另一株則否，\n結果兩株\n植物都開花\n→  \n推論\n：\n接受適當光週期的植物，產生了某種物質，經由嫁接處的\n韌皮部\n運送到另一株植物使其開花\n→  此物質經科學家研究後發現是\n開花素\n，亦為植物激素的一種\n長日照處理\n開花\n開花\n短日照處理\n短日照植物\n配合課本 \nP152\n27", "28": "  \n知識補給站\n開花素\n配合課本 \nP152\n◆ 光週期 \nvs. \n開花的關係\n葉片\n接收光的刺激\n產生\n開花素\n，經由\n韌皮部\n傳至莖頂或側芽\n影響花芽的產生\n光敏素\n形態改變\n28", "29": "◆ 說明\n：\n因\n低溫\n刺激而促進部分植物產生花芽的現象，稱為春化作用\n5-2.1 \n環境對植物開花的影響\n春化作用\n→ \n例如\n：\n梅花\n枝條的頂端分生組織或\n水仙鱗莖經歷冬天的低溫刺激而形成花芽，並在翌年初春開花\n水仙花\n配合課本 \nP152", "57": "  \nQuestion\n2\n. \n下列有關環境對種子萌發的影響，何者正確\n？\n　\n(\nA)\n某些植物的種子經過一次性低溫後即可萌芽，此為春化作\n用\n　\n(\nB)\n所有的種子萌發都需有適當的\n光照\n　\n(\nC)\n泡水的種子無法順利萌發是因為種皮太過\n堅硬\n　\n(\nD)\n部分種子需要經過動物食用後才能順利萌發。\n解答\n：\n(D)\n解析\n：\n(A)\n春化作用是指某些植物經過低溫刺激後，可以促進產生花芽。\n(B)\n僅部分種類的種子萌發會受到光線影響。\n(C)\n泡水種子已把種皮浸軟，無法順利萌發主要是因為缺氧。\n57", "56": "  \nQuestion\n解答\n：\n(A)(C)(D)\n解析\n：\n(B)\n連續黑暗未達臨界夜長，開花率不足 \n50\n％。\n\n(E)\n連續黑暗被紅光閃爍中斷，不足臨界夜長。\n56", "55": "  \nQuestion\n1\n. \n有一株臨界夜長 \n15\n 小時的長夜植物，請問下圖的哪些處理方式可以使其開花？\n(A)\n甲　\n(\nB)\n乙　\n(\nC)\n丙　\n(\nD)\n丁　\n(\nE)\n戊。\n55", "45": "◆\n 溫帶闊葉植物多能感應溫度的\n變化\n，\n藉\n改變生理狀態\n或\n\n產生\n熱休克蛋白\n，來保護自己\n5-2.3 \n逆境對植物生長發育的影響\n溫度\n◆\n 過高或過低的溫度會造成\n細胞膜組成與結構的改變\n，甚至造成離子滲出膜外，或各種通道的運送受阻\n，\n阻礙了光合作用與呼吸作用等生理代謝之進行\n配合課本 \nP155", "44": "◆\n \n當幼苗遭經常性的觸摸等機械性傷害時，乙烯可誘導幼苗的生長方向改變，從向上抽長改變為橫向加粗，造成幼苗長得粗而短\n5-2.3 \n逆境對植物生長發育的影響\n機械性傷害\n→ \n農民藉由輕撫秧苗來促使其長得粗壯\n配合課本 \nP155", "43": "◆ ABA \n增加，促使葉片氣孔關閉\n5-2.3 \n逆境對植物生長發育的影響\n水分\n乾旱\n◆ 根部組織缺氧\n，\n誘導乙烯的產生，促使細胞計畫性死亡而形成空隙\n◆ 乙烯增加，促進葉柄基部的離\n層形成及\n加速葉片老化\n水分\n淹水\n配合課本 \nP155", "42": "5-2.3 \n逆境對植物生長發育的影響\n◆ 對植物而言，凡是不利於生長發育的環境因素，皆可統稱為逆境\n◆ 面對逆境，植物體通常會有適度的反應來降低受傷的程度，避免因逆境而死亡\n◆ \n離層酸（ \nABA \n）\n與\n乙烯\n，\n是植物體在面對逆境時，主要協助調節生長的激素\n配合課本 \nP155", "41": "→\n \n囓齒動物啃咬核桃堅硬的果皮而形成裂縫，有利於\n種子\n\n萌發\n5-2.2 \n環境對種子萌發的影響\n配合課本 \nP154", "40": "◆ 有些植物的種皮或果皮十分\n堅\n\n硬\n，會阻礙幼苗生長，若有\n外\n\n力\n破壞這些障礙，即可加速\n種\n\n子\n的萌發\n外力\n→ \n例如\n：\n榕樹種子經由動物攝食後，被消化道內的消化液軟化種\n皮\n5-2.2 \n環境對種子萌發的影響\n配合課本 \nP154", "46": "  \n知識補給站\n熱休克蛋白\n配合課本 \nP155\n◆\n \n熱休克蛋白最初命名是因高溫誘導而產生的蛋白質，此現象普遍發生在動、植物甚至細菌細胞中，後續研究發現也會受低溫等逆境誘導而產生\n◆\n \n在可耐受的高溫範圍內，熱休克蛋白\n可協助\n維持細胞基本代謝；若在致死的高溫下，
