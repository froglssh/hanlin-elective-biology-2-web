const CONTENT={"lessons": [{"id": "b2-a31-l01", "t": "綠色葉汁，是否只有一種色素？", "src": "課本 P92；原PPT第 1 頁", "slide": 1, "sourcePages": [1], "sec": "s1", "figSpec": {"flip": [1]}, "txt": "<ul><li>從日常蔬果顏色提出問題。</li><li>葉片看起來綠色，不代表只含綠色色素。</li><li>本活動用色帶分離來取得證據。</li></ul><p class=\"think\">思考：外觀顏色能直接告訴你全部色素種類嗎？</p><div class=\"quote\">       我們日常所吃的蔬果如菠菜、青椒、紅甜椒、芭樂等有哪些顏色？這些顏色都和植物體內哪些色素有關？而這些色素都可幫助植物行光合作用嗎？綠色的菠菜含有幾種光合色素呢？<br>前言<br>探討活動 <br>3-1 <br>光合色素之層析分離<br>配合課本 <br>P92<small>原PPT第 1 頁（完整原文）</small></div><div class=\"quote\">探討活動 <br>前　言<br>我們日常所吃的蔬果如菠菜、青椒、紅甜椒、芭樂等有哪些顏色？這些顏色<br>都和植物體內哪些色素有關？而這些色素都可幫助植物行光合作用嗎？綠色的菠<br>菜含有幾種光合色素呢？<br>目　的<br>葉綠體內的葉綠素、葉黃素及胡蘿蔔素是光反應所需的光合色素，缺少這<br>些色素就無法進行光合作用。本活動目的為利用簡易的濾紙層析方法分離光合色<br>素，並嘗試從條帶顏色對應色素的種類。<br>原　理 <br>濾紙層析法是利用如丙酮與石油醚等可溶解色素的有機溶劑在濾紙上移動，<br>且因色素與濾紙的吸附力不同而使色素分離。植物所含的色素分子由於化學性質<br>不同，所以色素隨展開液移動時，與濾紙吸附力較大的色素移動較慢；反之，吸<br>附力較小的色素移動較快，故可藉此將混合的多種色素分開。<br>器　材<br>全班共用<br> 三種配方的展開液（石油醚：90% 丙酮＝9：1、8：2、7：3） 各10 mL ／組<br> 250 mL 錐形瓶 <br>3 個<br>每組使用<br> 滴管 <br>2 支 <br> 10 mL 量筒 <br>2 支<br> 鋁箔紙 <br>1 張 <br> 長條濾紙（約 15 × 0.8 cm） <br>2 條<br> 剪刀 <br>1 把 <br> 硬幣 <br>1 枚<br> 鐵尺 <br>1 把 <br> 鉛筆 <br>1 支<br> 新鮮、軟嫩多汁的綠色葉片 <br>2 片<br>（如菠菜、青江菜、鬼針草、朱槿、車前草等皆適用）<br>－1 光合色素之層析分離<br>3<br>92　選修生物 Ⅱ (全)<small>課本 PDF 第 1 頁，印刷 P92（完整原文）</small></div>", "tb": [["BOOK1", "P92 完整課本頁"]]}, {"id": "b2-a31-l02", "t": "活動目的：把混合的光合色素分開", "src": "課本 P92；原PPT第 2 頁", "slide": 2, "sourcePages": [2], "sec": "s1", "figSpec": {"flip": [2]}, "txt": "<ul><li>以簡易濾紙層析分離綠色葉片的光合色素。</li><li>從條帶顏色嘗試對應葉綠素、葉黃素與胡蘿蔔素。</li><li>描述所見條帶，再與教材參考比對。</li></ul><p class=\"think\">思考：沒有清楚分離的條帶，能直接判定某種色素不存在嗎？</p><p class=\"scope-note\">判讀提醒：本活動聚焦綠色葉片的色素；不能只憑蔬果外觀顏色判定所有色素都參與光合作用。</p><div class=\"quote\">       葉綠體內的葉綠素、葉黃素及胡蘿蔔素是光反應所需的光合色素，缺少這些色素就無法進行光合作用。本活動目的為利用簡易的濾紙層析方法分離光合色素，並嘗試從條帶顏色對應色素的種類。<br>探討活動 <br>3-1 <br>光合色素之層析分離<br>目的<br>配合課本 <br>P92<small>原PPT第 2 頁（完整原文）</small></div><div class=\"quote\">探討活動 <br>前　言<br>我們日常所吃的蔬果如菠菜、青椒、紅甜椒、芭樂等有哪些顏色？這些顏色<br>都和植物體內哪些色素有關？而這些色素都可幫助植物行光合作用嗎？綠色的菠<br>菜含有幾種光合色素呢？<br>目　的<br>葉綠體內的葉綠素  "約9%", "一定等到100%"], "tag": "method"}, {"q": "為何限制浸入長度", "o": ["避免起始色素溶入展開液", "使葉汁線完全泡在液中", "把展開液濃度改成90%"], "tag": "method"}], "id": "b2-a31-q05"}, {"t": "教材參考：色素與顏色", "q": "依教材註記配對顏色；不當作你的實測結果。", "learn": 10, "tag": "principle", "hint": "這題核對教材色名；實際條帶仍要另行記錄。", "why": "依P95：a藍綠、b淡綠、葉黃素淡黃、胡蘿蔔素鉻黃。", "sub": "課本 P95；原PPT第 11 頁", "refs": [{"src": "result", "cap": "教材參考：色素與顏色教材原圖"}, {"src": "PPT11S3", "cap": "原PPT第11頁代表畫面"}, {"src": "BOOK4", "cap": "P95 完整課本頁"}], "fig": "result", "figCaption": "課本 P95；原PPT第 11 頁", "kind": "fill", "imageWidth": 500, "rows": [{"q": "葉綠素a", "o": ["藍綠色", "淡綠色", "鉻黃色"], "tag": "principle"}, {"q": "葉綠素b", "o": ["淡綠色", "淡黃色", "藍綠色"], "tag": "principle"}, {"q": "葉黃素", "o": ["淡黃色", "藍綠色", "鉻黃色"], "tag": "principle"}, {"q": "胡蘿蔔素", "o": ["鉻黃色", "淡綠色", "藍綠色"], "tag": "principle"}], "id": "b2-a31-q06"}, {"t": "比較結果：哪些證據可信？", "q": "哪些做法適合比較不同展開液的分離效果？（選兩項）", "learn": 13, "tag": "design", "hint": "以可比較的紀錄為證據，不先指定獲勝配方。", "why": "重複結果與材料、方法紀錄有助比較；PPT明說9：1並非標準答案，應依學生操作結果討論。", "sub": "課本 P95；原PPT第 14 頁", "refs": [{"src": "PPT14S3", "cap": "原PPT第14頁代表畫面"}, {"src": "BOOK4", "cap": "P95 完整課本頁"}], "kind": "multi", "opts": [{"t": "在同設計條件下核對至少兩組結果", "ok": true, "tag": "design"}, {"t": "把9：1先寫成每組必須得到的最好結果", "ok": false, "tag": "design"}, {"t": "記錄條帶重疊、分開與清晰度及操作條件", "ok": true, "tag": "design"}, {"t": "只憑色帶移得最高就判定分離效果最好", "ok": false, "tag": "design"}], "id": "b2-a31-q07"}, {"t": "結果不理想：因素與收尾", "q": "逐一判讀三個檢查情境。", "learn": 14, "tag": "evidence", "hint": "可能因素需要證據；收尾遵循教材回收要求。", "why": "原PPT列出可能因素，需分析操作記錄與後續比較；P95要求集中回收廢液。", "sub": "課本 P95；原PPT第 15 頁", "refs": [{"src": "PPT15S3", "cap": "結果不理想：因素與收尾教材原圖"}, {"src": "PPT15S3", "cap": "原PPT第15頁代表畫面"}, {"src": "BOOK4", "cap": "P95 完整課本頁"}], "fig": "PPT15S3", "figCaption": "課本 P95；原PPT第 15 頁", "kind": "fill", "imageWidth": 500, "rows": [{"q": "條帶相連時", "o": ["檢查點樣集中、配方、封口及摺痕", "直接判定所有葉片只有一種色素", "把未分離條帶填成四條實測"], "tag": "evidence"}, {"q": "提出可能原因後", "o": ["以操作紀錄與後續控制比較求證", "一次改所有條件就能確定原因", "僅憑猜測當作已證實原因"], "tag": "evidence"} 各組條件與結果：\n結果不同時要檢查什麼：", "reviewPrompts": ["有分清實測、預測與教材參考嗎？", "有說明材料、配方及操作條件嗎？", "有用紀錄支持解釋並記下限制嗎？"], "id": "b2-a31-q11"}, {"t": "原討論四：分不開的可能因素", "q": "若活動結果不理想，色素仍相連、沒有分離，你認為是哪些因素造成的？", "learn": 14, "tag": "evidence", "hint": "以全班或自己的觀察紀錄討論；尚未實作先註明預測。", "why": "此為原活動開放討論題。系統只保存文字，不以教材示範替代你的結果或自動評分。", "sub": "課本 P95 原討論題；原PPT第15頁", "refs": [{"src": "spotting", "cap": "原討論四：分不開的可能因素教材原圖"}, {"src": "PPT15S3", "cap": "原PPT第15頁代表畫面"}, {"src": "BOOK4", "cap": "P95 完整課本頁"}], "fig": "spotting", "figCaption": "課本 P95；原PPT第 15 頁", "kind": "reflection", "original": true, "sourceSlide": 15, "reflectionLabel": "我的觀察與討論（保存文字，不自動評分）", "reflectionPlaceholder": "本次操作紀錄與不理想結果：\n可能因素與依據：\n計畫一次改哪個條件：\n如何比較以驗證：", "reviewPrompts": ["有分清實測、預測與教材參考嗎？", "有說明材料、配方及操作條件嗎？", "有用紀錄支持解釋並記下限制嗎？"], "id": "b2-a31-q12"}], "tags": {"principle": ["層析與色素", "教材以吸附差異說明分離；顏色、位置與含量或效率分開判讀。", "P92、95；PPT2–3、11、13"], "method": ["操作與條件", "點樣集中，風乾後重複；葉汁線不能浸入液面。", "P93–95；PPT8–12"], "design": ["配方與重複", "共同A加B或C，至少兩組比對；比較自己結果而非硬套9：1。", "P93、95；PPT6–7、14"], "evidence": ["記錄與求證", "觀察與參考分開，可能因素須再驗證；沒有分開不等於沒有色素。", "P95；PPT13–15"]}, "conceptMap": {"principle": 2, "method": 8, "design": 13, "evidence": 14}, "pptText": {"1": "       我們日常所吃的蔬果如菠菜、青椒、紅甜椒、芭樂等有哪些顏色？這些顏色都和植物體內哪些色素有關？而這些色素都可幫助植物行光合作用嗎？綠色的菠菜含有幾種光合色素呢？\n前言\n探討活動 \n3-1 \n光合色素之層析分離\n配合課本 \nP92", "2": "       葉綠體內的葉綠素、葉黃素及胡蘿蔔素是光反應所需的光合色素，缺少這些色素就無法進行光合作用。本活動目的為利用簡易的濾紙層析方法分離光合色素，並嘗試從條帶顏色對應色素的種類。\n探討活動 \n3-1 \n光合色素之層析分離\n目的\n配合課本 \nP92", "3": "◆ 濾紙層析法是利用如\n丙酮\n與\n石油醚\n等可溶解色素的有機溶劑在濾紙上移動，且因\n色素與濾紙的吸附力不同\n而使色素分離\n探討活動 \n3-1 \n光合色素之層析分離\n原理\n◆ 植物所含的色素分子由於化學性質不同，所以色素隨展開液移動時，與濾紙吸附力較大的色素移動較慢；反之，吸附力較小的色素移動較快，故可藉此將混合的多種色素分開\n配合課本 \nP92", "4": "探討活動 \n3-1 \n光合色素之層析分離\n器材\n全班使用\n三種配方的展開\n液（ 石油\n醚 \n: 90\n%\n 丙酮 \n=\n \n9\n：\n1\n、\n8\n：\n2\n、\n7\n：\n3\n ）\n各 \n10\n \nmL\n／組\n250\n \nmL\n 錐形\n瓶\n3\n 個\n配合課本 \nP92", "5": "探討活動 \n3-1 \n光合色素之層析分離\n器材\n每組使用\n滴管\n2\n 支\n10\n \nmL\n 量筒\n2\n 支\n鋁箔紙\n1\n 張\n長條\n濾紙（約 \n15\n\n0.8\n \ncm\n）\n2\n 條\n剪刀\n1\n 把\n硬幣\n1\n 枚\n鐵尺\n1\n 把\n鉛筆\n1\n 支\n新鮮、軟嫩多汁的綠色\n葉片（ 如\n菠菜、青江\n菜、\n鬼針草\n、朱槿、車前草等皆\n適用 ）\n2\n 片\n配合課本 \nP92", "6": "探討活動 \n3-1 \n光合色素之層析分離\n步驟\n分別混合石油醚與 \n90%\n \n丙酮，以 \n9\n：\n1 \n、 \n8\n：\n2 \n及\n\n \n7\n：\n3\n 三\n種比例，配製全班共用的展開混合\n液 \nA\n、\nB\n、\nC\n 各 \n100\n \nmL\n，並用鋁箔紙包住瓶口。\n石油醚\n：\n90% \n丙酮＝ \n9\n：\n1\n石油\n醚\n：\n90\n% \n丙酮＝ \n8\n：\n2\n石油\n醚\n：\n90\n% \n丙酮＝ \n7\n：\n3\n配合課本 \nP93\n鋁箔紙\nA\nB\nC", "7": "為測試不同展開液對植物色素的分離效果，每組選用兩種展開液\n：\n除 \nA\n 之外\n，\nB\n 或 \nC\n 二\n擇一，\nB\n 或 \nC\n 展開\n液至少應有兩組使用。為方便比較各組結果，在教室黑板上作表格，填入各組的展開液種類。如下\n：\n探討活動 \n3-1 \n光合色素之層析分離\n組　別\n展開\n液 \nA\n展開\n液 \nB\n展開\n液 \nC\n分層結果\n第一組\nV\nV\n第二組\nV\nV\n第三組\nV\nV\n第四組\nV\nV\n配合課本 \nP93", "8": "探討活動 \n3-1 \n光合色素之層析分離\n取兩種展開液\n各 \n1\n \nmL\n，分別以滴管滴\n入 \n10\n \nmL \n量筒內，然後用鋁箔紙包住量筒口，使展開液不易揮發，靜置於桌上備用。\n註\n盡量不要碰到內壁。\n展開\n液 \nA\n展開\n液 \nB\n10\n \nmL\n 量筒\n鋁箔紙\n配合課本 \nP93", "9": "探討活動 \n3-1 \n光合色素之層析分離\n將長條濾紙一端\n約 \n1.5\n \ncm\n 處\n剪成尖形箭頭，然後在距離濾紙\n尖端 \n2\n \ncm\n 處\n，直接用硬幣或鐵尺以直線方式精準地按壓葉片，畫出綠色線條，待汁液風乾後，重複操作數次，使葉片汁液在濾紙上呈現深綠色的線條。\n1.5\n \ncm\n1.5\n \ncm\n2\n \ncm\n配合課本 \nP94", "10": "探討活動 \n3-1 \n光合色素之層析分離\n將長條濾紙放入盛有展開液的量筒中，將濾紙露出量筒的一端下折，再用鋁箔紙封住量筒口，觀察展開液在濾紙上的上升情形。\n鋁箔紙\n濾紙\n葉汁\n展開液\n靜置\n註\n濾紙浸入展開液中的長度不要超過 \n1 cm\n，以免濾紙上的色素溶入展開液。\n配合課本 \nP94", "11": "當展開液上升至濾紙全長的 \n90\n％ 時，取出濾紙，觀察色素在濾紙上的分離情形，並用鉛筆在分離的色素條帶上緣畫線作記號。\n探討活動 \n3-1 \n光合色素之層析分離\n註\n葉綠素 \na \n為藍綠色，葉綠素 \nb \n為淡綠色，葉黃素為淡黃色，胡蘿蔔素為鉻黃色。\n配合課本 \nP95", "12": "探討活動 \n3-1 \n光合色素之層析分離\n活動結束後，將展開液集中為回收廢液。\n註\n不能直接倒入水槽。\n配合課本 \nP95", "13": "綜合全班活動結果，綠色葉片汁液內的光合色素經展開液展開後，由上而下顏色的排列情形為何？分別是什麼色素？\n探討活動 \n3-1 \n光合色素之層析分離\n討論\n答\n：\n顏色\n由上而下為\n：\n鉻黃色→淡黃色→藍綠色→\n淡\n\n綠色\n；色素種類依序\n為\n：\n胡蘿蔔素\n→葉黃素→葉綠素 \na \n→葉綠素 \nb\n。\n配合課本 \nP95", "14": "2. \n比較全班活動結果，哪一種展開液分離色素的效果較佳？\n探討活動 \n3-1 \n光合色素之層析分離\n答\n：\n石油醚\n：\n90\n％ 丙酮＝\n9\n：\n1\n。（一般而言，綠色葉菜類所含的色素相似，操作結果以展開液中石油醚與 \n90% \n丙酮的比例 \n9\n：\n1 \n效果較佳。然而這並非標準答案，仍以學生操作的結果來討論即可；換言之，本討論的重點是在比較學生所得到的結果。）\n3. \n活動設計時，為何每種展開液至少應有兩組使用？\n答\n：\n科學實驗需要重覆性\n，以利於\n在相同設計條件下比對\n結果\n，增加實驗結果的可信度。\n配合課本 \nP95", "15": "答\n：\n分析\n各活動步驟操作的設計緣由，逐一討論可修改之處，\n例如\n：\n(\n1\n)\n嘗試改變有機溶劑的不同比例，或選擇與欲分析色素之相溶程度不同的有機溶劑；\n(2\n)\n色素點樣是否集中；\n(3\n)\n展開液會揮發成氣體，若氣體能充滿於量筒中而達到飽和，則色素分離結果較\n佳；\n(4)\n濾紙不能有明顯的摺痕。\n4. \n若活動結果不理想，色素仍相連、沒有分離，你認為是哪些因素造成的？\n探討活動 \n3-1 \n光合色素之層析分離\n配合課本 \nP95"}, "originalCount": 4};
