const CONTENT={"lessons": [{"id": "b2-a32-l01", "t": "光照葉綠體，如何追蹤電子？", "src": "課本 P96；原PPT第 1 頁", "slide": 1, "sourcePages": [1], "sec": "s1", "figSpec": {"flip": [1]}, "txt": "<ul><li>光反應中氧氣來自水的裂解。</li><li>本活動使用分離的葉綠體，比較照光與遮光處理。</li><li>以受電子後改變顏色的物質追蹤還原作用。</li></ul><p class=\"think\">思考：只看溶液變色，可以直接量到氧氣或電子的數量嗎？</p><p class=\"scope-note\">判讀提醒：本活動比色提供還原作用的間接證據，沒有直接測量氧氣來源或電子數；水裂解的背景結論與本次觀察分開。</p><div class=\"quote\">探討活動 <br>3-2 <br>光反應的還原作用<br>前言<br>       在光反應中，氧氣的形成是來自水的裂解，不是來自二氧化碳。早期的研究學者如何操作實驗得到上述結論？我們能否重複當初的操作原理，證實葉綠體可吸收光，並將水裂解而釋放電子？<br>配合課本 <br>P96<small>原PPT第 1 頁（完整原文）</small></div><div class=\"quote\">探討活動 <br>前 言<br>在光反應中，氧氣的形成是來自水的裂解，不是來自二氧化碳。早期的研究<br>學者如何操作實驗得到上述結論？我們能否重複當初的操作原理，證實葉綠體可<br>吸收光，並將水裂解而釋放電子？<br>目　的<br>本活動運用氧化劑會因接收電子而還原的原理，藉由使用氧化劑 DCPIP 在<br>還原態時會轉變顏色的檢測技術，以證實葉綠體於光反應中有釋放電子的現象。<br>原　理 <br>1937 年，植物生理學家 希爾 發現，將葉綠體分離後置於試管中，再加入適<br>當的氧化劑，如二氯酚<br>酚（2,6-Dichlorophenol indophenol; DCPIP），照光後<br>會使水裂解成電子與氫離子，而將 DCPIP 還原，反應中也會放出氧，證實了光<br>反應會將水裂解，又稱為「希爾反應（Hill reaction）」。反應過程如下：<br>DCPIP  + H2O             <br>光<br>葉綠體<br>DCPIPH2 +        O2<br>1<br>2<br>DCPIP  + 2H<br>+ + 2e<br>－+    O2<br>1<br>2<br>（氧化態，藍色）<br>（還原態，無色）<br>其中 DCPIP 在氧化態呈藍色，而在接受電子與氫離子之後變為無色。<br>希爾　Robert Hill, 1899∼1991<br>－2 光反應的還原作用 <br>3<br>96　選修生物 Ⅱ (全)<small>課本 PDF 第 1 頁，印刷 P96（完整原文）</small></div>", "tb": [["BOOK1", "P96 完整課本頁"]]}, {"id": "b2-a32-l02", "t": "DCPIP：用顏色檢測還原作用", "src": "課本 P96；原PPT第 2 頁", "slide": 2, "sourcePages": [2], "sec": "s1", "figSpec": {"image": "equation"}, "txt": "<ul><li>DCPIP作為接受電子的氧化劑。</li><li>氧化態呈藍色；接受電子與氫離子後，還原態無色。</li><li>比較處理組的顏色變化，而非直接觀察電子。</li></ul><p class=\"think\">思考：藍色變淡時，還需要哪些對照才能支持解釋？</p><p class=\"scope-note\">判讀提醒：DCPIP是此活動使用的檢測物質；不能把原始綠色葉汁本身當成DCPIP的顏色。</p><div class=\"quote\">探討活動 <br>3-2 <br>光反應的還原作用<br>目的<br>       本活動運用氧化劑會因接收電子而還原的原理，藉由使用<br>氧化劑 <br>DCPIP<br> 在<br>還原態時會轉變顏色的檢測技術，以證實葉綠體於光反應中有釋放電子的現象。<br>配合課本 <br>P96<small>原PPT第 2 頁（完整原文）</small></div><div class=\"quote\">探討活動 <br>前 言<br>在光反應中，氧氣的形成是來自水的裂解，不是來自二氧化碳。早期的研究<br>學者如何操作實驗得到上述結論？我 r>C<br>、<br>D <br>4<br> 支離<br>心管所得的結果互不相同？<br>答<br>：<br>離心<br>可讓葉綠體下沉，利於觀察顏色變化。<br>　 答<br>：<br>A<br> 離心管<br>：<br>反應<br>液中含有葉綠體，所以經過照光後會進行還原作用。<br>B<br> 離心管<br>：<br>反應<br>液中沒有葉綠體，所以即使照光仍然沒有反應。<br>C<br> 離心管<br>：<br>反應<br>液中雖然含有葉綠體，但是沒有照光，所以沒有反應。<br>D<br> 離心管<br>：<br>反應<br>液中沒有葉綠體，也沒有照光，所以不會進行還原作用。<br>配合課本 <br>P101<small>原PPT第 18 頁（完整原文）</small></div><div class=\"quote\">討　論<br>1  為何製備葉綠體溶液時要用 0.5 M 蔗糖溶液，而不使用蒸餾水？<br>2  分析本活動中的處理，如下表： <br>A 離心管<br>B 離心管<br>C 離心管<br>D 離心管<br>葉綠體懸浮液<br>1 mL<br>－<br>1 mL<br>－<br>DCPIP 溶液<br>0.5 mL<br>0.5 mL<br>0.5 mL<br>0.5 mL<br>0.5 M 蔗糖溶液<br>4 mL<br>5 mL<br>4 mL<br>5 mL<br>光照處理<br>照光<br>照光<br>遮光<br>遮光<br>1 請問實驗組與對照組分別為何？<br>2 為何在 A、C 與 B、D 離心管所加入 0.5 M 蔗糖溶液的量不同？<br>3  在步驟4 中，離心的目的為何？<br>4  為何 A、B、C、D 4 支離心管所得的結果互不相同？<br>5  在「2 活動設計與操作」中，哪些因素可能會影響結果？<br>第 3 章  植物體內物質的吸收、合成及運輸　101<small>課本 PDF 第 6 頁，印刷 P101（完整原文）</small></div>", "tb": [["BOOK6", "P101 完整課本頁"]]}, {"id": "b2-a32-l19", "t": "原討論五：哪些因素影響比色？", "src": "課本 P101；原PPT第 19 頁", "slide": 19, "sourcePages": [19], "sec": "s5", "figSpec": {"flip": [19]}, "txt": "<ul><li>葉綠體狀態、DCPIP濃度、蔗糖量與光照時間可能影響結果。</li><li>核對混合是否均勻、是否先離心再比色。</li><li>用操作紀錄提出假說，後續比較一次控制一個因素。</li></ul><p class=\"think\">思考：多項條件同時改動，能確認哪項造成變化嗎？</p><p class=\"scope-note\">判讀提醒：原PPT列出可能因素，不等於已證實為本次誤差原因；沒有變色也不能直接斷言綠葉沒有光反應。</p><div class=\"quote\">探討活動 <br>3-2 <br>光反應的還原作用<br>5. <br>在「活動設計與操作」中，哪些因素可能會影響結果？<br>答<br>：<br>參與<br>反應者皆可能影響結果，例如<br>：<br>葉綠體懸浮液的狀態（如太大力攪拌，導致葉綠體多數破裂）、<br>DCPIP <br>溶液濃度、蔗糖溶液的量是否正確與光照時間是否足夠等；或其他可能的人為操作疏失，<br>例如<br>：<br>是否<br>有先離心再比色，是否有將試管內的溶液混合均勻。<br>配合課本 <br>P101<small>原PPT第 19 頁（完整原文）</small></div><div class=\"quote\">討　論<br>1  為何製備葉綠體溶液時要用 0.5 M 蔗糖溶液，而不使用蒸餾水？<br>2  分析本活動中的處理，如下表： <br>A 離心管<br>B 離心管<br>C 離心管<br>D 離心管<br>葉綠體懸浮液<br>1 mL<br>－<br>1 mL<br>－<br>DCPIP 溶液<br>0.5 mL<br>0.5 mL<br>0.5 mL<br>0.5 mL<br>0.5 M 蔗糖溶液<br>4 mL<br>5 mL<br>4 mL<br>5 mL<br>光照處理<br>照光<br>照光<br>遮光<br>遮光<br>1 請問實驗組與對照組分別為何？<br>2 為何在 A、C 與 B、D 離心管所加入 0.5 M 蔗糖溶液的量不同？<br>3  在步驟4 中，離心的目的為何？<br>4  為何 A、B、C、D 4 支離心管所得的結果互不相同？<br>5 P100–101；PPT14、18–19"]}, "conceptMap": {"redox": 1, "prepare": 8, "design": 16, "evidence": 17}, "pptText": {"1": "探討活動 \n3-2 \n光反應的還原作用\n前言\n       在光反應中，氧氣的形成是來自水的裂解，不是來自二氧化碳。早期的研究學者如何操作實驗得到上述結論？我們能否重複當初的操作原理，證實葉綠體可吸收光，並將水裂解而釋放電子？\n配合課本 \nP96", "2": "探討活動 \n3-2 \n光反應的還原作用\n目的\n       本活動運用氧化劑會因接收電子而還原的原理，藉由使用\n氧化劑 \nDCPIP\n 在\n還原態時會轉變顏色的檢測技術，以證實葉綠體於光反應中有釋放電子的現象。\n配合課本 \nP96", "3": "探討活動 \n3-2 \n光反應的還原作用\n原理\n◆\n \n1937\n 年\n，植物生理學家\n希爾\n：\n將\n葉綠體\n分離後置於試管中，加入氧化劑如\n二氯酚\n吲哚\n酚\n（\n2,6-Dichlorophenol indophenol; \nDCPIP\n)\n水裂解成\n電子\n與\n氫離子\n，而\n將 \nDCPIP\n 還原\n，反應中也會放出\n氧\n照光\n證實了光反應會將水裂解，又稱為\n「希爾反應（\nHill reaction\n）」\nDCPIP\n在氧化態呈藍色，而在接受電子與氫離子之後變為無色\n配合課本 \nP96", "4": "◆ 反應過程如下\n：\n探討活動 \n3-2 \n光反應的還原作用\nDCPIP\n + H\n2\nO\n → \nDCPIP + 2H\n+\n + 2e\n－\n+ \n　\nO\n2\n（ \n氧化\n態，\n藍色 ）\n葉綠體\n光\n →\n \nDCPIPH\n2\n + \n　\nO\n2\n \n（ 還原\n態，\n無色 ）\n配合課本 \nP96", "5": "探討活動 \n3-2 \n光反應的還原作用\n器材\n全班共用\n水果刀\n1\n 把\n果汁機\n1\n 臺\n50\n \nmL\n 燒杯\n1\n 個\n紗布\n1\n 塊\n低速離心機\n1\n 臺\n玻棒\n1\n 支\n新鮮綠色\n葉片（ 如\n菠菜、青江菜、鬼針草、朱槿、車前\n草等 ）\n10\n 克\n配合課本 \nP97", "6": "每組使用\n15\n \nmL\n 透明\n離心管\n5\n 支\n有刻度的試管\n3\n 支\n鋁箔紙\n1\n 張\n檯燈\n1\n 座\n標籤紙\n4\n 張\n0.5\n \nM\n 蔗糖\n溶液\n50\n \nmL\n0.1\n%\n \nDCPIP\n2\n \nmL\n探討活動 \n3-2 \n光反應的還原作用\n配合課本 \nP97", "7": "探討活動 \n3-2 \n光反應的還原作用\n步驟\n將新鮮綠色葉片切碎後置於果汁機內，\n加入 \n0.5 M\n 蔗糖溶液 \n20\n \nmL\n，以低速攪\n打 \n20\n 秒\n。\n葉綠體懸浮液的製備\n0.5\n \nM\n 蔗糖\n溶液\n20\n \nmL\n配合課本 \nP97", "8": "將打碎的綠色葉片汁\n用 \n4\n 層\n紗布過濾，濾液以滴管裝至離心管中。\n探討活動 \n3-2 \n光反應的還原作用\n葉綠體懸浮液的製備\n配合課本 \nP98", "9": "以每分鐘\n約 \n3000\n 轉\n的速度\n離心 \n5\n 分鐘\n後，小心地把離心管中的上層液盡量倒掉，保留管底的沉澱物。\n探討活動 \n3-2 \n光反應的還原作用\n葉綠體懸浮液的製備\n配合課本 \nP98", "10": "加入 \n0.5\n \nM\n 蔗糖溶液 \n5\n \nmL\n，並以玻棒輕輕攪拌，使離心管中的沉澱物均勻懸浮於溶液中，此即為葉綠體懸浮液。\n探討活動 \n3-2 \n光反應的還原作用\n葉綠體懸浮液的製備\n註\n葉綠體懸浮液可全班一起製備，再分組進行下列步驟。\n配合課本 \nP98", "11": "探討活動 \n3-2 \n光反應的還原作用\n活動設計與操作\n取 \n4\n 支離\n心管，分別標示\n編號 \nA\n、\nB\n、\nC\n、\nD\n，\n於 \nA\n、\nC\n 離心\n管中分別\n加入 \n1\n \nmL\n 葉綠體\n懸浮液，\n於 \nB\n、\nD\n 離心\n管中分別\n加入 \n0.5\n \nM\n 蔗糖溶液 \n1\n \nmL\n。\n葉綠體\n懸浮液 \n1\n \nmL\n0.5\n \nM\n 蔗糖溶液 \n1\n \nmL\n配合課本 \nP99", "12": "於 \n4\n 支離\n心管中分別\n加入 \n0.5\n \nM\n 蔗糖溶液 \n4\n \nmL\n 和 \n0.1\n％ \nDCPIP\n 溶液 \n0.5\n \nmL\n。\n探討活動 \n3-2 \n光反應的還原作用\n活動設計與操作\n各\n加入 \n0.5\n \nM\n 蔗糖溶液 \n4\n \nmL\n各\n加入 \n0.1\n％ \nDCPIP\n 溶液 \n0.5\n \nmL\n配合課本 \nP99", "13": "用鋁箔紙把離心管管口蓋住，並\n將 \nC\n、\nD\n 兩\n支離心管用鋁箔紙整支包裹以隔絕光照，再\n將 \n4\n 支離\n心管置於檯燈前\n約 \n15\n 公分\n處照光。\n探討活動 \n3-2 \n光反應的還原作用\n活動設計與操作\n配合課本 \nP100", "14": "30\n 分鐘\n後移去檯燈，取下\n包裹 \nC\n、\nD\n 離心\n管的鋁箔紙，\n將 \n4\n 支離\n心\n管以每\n分鐘 \n3000\n 轉\n離心 \n3\n 分鐘\n，然後比較上層澄清液的顏色變化，將結果記錄下來。\n探討活動 \n3-2 \n光反應的還原作用\n活動設計與操作\n配合課本 \nP100", "15": "1. \n為何製備葉綠體溶液時要\n用 \n0.5 M\n 蔗糖\n溶液，而不使用蒸餾水？\n探討活動 \n3-2 \n光反應的還原作用\n討論\n答\n：\n葉綠體\n和細胞一樣，都由外膜圍住，內含許多物質。依據前人研究，\n0.5\n \nM\n 蔗糖\n溶液約為葉綠體的等張溶液，如果使用蒸餾水，葉綠體則會因吸水而脹破。\n配合課本 \nP101", "16": "2. \n分析本活動中的處理，如下表\n：\n探討活動 \n3-2 \n光反應的還原作用\n(1\n)\n 請問\n實驗組與對照組分別為何？\n(2\n)\n 為何在 \nA\n、\nC \n與 \nB\n、\nD\n 離心\n管所\n加入 \n0.5 M\n 蔗糖\n溶液的量不同？\n配合課本 \nP101\nA\n 離心管\nB\n 離心管\nC\n 離心管\nD\n 離心管\n葉綠體懸浮液\n1\n \nmL\n–\n1\n \nmL\n–\nDCPIP\n 溶液\n0.5\n \nmL\n0.5\n \nmL\n0.5\n \nmL\n0.5\n \nmL\n0.5\n \nM\n 蔗糖溶液\n4\n \nmL\n5\n \nmL\n4\n \nmL\n5\n \nmL\n光照處理\n照光\n照光\n遮光\n遮光", "17": "探討活動 \n3-2 \n光反應的還原作用\n答\n：\n(\n1\n)\n \n操縱\n變因是光照的有無\n：\nA \n和 \nB \n離心管是實驗組、\nC \n和 \nD \n離心管是對照組。操縱變因是葉綠體的有無\n：\nA \n和 \nC \n離心管是實驗組、\nB \n和 \nD \n離心管是對照組\n。\n(2)\n \n加入不同量的 \n0.5\n \nM \n蔗糖溶液，目的是為了讓每支離心管內的溶液總體積相同。\n配合課本 \nP101", "18": "3. \n在\n步驟 \n4 \n中，離心的目的為何？\n探討活動 \n3-2 \n光反應的還原作用\n4. \n為何 \nA\n、\nB\n、\nC\n、\nD \n4\n 支離\n心管所得的結果互不相同？\n答\n：\n離心\n可讓葉綠體下沉，利於觀察顏色變化。\n　 答\n：\nA\n 離心管\n：\n反應\n液中含有葉綠體，所以經過照光後會進行還原作用。\nB\n 離心管\n：\n反應\n液中沒有葉綠體，所以即使照光仍然沒有反應。\nC\n 離心管\n：\n反應\n液中雖然含有葉綠體，但是沒有照光，所以沒有反應。\nD\n 離心管\n：\n反應\n液中沒有葉綠體，也沒有照光，所以不會進行還原作用。\n配合課本 \nP101", "19": "探討活動 \n3-2 \n光反應的還原作用\n5. \n在「活動設計與操作」中，哪些因素可能會影響結果？\n答\n：\n參與\n反應者皆可能影響結果，例如\n：\n葉綠體懸浮液的狀態（如太大力攪拌，導致葉綠體多數破裂）、\nDCPIP \n溶液濃度、蔗糖溶液的量是否正確與光照時間是否足夠等；或其他可能的人為操作疏失，\n例如\n：\n是否\n有先離心再比色，是否有將試管內的溶液混合均勻。\n配合課本 \nP101"}, "originalCount": 6};

el('hint-toggle').setAttribute('aria-haspopup','dialog');el('hint-toggle').onclick=()=>{el('hint-toggle').setAttribute('aria-expanded','true');const d=openDialog('思考提示',`<p>${esc(STAGES[QI].hint)}</p>`);d.addEventListener('close',()=>el('hint-toggle').setAttribute('aria-expanded','false'),{once:true});};el('reference-btn').onclick=()=>openReferences(STAGES[QI]);el('question-learn').onclick=()=>{returnQuestion=true;navigate('learn',STAGES[QI].learn)};el('q-jump').onchange=e=>showQuestion(+e.target.value);el('prev-btn').onclick=()=>QI>0&&showQuestion(QI-1);el('skip-btn').onclick=()=>QI<STAGES.length-1?showQuestion(QI+1):navigate('done');el('check-btn').onclick=check;el('reset-btn').onclick=resetQuestion;el('finish-btn').onclick=()=>navigate('done');
el('shsel').innerHTML=[...new Set(DECK.map(d=>d[1]))].map(n=>`<option value="${n}">第 ${n} 頁 · ${esc(DECK.find(d=>d[1]===n)[2].slice(0,22))}</option>`).join('');el('shsel').onchange=e=>{showStopPlay();SI=DECK.findIndex(d=>d[1]===+e.target.value);showRender();};el('shprev').onclick=()=>showStep(-1);el('shnext').onclick=()=>showStep(1);el('shplay').onclick=()=>{if(SPLAY)showStopPlay();else{if(SI===DECK.length-1)SI=0;showRender();SPLAY=setInterval(()=>{if(SI>=DECK.length-1){showStopPlay();return;}SI++;showRender()},2600);el('shplay').textContent='⏸ 暫停';}};el('shfs').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else el('show').requestFullscreen?.().catch(()=>{el('shfs').textContent='此瀏覽器不支援原生全螢幕'})};el('shclose').onclick=()=>navigate('intro');
el('theme-toggle').onclick=()=>{ST.theme=ST.theme==='dark'?'light':'dark';applyPreferences();save();};el('font-toggle').onclick=()=>{ST.font=(ST.font+1)%3;applyPreferences();save();fit();};function applyPreferences(){document.documentElement.dataset.theme=ST.theme;document.documentElement.style.setProperty('--text',[20,22,24][ST.font]+'px');document.documentElement.dataset.font=ST.font;el('theme-toggle').setAttribute('aria-pressed',String(ST.theme==='dark'));el('font-toggle').title='文字大小 '+[20,22,24][ST.font]+'px';}
document.addEventListener('fullscreenchange',fullscreenSync);document.addEventListener('keydown',e=>{if(e.isComposing||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if(document.querySelector('dialog[open]'))return;const fs=document.fullscreenElement===el('learn-stage')||el('learn-stage').classList.contains('presentation');if(fs){if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();if(LI<LEARN.length-1)showLearn(LI+1);}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();if(LI>0)showLearn(LI-1);}else if(e.key==='Escape')exitLearnFullscreen();return;}if(PAGE==='show'){if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();showStep(1);}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();showStep(-1);}else if(e.key==='Escape')navigate('intro');else if(e.key==='Home'){SI=0;showRender()}else if(e.key==='End'){SI=DECK.length-1;showRender()}return;}if(PAGE==='learn'&&el('flip')){if(e.key==='ArrowRight'){e.preventDefault();flipStop();flipShow(FI+1)}if(e.key==='ArrowLeft'){e.preventDefault();flipStop();flipShow(FI-1)}}});
el('learn-stage').addEventListener('contextmenu',e=>{if(document.fullscreenElement===el('learn-stage')||el('learn-stage').classList.contains('presentation')){e.preventDefault();if(LI<LEARN.length-1)showLearn(LI+1)}});
window.addEventListener('resize',fit);window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden){flipStop();showStopPlay();save();}});new ResizeObserver(fit).observe(el('bar'));
el('slide-text').onclick=()=>openDialog('原PPT第'+DECK[SI][1]+'頁原文',`<p>${esc(CONTENT.pptText[DECK[SI][1]])}</p>`);el('hero-image').src=IMG.overview;el('video-external').href=`https://drive.google.com/file/d/${VIDEO_ID}/view?usp=drivesdk`;el('raw-animation').onclick=()=>{const d=openDialog('原始簡報動畫',`<video controls autoplay playsinline style="width:100%" src="${ANIMATION_SRC}"></video>`);d.addEventListener('close',()=>d.querySelector('video')?.pause(),{once:true});};applyPreferences();const start=['learn','play','done'].includes(ST.page)?ST.page:'intro';navigate(start);if(!saving)storageNotice();
</script></body></html>
